<style>
:root { --bg: #1b130e; --panel: #271a12; --line: #4a3524; --text: #f1e6d2; --dim: #a8957a; --accent: #f5a524; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; overscroll-behavior: none; background: var(--bg); color: var(--text);   /* no pull-to-refresh or rubber-banding on the shelf */
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif; }
body { background: repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, rgba(255,255,255,.012) 2px 46px), radial-gradient(ellipse at 50% -10%, #3a2616, var(--bg) 65%) fixed; padding: max(22px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { max-width: 980px; margin: 0 auto; }
header { text-align: center; margin: 14px 0 26px; }
h1 { margin: 0; font-size: clamp(34px, 7vw, 54px); letter-spacing: .5px; }
.tag { margin: 6px 0 0; color: var(--dim); font-size: clamp(15px, 2.4vw, 18px); }
/* the shelf: each game is a board-game box — just its cover art, with a thick edge */
.shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 330px)); justify-content: center; gap: 34px 28px; list-style: none; margin: 0; padding: 0 0 12px; }
.box { display: block; position: relative; border-radius: 14px; text-decoration: none; color: inherit; overflow: hidden; background: #120b07;
  border: 3px solid rgba(255,255,255,.2); box-shadow: 0 9px 0 #0a0604, 0 9px 0 3px rgba(255,255,255,.07), 0 20px 30px rgba(0,0,0,.55);
  transform: rotate(var(--tilt, 0deg)); transition: transform .14s ease, box-shadow .14s ease; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.box:active { transform: translateY(6px) rotate(var(--tilt, 0deg)); box-shadow: 0 3px 0 #0a0604, 0 8px 14px rgba(0,0,0,.5); }
.art svg { display: block; width: 100%; height: auto; }
/* the box lid: a printed edge, a dark vignette at the rim, and a soft sheen across one corner, like a glossy cover */
.box::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 11px;
  box-shadow: inset 0 0 0 5px rgba(0,0,0,.28), inset 0 0 0 6px rgba(255,255,255,.22), inset 0 0 46px rgba(0,0,0,.5), inset 0 4px 0 6px rgba(255,255,255,.07); }
.box::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: linear-gradient(118deg, rgba(255,255,255,.26) 0, rgba(255,255,255,.09) 20%, rgba(255,255,255,0) 36%), linear-gradient(0deg, rgba(0,0,0,.18), rgba(0,0,0,0) 22%); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* About the designer: a few plain lines under the shelf */
.about { max-width: 620px; margin: 46px auto 0; padding: 22px 26px 24px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
.about h2 { margin: 0 0 10px; font-size: 22px; letter-spacing: .3px; }
.about p { margin: 8px 0; font-size: 17px; line-height: 1.45; color: var(--text); }
.about a { color: var(--accent); font-weight: 700; display: inline-block; }
footer { margin-top: 34px; text-align: center; color: var(--dim); font-size: 12px; }
</style>

      const gem = (cx, cy, s, c) => `<g transform="translate(${cx} ${cy})"><polygon points="${-s},${-s * .35} ${-s * .55},${-s * .8} ${s * .55},${-s * .8} ${s},${-s * .35}" fill="${c[0]}"/><polygon points="${-s},${-s * .35} ${s},${-s * .35} 0,${s}" fill="${c[1]}"/><polygon points="${-s * .55},${-s * .8} 0,${-s * .35} ${s * .55},${-s * .8}" fill="${c[2]}" opacity=".7"/><polygon points="${-s},${-s * .35} 0,${-s * .35} 0,${s}" fill="#fff" opacity=".14"/><polygon points="${-s},${-s * .35} ${-s * .55},${-s * .8} ${s * .55},${-s * .8} ${s},${-s * .35} 0,${s}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5" stroke-linejoin="round"/></g>`;
      const teal = ['#2ee6c8', '#0b8f86', '#c9fff5'], pink = ['#ff5fb7', '#a3196f', '#ffd0ea'], amber = ['#ffc542', '#c2740a', '#fff0b8'], blue = ['#5aa2ff', '#2646b8', '#d3e5ff'], violet = ['#b58cff', '#5a2fb0', '#ecdcff'];
      const title = (t, y, sz) => `<text x="150" y="${y}" text-anchor="middle" font-size="${sz}" font-weight="900" letter-spacing="1" fill="url(#omT)" stroke="#12062e" stroke-width="9" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
      return `<svg viewBox="0 0 300 380" role="img" aria-label="One More…"><defs>
        <radialGradient id="omB" cx="50%" cy="68%" r="85%"><stop offset="0" stop-color="#5b2aa8"/><stop offset=".55" stop-color="#241056"/><stop offset="1" stop-color="#0b0620"/></radialGradient>
        <radialGradient id="omG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7affe6" stop-opacity=".55"/><stop offset="1" stop-color="#7affe6" stop-opacity="0"/></radialGradient>
        <linearGradient id="omT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#ff8fd2"/><stop offset="1" stop-color="#9a6bff"/></linearGradient></defs>
        <rect width="300" height="380" fill="url(#omB)"/><circle cx="150" cy="262" r="150" fill="url(#omG)"/>
        <g transform="rotate(14 214 214)"><rect x="170" y="140" width="88" height="124" rx="10" fill="#17151f" stroke="#ff8a1d" stroke-width="4"/><circle cx="214" cy="212" r="26" fill="#2a2833"/><ellipse cx="205" cy="203" rx="8" ry="5" fill="#fff" opacity=".2"/><path d="M220 188 Q228 170 244 172" fill="none" stroke="#c9a46a" stroke-width="4" stroke-linecap="round"/><polygon points="246,160 249,168 258,169 251,175 253,184 246,179 239,184 241,175 234,169 243,168" fill="#ffd24a" stroke="#ff8a1d" stroke-width="2"/></g>
        ${[[0, 0, 30, 70], [44, 0, 18, 46], [262, 0, 34, 80], [226, 0, 20, 50], [300, 0, 16, 36]].map(([x, y, w, h]) => `<polygon points="${x - w / 2},0 ${x + w / 2},0 ${x},${h}" fill="#0b0620" opacity=".75"/>`).join('')}
        ${Array.from({ length: 12 }, (_, i) => { const a = (-80 + i * 13) * Math.PI / 180; return `<polygon points="150,300 ${(150 + 260 * Math.cos(a - .04)).toFixed(0)},${(300 + 260 * Math.sin(a - .04)).toFixed(0)} ${(150 + 260 * Math.cos(a + .04)).toFixed(0)},${(300 + 260 * Math.sin(a + .04)).toFixed(0)}" fill="#7affe6" opacity=".07"/>`; }).join('')}
        ${[[40, 190, 8], [262, 214, 7], [84, 234, 6], [196, 160, 6], [20, 280, 7]].map(([x, y, r]) => `<path d="M${x} ${y - r}L${x + r * .3} ${y - r * .3} ${x + r} ${y} ${x + r * .3} ${y + r * .3} ${x} ${y + r} ${x - r * .3} ${y + r * .3} ${x - r} ${y} ${x - r * .3} ${y - r * .3}Z" fill="#e9fff9" opacity=".9"/>`).join('')}
        ${gem(88, 278, 32, violet)}${gem(214, 284, 28, blue)}${gem(150, 272, 38, teal)}${gem(112, 308, 27, amber)}${gem(188, 310, 28, pink)}${gem(60, 316, 21, teal)}${gem(244, 316, 21, amber)}
        ${title('ONE', 66, 62)}${title('MORE…', 128, 62)}
        <rect x="52" y="346" width="196" height="24" rx="12" fill="#0b0620" fill-opacity=".88" stroke="#7affe6" stroke-opacity=".6"/>
        <text x="150" y="359" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="800" textLength="164" lengthAdjust="spacing" fill="#d9fff7">JUST ONE MORE…</text></svg>`;
    },
    // Dig Dig BOOM!: the front of the box, taken from the game's main menu — two Monster cards looming over a fan of Geodes, each a different gem.
    'dig-dig-boom': () => {
      const G = [['#2f7fe6', '#a9d2ff', '#0d2f73', 'M-9-13H9L16-4 0 15-16-4Z'], ['#1fae5f', '#a6f0c4', '#0b4a28', 'M-6-14H6L14-6V6L6 14H-6L-14 6V-6Z'], ['#f29a1f', '#ffe0a3', '#7a4300', 'M0-14L15 12H-15Z'],
        ['#ec5fa6', '#ffc3df', '#7a1c4e', 'M-14 0a14 14 0 1 0 28 0a14 14 0 1 0-28 0Z'], ['#9b52e0', '#dcb8ff', '#431a73', 'M0-15L13-7.5V7.5L0 15-13 7.5V-7.5Z'], ['#1bbdc2', '#a5f3f3', '#065255', 'M0-15C2-8 12-2 12 5a12 12 0 0 1-24 0C-12-2-2-8 0-15Z']];
      const geode = (i, x, y, r) => { const [c, l, d, path] = G[i]; return `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-29" y="-40" width="58" height="80" rx="7" fill="#8a5a2b" stroke="#3b2410" stroke-width="2"/><rect x="-24" y="-35" width="48" height="11" rx="3" fill="#a8723a"/><rect x="-24" y="-21" width="48" height="56" rx="5" fill="${l}" stroke="${d}" stroke-width="2"/><circle cx="8" cy="3" r="22" fill="${c}" opacity=".35"/><text x="-21" y="26" font-size="25" font-weight="900" fill="#1d1712">1</text><g transform="translate(9 4)"><path d="${path}" fill="${c}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/><path d="M-6-6l4-4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g></g>`; };
      const rays = (cx, cy, c1, c2, id) => Array.from({ length: 16 }, (_, i) => { const a = i * 22.5 * Math.PI / 180, b = (i + 1) * 22.5 * Math.PI / 180; return `<polygon points="${cx},${cy} ${(cx + 120 * Math.cos(a)).toFixed(1)},${(cy + 120 * Math.sin(a)).toFixed(1)} ${(cx + 120 * Math.cos(b)).toFixed(1)},${(cy + 120 * Math.sin(b)).toFixed(1)}" fill="${i % 2 ? c1 : c2}"/>`; }).join('');
      const mon = (x, y, r, edge, c1, c2, ink, face, tiles, id) => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-52" y="-72" width="104" height="144" rx="9" fill="${edge}" stroke="#3a0d0d" stroke-width="2"/><rect x="-46" y="-66" width="92" height="132" rx="6" fill="#fffaf0"/><rect x="-46" y="-66" width="92" height="22" rx="5" fill="${edge}"/>
        <clipPath id="${id}"><rect x="-42" y="-40" width="84" height="64" rx="5"/></clipPath><g clip-path="url(#${id})">${rays(0, -8, c1, c2)}<circle cx="0" cy="-8" r="26" fill="#fff" opacity=".35"/></g><rect x="-42" y="-40" width="84" height="64" rx="5" fill="none" stroke="${edge}" stroke-width="2"/>${face}
        ${tiles.map((v, i) => `<rect x="${-42 + i * (84 / tiles.length)}" y="32" width="${84 / tiles.length - 3}" height="26" rx="5" fill="#cf2f2f" stroke="#1d1712" stroke-width="2"/><text x="${-42 + i * (84 / tiles.length) + (84 / tiles.length - 3) / 2}" y="46" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="900" fill="#fff">${v}</text>`).join('')}</g>`;
      const beast = `<g transform="translate(0 -8)"><path d="M-20-16L-26-34-10-22ZM20-16L26-34 10-22Z" fill="#2a0d0d"/><circle r="22" fill="#2a0d0d"/><circle cx="-8" cy="-3" r="5" fill="#fffaf0"/><circle cx="8" cy="-3" r="5" fill="#fffaf0"/><path d="M-9 10l3 6 3-6 3 6 3-6" fill="none" stroke="#fffaf0" stroke-width="2"/></g>`;
      const slime = `<g transform="translate(0 -6)"><path d="M-24 16C-28-8-16-24 0-24S28-8 24 16C18 22 12 18 6 22S-6 18-12 22-20 20-24 16Z" fill="#0d2a14"/><path d="M0-24V-34M-5-34h10" stroke="#0d2a14" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-4" r="11" fill="#fffaf0"/><circle cx="2" cy="-2" r="5.5" fill="#1d1712"/></g>`;
      return `<svg viewBox="0 0 300 380" role="img" aria-label="Dig Dig BOOM!"><defs>
        <radialGradient id="dbBg" cx="30%" cy="26%" r="95%"><stop offset="0" stop-color="#7a431d"/><stop offset=".45" stop-color="#3a2110"/><stop offset="1" stop-color="#150d08"/></radialGradient>
        <radialGradient id="dbGl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffa032" stop-opacity=".6"/><stop offset="1" stop-color="#ffa032" stop-opacity="0"/></radialGradient>
        <linearGradient id="dbT1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#ffb62e"/><stop offset="1" stop-color="#d9731a"/></linearGradient>
        <linearGradient id="dbT2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#ffa42b"/><stop offset=".8" stop-color="#ee4a1c"/><stop offset="1" stop-color="#b81d12"/></linearGradient></defs>
        <rect width="300" height="380" fill="url(#dbBg)"/><circle cx="150" cy="170" r="150" fill="url(#dbGl)"/>
        ${mon(98, 126, -7, '#cf2f2f', '#f25a3c', '#d23a27', '#2a0d0d', beast, [1, 3, 5, 7], 'dbcA')}${mon(202, 136, 6, '#cf2f2f', '#6fd16a', '#3fa84a', '#0d2a14', slime, [2, 4, 6], 'dbcB')}
        <g transform="translate(0 -22)">${geode(0, 50, 246, -22)}${geode(1, 98, 258, -13)}${geode(2, 148, 264, -4)}${geode(3, 198, 262, 5)}${geode(4, 247, 252, 15)}</g>
        ${[[30, 196, 9], [276, 190, 7], [150, 214, 6], [18, 120, 6], [284, 112, 8]].map(([x, y, r]) => `<path d="M${x} ${y - r}L${x + r * .3} ${y - r * .3} ${x + r} ${y} ${x + r * .3} ${y + r * .3} ${x} ${y + r} ${x - r * .3} ${y + r * .3} ${x - r} ${y} ${x - r * .3} ${y - r * .3}Z" fill="#fff6c8" opacity=".9"/>`).join('')}
        <polygon points="${Array.from({ length: 24 }, (_, i) => { const a = i * 15 * Math.PI / 180, r = i % 2 ? 98 : 140; return (150 + r * Math.cos(a)).toFixed(1) + ',' + (338 + r * .42 * Math.sin(a)).toFixed(1); }).join(' ')}" fill="#ff8a1d" opacity=".42"/>
        <text x="150" y="46" text-anchor="middle" font-size="42" font-weight="900" fill="url(#dbT1)" stroke="#2a0f0a" stroke-width="8" stroke-linejoin="round" paint-order="stroke">DIG DIG</text>
        <g transform="rotate(-4 150 346)"><text x="150" y="354" text-anchor="middle" font-size="70" font-weight="900" fill="url(#dbT2)" stroke="#2a0f0a" stroke-width="10" stroke-linejoin="round" paint-order="stroke">BOOM!</text></g>
        <polygon points="268,318 272,330 284,332 275,340 278,352 268,345 258,352 261,340 252,332 264,330" fill="#ffd54a" stroke="#e8731a" stroke-width="2"/></svg>`;
    },
  };
  const art = g => (ART[g.art] ? ART[g.art]() : `<svg viewBox="0 0 300 380" role="img" aria-label="${esc(g.title)}"><rect width="300" height="380" fill="${esc(g.accent || '#d9953a')}"/><text x="150" y="190" text-anchor="middle" font-size="64">${esc(g.icon || '🎲')}</text></svg>`);

  const shown = L.games.filter(g => (g.listed || showUnlisted) && href(g));
  const tilt = i => ['-.7deg', '.6deg', '-.4deg', '.8deg'][i % 4];            // boxes sit a little askew on the shelf
  document.getElementById('app').innerHTML = `
    <header><h1>🎲 ${esc(L.name)}</h1><p class="tag">${esc(L.tagline)}</p></header>
    <ul class="shelf">${shown.map((g, i) => `
      <li><a class="box" data-id="${esc(g.id)}" href="${esc(href(g))}" style="--accent-c:${esc(g.accent || '#d9953a')};--tilt:${tilt(i)}" aria-label="${esc(g.title)}${g.players ? ", " + esc(g.players) : ""}">
        <div class="art">${art(g)}</div>
        <h2 class="sr">${esc(g.title)}</h2>
      </a></li>`).join('')}</ul>
    <section class="about" aria-label="${esc(L.about.heading)}"><h2>${esc(L.about.heading)}</h2>${L.about.lines.map(t => `<p>${esc(t)}</p>`).join('')}<p>${esc(L.about.contact.lead)}<br><a href="mailto:${esc(L.about.contact.email)}">${esc(L.about.contact.email)}</a></p></section>
    <footer>Version ${esc(BUILD)}</footer>`;

})();
</script>
