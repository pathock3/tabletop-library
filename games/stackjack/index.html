    return `<div class="sheet"><div class="sheetin"><h3>${esc(pd.prompt)}</h3>${show.length ? `<div class="pickrow showrow">${pd.showLabel ? `<small>${esc(pd.showLabel)}</small>` : ''}${show.map(c => mini(c)).join('')}</div>` : ''}<div class="opts2">${pd.opts.map(o => `<button class="big ${pd.kind === 'window' && o.id === 'decline' ? 'ghost' : ''}" data-act="ans" data-v="${esc(o.id)}">${esc(o.label)}</button>`).join('')}</div></div></div>`;
  }
  const scoreHTML = (s, who) => `<div class="score">${s.pl.map((p, i) => `<div class="sc ${who === i ? 'now' : ''}" style="--pc:${PTS[i % 6]}">${esc(p.name)}<small>${p.pts} / ${s.winAt} points</small><div class="bar"><i style="width:${Math.min(100, Math.round(p.pts / s.winAt * 100))}%"></i></div></div>`).join('')}</div>`;
  function draftHTML(s, v, me) {
    const dr = s.draft, pd = s.pending, mine = pd && pd.kind === 'pick' && isMeFor(s, pd, v);
    const who = dr && dr.k < dr.order.length ? dr.order[dr.k] : null;
    const picks = dr ? dr.picks.map(x => `<span class="pk">${esc(s.pl[x.p].name)}: ${esc(DEF[s.cards[x.u].id].name)}</span>`).join('') : '';
    const d = dims(), n = Math.max(1, s.market.length), W = d.W - 36, Hh = d.H - Math.round(56 * d.u) - 8 - Math.round(64 * d.u) - Math.round(84 * d.u) - Math.round(58 * d.u) - 44;
    let cw = 40; for (let c = 1; c <= n; c++) { const rows = Math.ceil(n / c); cw = Math.max(cw, Math.floor(Math.min((W - (c - 1) * 14) / c - 8, (Hh - (rows - 1) * 14) / rows / 1.42 - 6, 320))); }
    return `<div class="draft">${scoreHTML(s, who)}<h2>Draft wildcards</h2><p class="dsub">${who != null ? (mine ? 'Pick a wildcard! Tap a card.' : esc(s.pl[who].name) + ' is picking…') : ''} Two picks each, fewest points first${dr && dr.tie ? ' (ties broken at random)' : ''}.</p>
      <div class="market" style="--cw:${cw}px">${s.market.map(c => `<button class="mk ${mine ? 'canpick' : ''}" data-act="${mine ? 'ans' : 'card'}" data-v="c${c.u}" data-u="${c.u}" data-p="-1">${faceHTML(c, { big: true })}</button>`).join('')}</div>
      <div class="dfoot"><button class="chip" data-act="deck" data-p="${me}">Your deck</button>${picks}</div></div>`;
  }
  /* the totals as spaces on a track: chips that share a space line up in the order they arrived, the first one in front with a "1st" badge */
  function trackHTML(s, r) {
    const live = r.rows.filter(x => !x.busted), spaces = [...new Set(live.map(x => x.total))].sort((a, b) => b - a);
    if (!spaces.length) return '';
    return `<div class="track">${spaces.map(t => { const here = live.filter(x => x.total === t).sort((a, b) => (a.arrived == null ? 1e9 : a.arrived) - (b.arrived == null ? 1e9 : b.arrived)); return `<div class="space"><div class="stack">${here.slice().reverse().map((x, k, arr) => `<span class="chp" style="--pc:${PTS[x.p % 6]};z-index:${k + 1}" title="${esc(s.pl[x.p].name)}"><b>${esc(s.pl[x.p].name.slice(0, 2))}</b>${here.length > 1 && k === arr.length - 1 ? '<i class="first">1st</i>' : ''}</span>`).join('')}</div><div class="sn">${t}</div></div>`; }).join('')}</div><p class="tiehint">Tied totals? Whoever got there first wins the tie.</p>`;
  }
  function resultsHTML(s) {
    const r = s.result, sk = ui.skip ? ' skip' : ''; if (!r) return '';
    const rows = r.rows.slice().sort((a, b) => (b.pts - a.pts) || ((a.place || 99) - (b.place || 99)));
    const live = r.rows.filter(x => !x.busted), shared = live.some((x, k) => live.some((y, m) => m !== k && y.total === x.total));
    return `<div class="results${sk}"><h2>${s.tiebreak ? 'Tiebreak round' : 'Round ' + r.round} results</h2>${trackHTML(s, r)}<div class="rrows">${rows.map((x, k) => `<div class="rrow ${x.busted ? 'bad' : ''}" style="--d:${.5 + k * .6}s;--pc:${PTS[x.p % 6]}"><div class="rtop"><b>${esc(s.pl[x.p].name)}</b><span class="rt">${x.busted ? 'BUST' : x.total}</span><span class="rp">${x.busted ? 'last place' : 'place ' + x.place} · +${x.pts}</span></div><div class="rline">${x.line.map(l => { const c = s.cards[l.u]; return faceHTML(c, { cls: 'flipin', val: valText(c) }); }).join('')}${x.load ? `<span class="load"><b>${x.load}</b> Load</span>` : ''}</div></div>`).join('')}</div>
      ${scoreHTML(s, null)}
      <div class="ractions"><button class="chip" data-act="skip">Skip</button><button class="big gold" data-act="ans" data-v="continue">${s.tiebreak ? 'Continue' : Math.max(...s.pl.map(p => p.pts)) >= s.winAt ? 'Finish' : 'Continue to the draft'}</button></div></div>`;
  }
  function overHTML(s) {
    const order = s.pl.map((p, i) => i).sort((a, b) => s.pl[b].pts - s.pl[a].pts);
    const hist = s.history;
    return `<div class="screen over">${libraryLink()}<div class="hero"><div class="suits">21</div><h1>${esc(s.pl[s.winner].name)} wins!</h1></div>
      <div class="final">${order.map((i, k) => `<div class="frow"><b>${k + 1}. ${esc(s.pl[i].name)}</b><span>${s.pl[i].pts} / ${s.winAt} pts</span></div>`).join('')}</div>
      <table class="hist"><tr><th></th>${hist.map(h => `<th>R${h.round}${h.tiebreak ? 'T' : ''}</th>`).join('')}</tr>${order.map(i => `<tr><td>${esc(s.pl[i].name)}</td>${hist.map(h => `<td>${h.pts[i] != null ? h.pts[i] : '–'}</td>`).join('')}</tr>`).join('')}</table>
      <button class="big gold" data-act="newgame">Play again</button><button class="big ghost" data-act="home">Main Menu</button></div>`;
  }
  const logHTML = s => `<div class="sheet" data-act="log"><div class="sheetin logsheet" data-act="none"><h3>Log</h3><div class="logbody">${s.log.slice(-60).reverse().map(l => `<div class="ll">${esc(l.t)}</div>`).join('')}</div><button class="big" data-act="log">Close</button></div></div>`;
  const sheetBox = inner => `<div class="sheet" data-act="none"><div class="sheetin">${inner}</div></div>`;
  const stepVis = i => {
    const f = id => faceHTML({ id }, {});
    if (i === 0) return `${f('nine')}<span class="eq">+</span>${f('five')}<span class="eq">+</span>${f('six')}<span class="eq">= 20</span>${f('seven')}<span class="eq">+</span>${f('eight')}<span class="eq">+</span>${f('nine')}<span class="eq" style="color:#ff7a5a">= 24 BUST</span>`;
    if (i === 1) return `<div class="who">You<span class="pillbtn h">Hit</span></div><div class="who">Ava<span class="pillbtn p">Pass</span></div><div class="who">Ben<span class="pillbtn p">Pass</span></div><span class="eq">→ flip together</span>`;
    const t = D.rules.POINTS_BY_PLACE[3];
    return `<span class="tbl">3 players: 1st <b>${t[0]}</b> · 2nd <b>${t[1]}</b> · 3rd <b>${t[2]}</b></span>${f('hi-lo')}${f('squeeze')}<span class="tbl"><b>14 / ${D.rules.WIN_POINTS}</b> points</span>`;
  };
  const helpHTML = () => `<div class="sheet" data-act="none"><div class="sheetin wide-sheet"><h2>How to Play</h2><div class="steps">${D.texts.steps.map((st, i) => `<div class="step"><div class="num">${i + 1}</div><div><h3>${esc(st.title)}</h3><p>${esc(st.text)}</p></div><div class="vis">${stepVis(i)}</div></div>`).join('')}</div><button class="big gold" data-act="closehelp">Got it</button></div></div>`;
  const menuHTML = () => sheetBox(`<h2>Menu</h2><button class="big gold" data-act="closemenu">Back to the game</button><button class="big" data-act="help">How to Play</button><button class="big" data-act="log">Log</button><button class="big" data-act="settings">Settings</button><button class="big ghost" data-act="home">Main Menu</button>`);
  const settingsHTML = () => sheetBox(`<h2>Settings</h2><button class="big" data-act="resettips">${ui.tipsReset ? 'Tips reset ✓ They will show again' : 'Reset tips'}</button><p>Show every first-time tip again, as if it were your first game.</p><button class="big gold" data-act="closesettings">Done</button>`);
  const tipHTML = () => { const t = D.texts.tips[ui.tip]; return t ? sheetBox(`<h2>${esc(t[0])}</h2><p>${esc(t[1])}</p><button class="big gold" data-act="tipok">Got it</button>`) : ''; };

  // ---------- first-time tips: each once, the first time it comes up (the game waits while one is open) ----------
  function tipCheck() {
    const s = ui.s; if (!s || ui.tip || ui.menu || ui.settings || ui.help || ui.screen !== 'game' || humans(s).length === 0) return;
    const sn = seen(), pd = s.pending, v = viewer(s), want = [];
    const add = k => { if (!sn[k] && !ui.tipQ.includes(k)) want.push(k); };
    if (s.phase === 'play') { add('welcome'); }
    if (humanOpts(s, v)) add('turn');
    if (v !== null && s.pl[v] && s.pl[v].load > 0) add('load');
    if (pd && pd.kind === 'window' && isMeFor(s, pd, v)) add('window');
    if (v !== null && s.pl[v] && s.pl[v].status === 'busted') add('bust');
    if (s.phase === 'results') { add('reveal'); if (s.result && s.result.rows.some((x, k, a) => !x.busted && a.some((y, m) => m !== k && !y.busted && y.total === x.total))) add('tied'); }
    if (s.phase === 'draft') add('draft');
    ui.tipQ.push(...want);
    if (ui.tipQ.length) { ui.tip = ui.tipQ.shift(); const x = seen(); x[ui.tip] = 1; store.set(TIPS, JSON.stringify(x)); }
  }

  // ---------- running the game ----------
  function newGame(opts) {
    opts = opts || {};
    const seed = opts.seed != null ? opts.seed : (Math.random() * 2 ** 31) | 0;
    ui.s = E.newGame({ seats: opts.seats || QUICK_SEATS(), seed, quick: opts.quick, friendly: opts.friendly, showAll: opts.showAll });
    ui.shown = null; ui.sheet = null; ui.deckOf = null; ui.skip = false; ui.screen = 'game'; ui.menu = false; ui.help = false; ui.settings = false; ui.confirmNew = false; ui.tip = null; ui.tipQ = []; save(); render();
  }
  function answerNow(id) { const r = E.answer(ui.s, id); if (r.ok) { ui.sheet = null; ui.skip = false; save(); } render(); }

  function render() {
    clearTimeout(ui.timer);
    let h;
    if (ui.screen === 'game' && ui.s) { tipCheck(); h = gameHTML(); }
    else h = homeHTML();
    app.style.setProperty('--u', dims().u.toFixed(3));
    app.innerHTML = h + (ui.menu && ui.screen === 'game' ? menuHTML() : '') + (ui.settings ? settingsHTML() : '') + (ui.help ? helpHTML() : '') + (ui.tip ? tipHTML() : '');
    animateChips(); drive();
  }
  /* a chip that moves slides to its new space instead of jumping */
  function animateChips() {
    const next = {};
    app.querySelectorAll('.lbchip').forEach(el => {
      const p = el.dataset.p, r = el.getBoundingClientRect(); next[p] = { x: r.left, y: r.top };
      const o = ui.chipPos[p]; if (o && el.animate && (Math.abs(o.x - r.left) > 2 || Math.abs(o.y - r.top) > 2)) el.animate([{ transform: `translate(${o.x - r.left}px, ${o.y - r.top}px)` }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.2,.8,.3,1)' });
    });
    ui.chipPos = next;
  }
  function drive() {
    const s = ui.s; if (ui.screen !== 'game' || !s || s.phase === 'over' || ui.menu || ui.help || ui.tip || ui.settings) { ui.due = {}; return; }
    const pd = s.pending;
    if (!pd) {                              // everyone hits whenever they like: each computer player acts on its own clock
      const open = E.openPlayers(s); if (!open) return;
      const ais = open.filter(p => s.pl[p].kind === 'ai'), now = Date.now(), [lo, hi] = D.rules.aiThinkMs;
      for (const p of ais) if (!ui.due[p]) ui.due[p] = now + lo + Math.random() * (hi - lo);
      for (const k of Object.keys(ui.due)) if (!ais.includes(Number(k))) delete ui.due[k];
      if (!ais.length) return;
      ui.timer = setTimeout(() => {
        if (ui.s !== s || s.pending || !E.isOpen(s)) return; const t = Date.now();
        for (const p of ais.filter(p => ui.due[p] !== undefined && ui.due[p] <= t + 5)) { if (s.pending || !E.isOpen(s)) break; delete ui.due[p]; const id = AI.answer(s, p); if (id) E.act(s, p, id); }
        save(); render();
      }, Math.max(30, Math.min(...ais.map(p => ui.due[p])) - now));
      return;
    }
    if (pd.kind === 'results') { if (humans(s).length === 0) ui.timer = setTimeout(() => answerNow('continue'), 3500); return; }
    if (pd.who == null) return;
    const pl = s.pl[pd.who];
    if (pl.kind === 'human') return;
    const delay = pd.kind === 'ack' ? 250 : D.rules.passDelayMs * (humans(s).length ? 1 : .35);
    ui.timer = setTimeout(() => { if (ui.s !== s || s.pending !== pd) return; const id = AI.answer(s, pd.who); const r = E.answer(s, id); if (!r.ok) console.error('AI answer refused', id, pd.prompt); save(); render(); }, delay);
  }

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act, s = ui.s; if (a === 'none') return;
    if (a !== 'newgame') ui.confirmNew = false;
    if (a === 'newgame') { if ((hasSave() || (ui.s && ui.s.phase !== 'over' && ui.screen === 'game')) && !ui.confirmNew) { ui.confirmNew = true; render(); } else newGame(); }
    else if (a === 'continue') { try { const d = JSON.parse(store.get(SAVE)); ui.s = d.s; ui.screen = 'game'; ui.shown = null; render(); } catch (err) { store.del(SAVE); render(); } }
    else if (a === 'home') { ui.screen = 'home'; ui.menu = false; ui.help = false; render(); }
    else if (a === 'help') { ui.help = true; render(); } else if (a === 'closehelp') { ui.help = false; render(); }
    else if (a === 'menu') { ui.menu = true; render(); } else if (a === 'closemenu') { ui.menu = false; render(); }
    else if (a === 'settings') { ui.settings = true; render(); } else if (a === 'closesettings') { ui.settings = false; ui.tipsReset = false; render(); }
    else if (a === 'resettips') { store.del(TIPS); ui.tipsReset = true; render(); }
    else if (a === 'tipok') { ui.tip = ui.tipQ.length ? ui.tipQ.shift() : null; if (ui.tip) { const x = seen(); x[ui.tip] = 1; store.set(TIPS, JSON.stringify(x)); } render(); }
    else if (a === 'handoff') { ui.shown = Number(el.dataset.v); render(); }
    else if (a === 'closesheet') { ui.sheet = null; ui.deckOf = null; render(); }
    else if (a === 'log') { ui.log = !ui.log; ui.menu = false; render(); }
    else if (a === 'skip') { ui.skip = true; render(); }
    else if (a === 'card') { ui.sheet = Number(el.dataset.u); render(); }
    else if (a === 'deck') { const p = Number(el.dataset.p); if (s && (p === viewer(s) || (viewer(s) === null && p === humans(s)[0]) || s.showAll)) { ui.deckOf = p; render(); } }
    else if (a === 'target') { const pd = s && s.pending; if (pd && pd.kind === 'target' && isMeFor(s, pd, viewer(s))) { const o = pd.opts.find(x => x.p === Number(el.dataset.p)); if (o) { answerNow(o.id); return; } } }
    else if (a === 'ans') { if (s && s.pending) answerNow(el.dataset.v); }
    else if (a === 'act') { const ho = s && humanOpts(s, viewer(s)); if (ho && E.act(s, ho.me, el.dataset.v).ok) { ui.sheet = null; ui.skip = false; save(); render(); } }
  });
  render();
  if (typeof window !== 'undefined') window.LB = { ui, render, newGame };
  let rz = 0; addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(render); });
})();
</script>
</body>
</html>
