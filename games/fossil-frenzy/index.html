<style>
:root {
  --bg: #1b130e; --panel: #271a12; --panel2: #32231a; --line: #4a3524;
  --umber: #4a2e1c; --umber-d: #2f1c10; --bone: #f6e7b8; --ink: #2b1b10;
  --text: #f1e6d2; --dim: #a8957a; --accent: #f5a524; --good: #3ecf8e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; width: 100%; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif; touch-action: manipulation; }
#app { position: absolute; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }

/* ---------- game layout ---------- */
.game { --set: 58px; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; gap: 6px; padding: 8px 10px 10px; }
.bar { display: flex; gap: 8px; align-items: stretch; }
.chips { display: flex; gap: 6px; flex: 1; min-width: 0; }
/* the score is the most important thing outside the board: big, always in view, the current player's lit up */
.chip { flex: 1 1 0; min-width: 0; background: var(--panel); border: 3px solid transparent; border-radius: 14px; padding: 6px 10px 7px; display: flex; flex-direction: column; gap: 0; position: relative; }
.chip.cur { border-color: var(--c); background: var(--panel2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.chip .nm { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.chip .pts { font-size: clamp(46px, 9.5vw, 76px); font-weight: 800; line-height: 1.02; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.chip.cur .pts { color: #fff; }
.chip .pts.bump { animation: bump .55s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: var(--accent); } 100% { transform: scale(1); } }
.chip .say { position: absolute; right: 8px; top: 6px; padding: 3px 10px; border-radius: 99px; background: var(--accent); color: #2b1b10; font-weight: 800; font-size: 14px; animation: bankin2 .35s ease-out; }
@keyframes bankin2 { 0% { transform: scale(.5); opacity: 0; } 100% { transform: none; opacity: 1; } }
.chip .sets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: calc(var(--set) + 6px); margin-top: 6px; }
.chips.n3, .chips.n4 { --set: 46px; }
.chips.n4 .nm { font-size: 15px; gap: 4px; }
/* held sets are buttons: big, raised tiles. The ones you can bank right now glow green and carry a "Bank" label. */
.setbtn { position: relative; width: var(--set); height: var(--set); padding: 0; flex: none; border-radius: 9px; color: var(--ink); display: block; border: 0; opacity: .92; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
.setbtn svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.setbtn .v { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: calc(var(--set) * .5); line-height: 1; pointer-events: none; text-shadow: 0 1px 0 rgba(255,246,214,.6); }
.setbtn.plain .v { color: #3b2410; } .setbtn.aged .v { color: #12306b; } .setbtn.gold .v { color: #a3151b; } .setbtn.gem .v { color: #f6e7b8; text-shadow: 0 1px 0 rgba(0,0,0,.6); font-size: calc(var(--set) * .4); }
.setbtn.act { opacity: 1; cursor: pointer; animation: ready 1.8s ease-in-out infinite; }
.setbtn.act:active { transform: translateY(3px); animation: none; }
.setbtn.landing { visibility: hidden; }
.setbtn.spot { animation: spot 1s ease-in-out infinite; }
.slot { width: var(--set); height: var(--set); border-radius: 9px; border: 2px dashed var(--line); flex: none; }
@keyframes ready { 0%, 100% { box-shadow: 0 0 0 3px var(--good), 0 0 8px rgba(62,207,142,.25); } 50% { box-shadow: 0 0 0 3px var(--good), 0 0 20px rgba(62,207,142,.7); } }
@keyframes spot { 0%, 100% { box-shadow: 0 0 0 3px var(--accent), 0 0 6px rgba(245,165,36,.3); } 50% { box-shadow: 0 0 0 3px var(--accent), 0 0 20px rgba(245,165,36,.85); } }
.bankcap { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--good); line-height: 1.1; max-width: 4.2em; }
.q { position: absolute; left: 6px; bottom: 6px; z-index: 3; width: 68px; height: 68px; border-radius: 18px; background: var(--panel2); border: 2px solid var(--line); color: var(--text); font-weight: 700; font-size: 38px; line-height: 1; opacity: .95; }   /* the menu sits in the board's bottom-left corner, so the scores can span the whole width */
.legend { display: flex; gap: 14px; align-items: center; justify-content: center; font-size: 12px; color: var(--dim); padding: 0 6px; min-height: 2.5em; }
.legend .hint { margin: 0 auto; color: var(--text); font-size: 16px; line-height: 1.25; text-align: center; }
.main { min-height: 0; display: flex; position: relative; }
.boardwrap { min-height: 0; min-width: 0; display: flex; flex: 1; }
.legend .event { color: var(--accent); font-size: 16px; font-weight: 700; }
svg.board { width: 100%; height: 100%; touch-action: manipulation; }

/* whose turn it is: shown before they start tapping (a tap anywhere on it starts the turn) */
.turncard { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px;
  border-radius: 16px; background: rgba(27,19,14,.94); border: 4px solid var(--c); }
.turncard .tc-who { font-size: clamp(34px, 8vw, 60px); font-weight: 800; color: var(--c); line-height: 1.05; }
.turncard .tc-last { font-size: 19px; color: var(--accent); max-width: 30em; }
.turncard .tc-tap { margin-top: 14px; padding: 22px 54px; min-height: 76px; border-radius: 18px; background: var(--c); color: #14100c; font-weight: 800; font-size: 28px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }

@media (min-width: 700px) { .game { --set: 78px; gap: 10px; padding: 12px 16px 14px; } .chip .nm { font-size: 22px; } .legend .hint, .legend .event { font-size: 21px; } .q { width: 80px; height: 80px; font-size: 44px; border-radius: 20px; } .end { padding: 24px 46px; min-height: 80px; font-size: 28px; } .turncard .tc-tap { padding: 26px 70px; min-height: 90px; font-size: 32px; } }
/* the films (a match, digging a map up) are drawn on this layer above everything; it never takes a tap */
#fx { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
#fx > div { position: absolute; will-change: transform, opacity; }
#fx .flyer { filter: drop-shadow(0 7px 5px rgba(0,0,0,.45)); }
#fx .flyer svg { position: absolute; inset: 0; }
#fx .flysq { display: block; filter: drop-shadow(0 8px 6px rgba(0,0,0,.5)); opacity: 0; }
#fx .shock { border-radius: 50%; border: 6px solid #fff; opacity: 0; }
#fx .chest { filter: drop-shadow(0 8px 8px rgba(0,0,0,.5)); }
#fx .chest svg { overflow: visible; } #fx .lid { transform-box: fill-box; transform-origin: 100% 100%; }
#fx .plus { display: grid; place-items: center; font-weight: 900; font-size: 44px; color: #ffe27a; text-shadow: 0 3px 0 #7a4a08, 0 0 14px rgba(255,200,60,.9); }
/* menu (system chrome: small and quiet) */
.backdrop { position: absolute; inset: 0; z-index: 4; background: rgba(0,0,0,.45); }
.menu { position: absolute; z-index: 5; bottom: calc(env(safe-area-inset-bottom) + 100px); left: max(12px, env(safe-area-inset-left)); width: min(300px, calc(100% - 24px)); background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px;
  display: flex; flex-direction: column; gap: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.55); }
.menu button { padding: 14px 16px; border-radius: 12px; background: var(--panel2); text-align: left; font-weight: 700; font-size: 17px; }
.menu button.danger { background: #5a2a1e; }
.big.danger { background: #8a3524; color: #fff; }
.menu .mq { margin: 4px 6px 6px; line-height: 1.4; }

/* ---------- board ---------- */
.cell .bg { fill: #2a1d14; stroke: #3d2b1d; stroke-width: 1.5; }
/* face down: a tile of sand; face up: one torn half of a treasure map, its colours by tier */
.sand { fill: url(#gSand); stroke: #5e4527; stroke-width: 2.5; }
.speck { fill: url(#pSpeck); pointer-events: none; }
.ripple { fill: none; stroke: rgba(255,235,180,.2); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.parch { stroke-width: 2.5; stroke-linejoin: round; }
.parch.plain { fill: url(#gPlain); stroke: #a58a58; } .parch.aged { fill: url(#gAged); stroke: #a8895a; } .parch.gold { fill: url(#gGold); stroke: #c8962a; stroke-width: 3.5; } .parch.gem { fill: url(#gGem); stroke: #8e7bb0; }
.det { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.det.plain { stroke: #5a3d1c; } .det.aged { stroke: #1d3f86; } .det.gold { stroke: #8a1a14; } .det.gem { stroke: #b9a4d8; }
.det.dot { stroke-dasharray: 0.1 5; stroke-width: 3; }
.det.xmark { stroke: #b3261e; stroke-width: 3.5; opacity: .75; }
.det.border { stroke: #c8962a; stroke-width: 1.6; opacity: .95; }
.tile.peek .parch { filter: none; stroke-dasharray: none; }
.tile .num { font-weight: 900; font-size: 29px; text-anchor: middle; dominant-baseline: central; pointer-events: none; paint-order: stroke; stroke-width: 3.5px; stroke-linejoin: round; }
.tile .num.plain { fill: #3b2410; stroke: rgba(238,222,178,.75); } .tile .num.aged { fill: #12306b; stroke: rgba(240,226,184,.75); } .tile .num.gold { fill: #a3151b; stroke: rgba(250,232,170,.8); }
.gone { fill: none; stroke-width: 2.5; stroke-dasharray: 6 7; opacity: .55; pointer-events: none; }
.tile .gemnum { fill: #f6e7b8; font-weight: 900; font-size: 15px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }   /* what a gem map is worth, under the jewel */
.tile .num.gem { fill: #f6e7b8; font-size: 15px; stroke: none; }
.ring { fill: none; stroke-width: 4.5; pointer-events: none; }
.flipin { animation: flip .32s ease-out; transform-box: fill-box; transform-origin: center; }
/* an opponent peeks: the fossil lifts and tilts as if a corner were being peeked under; the number stays hidden */
.tile.lift { animation: lift .6s ease-in-out; transform-box: fill-box; transform-origin: center; }
@keyframes lift { 0% { transform: none; } 20% { transform: translateY(-5px) rotate(-7deg) scale(1.12); } 45% { transform: translateY(-5px) rotate(7deg) scale(1.12); } 70% { transform: translateY(-5px) rotate(-4deg) scale(1.12); } 100% { transform: none; } }
.ring.pulse { animation: pulse .6s ease-in-out; }
@keyframes pulse { 0%, 100% { opacity: 1; } 30%, 70% { opacity: .25; } }
.eye { font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; animation: eye .65s ease-in-out forwards; }
@keyframes eye { 0% { opacity: 0; } 20%, 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tile.lift, .ring.pulse, .eye, .chip .pts.bump, .setbtn.act, .setbtn.spot { animation: none; } }
@keyframes flip { 0% { transform: scaleX(.05); } 100% { transform: scaleX(1); } }
.pop { animation: pop .4s ease-out; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

/* small fossil chips (end screen) */
.mini { min-width: 30px; height: 30px; border-radius: 7px; background: var(--bone); color: var(--ink); font-weight: 800; display: grid; place-items: center; font-size: 15px; padding: 0 3px; }

/* ---------- the one button on the table, and the opponent's bank banner ---------- */
.end { position: absolute; right: 6px; bottom: 6px; z-index: 2; background: var(--panel2); border: 2px solid var(--line); border-radius: 18px; padding: 20px 36px; min-height: 68px; font-weight: 800; font-size: 24px; opacity: .85; }
.end.go { border-color: var(--accent); background: #4a3418; opacity: 1; box-shadow: 0 0 0 4px rgba(245,165,36,.2); }
.bankcard { position: absolute; z-index: 2; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; color: inherit; cursor: pointer; padding: 18px 30px; border-radius: 20px;
  background: rgba(27,19,14,.92); border: 4px solid var(--c); box-shadow: 0 12px 34px rgba(0,0,0,.6); animation: bankin .35s ease-out; max-width: 92%; }
@keyframes bankin { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.bankcard .bk-who { font-size: clamp(18px, 3.6vw, 26px); font-weight: 800; color: var(--c); }
.bankcard .bk-pts { font-size: clamp(54px, 11vw, 92px); font-weight: 900; line-height: 1; color: #fff; }
.bankcard .bk-tap { font-size: 13px; color: var(--dim); margin-top: 10px; }
.bankcard:active { filter: brightness(1.15); }

/* ---------- screens / overlays ---------- */
/* ---------- home screen: one screen, never scrolls ---------- */
.screen.home { background: radial-gradient(ellipse at 30% 25%, #5b3518 0%, #2d1a0d 42%, var(--bg) 78%); overflow: hidden; touch-action: manipulation;
  padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
.sheet.hero { max-width: 1040px; height: 100%; display: grid; gap: 10px; align-items: center; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
@media (min-aspect-ratio: 5/4) { .sheet.hero { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 28px; } }
.hero-art { position: relative; min-height: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.hero-art::before { content: ""; position: absolute; inset: 8% 6%; background: radial-gradient(circle, rgba(245,165,36,.42), rgba(245,165,36,0) 68%); filter: blur(24px); }
.hero-board { position: relative; flex: 1 1 0; min-height: 0; width: 100%; max-width: 620px; filter: drop-shadow(0 18px 24px rgba(0,0,0,.55)); }
.h-cell { transform-box: fill-box; transform-origin: center; animation: hin .55s ease-out backwards; animation-delay: calc(var(--i) * 22ms); }
@keyframes hin { 0% { transform: scale(.2) rotate(-25deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.h-cell .bg { fill: #2a1d14; stroke: #3d2b1d; stroke-width: 1.5; }
.h-back, .h-front { transform-box: fill-box; transform-origin: center; }
.h-front { transform: scaleX(0); }
.h-flipper { animation: hback 7s ease-in-out infinite; animation-delay: var(--d); }
.h-front { animation: hfront 7s ease-in-out infinite; animation-delay: var(--d); }
@keyframes hback { 0%, 54% { transform: scaleX(1); } 58%, 74% { transform: scaleX(0); } 78%, 100% { transform: scaleX(1); } }
@keyframes hfront { 0%, 54% { transform: scaleX(0); } 58%, 74% { transform: scaleX(1); } 78%, 100% { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .h-cell, .h-flipper, .h-front { animation: none; } }
.hero-menu { position: relative; display: flex; flex-direction: column; align-items: stretch; min-height: 0; }
.logo { margin: 0 0 6px; font-size: clamp(40px, min(11vw, 10.5vh), 96px); line-height: .9; font-weight: 900; letter-spacing: -2px; text-align: left;
  background: linear-gradient(180deg, #ffe3a0 10%, #f5a524 55%, #c8650f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.4)); animation: logoin .7s ease-out .2s backwards; }
@keyframes logoin { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.hero-menu .sub { font-size: clamp(14px, 2.2vh, 17px); margin-bottom: 0; }

.libback { position: absolute; z-index: 2; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 10px 16px 10px 12px; min-height: 44px;
  border-radius: 99px; background: var(--panel2); border: 2px solid var(--accent); color: var(--text); font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,.35); }

.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 22px 18px 30px; background: radial-gradient(ellipse at 50% 0%, #3a2616, var(--bg) 70%); }
.sheet { max-width: 640px; margin: 0 auto; }
/* every screen but the front one sits in the middle of the page, not hung from the top (a tall one scrolls from its top) */
.screen:not(.home) { display: flex; padding-top: 22px; padding-bottom: 22px; }
.screen:not(.home) > .sheet { margin: auto; width: 100%; }
h1 { margin: 0 0 4px; font-size: 38px; letter-spacing: .5px; }
h2 { margin: 18px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); }
.sub { color: var(--dim); margin: 0 0 14px; }
.back { display: inline-flex; align-items: center; margin: -6px 0 10px; padding: 0 20px 0 14px; min-height: 48px; border-radius: 99px; color: var(--text); font-size: 17px; font-weight: 700; text-decoration: none; background: var(--panel); border: 2px solid var(--line); }
.seg { display: inline-flex; background: var(--panel); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { padding: 10px 16px; border-radius: 9px; font-weight: 700; color: var(--dim); }
.seg button.on { background: var(--accent); color: #2b1b10; }
.seg.sizes { display: flex; flex-wrap: nowrap; width: 100%; max-width: 560px; }
.seg.sizes button { display: flex; flex: 1 1 0; min-width: 0; flex-direction: column; align-items: center; gap: 1px; padding: 8px 4px; }
.seg.sizes small { font-size: 12px; font-weight: 600; opacity: .8; }
.seatrow { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }

.seatrow input { flex: 1 1 130px; min-width: 0; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); color: var(--text); user-select: text; -webkit-user-select: text; }
.big { display: block; width: 100%; margin-top: 22px; padding: 16px; border-radius: 14px; background: var(--accent); color: #2b1b10; font-weight: 800; font-size: 20px; }
.settings .warn { background: var(--panel); border: 2px solid var(--accent); border-radius: 16px; padding: 4px 16px 16px; }
.settings .warn p { line-height: 1.45; font-size: 16px; }
.settings .warn p.warn-h { font-weight: 800; font-size: 19px; color: var(--accent); margin-bottom: 0; }
.settings .ok { color: var(--good); font-weight: 700; }
.big.alt { background: var(--panel2); color: var(--text); border: 2px solid var(--line); margin-top: 12px; }
.ghost { margin-top: 10px; padding: 12px 16px; border-radius: 12px; background: var(--panel); font-weight: 700; }
.mode { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-top: 14px; padding: 18px 20px; text-align: left; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.mode:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.mode b { font-size: 22px; }
.mode span { color: var(--dim); font-size: 15px; }
.levels { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.lvl { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 96px; padding: 12px 18px 12px 14px; text-align: left; border-radius: 18px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.lvl:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.lvl.next { border-color: var(--accent); background: var(--panel2); box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 0 3px rgba(245,165,36,.25); }
.lvl .mini-board { width: 76px; height: 76px; flex: none; }
.lvl .mini-board polygon { fill: #8a6738; stroke: #5e4527; stroke-width: 1.2; }
.lvl.done .mini-board polygon { fill: #d9c18a; stroke: #a8895a; }
.lvl .lv-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lvl b { font-size: 26px; line-height: 1.1; }
.lvl small { color: var(--dim); font-size: 16px; }
.lvl .state { margin-left: auto; text-align: right; flex: none; }
.pill { display: inline-block; padding: 10px 16px; border-radius: 99px; font-weight: 800; font-size: 17px; white-space: nowrap; background: var(--panel2); color: var(--text); border: 2px solid var(--line); }
.pill.go { background: var(--accent); color: #2b1b10; border-color: var(--accent); }
.pill.ok { background: transparent; color: var(--good); border-color: var(--good); }
.lvl.locked { opacity: .55; box-shadow: none; filter: grayscale(.7); cursor: default; }
.lvl.locked:active { transform: none; }
.lockmsg { display: inline-block; font-size: 26px; line-height: 1; }
.sheet.wide { max-width: 720px; }
/* the end screen sits in the middle of the page (and scrolls, if it ever has to, from its top) */
.screen.over { display: flex; padding-top: 14px; padding-bottom: 14px; }
.over-sheet { margin: auto; width: 100%; max-width: 720px; text-align: center; }
.over-sheet h1 { font-size: clamp(34px, 7vw, 52px); margin-bottom: 14px; }
.over-sheet .results { text-align: left; justify-content: center; }
.over-sheet .place { align-items: stretch; }
.over-buttons { display: flex; flex-direction: column; gap: 0; width: min(480px, 100%); margin: 0 auto; }
.camp-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.camp-head h1 { margin: 0; }
.camp-head .pips { gap: 10px; }
.camp-head .pips i { width: 18px; height: 18px; }

.pips i.on { background: var(--good); border-color: var(--good); }

.mode.resume b { color: var(--good); }
.tipback { position: absolute; inset: 0; z-index: 8; display: flex; align-items: flex-end; justify-content: center; padding: 0 16px calc(env(safe-area-inset-bottom) + 18px); background: rgba(10,6,3,.4); }
.tipback.top { align-items: flex-start; }
.tip { width: min(560px, 100%); padding: 20px 22px 18px; border-radius: 20px; background: var(--panel2); border: 3px solid var(--accent); box-shadow: 0 18px 50px rgba(0,0,0,.6); animation: bankin2 .3s ease-out; }
.tip h2 { margin: 0 0 8px; font-size: 26px; color: var(--accent); text-transform: none; letter-spacing: 0; }
.tip p { margin: 0 0 4px; font-size: 19px; line-height: 1.4; }
.tip .big { margin-top: 14px; padding: 18px; }
.help p, .help li { line-height: 1.45; font-size: 15px; }
.help li { margin: 4px 0; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 10px 0 8px; }
.hcard { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px; }
.hcard svg { width: 100%; height: auto; max-height: 96px; }
.hcard b { font-size: 20px; color: var(--accent); }
.hcard p { margin: 0; font-size: 16px; line-height: 1.35; }
.help .hline { font-size: 17px; margin: 8px 0; }
.help .ghost { width: 100%; margin-top: 6px; }
.fine { margin-top: 14px; color: var(--dim); }
.fine summary { cursor: pointer; padding: 10px 0; font-weight: 700; }
.help h3 { margin: 18px 0 4px; color: var(--accent); font-size: 16px; }
.table { width: 100%; border-collapse: collapse; margin: 6px 0; }
.table td, .table th { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); font-size: 16px; }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 6px 0 4px; }
.place { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.place.win { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }   /* the winner's own colour */
.place .pn { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; }
.place .pn .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
.place .score { font-size: clamp(72px, 15vw, 112px); font-weight: 900; line-height: .95; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.place .tiles { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.mini.lost { opacity: .5; }
.gw { font-size: .62em; font-weight: 800; margin-left: 2px; }
/* the fossils in this game: what exists (from the game's own data), not what is left */
.fossils .frow { display: flex; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.fossils .frow .mini { min-width: 46px; height: 46px; font-size: 24px; border-radius: 10px; }
.fossils .frow b { font-size: 24px; font-variant-numeric: tabular-nums; }
.fossils .frow span.what { color: var(--dim); font-size: 15px; margin-left: auto; text-align: right; }
.fossils .total { margin: 10px 0 0; font-weight: 700; }
.rowlab { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); margin-top: 2px; }
.place .tiles { min-height: 30px; }
/* the unlock is a quiet line under the headline (not a card: nothing there is tappable); the confetti does the celebrating */
.unlock { margin: 2px 0 14px; font-size: 20px; font-weight: 800; color: var(--accent); animation: unlockin .6s cubic-bezier(.2,1.4,.4,1); }
@keyframes unlockin { 0% { transform: scale(.7); opacity: 0; } 100% { transform: none; opacity: 1; } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
.confetti i { position: absolute; top: -16px; width: 10px; height: 16px; border-radius: 2px; opacity: 0; animation: fall linear forwards; }
@keyframes fall { 0% { transform: translateY(0) translateX(0) rotate(0); opacity: 1; } 100% { transform: translateY(105vh) translateX(var(--dx)) rotate(540deg); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .unlock { animation: none; } .confetti { display: none; } }
.dim { color: var(--dim); font-size: 13px; }
/* ---------- iPhone portrait (402 x 874, minus the status bar and the home bar): no menu screen scrolls ---------- */
@media (max-width: 480px), (max-height: 700px) {
  .screen:not(.home) { padding: 12px 16px; }
  h1 { font-size: 30px; margin-bottom: 2px; }
  h2 { margin: 12px 0 6px; font-size: 12px; }
  .sub { margin-bottom: 8px; font-size: 14px; }
  .back { min-height: 44px; margin: 0 0 8px; }
  .big { margin-top: 12px; padding: 14px; font-size: 18px; }
  .big.alt { margin-top: 8px; }
  .ghost { margin-top: 8px; padding: 10px 14px; }
  .seatrow { margin: 5px 0; }
  .seatrow input { padding: 8px 12px; }
  .seg button { padding: 8px 14px; }
  .dim { font-size: 12px; }
  .pass-note { display: none; }
  .settings h3 { margin: 12px 0 2px; }
  .settings .warn { padding: 2px 12px 12px; }
  .settings .warn p { font-size: 14px; margin: 8px 0; }
  .help .hline { font-size: 14px; margin: 5px 0; }
  .how { grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 4px; }
  .hcard { padding: 6px 10px 8px; gap: 2px; }
  .hcard svg { max-height: 54px; }
  .hcard b { font-size: 15px; }
  .hcard p { font-size: 12.5px; line-height: 1.3; }
  .fine summary { padding: 6px 0; }
  .fine[open] { max-height: 26vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .fossils .frow { padding: 5px 0; gap: 10px; }
  .fossils .frow .mini { min-width: 38px; height: 38px; font-size: 20px; }
  .fossils .frow b { font-size: 20px; }
  .fossils .frow span.what { font-size: 13px; }
  .results { grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0; }
  .place { padding: 8px 10px; gap: 3px; }
  .place .pn { font-size: 16px; }
  .place .score { font-size: 48px; letter-spacing: -1px; }
  .place .tiles { min-height: 24px; }
  .rowlab { font-size: 11px; }
  .mini { min-width: 24px; height: 24px; font-size: 13px; }
  .over-sheet h1 { font-size: 28px; margin-bottom: 6px; }
  .unlock { margin: 0 0 8px; font-size: 16px; }
  .lvl { min-height: 80px; padding: 8px 14px 8px 10px; gap: 12px; }
  .lvl .mini-board { width: 62px; height: 62px; }
  .levels { gap: 8px; }
  .camp-head { margin-bottom: 8px; }
}
</style>

<!-- =====================================================================
     DATA BLOCK — every rule, point value, board-setup number and campaign level lives here.
     The logic below (engine / bots / campaign / ui) reads this object and nothing else.
     ===================================================================== -->
<script id="data">
const GAME_DATA = {
  // Where the Tabletop Library's front page is (relative to this file). Shown only when hosted over http(s).
  library: { name: 'Tabletop Library', href: '../../index.html' },

  // Pass & Play: 2-4 people on one device.
  players: { min: 2, max: 4 },
  // Pass & Play offers the same five boards as the campaign levels (board, fossils and gems of that level); the setup screen picks one by itself from the number of players
  // (more people, a bigger board, so everyone gets turns) until somebody chooses.
  passBoards: [{ id: 'tiny', name: 'Tiny', level: 'beginner' }, { id: 'small', name: 'Small', level: 'novice' }, { id: 'medium', name: 'Medium', level: 'normal' },
               { id: 'large', name: 'Large', level: 'challenging' }, { id: 'huge', name: 'Huge', level: 'master' }],
  passBoardByPlayers: { 2: 'medium', 3: 'large', 4: 'huge' },
  die: { sides: 6 },            // who goes first (highest roll)

  // ---- BOARD ---------------------------------------------------------
  // One fossil on every space, no pieces, no movement. The shapes are sets of hex spaces in cube coordinates (x + y + z = 0).
  // `radius r` means every space with max(|x|, |y|, |z|) <= r; `remove` / `add` take spaces out of / put spaces into that hexagon;
  // a `triangle` of side n has rows of 1 to n spaces (x >= 0, z >= 0, x + z <= n - 1).
  // Pass & Play plays on the `flower`; each campaign level has a board of its own (see the levels below).
  shapes: {
    donut:    { radius: 2, remove: [[0, 0, 0]] },                                                  // 18: the radius-2 hexagon without its centre
    triangle: { triangle: 6 },                                                                      // 21: rows of 1 to 6
    sun:      { radius: 2, add: [[3, -3, 0], [3, 0, -3], [0, 3, -3], [-3, 3, 0], [-3, 0, 3], [0, -3, 3]] },   // 25: the radius-2 hexagon (19) and the six radius-3 corners as rays
    flower:   { radius: 3, remove: [[3, -3, 0], [3, 0, -3], [0, 3, -3], [-3, 3, 0], [-3, 0, 3], [0, -3, 3]] },     // 31: the radius-3 hexagon without its six corners
    giant:    { radius: 3 },                                                                        // 37: the whole radius-3 hexagon
  },
  board: { shape: 'flower' },

  // ---- FOSSILS (31, for Pass & Play: the same as the Challenging level) ---------------------
  tokens: [
    { value: 2,  count: 6 },
    { value: 3,  count: 6 },
    { value: 5,  count: 4 },
    { value: 6,  count: 4 },
    { value: 7,  count: 4 },
    { value: 9,  count: 2 },
    { value: 10, count: 2 },
    { value: 12, count: 3, gem: true },   // gems: worth 12, matched as a set of three
  ],
  matching: { pairSize: 2, gemSetSize: 3 },

  // ---- RULES -----------------------------------------------------------
  // A turn is "peek and flip" (first tap = private peek, second tap = public flip) or "bank".
  rules: {
    scoring: {
      setPoints: 'tile-number',   // banking ONE held set scores the number on its fossil (a gem scores its own value); a number here = flat points instead
    },
    tiebreaks: ['score', 'sets', 'finalPair'],   // highest score, then most sets popped, then who popped the final pair
  },

  // ---- CAMPAIGN --------------------------------------------------------
  // You against one opponent per level. Beat a level (win outright) to unlock the next; only the first starts open.
  // Each level's opponent is an `ai` profile (abilities scored 0-10; see THE OPPONENTS' BRAINS below). To make a level easier or
  // harder, change its numbers: memory first, then the skills.
  campaign: {
    // Each level has its own board (`shape`, see `shapes` above) and its own fossils (value x copies; a `gem` is matched as a set of three and is worth its value).
    // The number of fossils must equal the number of spaces. Level 2 is the first with gems: the first gem a player sees is explained by a reminder (`coach.gem`), not by a note at the start of the level.
    levels: [
      { id: 'beginner',    name: 'Beginner',    shape: 'donut',    tokens: [{ value: 2, count: 4 }, { value: 3, count: 4 }, { value: 5, count: 4 }, { value: 6, count: 4 }, { value: 9, count: 2 }],
        ai: { memory: 5.2, selfAwareness: 0, valueSense: 0, leadSense: 0, endSense: 0, setsSense: 0, gemSense: 0 } },
      { id: 'novice',      name: 'Novice',      shape: 'triangle', tokens: [{ value: 2, count: 4 }, { value: 3, count: 4 }, { value: 5, count: 4 }, { value: 6, count: 4 }, { value: 9, count: 2 }, { value: 10, count: 3, gem: true }],
        ai: { memory: 7.0, selfAwareness: 3, valueSense: 3, leadSense: 3, endSense: 3, setsSense: 3, gemSense: 3 } },
      { id: 'normal',      name: 'Normal',      shape: 'sun',      tokens: [{ value: 2, count: 6 }, { value: 3, count: 4 }, { value: 5, count: 4 }, { value: 6, count: 4 }, { value: 9, count: 2 }, { value: 10, count: 2 }, { value: 11, count: 3, gem: true }],
        ai: { memory: 8.5, selfAwareness: 5, valueSense: 5, leadSense: 5, endSense: 5, setsSense: 5, gemSense: 5 } },
      { id: 'challenging', name: 'Challenging', shape: 'flower',   tokens: [{ value: 2, count: 6 }, { value: 3, count: 6 }, { value: 5, count: 4 }, { value: 6, count: 4 }, { value: 7, count: 4 }, { value: 9, count: 2 }, { value: 10, count: 2 }, { value: 12, count: 3, gem: true }],
        ai: { memory: 9.3, selfAwareness: 7, valueSense: 8, leadSense: 8, endSense: 8, setsSense: 8, gemSense: 8 } },
      { id: 'master',      name: 'Master',      shape: 'giant',    tokens: [{ value: 2, count: 8 }, { value: 3, count: 8 }, { value: 5, count: 4 }, { value: 6, count: 4 }, { value: 7, count: 4 }, { value: 9, count: 2 }, { value: 10, count: 2 }, { value: 11, count: 2 }, { value: 15, count: 3, gem: true }],

    profiles: {

      expert: { memory: 10, selfAwareness: 10, valueSense: 10, leadSense: 10, endSense: 10, setsSense: 10, gemSense: 10 },

    // How the smart opponent weighs things, and what the 0-10 scores mean in numbers. Calibration numbers (see games/fossil-frenzy/docs/AI.md), shared by every level.
    tuning: {
      retentionAtZero: 0.5,                                      // memory skill 0 = a memory survives a turn half the time; skill 10 = always
      nearMiss: 0.5,                                             // when memory slips: how often it taps a neighbour of the right fossil rather than any fossil
      endHabits: [                                               // an opponent with almost no endgame sense banks by rule of thumb (endSense at or below `upTo`)

      wpScale: 2.5, sigmaBase: 8,                                // from lead to chance of winning
      endBias: 0, endScale: 6,                                   // extra push to finish the game when ahead / keep it going when behind (0: simulations found no gain)
      defaultBias: 3, defaultDecay: 1, defaultRef: 5,            // early in the game, banking what you hold and taking a set you can make are the default: a nudge that fades as the game goes on, smaller for low sets
      gemLeak: 3, gemEager: 100,                                 // what going for the third gem costs it (information given away); how strongly a bot with no gem sense wants to
      slipShare: 0.4,                                            // when it taps the wrong spot, how much of what exploring would have given it still gets
