<!-- =====================================================================
     ENGINE — pure rules, no DOM.  Reads GAME_DATA (or a copy passed in).
     ===================================================================== -->
<script id="engine">
const Engine = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));

  // Seeded RNG whose position can be saved and restored (so a saved game continues exactly where it stopped).
  function mulberry32(seed) {
    let a = seed >>> 0;
    const next = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.getState = () => a;
    next.setState = v => { a = v >>> 0; };
    return next;
  }

  const rint = (s, n) => Math.floor(s.rng() * n);
  const rollDie = (s, sides) => 1 + rint(s, sides || s.data.die.sides);
  const cur = s => s.players[s.current];
  const fail = msg => { throw new Error('Illegal: ' + msg); };
  const emit = (s, ev) => { for (const o of s.observers) o.onEvent(ev, s); };

  // ---------------- board ----------------
  // The spaces of a board, in reading order (row by row), each as axial (q, r) with q = x and r = z of its cube coordinates.
  function buildBoard(data) {
    const sh = data.shapes[data.board.shape];
    if (!sh) fail('unknown board shape ' + data.board.shape);
    const keep = new Set(), key = (x, y, z) => x + ',' + y + ',' + z;
    if (sh.triangle) { for (let x = 0; x < sh.triangle; x++) for (let z = 0; x + z < sh.triangle; z++) keep.add(key(x, -x - z, z)); }
    else {
      const R = sh.radius;
      for (let x = -R; x <= R; x++) for (let z = -R; z <= R; z++) { const y = -x - z; if (Math.abs(y) <= R) keep.add(key(x, y, z)); }
      for (const c of sh.remove || []) keep.delete(key(...c));
      for (const c of sh.add || []) keep.add(key(...c));
    }
    const cells = [...keep].map(k => k.split(',').map(Number)).map(([x, y, z]) => ({ q: x, r: z }));
    cells.sort((a, b) => a.r - b.r || a.q - b.q);
    cells.forEach((c, i) => { c.id = i; });
    return cells;
  }

  // ---------------- creation ----------------
  function createGame(opts = {}) {
    const data = clone(opts.data || GAME_DATA);
    const n = opts.players || 2;
    if (n < data.players.min || n > data.players.max) fail('player count ' + n);
    const rng = opts.rng || (opts.seed !== undefined ? mulberry32(opts.seed) : Math.random);
    const s = { data, rules: data.rules, rng, n, observers: [], over: false, result: null,
                matchedCount: 0, turnNo: 0, lastPopper: -1, lastBank: null };

    s.cells = buildBoard(data);

    // fossils
    let values = [];
    for (const t of data.tokens) {
      const size = t.gem ? data.matching.gemSetSize : data.matching.pairSize;
      if (t.count % size) fail('token count of ' + t.value + ' is not a multiple of its set size');
      for (let i = 0; i < t.count; i++) values.push({ value: t.value, gem: !!t.gem });
    }
    if (values.length !== s.cells.length) fail(values.length + ' tiles for ' + s.cells.length + ' spaces');
    if (opts.layout) {           // deterministic layout for tests: values in cell order
      const pool = values.slice();
      values = opts.layout.map(v => {
        const i = pool.findIndex(p => p.value === v.value && p.gem === !!v.gem);
        if (i < 0) fail('layout does not match tile set');
        return pool.splice(i, 1)[0];
      });
    } else {
      for (let i = values.length - 1; i > 0; i--) {
        const j = rint(s, i + 1); [values[i], values[j]] = [values[j], values[i]];
      }
    }
    s.tokens = values.map((v, i) => ({ id: i, value: v.value, gem: v.gem, cell: s.cells[i].id, matched: false }));
    s.tokenAt = new Array(s.cells.length).fill(-1);
    for (const t of s.tokens) s.tokenAt[t.cell] = t.id;

    s.players = [];
    for (let i = 0; i < n; i++) s.players.push({ idx: i, roll: 0, sets: [], banked: [], points: 0, poppedSets: 0 });

    // who starts: everyone rolls; a duplicate roll is re-rolled by whoever rolled it second; highest goes first
    const used = new Set();
    for (const p of s.players) {
      let r, guard = 0;
      do { r = rollDie(s); } while (used.has(r) && ++guard < 1000);
      used.add(r); p.roll = r;
    }
    s.firstPlayer = s.players.reduce((b, p) => (p.roll > s.players[b].roll ? p.idx : b), 0);
    s.current = s.firstPlayer;
    beginTurn(s);
    return s;
  }

  function beginTurn(s) {
    s.turn = { T: null, F: null, F2: null, revealed: [], peeked: null };
    s.phase = 'action';
    emit(s, { type: 'turn', actor: s.current });
  }

  // ---------------- peek / flip / match ----------------
  const unmatched = (s, id) => id >= 0 && id < s.tokens.length && !s.tokens[id].matched;
  const hiddenOthers = s => s.tokens.filter(t => !t.matched && !s.turn.revealed.includes(t.id) && t.id !== s.turn.T);

  function reveal(s, tid, step) {
    const t = s.tokens[tid];
    s.turn.revealed.push(tid);
    emit(s, { type: 'reveal', actor: s.current, tid, cell: t.cell, value: t.value, gem: t.gem, step });
  }

  // First tap: a private peek at any fossil. After it you must flip (banking is only possible before a peek).
  function peek(s, tid) {
    if (s.phase !== 'action') fail('cannot peek now');
    if (!unmatched(s, tid)) fail('cannot peek at ' + tid);
    s.turn.T = tid; s.turn.peeked = tid; s.phase = 'peeked';
    const t = s.tokens[tid];
    emit(s, { type: 'peek', actor: s.current, tid, cell: t.cell, value: t.value, gem: t.gem });
    return t.value;
  }

  // Second tap: a public flip of a different fossil.
  function flipOther(s, tid) {
    if (s.phase !== 'peeked') fail('flip only after peeking');
    if (tid === s.turn.T || !unmatched(s, tid)) fail('cannot flip ' + tid);
    s.turn.F = tid; reveal(s, tid, 'other');
    s.phase = 'flipped';
  }

  function popSet(s, tids) {
    const p = cur(s), toks = tids.map(i => s.tokens[i]);
    for (const t of toks) { t.matched = true; s.tokenAt[t.cell] = -1; }
    p.sets.push({ value: toks[0].value, gem: toks[0].gem, size: toks.length, ids: tids.slice() });
    p.poppedSets++; s.lastPopper = p.idx; s.matchedCount += toks.length;
    s.turn.matched = tids.slice();
    emit(s, { type: 'match', actor: p.idx, tids: tids.slice(), value: toks[0].value, gem: toks[0].gem });
    s.phase = 'resolved';
    if (s.matchedCount === s.tokens.length) finish(s);
  }

  // Reveal the fossil you peeked at. A matching pair is yours. If it and the flipped one are both gems you may
  // go on and flip a third fossil; three gems make a set. Anything else flips back at the end of the turn.
  function flipOwn(s) {
    if (s.phase !== 'flipped') fail('cannot flip the peeked fossil now');
    const T = s.tokens[s.turn.T], F = s.tokens[s.turn.F];
    reveal(s, T.id, 'own');
    if (!T.gem && !F.gem && T.value === F.value) return popSet(s, [T.id, F.id]);
    if (T.gem && F.gem && hiddenOthers(s).length > 0) { s.phase = 'gemThird'; return; }
    s.phase = 'resolved';
  }

  const canFlipOwn = s => s.phase === 'flipped';
  const canFlipSecond = s => s.phase === 'gemThird' && hiddenOthers(s).length > 0;

  function flipSecond(s, tid) {
    if (!canFlipSecond(s)) fail('no third flip available');
    if (!hiddenOthers(s).some(t => t.id === tid)) fail('cannot flip ' + tid);
    s.turn.F2 = tid; reveal(s, tid, 'second');
    if (s.tokens[tid].gem) popSet(s, [s.turn.T, s.turn.F, tid]); else s.phase = 'resolved';
  }

  // ---------------- banking ----------------
  // A turn is a peek AND a flip (once you have peeked you must flip another fossil), or a bank instead — never a peek and then a bank.
  const canBank = s => s.phase === 'action' && cur(s).sets.length > 0;

  // Bank ONE held set (the player's choice). It scores the number on its fossil, once: no bonus roll.
  function bank(s, setIndex = 0) {
    if (!canBank(s)) fail('cannot bank');
    const sc = s.rules.scoring, p = cur(s), set = p.sets[setIndex];
    if (!set) fail('no such set');
    const base = sc.setPoints === 'tile-number' ? set.value : sc.setPoints;
    s.lastBank = { player: p.idx, value: set.value, gem: set.gem, base, total: base, setsLeft: p.sets.length - 1 };
    p.points += base; p.sets.splice(setIndex, 1);
    p.banked.push({ value: set.value, gem: set.gem, base });
    s.turn.T = null; s.turn.peeked = null; s.turn.banked = true;
    s.phase = 'resolved';
    emit(s, { type: 'bank', actor: p.idx, info: s.lastBank });
  }

  // ---------------- turn end / game end ----------------
  function endTurn(s) {
    if (s.over) return;
    s.turn.revealed = [];
    s.turnNo++;
    s.current = (s.current + 1) % s.n;
    beginTurn(s);
  }

  function standings(s) {
    return s.players.map(p => ({
      idx: p.idx, score: p.points, sets: p.poppedSets, finalPair: s.lastPopper === p.idx ? 1 : 0, stranded: p.sets.length,
    }));
  }

  function computeResult(s) {
    const keys = s.rules.tiebreaks, st = standings(s);
    const cmp = (a, b) => { for (const k of keys) if (a[k] !== b[k]) return b[k] - a[k]; return 0; };
    const ranking = st.slice().sort(cmp);
    const winners = ranking.filter(r => cmp(r, ranking[0]) === 0).map(r => r.idx);
    return { ranking, winners, standings: st };
  }

  function finish(s) {
    s.over = true; s.phase = 'over';
    s.result = computeResult(s);
    emit(s, { type: 'over', result: s.result });
  }

  // ---------------- save / resume ----------------
  const SAVE_SCHEMA = 2;
  // Identifies the rules a save was made under; a save from different rules (an updated data block) is not resumed.
  function fingerprint(s) {
    const str = JSON.stringify([s.data.board, s.data.shapes[s.data.board.shape], s.data.tokens, s.data.matching, s.data.die, s.rules]);
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  // A plain-JSON snapshot of a game in progress (works at any moment, including mid-turn).
  function serialize(s) {
    if (!s.rng.getState) throw new Error('this game uses an RNG that cannot be saved');
    if (s.over) throw new Error('a finished game is not saved');
    return JSON.parse(JSON.stringify({
      schema: SAVE_SCHEMA, fingerprint: fingerprint(s), n: s.n,
      tokens: s.tokens, tokenAt: s.tokenAt, players: s.players, current: s.current, phase: s.phase, turn: s.turn,
      turnNo: s.turnNo, matchedCount: s.matchedCount, lastPopper: s.lastPopper, lastBank: s.lastBank,
      firstPlayer: s.firstPlayer, rngState: s.rng.getState(),
    }));
  }

  // Rebuilds a game from serialize(); throws if the save is from another schema or other rules.
  function restore(saved, opts = {}) {
    if (!saved || saved.schema !== SAVE_SCHEMA) throw new Error('unknown save format');
    const s = createGame({ data: opts.data, players: saved.n, seed: 1 });
    if (fingerprint(s) !== saved.fingerprint) throw new Error('the rules changed since this game was saved');
    if (saved.tokens.length !== s.tokens.length || saved.players.length !== s.n) throw new Error('save does not match the game');
    for (const k of ['tokens', 'tokenAt', 'players', 'current', 'phase', 'turn', 'turnNo', 'matchedCount', 'lastPopper', 'lastBank', 'firstPlayer']) s[k] = saved[k];
    s.rng.setState(saved.rngState);
    return s;
  }

  // ---------------- views / dispatch ----------------
  function status(s) {
    return {
      phase: s.phase,
      canPeek: s.phase === 'action' && s.tokens.some(t => !t.matched),
      canBank: canBank(s),
      canFlipOwn: canFlipOwn(s),
      canFlipSecond: canFlipSecond(s),
      canEnd: !s.over && (s.phase === 'flipped' || s.phase === 'gemThird' || s.phase === 'resolved'),    // only once you have flipped (or banked)
    };
  }

  // What a player at the table may legitimately know: no face-down fossil values.
  function publicView(s, idx) {
    const seen = new Map();
    for (const tid of s.turn.revealed) seen.set(tid, s.tokens[tid].value);
    return {
      n: s.n, me: idx, current: s.current, phase: s.phase, over: s.over, rules: s.rules, die: s.data.die, turnNo: s.turnNo,
      setPair: s.data.matching.pairSize, setGem: s.data.matching.gemSetSize, kinds: s.data.tokens,       // which fossils exist is public
      cells: s.cells,
      tokens: s.tokens.map(t => ({ id: t.id, cell: t.cell, matched: t.matched })),
      tokensLeft: s.tokens.length - s.matchedCount,
      revealed: s.turn.revealed.map(tid => ({ tid, value: seen.get(tid), gem: s.tokens[tid].gem })),
      T: idx === s.current ? s.turn.T : null,          // another seat's peeked fossil stays private
      F: s.turn.F,
      peeked: idx === s.current && s.turn.peeked !== null ? { tid: s.turn.peeked, value: s.tokens[s.turn.peeked].value, gem: s.tokens[s.turn.peeked].gem } : null,
      players: s.players.map(p => ({ idx: p.idx, sets: p.sets.map(x => ({ value: x.value, gem: x.gem, size: x.size })), points: p.points })),
      status: idx === s.current ? status(s) : null,
    };
  }

  function apply(s, a) {
    switch (a.type) {
      case 'peek': return peek(s, a.tid);
      case 'flipOther': return flipOther(s, a.tid);
      case 'flipSecond': return flipSecond(s, a.tid);
      case 'flipOwn': return flipOwn(s);
      case 'bank': return bank(s, a.set);
      case 'endTurn': return endTurn(s);
      default: fail('unknown action ' + a.type);
    }
  }

  return { createGame, buildBoard, peek, flipOther, flipSecond, flipOwn, canFlipSecond, canFlipOwn, bank, canBank, endTurn,
           status, standings, computeResult, publicView, apply, serialize, restore, mulberry32 };
})();
</script>

<script id="bots">
/* =====================================================================
   BOTS — a configurable opponent, from "plays at random" up to the perfect player.

   What a bot may know: the public view of the game (Engine.publicView), the public events (every flip, every match,
   every set popped) and its OWN peeks.  Never a hidden fossil value.

   Every skill is scored 0 (none) to 10 (perfect); the perfect bot scores 10 on all of them (see GAME_DATA.ai.skills):
     memory         every fact it learns fades — each turn that passes, the chance it still recalls a fact exactly is its retention
                    (a skill of 10 never forgets). Acting on a fact, it gets the spot right with probability retention^age, otherwise
                    it taps a nearby or random other spot
     selfAwareness  how well it knows its own memory is fading (low = overconfident: it goes for matches it cannot reliably make)
     valueSense     understands that high sets are worth more than low ones (0 = every set looks the same)
     leadSense      plays for the win (protect a lead / chase a deficit) rather than for raw points
     endSense       knows how close the game is to ending (when to bank); a very low score banks by rule of thumb instead
     setsSense      keeps track of which sets are still on the board
     gemSense       understands that going for the third gem gives two gems' positions away (low = it always goes for the third)
   ===================================================================== */
const Bots = (() => {
  const AI = () => GAME_DATA.ai;

  // ---------- small math ----------
  const erf = x => {
    const s = x < 0 ? -1 : 1; x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x));
  };
  const Phi = z => 0.5 * (1 + erf(z / Math.SQRT2));                       // normal CDF
  const softplus = x => (x > 20 ? x : Math.log1p(Math.exp(x)));
  const keyOf = (value, gem) => (gem ? 'g' : 'n') + value;

  const DEFAULTS = { style: 'smart', memory: 10, selfAwareness: 10, valueSense: 10, leadSense: 10, endSense: 10, setsSense: 10, gemSense: 10 };
  function profileOf(spec) {
    if (typeof spec === 'string') { if (!AI().profiles[spec]) throw new Error('unknown bot profile ' + spec); return { ...DEFAULTS, ...AI().profiles[spec] }; }
    const base = spec && spec.profile ? AI().profiles[spec.profile] : null;
    return { ...DEFAULTS, ...(base || {}), ...(spec || {}) };
  }

  function create(opts) {
    const P = profileOf(opts.profile !== undefined ? opts.profile : opts.spec);
    const T = { ...AI().tuning, ...(P.tuning || {}) };
    const bot = { seat: opts.seat, profile: P, rng: opts.rng || Math.random, facts: new Map(), gone: {}, turnIx: 0, slips: 0, lost: new Set() };
    const rnd = () => bot.rng();
    const pick = arr => arr[Math.floor(rnd() * arr.length)];

    // ---------- the fossil kinds and scoring (they arrive with the public view, so a bot works with any data block) ----------
    let KINDS = [], TOTAL = 0, MEAN_VALUE = 0, SIZES = { pair: 2, gem: 3 }, seenKinds = null;
    function learnRules(v) {
      if (seenKinds === v.kinds) return;
      seenKinds = v.kinds;
      SIZES = { pair: v.setPair, gem: v.setGem };
      KINDS = v.kinds.map(t => ({ key: keyOf(t.value, t.gem), value: t.value, gem: !!t.gem, count: t.count, size: t.gem ? v.setGem : v.setPair }));
      TOTAL = KINDS.reduce((n, k) => n + k.count, 0);
      const setsTotal = KINDS.reduce((n, k) => n + k.count / k.size, 0);
      MEAN_VALUE = KINDS.reduce((n, k) => n + k.value * k.count / k.size, 0) / setsTotal;
      const sc = v.rules.scoring;
    }
    // abilities are scored 0-10 in the profile; the engine works with 0-1
    const sk = name => P[name] / 10;
    const retention = () => T.retentionAtZero + (1 - T.retentionAtZero) * sk('memory');          // memory skill -> chance a memory survives a turn
    const overconfidence = () => 1 - sk('selfAwareness');
    // a bot with almost no feel for the end of the game banks by rule of thumb (its habits come from GAME_DATA.ai.tuning.endHabits)
    const habit = () => T.endHabits.find(h => P.endSense <= h.upTo) || null;
    const ve = value => (1 - sk('valueSense')) * MEAN_VALUE + sk('valueSense') * value;                                     // the value this bot sees in a set

    // ---------- what it learns ----------
    bot.onEvent = ev => {
      switch (ev.type) {
        case 'turn': bot.turnIx++; bot.lost.forEach(t => bot.facts.delete(t)); bot.lost.clear(); break;
        case 'reveal': bot.facts.set(ev.tid, { value: ev.value, gem: ev.gem, pub: true, t: bot.turnIx }); break;          // a public flip: everyone saw it
        case 'peek': {
          if (ev.actor !== bot.seat) break;                                                                                // other players' peeks are private
          const old = bot.facts.get(ev.tid);
          bot.facts.set(ev.tid, { value: ev.value, gem: ev.gem, pub: !!(old && old.pub), t: bot.turnIx });
          break;
        }
        case 'match': {
          for (const t of ev.tids) bot.facts.delete(t);
          const k = keyOf(ev.value, ev.gem); bot.gone[k] = (bot.gone[k] || 0) + ev.tids.length;
          break;
        }
        default: break;
      }
    };

    // does it recall a fact exactly right now?  (memory^age)
    const trueRecall = f => (retention() >= 1 ? 1 : Math.max(T.recallFloor, Math.pow(retention(), bot.turnIx - f.t)));      // (a small floor, so a forgetful bot can never be stuck for good)
    const recalls = f => retention() >= 1 || rnd() < trueRecall(f);
    // how reliable the bot THINKS a memory is: the truth, or — if it is overconfident — closer to certain
    const believedRecall = f => { const p = trueRecall(f); return p + overconfidence() * (1 - p); };

    // ---------- the picture of the game from where it sits ----------
    function look(v) {
      learnRules(v);
      const L = v.tokensLeft, n = v.n, me = v.players[v.me];
      const known = [];
      for (const [tid, f] of bot.facts) {
        if (v.tokens[tid].matched) { bot.facts.delete(tid); continue; }
        known.push({ tid, key: keyOf(f.value, f.gem), value: f.value, gem: f.gem, pub: f.pub, t: f.t, pr: believedRecall(f) });
      }
      const byKey = {};
      for (const k of known) (byKey[k.key] = byKey[k.key] || []).push(k);
      // what is still on the board, by kind (if it tracks the sets; else a proportional guess)
      const R = {};
      for (const k of KINDS) R[k.key] = sk('setsSense') >= 0.5 ? Math.max(0, k.count - (bot.gone[k.key] || 0)) : k.count * L / TOTAL;
      const unknownN = Math.max(0, L - known.length);
      const c = {};
      let cs = 0;
      for (const k of KINDS) { c[k.key] = Math.max(0, R[k.key] - (byKey[k.key] ? byKey[k.key].length : 0)); cs += c[k.key]; }
      if (cs > 0) for (const k in c) c[k] *= unknownN / cs;
      const sets = [];                                       // the sets still to be made, by value
      for (const k of KINDS) { const m = sk('setsSense') >= 0.5 ? Math.floor(R[k.key] / k.size + 1e-9) : Math.round(R[k.key] / k.size); for (let i = 0; i < m; i++) sets.push(k.value); }
      // sure sets: kinds I know enough tiles of to complete right now
      const sure = [];                                       // {key, value, gem, tiles:[known], pub}
      for (const k of KINDS) {
        const have = byKey[k.key] || [];
        for (let i = 0; i + k.size <= have.length; i += k.size) {
          const tiles = have.slice().sort((a, b) => (b.pub ? 1 : 0) - (a.pub ? 1 : 0)).slice(i, i + k.size);   // use up public knowledge first
          sure.push({ key: k.key, value: k.value, gem: k.gem, tiles, pub: tiles.every(t => t.pub), pr: tiles.reduce((a, t) => a * t.pr, 1) });
        }
      }
      const singles = [];                                    // private knowledge that is not yet a sure set
      for (const k of KINDS) {
        const have = (byKey[k.key] || []);
        const left = have.length % k.size;
        if (!left) continue;
        const rest = have.slice().sort((a, b) => (b.pub ? 1 : 0) - (a.pub ? 1 : 0)).slice(have.length - left);
        for (const t of rest) if (!t.pub) singles.push({ x: k.value, c: c[k.key], key: k.key });
      }
      // how long is left (my turns, this one included)
      const Sn = sets.length;
      const Eall = Math.max(Sn * T.minTurnsPerSet, T.turnsPerSet * Sn - T.knownRelief * sure.length);
      const Eme = Eall / n;
      // it only notices the end approaching once it is within `endSense` x horizonTurns of it; before that it assumes there is plenty of time
      const E = Eme <= sk('endSense') * T.horizonTurns ? Eme : Math.max(Eme, T.blindTurns);
      return { v, L, n, me, known, byKey, c, unknownN, sets, sure, singles, E, C: Math.max(0, E - 1),
               publicKnown: known.filter(k => k.pub), privateKnown: known.filter(k => !k.pub) };
    }

    // ---------- equity: how good is a position for me, in points ----------
    function worthOf(items, C) {                            // items: [{v, need}] — work to do (turns needed each); the time left limits how much gets done
      const arr = items.slice().sort((a, b) => ve(b.v) / b.need - ve(a.v) / a.need);
      let cum = 0, w = 0;
      for (const it of arr) { w += ve(it.v) * Phi((C - cum - it.need + 0.5) / T.sE); cum += it.need; }
      return { worth: w, need: cum };
    }
    function eqMine(s, U) {                                  // s: {pts, held:[v], priv:[v], singles:[{x,c}], C}
      const items = s.held.map(v => ({ v, need: 1 })).concat(s.priv.map(v => ({ v, need: 2 })));
      const { worth, need } = worthOf(items, s.C);
      const free = Math.max(0, s.C - need);
      const g = Phi((s.C - need - 2) / T.sE);
      let pot = 0;
      for (const sg of s.singles) pot += g * Math.min(T.maxHit, T.hitRate * free * sg.c / Math.max(1, U)) * ve(sg.x);
      return s.pts + worth + T.spareValue * softplus(s.C - need) + pot;
    }
    // how uncertain the final margin still is: mostly the sets still to be won
    const sigmaOf = sets => Math.sqrt(T.sigmaBase + sets.reduce((a, v) => a + ve(v) * ve(v), 0));

    // ---------- choosing what to do with the turn ----------
    function oppBest(X) {
      let best = null;
      for (const p of X.v.players) {
        if (p.idx === X.v.me) continue;
        const e = p.points + worthOf(p.sets.map(s => ({ v: s.value, need: 1 })), X.C).worth + T.spareValue * softplus(X.C - p.sets.length);
        if (!best || e > best.e) best = { e, pts: p.points };
      }
      return best || { e: 0, pts: 0 };
    }
    const denial = (X, value) => Phi((ve(value) - T.spareValue) / T.denialSpread) * T.replyShare * ve(value);   // what they take if I leave a public set

    function baseState(X) {
      return { pts: X.me.points, held: X.me.sets.map(s => s.value), priv: X.sure.filter(s => !s.pub).map(s => s.value), singles: X.singles.slice(), C: X.C };
    }
    function utility(X, st, setsAfter, pubLeft, oppE, sigRef) {
      let D = eqMine(st, X.unknownN) - oppE;
      if (pubLeft.length) D -= denial(X, Math.max(...pubLeft));
      if (sk('leadSense') <= 0) return D;
      const wp = Phi(D / sigmaOf(setsAfter));
      // ahead: finishing the game sooner protects the lead; behind: keeping fossils on the board buys time to catch up
      const removed = X.sets.length - setsAfter.length;
      const hurry = T.endBias * sk('endSense') * Math.tanh(D / T.endScale) * removed;
      return (1 - sk('leadSense')) * D + sk('leadSense') * (sigRef * T.wpScale * (wp - 0.5) + hurry);
    }
    const without = (arr, val) => { const a = arr.slice(), i = a.indexOf(val); if (i >= 0) a.splice(i, 1); return a; };

    // The turn's candidates: bank, take a sure set, explore (peek something new), gamble on a gem set.
    function plans(X) {
      const out = [];
      const oppE = oppBest(X).e, sigRef = sigmaOf(X.sets);
      const pubPairs = X.sure.filter(s => s.pub).map(s => s.value);
      const base = baseState(X);
      const U = (st, setsAfter, pubLeft) => utility(X, st, setsAfter, pubLeft, oppE, sigRef);
      // The default moves — bank what you hold, take a set you can make — are worth a nudge early in the game, fading as the game goes on
      // (later the score and the time left matter more); a low set earns less of it.
      const phase = Math.pow(X.L / TOTAL, T.defaultDecay);
      const nudge = value => T.defaultBias * phase * Math.min(1, ve(value) / T.defaultRef);
      // bank
      if (X.v.status && X.v.status.canBank && X.me.sets.length) {
        let bi = 0; X.me.sets.forEach((s, i) => { if (s.value > X.me.sets[bi].value) bi = i; });
        const val = X.me.sets[bi].value;
        out.push({ kind: 'bank', set: bi, u: U({ ...base, pts: base.pts + val, held: without(base.held, val) }, X.sets, pubPairs) + nudge(val) });
      }
      // take a sure set (it only works if it recalls where the fossils are)
      const matchPlans = [];
      for (const s of X.sure) {
        const st = { ...base, held: base.held.concat([s.value]), priv: s.pub ? base.priv : without(base.priv, s.value) };
        const plan = { kind: 'match', sure: s, u: U(st, without(X.sets, s.value), s.pub ? without(pubPairs, s.value) : pubPairs) + nudge(s.value) };
        matchPlans.push(plan); out.push(plan);
      }
      // explore: peek a tile I know nothing about, then flip another I know nothing about (two new fossils learned at once)
      if (X.unknownN > 0) {
        let eu = 0;
        const Un = X.unknownN;
        const knownN = k => (X.byKey[k.key] || []).length;
        for (const k of KINDS) {
          const ck = X.c[k.key]; if (ck <= 0) continue;
          const pi = ck / Un;
          if (knownN(k) >= k.size - 1) {                                                    // my peek completes a set with what I already know: flip the partner
            const singlesAfter = base.singles.slice(), si = singlesAfter.findIndex(z => z.key === k.key);
            if (si >= 0) singlesAfter.splice(si, 1);
            const hit = U({ ...base, held: base.held.concat([k.value]), singles: singlesAfter }, without(X.sets, k.value), pubPairs);
            // ...if it recalls where the partner is (otherwise it taps the wrong spot and just learns what it peeked)
            const partner = (X.byKey[k.key] || []).slice().sort((a, b) => b.pr - a.pr).slice(0, k.size - 1).reduce((a, t) => a * t.pr, 1);
            const miss = partner < 1 ? U({ ...base, singles: base.singles.concat([{ x: k.value, c: Math.max(0, ck - 1), key: k.key }]) }, X.sets, pubPairs) : 0;
            eu += pi * (partner * hit + (1 - partner) * miss);
            continue;
          }
          // otherwise I learn it privately, and flip some other unknown fossil publicly
          const learned = base.singles.concat([{ x: k.value, c: Math.max(0, ck - 1), key: k.key }]);
          if (Un < 2) { eu += pi * U({ ...base, singles: learned }, X.sets, pubPairs); continue; }
          for (const k2 of KINDS) {
            const c2 = X.c[k2.key] - (k2.key === k.key ? 1 : 0);
            if (c2 <= 0) continue;
            const pj = c2 / (Un - 1);
            let st = { ...base, singles: learned }, setsAfter = X.sets, pubLeft = pubPairs;
            if (k2.key === k.key && k.size === 2) {                                         // the flip matches my peek
              st = { ...base, held: base.held.concat([k.value]) }; setsAfter = without(X.sets, k.value);
            } else if (knownN(k2) >= k2.size - 1 && k2.key !== k.key) {                      // the flip completes a set I knew about: it becomes public, and the next player can take it
              pubLeft = pubPairs.concat([k2.value]);
            }
            eu += pi * pj * (U(st, setsAfter, pubLeft));
          }
        }
        out.push({ kind: 'explore', u: eu });
      }
      // a set it believes it can make is only as good as its recall of it: otherwise the turn is mostly wasted (about what exploring would give)
      const idle = U(base, X.sets, pubPairs), ex = out.find(p => p.kind === 'explore');
      const failU = ex ? idle + T.slipShare * (ex.u - idle) : idle;            // a slip taps a random spot: some of the value of exploring, not all
      for (const p of matchPlans) if (p.sure.pr < 1) p.u = p.sure.pr * p.u + (1 - p.sure.pr) * failU;
      // gem gamble: two gems known, the third is out there
      for (const k of KINDS) {
        if (!k.gem) continue;
        const have = X.byKey[k.key] || [];
        if (have.length === k.size - 1 && X.c[k.key] > 0 && X.unknownN > 0) {
          const p = X.c[k.key] / X.unknownN;
          const hit = U({ ...base, held: base.held.concat([k.value]) }, without(X.sets, k.value), pubPairs);
          const miss = U(base, X.sets, pubPairs) - T.gemLeak;
          // a bot with no feel for what going for the third gem gives away simply always goes for it
          out.push({ kind: 'gamble', tiles: have, u: p * hit + (1 - p) * miss + (sk('gemSense') < 0.5 ? T.gemEager : 0) });
        }
      }
      return out;
    }

    const unmatchedIds = v => v.tokens.filter(t => !t.matched).map(t => t.id);
    const unknownIds = (X, except = []) => X.v.tokens.filter(t => !t.matched && !bot.facts.has(t.id) && !except.includes(t.id)).map(t => t.id);
    // tap where I believe a fossil is — unless my memory slips, then another spot. A person who has lost track of a fossil taps
    // somewhere they do NOT already know holds something else, and (a slip is often a near miss: the fossil next to the one it meant).
    // Having tapped wrong, it knows it has lost that fossil: the belief is dropped, so it does not try the same thing again next turn.
    function aim(X, fact, except = []) {
      if (recalls(fact)) return fact.tid;
      bot.slips++;
      let others = X.v.tokens.filter(t => !t.matched && t.id !== fact.tid && !except.includes(t.id)).map(t => t.id);
      if (!others.length) return fact.tid;
      const notKnownElse = others.filter(id => { const f = bot.facts.get(id); return !f || f.value === fact.value; });   // not a spot it knows holds a different fossil
      if (notKnownElse.length) others = notKnownElse;
      bot.lost.add(fact.tid);                                  // (dropped when the turn ends, so deciding stays free of side effects)
      const here = X.v.cells[X.v.tokens[fact.tid].cell];
      const near = others.filter(id => { const c = X.v.cells[X.v.tokens[id].cell], dq = c.q - here.q, dr = c.r - here.r; return Math.max(Math.abs(dq), Math.abs(dr), Math.abs(dq + dr)) === 1; });
      return near.length && rnd() < T.nearMiss ? pick(near) : pick(others);
    }

    function chooseAction(v) {
      const X = look(v);
      const me = X.me;
      const hb = habit();
      if (v.status.canBank && me.sets.length && hb && ((hb.bankAt > 0 && me.sets.length >= hb.bankAt) || (hb.endgameTiles > 0 && v.tokensLeft <= hb.endgameTiles))) { let bi = 0; me.sets.forEach((s, i) => { if (s.value > me.sets[bi].value) bi = i; }); return { type: 'bank', set: bi }; }
      const ps = plans(X);
      let best = null;
      for (const p of ps) if (!best || p.u > best.u + 1e-9 || (Math.abs(p.u - best.u) <= 1e-9 && rnd() < 0.5)) best = p;
      if (best) {
        if (best.kind === 'bank') return { type: 'bank', set: best.set };
        if (best.kind === 'match') { const first = best.sure.tiles[0]; return { type: 'peek', tid: aim(X, first) }; }
        if (best.kind === 'gamble') return { type: 'peek', tid: aim(X, best.tiles[0]) };
        const unk = unknownIds(X);
        if (unk.length) return { type: 'peek', tid: pick(unk) };
      }
      const any = unmatchedIds(v);                            // nothing better: look at something
      return any.length ? { type: 'peek', tid: pick(any) } : { type: 'endTurn' };
    }

    function chooseFlip(v) {
      const X = look(v), T0 = v.peeked;
      const k = keyOf(T0.value, T0.gem);
      const twins = (X.byKey[k] || []).filter(t => t.tid !== T0.tid);
      if (twins.length) {
        const wantTwins = T0.gem ? SIZES.gem - 1 : SIZES.pair - 1;
        // is it worth taking?  (a low set may be worth leaving, depending on the game)
        if (twins.length >= wantTwins && takeIt(X, T0)) return { type: 'flipOther', tid: aim(X, twins[0], [T0.tid]) };
        if (T0.gem && twins.length >= 1 && (sk('gemSense') < 0.5 || gambleIt(X, T0, twins))) return { type: 'flipOther', tid: aim(X, twins[0], [T0.tid]) };
      }
      // no set to take: flip something I have not seen (a second new fossil learned, and a chance it matches my peek)
      const unk = unknownIds(X, [T0.tid]);
      const pool = unk.length ? unk : unmatchedIds(v).filter(t => t !== T0.tid);
      return { type: 'flipOther', tid: pick(pool) };
    }

    // Is taking this sure set better than leaving it?
    function takeIt(X, T0) {
      if (X.unknownN === 0) return true;                       // nothing left to explore: the game can only go on by taking sets
      const oppE = oppBest(X).e, sigRef = sigmaOf(X.sets), base = baseState(X);
      const take = utility(X, { ...base, held: base.held.concat([T0.value]) }, without(X.sets, T0.value), [], oppE, sigRef);
      const leave = utility(X, { ...base, priv: base.priv.concat([T0.value]) }, X.sets, [], oppE, sigRef);
      return take >= leave - 1e-9;
    }
    function gambleIt(X, T0, twins) {
      const kind = KINDS.find(z => z.key === keyOf(T0.value, T0.gem));
      const c = X.c[kind.key];
      if (!(c > 0) || X.unknownN <= 0) return false;
      const p = c / X.unknownN;
      const oppE = oppBest(X).e, sigRef = sigmaOf(X.sets), base = baseState(X);
      const hit = utility(X, { ...base, held: base.held.concat([T0.value]) }, without(X.sets, T0.value), [], oppE, sigRef);
      const miss = utility(X, base, X.sets, [], oppE, sigRef) - T.gemLeak;
      const skip = utility(X, base, X.sets, [], oppE, sigRef);
      return p * hit + (1 - p) * miss > skip;
    }

    const revealedOf = (v, tid) => v.revealed.find(r => r.tid === tid);
    function afterFlip(v) {
      const T0 = v.peeked, F = revealedOf(v, v.F);
      if (!T0.gem && !F.gem && T0.value === F.value) return { type: 'flipOwn' };
      if (T0.gem && F.gem) {
        const X = look(v);
        const third = (X.byKey[keyOf(T0.value, true)] || []).filter(t => t.tid !== T0.tid && t.tid !== v.F);
        if (third.length) return { type: 'flipOwn' };
        if (sk('gemSense') < 0.5) return { type: 'flipOwn' };                           // found two gems: it goes for the third, whatever that gives away
        if (gambleIt(X, T0, third)) return { type: 'flipOwn' };
        if (v.tokensLeft <= SIZES.gem) return { type: 'flipOwn' };
      }
      return { type: 'endTurn' };
    }

    function chooseThird(v) {
      const X = look(v), T0 = v.peeked;
      const seen = new Set(v.revealed.map(r => r.tid)); seen.add(T0.tid);
      const third = (X.byKey[keyOf(T0.value, true)] || []).filter(t => !seen.has(t.tid));
      if (third.length) return { type: 'flipSecond', tid: aim(X, third[0], [...seen]) };
      const pool = v.tokens.filter(t => !t.matched && !seen.has(t.id) && !bot.facts.has(t.id)).map(t => t.id);
      const any = pool.length ? pool : v.tokens.filter(t => !t.matched && !seen.has(t.id)).map(t => t.id);
      return any.length ? { type: 'flipSecond', tid: pick(any) } : { type: 'endTurn' };
    }

    // ---------- the tutorial opponent: plays at random ----------
    function randomDecide(v) {
      const un = unmatchedIds(v);
      switch (v.phase) {
        case 'action': {
          const me = v.players[v.me];
          if (v.status.canBank && me.sets.length && rnd() < 0.35) return { type: 'bank', set: Math.floor(rnd() * me.sets.length) };
          return { type: 'peek', tid: pick(un) };
        }
        case 'peeked': return { type: 'flipOther', tid: pick(un.filter(t => t !== v.peeked.tid)) };
        case 'flipped': {
          const T0 = v.peeked, F = revealedOf(v, v.F);
          if (!T0.gem && !F.gem && T0.value === F.value) return { type: 'flipOwn' };
          if (T0.gem && F.gem && rnd() < 0.5) return { type: 'flipOwn' };
          return { type: 'endTurn' };
        }
        case 'gemThird': {
          const seen = new Set(v.revealed.map(r => r.tid)); seen.add(v.peeked.tid);
          const pool = un.filter(t => !seen.has(t));
          return pool.length ? { type: 'flipSecond', tid: pick(pool) } : { type: 'endTurn' };
        }
        default: return { type: 'endTurn' };
      }
    }

    // For tests and the design notes: what the bot is weighing at an action-phase view, best first.
    bot.weigh = v => { const X = look(v); return { E: X.E, sets: X.sets, sure: X.sure.length, known: X.known.length, unknown: X.unknownN, plans: plans(X).map(p => ({ kind: p.kind, u: +p.u.toFixed(3), value: p.sure ? p.sure.value : p.set !== undefined ? X.me.sets[p.set].value : undefined })).sort((a, b) => b.u - a.u) }; };

    bot.save = () => ({ v: 3, seat: bot.seat, profile: P, facts: [...bot.facts], gone: bot.gone, lost: [...bot.lost], turnIx: bot.turnIx, rngState: bot.rng.getState ? bot.rng.getState() : null });

    bot.decide = v => {
      if (P.style === 'random') return randomDecide(v);
      switch (v.phase) {
        case 'action': return chooseAction(v);
        case 'peeked': return chooseFlip(v);
        case 'flipped': return afterFlip(v);
        case 'gemThird': return chooseThird(v);
        case 'resolved': return { type: 'endTurn' };
        default: return null;
      }
    };
    return bot;
  }

  // One bot per seat spec (a profile name, a profile object, or null for a human seat); subscribes them to the game.
  function attach(state, specs, seed) {
    const rng0 = Engine.mulberry32((seed || 1) * 7919 + 13);
    return specs.map((sp, seat) => {
      if (!sp) return null;
      const b = create({ seat, profile: sp, rng: Engine.mulberry32(Math.floor(rng0() * 4294967296)) });
      state.observers.push(b);
      return b;
    });
  }

  // Rebuild the bots from their saved form and subscribe them to a restored game (null = human seat).
  function restore(state, saved) {
    return saved.map(sv => {
      if (!sv) return null;
      if (sv.v !== 3) throw new Error('unknown bot save format');
      const b = create({ seat: sv.seat, profile: sv.profile, rng: Engine.mulberry32(1) });
      b.facts = new Map(sv.facts); b.gone = sv.gone || {}; b.lost = new Set(sv.lost || []); b.turnIx = sv.turnIx | 0;
      if (sv.rngState !== null) b.rng.setState(sv.rngState);
      state.observers.push(b);
      return b;
    });
  }

  function step(state, bot) {
    const a = bot.decide(Engine.publicView(state, bot.seat));
    if (a) Engine.apply(state, a);
    return a;
  }

  // Play a bot-only game to the end; false if the safety cap was hit.
  function playGame(state, bots, maxActions = 200000) {
    for (let n = 0; !state.over; n++) {
      if (n > maxActions) return false;
      step(state, bots[state.current]);
    }
    return true;
  }

  return { create, attach, restore, step, playGame, profileOf };
})();
</script>

<script id="sound">
/* =====================================================================
   SOUND — synthesised with Web Audio from the recipes in GAME_DATA.sound; no files, no network.
   Good manners built in: the audio context is only created/resumed inside a tap (iPad Safari insists), nothing plays while
   it is switched off, sounds are short and soft behind one master level and a gentle limiter, the same sound is not stacked
   on itself, the number of voices is capped, and it stops when the page is hidden. The iPad's silent switch still mutes it.
   ===================================================================== */
const Sound = (() => {
  function create({ data, AudioContext, now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now()) } = {}) {
    let ctx = null, master = null, noise = null, enabled = true, voices = 0;
    const lastAt = {}, played = [];

    function build() {
      if (ctx || !AudioContext) return;
      try { ctx = new AudioContext({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AudioContext(); } catch (e2) { ctx = null; return; } }
      try { wire(); } catch (e) { ctx = null; }                    // a browser with a half-working audio system just stays silent
    }
    function wire() {
      master = ctx.createGain(); master.gain.value = data.master;
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -14; limiter.knee.value = 24; limiter.ratio.value = 6; limiter.attack.value = 0.003; limiter.release.value = 0.2;
      master.connect(limiter); limiter.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 0.25), buf = ctx.createBuffer(1, len, ctx.sampleRate), ch = buf.getChannelData(0);
      let seed = 1; for (let i = 0; i < len; i++) { seed = (seed * 16807) % 2147483647; ch[i] = (seed / 2147483647) * 2 - 1; }     // fixed noise: the same "tak" every time
      noise = buf;
    }

    // Call from inside a tap/click: creates the context the first time and wakes it if the browser put it to sleep.
    function unlock() {
      if (!AudioContext) return false;
      build();
      if (ctx && ctx.state !== 'running' && ctx.resume) { try { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* ignore */ } }
      return !!ctx;
    }
    function suspend() { if (ctx && ctx.state === 'running' && ctx.suspend) { try { const r = ctx.suspend(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* ignore */ } } }

    function voice(v, t0) {
      const t = t0 + (v.at || 0), a = v.a || 0.006, d = Math.max(0.02, v.d), peak = Math.min(1, v.g);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let src;
      if (v.w === 'noise') { src = ctx.createBufferSource(); src.buffer = noise; src.loop = true; }
      else {
        src = ctx.createOscillator(); src.type = v.w;
        const f = Array.isArray(v.f) ? v.f : [v.f, v.f];
        src.frequency.setValueAtTime(f[0], t);
        if (f[1] !== f[0]) src.frequency.exponentialRampToValueAtTime(f[1], t + d);
      }
      let node = src;
      if (v.hp) { const h = ctx.createBiquadFilter(); h.type = 'highpass'; h.frequency.value = v.hp; node.connect(h); node = h; }
      if (v.lp) { const l = ctx.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = v.lp; node.connect(l); node = l; }
      node.connect(g); g.connect(master);
      voices++;
      src.onended = () => { voices--; try { g.disconnect(); } catch (e) { /* ignore */ } };
      src.start(t); src.stop(t + d + 0.03);
    }

    function play(name) {
      played.push(name); if (played.length > 200) played.shift();
      const recipe = data.sounds[name];
      if (!enabled || !recipe || !ctx || ctx.state !== 'running') return false;
      const ms = now();
      if (lastAt[name] !== undefined && ms - lastAt[name] < data.minGapMs) return false;
      if (voices + recipe.length > data.maxVoices) return false;
      lastAt[name] = ms;
      const t0 = ctx.currentTime + 0.005;
      try { recipe.forEach(v => voice(v, t0)); } catch (e) { return false; }
      return true;
    }
    return { create, unlock, suspend, play, setEnabled: v => { enabled = !!v; }, isEnabled: () => enabled, played, get ready() { return !!ctx; } };
  }
  return { create };
})();
</script>

<!-- =====================================================================
     CAMPAIGN — pure unlock logic (no DOM, no storage).  The UI keeps the list of beaten levels.
     ===================================================================== -->
<script id="campaign">
const Campaign = (() => {
  const levels = () => GAME_DATA.campaign.levels;

  // A level is open if it is the first, or the one before it has been beaten.
  const isUnlocked = (i, beaten) => i === 0 || beaten.includes(levels()[i - 1].id);
  const isBeaten = (i, beaten) => beaten.includes(levels()[i].id);

  // "Defeat" a level = win the game outright. A shared win (every tie-break level) is not a defeat.
  const humanWon = (result, seat = 0) => result.winners.length === 1 && result.winners[0] === seat;

  // The bot spec for a level (see Bots.attach).
  const botSpec = level => level.ai;

  // The rules of a game at this level: the same game, on the level's board and with the level's fossils.
  const gameData = level => { const d = JSON.parse(JSON.stringify(GAME_DATA)); d.board = { shape: level.shape }; d.tokens = JSON.parse(JSON.stringify(level.tokens)); return d; };

  // After a finished game at level i: the new list of beaten levels, and what changed.
  function recordResult(beaten, i, won) {
    const lv = levels();
    const next = won && !beaten.includes(lv[i].id) ? [...beaten, lv[i].id] : beaten.slice();
    const unlocked = won && i + 1 < lv.length && !beaten.includes(lv[i].id) && !isUnlocked(i + 1, beaten) ? lv[i + 1].name : null;
    return { beaten: next, won, newlyUnlocked: unlocked, completed: next.length === lv.length && beaten.length < lv.length };
  }

  return { levels, isUnlocked, isBeaten, humanWon, botSpec, gameData, recordResult };
})();
</script>

<script id="ui">
/* =====================================================================
   UI — a table for touch.  The table is the UI: tap fossils and sets.
   Nothing advances on a timer; an opponent's turn stays on the board until you tap.
   ===================================================================== */
(() => {
  'use strict';
  const D = GAME_DATA, LV = D.campaign.levels;
  const COLORS = ['#4f8cff', '#ff5a5f', '#3ecf8e', '#f5a524'];
  const root = document.getElementById('app');
  // Which build is this? tools/build.js stamps the commit/branch; an unbuilt file says so.
  const BUILD = (() => { const m = document.querySelector('meta[name=build]'); const v = m ? m.content : ''; return !v || v.startsWith('__') ? 'local file' : v; })();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // ?unlock opens every campaign level for this visit (for testing; nothing is saved).
  const UNLOCK_ALL = /[?&]unlock\b/.test(location.search);

  // ---------------- remembered between visits (if the browser allows) ----------------
  // Everything this game stores lives under the Tabletop Library's name, then the game's.
  const NS = 'tabletop-library-fossil-frenzy-';
  const PASS_KEY = NS + 'passplay', CAMPAIGN_KEY = NS + 'campaign', SAVE_KEY = NS + 'save', TIPS_KEY = NS + 'tips';
  const SOUND_KEY = NS + 'sound', HINTS_KEY = NS + 'hints', DONE_KEY = NS + 'games-finished', UNLOCKALL_KEY = NS + 'unlock-everything';
  const LEGACY_KEYS = ['fossil-frenzy-setup-v1', 'fossil-frenzy-passplay-v2', 'fossil-frenzy-campaign-v1', 'fossil-frenzy-save-v1', 'fossil-frenzy-save-v2', 'fossil-frenzy-hints', 'fossil-frenzy-games-finished'];
  const pref = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) { /* storage unavailable: fine */ } },
    del: k => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
    json: k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  };
  LEGACY_KEYS.forEach(pref.del);                       // data stored under the app's earlier name is discarded

  function loadPass() {
    const cfg = { n: D.players.min, size: null, reminders: true, names: Array.from({ length: D.players.max }, (_, i) => 'Player ' + (i + 1)) };     // rules reminders are on unless the players switch them off
    const s = pref.json(PASS_KEY);
    if (s && s.reminders === false) cfg.reminders = false;
    if (s && D.passBoards.some(b => b.id === s.size)) cfg.size = s.size;          // a size somebody chose; null = picked from the number of players
    if (s && s.n >= D.players.min && s.n <= D.players.max) {
      cfg.n = s.n;
      (s.names || []).forEach((x, i) => { if (i < D.players.max && x) cfg.names[i] = String(x).slice(0, 14); });
    }
    return cfg;
  }
  function loadBeaten() {
    const b = pref.json(CAMPAIGN_KEY);
    const ids = new Set(LV.map(l => l.id));
    return Array.isArray(b && b.beaten) ? b.beaten.filter(id => ids.has(id)) : [];
  }

  const ui = { screen: 'home', mode: 'pass', pass: loadPass(), beaten: loadBeaten(), levelIdx: 0, names: [], st: null, bots: [],
               help: false, menu: null, prevUp: new Set(), popTurn: -1, botWaiting: false, notice: '',
               countedOver: false, outcome: null, turnCard: false, lastEvent: '', say: '',
               steps: null, stage: 0, base: null, animTimer: null, liftKey: '', prevPts: null,
               tip: null, tipsSeen: new Set(), fx: null, recall: [], filmedTurn: -1, boardLevel: 0 };
  ui.settings = null;                                   // null | 'open' | 'unlock' (the warning before unlocking everything) | 'reset'
  ui.sound = pref.get(SOUND_KEY) !== 'off';             // sound effects: on unless switched off (Menu or Settings), remembered on this device
  ui.endSounded = false;
  ui.fossils = false;                                   // the "Fossils in this game" panel
  const audio = Sound.create({ data: D.sound, AudioContext: window.AudioContext || window.webkitAudioContext });
  audio.setEnabled(ui.sound);
  // (a sound can follow another after a short gap: e.g. the flip's tap, then its chime)
  const sfx = (name, afterMs = 0) => { const go = () => { try { audio.play(name); } catch (e) { /* sound is never allowed to break the game */ } }; if (afterMs) setTimeout(go, afterMs); else go(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) audio.suspend(); });
  ui.unlockAll = pref.get(UNLOCKALL_KEY) === '1';       // Settings → Unlock everything (kept on this device)
  ui.hints = ['auto', 'on', 'off'].includes(pref.get(HINTS_KEY)) ? pref.get(HINTS_KEY) : 'auto';
  // Prompts above the board: shown until this device has finished one game, then quiet. Help panel: Auto / On / Off.
  const hintsVisible = () => ui.hints === 'on' || (ui.hints === 'auto' && !(+pref.get(DONE_KEY) > 0));
  const seatName = i => ui.names[i] || 'Player ' + (i + 1);
  const passBoard = () => D.passBoards.find(b => b.id === (ui.pass.size || D.passBoardByPlayers[ui.pass.n])) || D.passBoards[0];
  const levelIndexOf = id => LV.findIndex(l => l.id === id);
  const isBot = i => !!ui.bots[i];
  const unlocked = i => UNLOCK_ALL || ui.unlockAll || Campaign.isUnlocked(i, ui.beaten);

  // ---------------- rules reminders ----------------
  // A short note the first time something comes up (see `coach` in the data). Campaign: once per device, only on the levels the note names.
  // Pass & Play: once per game, unless the players switched reminders off. The note waits for a tap on "Got it" before play goes on.
  function showTip(id, endsTurn = false, focus = []) {          // focus: the tiles the note is about, [{ tid, color, dash }]: they stay in view above it
    const c = D.coach[id];
    if (!c || ui.tip || !ui.st) return false;
    if (ui.mode === 'campaign') {
      if (c.levels && !c.levels.includes(LV[ui.levelIdx].id)) return false;
      const seen = new Set(pref.json(TIPS_KEY) || []);
      if (seen.has(id)) return false;
      seen.add(id); pref.set(TIPS_KEY, JSON.stringify([...seen]));
    } else {
      if (!ui.pass.reminders || ui.tipsSeen.has(id)) return false;
      ui.tipsSeen.add(id);
    }
    ui.tip = { id, endsTurn, focus };
    return true;
  }
  // Pass & Play: the public flips of the other players since my last turn, so I can see them as if I had been watching.
  function noteFlips(p) {
    const st = ui.st;
    if (ui.mode !== 'pass') return;
    ui.recall = ui.recall.map(e => ({ ...e, to: e.to.filter(x => x !== p) })).filter(e => e.to.length);          // I have had my turn: what I was shown is old news
    for (const tid of st.turn.revealed) if (!st.tokens[tid].matched) ui.recall.push({ tid, by: p, to: Array.from({ length: st.n }, (_, i) => i).filter(i => i !== p) });
  }
  const recallFor = p => { const m = new Map(); for (const e of ui.recall) if (e.to.includes(p) && !ui.st.tokens[e.tid].matched) m.set(e.tid, e.by); return m; };

  // ---------------- game flow ----------------
  // Who goes first is simply decided at random (the engine's opening roll) — no screen for it. The turn card says whose turn it is.
  function startGame() {
    clearAnim();
    const seed = Math.floor(Math.random() * 2147483647), campaign = ui.mode === 'campaign';
    const n = campaign ? 2 : ui.pass.n;
    ui.boardLevel = campaign ? ui.levelIdx : levelIndexOf(passBoard().level);          // the level whose board and fossils are on the table (Pass & Play: the chosen size)
    ui.st = Engine.createGame({ players: n, seed, data: Campaign.gameData(LV[ui.boardLevel]) });
    ui.bots = Bots.attach(ui.st, campaign ? [null, Campaign.botSpec(LV[ui.levelIdx])] : Array(n).fill(null), seed);
    ui.names = campaign ? ['You', LV[ui.levelIdx].name] : ui.pass.names.slice(0, n);
    pref.del(SAVE_KEY);                                                  // a new game replaces the one that was saved
    Object.assign(ui, { screen: 'play', prevUp: new Set(), popTurn: -1, botWaiting: false, notice: '', countedOver: false, outcome: null, tip: null, tipsSeen: new Set(), recall: [],
                        menu: null, help: false, fossils: false, lastEvent: '', prevPts: null, liftKey: '', endSounded: false });
    nextTurnStarts(true);
  }
  function beginTurn() {
    ui.turnCard = false; ui.lastEvent = '';
    if (animating()) startAnim();
    else if (ui.mode === 'pass') for (const [tid, by] of recallFor(ui.st.current)) if (ui.st.tokens[tid].gem) { showTip('gem', false, [{ tid, color: COLORS[by] }]); break; }          // someone showed a gem: say how gems work
  }

  // Is an opponent's turn still being shown one move at a time?
  const animating = () => !!ui.steps && ui.stage < ui.steps.length;
  const reducedMotion = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function clearAnim() { if (ui.animTimer) clearTimeout(ui.animTimer); ui.animTimer = null; }
  // The sound for the opponent move now being shown (steps[k-1]).
  function playStep(k) {
    const a = ui.steps[k - 1].a;
    if (a.type === 'peek') sfx('peek');
    else if (a.type === 'bank') sfx('bank');
    else if (a.type === 'flipOther' || a.type === 'flipSecond') {
      let T = null; for (let j = 0; j < k; j++) if (ui.steps[j].a.type === 'peek') T = ui.steps[j].a.tid;
      sfx('flip'); const o = flipOutcome(T, a.tid, a.type === 'flipSecond'); if (o) sfx(o, 110);
    }
  }
  // After a public flip of `f` with my peeked fossil `t`: which sound follows the flip.
  // Two gems are silent until the third one lands: the chime would tell the table that the fossil you peeked is a gem, even if you then stop.
  function flipOutcome(t, f, third) {
    if (t === null || t === undefined) return '';
    const A = ui.st.tokens[t], B = ui.st.tokens[f];
    if (A.gem && B.gem) return third ? 'gem' : '';
    return !A.gem && !B.gem && A.value === B.value ? 'match' : 'miss';
  }
  function stepMs(a) { const P = D.pace; return a.type === 'peek' ? P.peek : a.type === 'bank' ? P.bank : P.flip; }
  // Does the move now shown (steps[k-1]) turn a gem face up for everyone? (the first time any gem shows, a reminder says how gems work)
  function stepRevealsGem(k) {
    const a = ui.steps[k - 1].a;
    if (a.type === 'flipOther' || a.type === 'flipSecond') return ui.st.tokens[a.tid].gem ? a.tid : null;
    if (a.type !== 'flipOwn') return null;
    let T = null; for (let j = 0; j < k; j++) if (ui.steps[j].a.type === 'peek') T = ui.steps[j].a.tid;
    return T !== null && ui.st.tokens[T].gem ? T : null;
  }
  const gemTip = tid => showTip('gem', false, [{ tid, color: COLORS[ui.st.current] }]);
  function startAnim() {
    clearAnim();
    if (!animating()) return;
    if (ui.tip) { ui.animTimer = setTimeout(startAnim, 250); return; }          // a reminder is waiting for its tap: the opponent's turn waits too
    if (reducedMotion()) { finishAnim(false); return; }
    if (ui.stage === 0) { ui.stage = 1; playStep(1); }         // its peek shows at once
    if (!animating()) return;
    ui.animTimer = setTimeout(() => {
      ui.animTimer = null;
      const next = ui.steps[ui.stage], prev = ui.stage > 0 ? ui.steps[ui.stage - 1].snap : ui.base, digRect = next && next.a.type === 'bank' ? tileRect(`.chip.cur .setbtn[data-i="${next.a.set}"]`) : null;
      ui.stage++; if (animating()) playStep(ui.stage); else if (ui.say) sfx('slip', 150);
      { const g = stepRevealsGem(ui.stage); if (g !== null) gemTip(g); }
      render(); startAnim();
      if (digRect && canFx()) { const to = ui.steps[ui.stage - 1].snap, set = prev.sets[next.a.set]; if (set) startDigFx(ui.st.current, { value: set.value, gem: set.gem }, prev.points, to.points, digRect, null); }
      else if (!animating()) botMatchFx();
    }, stepMs(ui.steps[ui.stage - 1].a));
  }
  const tileRect = sel => { const el = root.querySelector(sel); return el ? rectOf(el) : null; };
  // An opponent's last move completed a set: the same film as for a match of mine (its sound already played with the flip).
  function botMatchFx() {
    const st = ui.st, last = ui.steps && ui.steps[ui.steps.length - 1];

  // ---------------- the two little films: a match, and digging a map up ----------------

  // with "reduce motion" there is no film (a match then waits for a tap, as before).

  function endFx() {

    fx.timers.forEach(clearTimeout);

  // A match: both tiles lift, slide until their torn edges meet, become one square map (an X and what it is worth), and the map flies to its player's maps.
  // Gems: the three pieces fly together into a bigger, more ornate map.
  function startMatchFx(tids, player, o = {}) {
    const st = ui.st, A = D.anim.match;
    ui.filmedTurn = st.turnNo;                                       // the maps leave the board for good: they are not drawn back afterwards
    ui.fx = { kind: 'match', player, hideSet: true, anims: [], timers: [], then: o.then || null, sound: o.sound || '', soundDone: false };
    render();
    const cells = tids.map(t => root.querySelector(`.cell[data-id="${st.tokens[t].cell}"]`)), target = root.querySelector('.setbtn.landing');
    if (!canFx() || cells.some(c => !c) || !target) { endFx(); return; }

  }

  // Digging a map up: it rises, becomes an open treasure chest, and its points rain into the score and count up.
  function chestHTML() {
    return `<svg viewBox="0 0 100 100" width="100%" height="100%"><ellipse class="glow" cx="50" cy="46" rx="48" ry="36" fill="url(#gGlow)"/>
      <g class="coins"><ellipse cx="50" cy="52" rx="30" ry="10" fill="#f5c542" stroke="#a67513" stroke-width="2"/><circle cx="38" cy="47" r="6" fill="#ffd966" stroke="#a67513" stroke-width="1.6"/><circle cx="52" cy="44" r="6.5" fill="#ffe27a" stroke="#a67513" stroke-width="1.6"/><circle cx="63" cy="48" r="5.5" fill="#ffd966" stroke="#a67513" stroke-width="1.6"/></g>
      <rect x="16" y="52" width="68" height="34" rx="5" fill="#8a5a2b" stroke="#47290f" stroke-width="3"/><rect x="16" y="62" width="68" height="6" fill="#d9a33a"/><rect x="45" y="58" width="10" height="14" rx="2" fill="#f2c14e" stroke="#47290f" stroke-width="2"/>
      <g class="lid"><path d="M16,52 L16,40 Q16,26 50,26 Q84,26 84,40 L84,52Z" fill="#9c6633" stroke="#47290f" stroke-width="3"/><rect x="16" y="42" width="68" height="6" fill="#d9a33a"/></g></svg>`;
  }
  function startDigFx(player, x, from, to, rect, then) {
    const A = D.anim.dig;
    ui.fx = { kind: 'dig', player, shown: from, to, anims: [], timers: [], then: then || null, raf: 0 };
    render();
    const pts = root.querySelector(`.chip[data-p="${player}"] .pts`);
    if (!canFx() || !pts) { endFx(); return; }
    const fx = ui.fx, w = Math.max(rect.w, 48), P = rectOf(pts), C = { x: rect.x, y: rect.y + w * 0.35 }, sq = squareHTML(x, w);
    const sqEl = fxEl(sq.cls, rect, w, w, sq.html); sqEl.style.setProperty('--set', w + 'px');
    const chest = fxEl('chest', C, w * 2.4, w * 2.4, chestHTML()); chest.style.opacity = '0';
    const plus = fxEl('plus', C, w * 2, w * 0.9, `+${x.value}`); plus.style.opacity = '0';

    if (glow) go(fx, glow, [{ opacity: 0 }, { opacity: 1 }], { delay: tOpen + 80, duration: A.open * 0.8 });
    if (coins) go(fx, coins, [{ transform: 'translateY(10px)' }, { transform: 'none' }], { delay: tOpen + 60, duration: A.open, easing: EASE.pop });
    const dx = P.x - C.x, dy = P.y - C.y;
    go(fx, plus, [{ opacity: 0, transform: 'translate(0,10px) scale(.6)' }, { opacity: 1, transform: 'translate(0,-12px) scale(1.2)', offset: .3 }, { opacity: 1, transform: `translate(${dx * .6}px,${dy * .6}px) scale(1)`, offset: .8 }, { opacity: 0, transform: `translate(${dx}px,${dy}px) scale(.7)` }], { delay: tPlus, duration: A.rain, easing: EASE.io });

  // ---------------- taps ----------------
  // An opponent's finished turn stays on the board until I act. My first tap on a fossil (or a set) ends it and is the
  // start of my own turn — there is no Continue.
  function takeOverFromOpponent() {
    if (!ui.botWaiting) return;
    endTurn();
  }

  function cellTap(id) {
    const st = ui.st;
    if (animating()) { finishAnim(); return; }                                      // a tap skips ahead through an opponent's moves
    if (st.over || ui.turnCard || ui.tip) return;
    takeOverFromOpponent();
    if (st.over || ui.botWaiting || isBot(st.current)) { render(); return; }
    ui.lastEvent = '';
    const tid = st.tokenAt[id];
    if (st.phase === 'peeked' && tid === st.turn.T) return;                            // the fossil I peeked at: tapping it does nothing (no hiding, no animation) — I must flip another
    const phase0 = st.phase, pop0 = st.matchedCount;
    try {
      if (st.phase === 'action') {
        if (tid >= 0) Engine.peek(st, tid);                 // first tap: a private peek
      } else if (st.phase === 'peeked') {
        if (tid >= 0) {
          Engine.flipOther(st, tid);                                                // second tap: a public flip
          const T = st.tokens[st.turn.T], F = st.tokens[st.turn.F];
          if (!T.gem && !F.gem && T.value === F.value) Engine.flipOwn(st);          // a pair: you always take it
        }

        const T = st.tokens[st.turn.T], F = st.tokens[st.turn.F];
        if (tid >= 0 && tid !== st.turn.T && tid !== st.turn.F && T.gem && F.gem) {   // two gems: tapping a third IS the consent to reveal mine
          Engine.flipOwn(st);

        } else { endTurn(); render(); return; }                                // anything else, once I have flipped: tap anywhere ends the turn
      } else if (st.phase === 'gemThird') {
        if (tid >= 0 && tid !== st.turn.T && tid !== st.turn.F) Engine.flipSecond(st, tid);
        else { endTurn(); render(); return; }
      } else if (st.phase === 'resolved') { endTurn(); render(); return; }
    } catch (e) { console.warn(e.message); }
    const matchedNow = st.phase === 'resolved' && phase0 !== 'resolved' && !!st.turn.matched && !st.over, film = matchedNow && canFx();
    let chime = '';
    if (phase0 === 'action' && st.phase === 'peeked') { sfx('peek'); if (st.tokens[st.turn.T].gem) showTip('gem', false, [{ tid: st.turn.T, color: COLORS[st.current], dash: true }]); }
    else if (st.phase !== phase0 && phase0 !== 'action') {                        // a public flip happened
      sfx('flip');
      const popped = st.matchedCount > pop0, gems = st.turn.T !== null && st.tokens[st.turn.T].gem && st.tokens[st.turn.F].gem;
      if (popped || !gems) { chime = popped ? (gems ? 'gem' : 'match') : 'miss'; if (!film) sfx(chime, 110); }          // (two gems without the third stay silent: see flipOutcome)

  // Tapping a held set banks it — and banking is the whole turn, so the turn ends at once.
  function setTap(i) {
    const st = ui.st;
    if (animating()) { finishAnim(); return; }
    if (st.over || ui.turnCard || ui.tip) return;
    takeOverFromOpponent();
    if (st.over || ui.botWaiting || isBot(st.current)) { render(); return; }
    try {
      if (Engine.canBank(st)) {
        const who = st.current, p = st.players[who], set = p.sets[i], from = p.points, rect = tileRect(`.chip.cur .setbtn[data-i="${i}"]`);
        Engine.bank(st, i); ui.lastEvent = `${seatName(who)} dug up ${bankText(st.lastBank)}`;
        if (rect && canFx() && !st.over) { startDigFx(who, { value: set.value, gem: set.gem }, from, p.points, rect, endTurn); return; }         // the film, then the turn ends
        sfx('bank'); endTurn();

    } catch (e) { console.warn(e.message); }
    render();
  }

  // While the opponent's bank banner is up, a tap anywhere (not just on the banner) sends it away and starts my turn.
  // Has my turn got to the point where a tap anywhere ends it? (after the flip — or a pair/bank — never before)
  const tapEndsTurn = () => ui.screen === 'play' && !!ui.st && !ui.st.over && !ui.turnCard && !ui.tip && !ui.fx && !ui.botWaiting && !animating() && !isBot(ui.st.current) && Engine.status(ui.st).canEnd;
  const bankBannerUp = () => ui.screen === 'play' && !!ui.st && ui.botWaiting && !animating() && !ui.fx && !ui.turnCard && !ui.st.over && !!ui.st.turn.banked && !!ui.st.lastBank;
  function onClick(e) {

    if (ui.fx) { endFx(); return; }                    // a tap skips a film (a match flying to its player, a map being dug up)
    const el = e.target.closest('[data-act]');
    if (!el) {
      if (ui.menu || ui.help || ui.fossils || ui.settings || ui.tip) return;
      if (bankBannerUp()) { takeOverFromOpponent(); render(); }
      else if (tapEndsTurn()) { endTurn(); render(); }                          // once I have flipped, a tap anywhere ends my turn
      return;
    }
    const d = el.dataset, st = ui.st;
    switch (d.act) {
      case 'mode': ui.screen = d.v; break;          // (ui.mode belongs to the game on the table, which may still be a saved one)
      case 'continue': ui.screen = 'play'; ui.menu = null; if (ui.mode === 'pass' && !ui.botWaiting && !st.over && !animating()) ui.turnCard = true; break;          // pick up the saved game
      case 'home': ui.screen = 'home'; break;
      case 'n': ui.pass.n = +d.v; pref.set(PASS_KEY, JSON.stringify(ui.pass)); break;          // (the board size follows the number of players until one is chosen)
      case 'size': ui.pass.size = d.v; pref.set(PASS_KEY, JSON.stringify(ui.pass)); break;
      case 'deal': ui.mode = 'pass'; startGame(); break;

  function boardSVG() {
