  function tipHTML() {
    const c = D.coach[ui.tip.id], body = c.body.replace(/\{value\}/g, gemValue());
    return `<div class="tipback"><div class="tip" role="alertdialog" aria-label="${esc(c.title)}"><h2>${esc(c.title)}</h2><p>${esc(body)}</p><button class="big" data-act="tip-ok">Got it</button></div></div>`;
  }

  function menuHTML() {
    const m = ui.menu, sure = (q, yes, act) => `<p class="mq">${q}</p><button class="danger" data-act="${act}">${yes}</button><button data-act="menu-close">No, keep playing</button>`;
    const body = m === 'retry' ? sure('Start this game over with a fresh deal? The current game will be lost.', 'Yes, start over', 'retry')
      : m === 'quit' ? sure('Leave this game and go to the Main Menu? Your game is saved: Continue on the Main Menu picks it up where you left off.', 'Yes, leave', 'quit')
      : `<button data-act="menu-ask" data-v="retry">Retry</button><button data-act="help">How to play</button><button data-act="fossils">Tiles</button><button data-act="settings">Settings</button><button data-act="menu-ask" data-v="quit">Main Menu</button>`;
    return `<div class="backdrop" data-act="menu-close"></div><div class="menu" role="menu">${body}</div>`;
  }

  // The way back to the shelf: a clear chip in the very top-left corner of the home screen.
  // The way back to the library is only for somebody who came from it: the shelf links here with ?from=library (the tab remembers it), a link you share goes straight to this game with nothing of the library in it.
  const fromLibrary = () => { let came = /[?&]from=library\b/.test(location.search); try { if (came) sessionStorage.setItem('tabletop-library-from', '1'); else came = sessionStorage.getItem('tabletop-library-from') === '1'; } catch (e) { /* no storage: only a page opened from the shelf shows it */ } return /^https?:$/.test(location.protocol) && came; };
  const libraryLink = () => (D.library && fromLibrary() ? `<a class="back libback" href="${esc(D.library.href)}"><span aria-hidden="true">‹</span> ${esc(D.library.name)}</a>` : '');

  // The home screen's picture: the real board, tiles flipping over by themselves to show numbers and gems. Decoration only.
  function heroSVG() {
    const S = 34, W = Math.sqrt(3) * S, cells = Engine.buildBoard(D);
    const pos = c => ({ x: W * (c.q + c.r / 2), y: 1.5 * S * c.r });
    const vals = [];
    D.tokens.forEach(t => { for (let i = 0; i < t.count; i++) vals.push({ value: t.value, gem: !!t.gem }); });
    for (let i = vals.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [vals[i], vals[j]] = [vals[j], vals[i]]; }
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    cells.forEach(c => { const q = pos(c); x0 = Math.min(x0, q.x - W / 2); x1 = Math.max(x1, q.x + W / 2); y0 = Math.min(y0, q.y - S); y1 = Math.max(y1, q.y + S); });
    const flippers = new Map([[3, 0], [8, 3], [12, 5], [15, 1], [19, 6], [23, 2], [27, 4]]);   // which tiles flip, and when (seconds into the 7 s loop): one new tile a second, each up for under 2 s, so never more than two face up at once
    let out = '';
    cells.forEach((c, k) => {
      const { x, y } = pos(c), v = vals[k], fl = flippers.has(k);
      out += `<g class="h-cell" style="--i:${k}"><polygon class="bg" points="${hexPts(x, y, S)}"/>
        <g class="h-back${fl ? ' h-flipper' : ''}"${fl ? ` style="--d:-${flippers.get(k)}s"` : ''}>${sandArt(x, y, S, k)}</g>`;
      if (fl) out += `<g class="h-front tile" style="--d:-${flippers.get(k)}s">${mapFaceArt(x, y, S, v, k)}<polygon class="ring" style="stroke:#f5a524" points="${hexPts(x, y, S * 0.9)}"/></g>`;
      out += '</g>';
    });
    const pad = 6;
    return `<svg class="hero-board" viewBox="${(x0 - pad).toFixed(1)} ${(y0 - pad).toFixed(1)} ${(x1 - x0 + 2 * pad).toFixed(1)} ${(y1 - y0 + 2 * pad).toFixed(1)}" aria-hidden="true">${out}</svg>`;
  }

  // A game left half-played (it is kept until a new one is started or it ends): what the Continue buttons say about it.
  const savedGame = () => (ui.st && !ui.st.over && ui.screen !== 'play' ? { campaign: ui.mode === 'campaign' } : null);
  function savedLine() {
    const st = ui.st;
    return ui.mode === 'campaign' ? `${LV[ui.levelIdx].name} · you ${st.players[0].points}, ${st.players[1].points}` : st.players.map(p => `${seatName(p.idx)} ${p.points}`).join(' · ');
  }
  const resumeBtn = () => `<button class="mode resume" data-act="continue"><b>Continue</b><span>${esc(ui.mode === 'campaign' ? 'Campaign' : 'Pass & Play')} · ${esc(savedLine())}</span></button>`;

  function homeHTML() {
    const beaten = LV.filter((l, i) => Campaign.isBeaten(i, ui.beaten)).length, sv = savedGame();
    const pips = LV.map((l, i) => `<i class="${Campaign.isBeaten(i, ui.beaten) ? 'on' : ''}"></i>`).join('');
    return `<div class="screen home">${libraryLink()}<div class="sheet hero">
      <div class="hero-art">${heroSVG()}</div>
      <div class="hero-menu">
        <h1 class="logo">Torn<br>Treasure</h1>
        <p class="sub">Peek. Flip. Match. Dig up.</p>
        ${sv ? resumeBtn() : ''}
        <button class="mode${sv ? '' : ' primary'} row" data-act="mode" data-v="campaign"><b>Campaign</b><span class="pips" role="img" aria-label="${beaten} of ${LV.length} opponents beaten">${pips}</span></button>
        <button class="mode" data-act="mode" data-v="pass"><b>Pass &amp; Play</b><span>${D.players.min}–${D.players.max} people, one device</span></button>
        <div class="ghostrow"><button class="ghost" data-act="help">How to play</button><button class="ghost" data-act="settings">Settings</button></div>
        ${ui.notice ? `<p class="dim" style="margin:8px 0 0">${esc(ui.notice)}</p>` : ''}<p class="dim ver">Version ${esc(BUILD)}</p>
      </div>
    </div></div>`;
  }

  function passHTML() {
    const p = ui.pass, sv = savedGame();
    const seats = Array.from({ length: p.n }, (_, i) => `<div class="seatrow"><span class="dot" style="background:${COLORS[i]}"></span>
        <input value="${esc(p.names[i])}" maxlength="14" data-act="name" data-i="${i}" aria-label="Name of player ${i + 1}"></div>`).join('');
    return `<div class="screen"><div class="sheet wide">
      <button class="back" data-act="home">‹ Torn Treasure</button>
      <h1>Pass &amp; Play</h1><p class="sub">Pass the device around the table.</p>
      ${sv && !sv.campaign ? resumeBtn() + '<h2>Or start a new game</h2>' : ''}
      <h2>Players</h2><span class="seg">${Array.from({ length: D.players.max - D.players.min + 1 }, (_, k) => k + D.players.min).map(n => `<button class="${p.n === n ? 'on' : ''}" data-act="n" data-v="${n}">${n}</button>`).join('')}</span>
      ${seats}
      <h2>Board size</h2><span class="seg sizes">${D.passBoards.map(b => { const lv = LV[levelIndexOf(b.level)], n = lv.tokens.reduce((a, t) => a + t.count, 0); return `<button class="${passBoard().id === b.id ? 'on' : ''}" data-act="size" data-v="${b.id}"><b>${esc(b.name)}</b><small>${n} tiles</small></button>`; }).join('')}</span>
      <p class="dim pass-note">${p.size ? 'The size you chose.' : `Picked for ${p.n} players: more people, a bigger board.`} Bigger boards have more tiles to remember${LV[levelIndexOf(passBoard().level)].tokens.some(t => t.gem) ? ', and gem maps' : ' (and no gem maps)'}.</p>
      <h2>Rules reminders</h2><span class="seg">${[['on', 'On'], ['off', 'Off']].map(([v, t]) => `<button class="${(p.reminders ? 'on' : 'off') === v ? 'on' : ''}" data-act="reminders" data-v="${v}">${t}</button>`).join('')}</span>
      <p class="dim pass-note">A short note the first time a match or a gem comes up. Turn it off once everyone knows the rules.</p>
      <button class="big" data-act="deal">${sv && !sv.campaign ? 'Start a new game' : 'Deal the tiles'}</button>
      ${sv && !sv.campaign ? '<p class="dim pass-note">Your saved game is replaced.</p>' : ''}
    </div></div>`;
  }

  // The level's board, small: a taste of its shape before you choose it.
  function miniBoard(level) {
    const S = 9, W = Math.sqrt(3) * S, cells = Engine.buildBoard(Campaign.gameData(level)), pos = c => ({ x: W * (c.q + c.r / 2), y: 1.5 * S * c.r });
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    cells.forEach(c => { const q = pos(c); x0 = Math.min(x0, q.x - W / 2); x1 = Math.max(x1, q.x + W / 2); y0 = Math.min(y0, q.y - S); y1 = Math.max(y1, q.y + S); });
    return `<svg class="mini-board" viewBox="${f1(x0 - 2)} ${f1(y0 - 2)} ${f1(x1 - x0 + 4)} ${f1(y1 - y0 + 4)}" aria-hidden="true">${cells.map(c => { const q = pos(c); return `<polygon points="${hexPts(q.x, q.y, S * 0.9)}"/>`; }).join('')}</svg>`;
  }
  function campaignHTML() {
    const sv = savedGame(), done = LV.filter((l, i) => Campaign.isBeaten(i, ui.beaten)).length;
    const nextIdx = LV.findIndex((l, i) => unlocked(i) && !Campaign.isBeaten(i, ui.beaten));
    const rows = LV.map((l, i) => {
      const open = unlocked(i), won = Campaign.isBeaten(i, ui.beaten);
      const state = won ? '<span class="pill ok">✓ Beaten</span>' : open ? `<span class="pill go">${i === nextIdx ? 'Next up' : 'Play'} ›</span>` : '<span class="lockmsg" role="img" aria-label="Locked">🔒</span>';
      return `<button class="lvl${open ? '' : ' locked'}${won ? ' done' : ''}${i === nextIdx ? ' next' : ''}" data-act="level" data-i="${i}"${open ? '' : ' aria-disabled="true"'}>
        ${miniBoard(l)}<span class="lv-text"><b>${esc(l.name)}</b></span><span class="state">${state}</span></button>`;
    }).join('');
    const all = done === LV.length;
    return `<div class="screen"><div class="sheet wide">
      <button class="back" data-act="home">‹ Torn Treasure</button>
      <div class="camp-head"><h1>Campaign</h1><span class="pips progress" role="img" aria-label="${done} of ${LV.length} opponents beaten">${LV.map((l, i) => `<i class="${Campaign.isBeaten(i, ui.beaten) ? 'on' : ''}"></i>`).join('')}</span></div>
      ${sv && sv.campaign ? resumeBtn() + '<h2>Or start a new game</h2>' : ''}
      <div class="levels">${rows}</div>
      ${sv && sv.campaign ? '<p class="dim">Starting a level replaces your saved game.</p>' : ''}
      ${all ? '<p class="sub" style="margin-top:16px">🏆 You have beaten every opponent.</p>' : ''}
    </div></div>`;
  }

  const WHY = { score: 'highest score', sets: 'most maps found', finalPair: 'found the final map' };
  function overHTML() {
    const st = ui.st, r = st.result, keys = st.rules.tiebreaks, campaign = ui.mode === 'campaign', o = ui.outcome;
    let why = '';
    if (r.winners.length > 1) why = r.winners.length === st.n ? 'Dead heat.' : 'Shared win — every tie-break is level.';
    else if (r.ranking.length > 1) { const a = r.ranking[0], b = r.ranking[1]; const k = keys.find(k => a[k] !== b[k]); why = k === 'score' ? '' : `Tied on score — won on ${WHY[k]}.`; }
    let title = r.winners.length > 1 ? 'Shared win!' : esc(seatName(r.winners[0])) + ' wins!';
    if (campaign && o) title = o.won ? (o.completed ? 'Campaign complete!' : `You beat ${esc(LV[ui.levelIdx].name)}!`) : r.winners.length > 1 ? 'A draw — not a win.' : `${esc(LV[ui.levelIdx].name)} wins`;
    const extra = campaign && o && !o.won ? 'Win outright to unlock the next level.' : '';
    const tileHTML = (x, cls = '') => `<span class="mini ${cls}">${setLabel(x)}</span>`;
    const places = r.ranking.map(x => {
      const p = st.players[x.idx], win = r.winners.includes(x.idx);
      return `<div class="place${win ? ' win' : ''}" style="--c:${COLORS[x.idx]}">
        <div class="pn"><span class="dot"></span>${win ? '🏆 ' : ''}${esc(seatName(x.idx))}</div>
        <div class="score">${x.score}</div>
        <div class="rowlab">Dug up</div>
        <div class="tiles">${p.banked.map(b => tileHTML(b)).join('') || '<span class="dim">none</span>'}</div>
        <div class="rowlab">Found, not dug up</div>
        <div class="tiles lostrow">${p.sets.slice().sort((a, b) => b.value - a.value).map(s => tileHTML(s, 'lost')).join('') || '<span class="dim">none</span>'}</div>
      </div>`;
    }).join('');
    // Celebrate a win in the campaign where you can't miss it: a big card (and confetti) above the results (nothing is newly unlocked when everything already is).
    const celebrate = campaign && o && (o.completed || (o.newlyUnlocked && !(UNLOCK_ALL || ui.unlockAll)))
      ? `<p class="unlock">${o.completed ? '🏆 Every opponent beaten' : `🔓 ${esc(o.newlyUnlocked)} unlocked`}</p>${confettiHTML()}` : '';
    // The choices: after a win, on to the next level; after a loss (or a pass & play game), play again — and always the main menu.
    const nextBtn = campaign && o && o.won && ui.levelIdx + 1 < LV.length && unlocked(ui.levelIdx + 1);
    const won = campaign && o && o.won;
    const againText = campaign ? `Play ${esc(LV[ui.levelIdx].name)} again` : 'Play again';          // the same level (or the same players), a fresh deal
    const main = nextBtn ? `<button class="big" data-act="next">Next: ${esc(LV[ui.levelIdx + 1].name)}</button>` : '';
    const again = `<button class="big${main ? ' alt' : ''}" data-act="again">${againText}</button>`;
    return `<div class="screen over"><div class="sheet over-sheet"><h1>${title}</h1>
      ${[why, extra].filter(Boolean).length ? `<p class="sub">${[why, extra].filter(Boolean).join(' ')}</p>` : ''}${celebrate}<div class="results">${places}</div>
      <div class="over-buttons">${main}${again}<button class="big alt" data-act="home">Main menu</button></div></div></div>`;
  }

  // A burst of confetti for a campaign win: pieces fall from the top and fade. Decoration only; never blocks a tap.
  function confettiHTML() {
    const cols = ['#f5a524', '#3ecf8e', '#4f8cff', '#ff5a5f', '#f6e7b8'];
    return `<div class="confetti" aria-hidden="true">${Array.from({ length: 36 }, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${cols[i % cols.length]};animation-delay:${((i * 53) % 90) / 100}s;animation-duration:${2.2 + (i % 5) * 0.35}s;--dx:${((i * 29) % 80) - 40}px"></i>`).join('')}</div>`;
  }

  const gameData = () => (ui.st ? ui.st.data : D);          // the rules of the game on the table (a campaign level has its own board and fossils)
  const gemValue = () => (gameData().tokens.find(t => t.gem) || {}).value;     // shown in the help text; the number itself lives in the data block
  const judgments = () => [
    `The board has ${gameData().tokens.reduce((n, t) => n + t.count, 0)} spaces, one tile on each. There are no pieces and no movement: you can peek at any tile.`,
    'Your first tap is a private peek (the board shows you the number — hold the device toward yourself); your second tap is a public flip. Tiles that do not match flip back at the end of your turn.',
    'After a peek you must flip another tile: you cannot dig up a map once you have peeked.',
    `Matches are pairs${gemValue() ? ' (a gem map is torn in three pieces, so it takes three)' : ''}. Only the tile you peeked can be matched, against the one you flipped. A match puts a map back together: it flies to your maps by itself and your turn ends.`,
    `A map is worth nothing until it is dug up. Digging up takes one map of your choice, worth the number on it${gemValue() ? ` (a gem map is ${gemValue()})` : ''}. Maps you never dig up are worth nothing.`,
    'Digging up is your whole turn, so it ends the moment the points are counted — there is no End turn tap afterwards.',
    'Who goes first is decided at random, without a screen for it; a card names whose turn it is before they tap (in Pass & Play, every turn).',
    'After you peek a gem piece and flip a gem piece, tapping a third tile is your consent to reveal your peeked piece too.',
    'An opponent\'s turn is shown one move at a time: a peek (the tile lifts, the number stays hidden), then the flip, right away. Its turn stays on the board until you tap a tile — that tap starts your turn, so there is no Continue. When it digs up a map, a banner says what it scored and its new total.',
    'Your found maps live in the scoreboard at the top, under your score — that is also where you tap one to dig it up.',
    'Pass & Play: when it is your turn, the tiles the other players flipped publicly since your last turn show face up with a ring in their colour (never the tile they only peeked at).',
    'Rules reminders: the first time a match or a gem comes up, a short note says how it works. In Pass & Play they come once per game and can be switched off on the setup screen; in the Campaign each shows once on a device.',
    'Leaving a game keeps it: Continue on the Main Menu (or on the Campaign / Pass & Play screen) picks it up. Starting a new game replaces it.',
    'Ties go to the most maps found, then whoever found the final map.',
    'Campaign: you beat a level by winning outright (a shared win does not count). Opponents differ in how well they remember tiles (their memory fades as turns pass, and now and then they tap the wrong spot), and in how well they judge the game: which maps are worth digging up, how close the end is, whether they are winning.',
  ];
  // "Tiles": how many of each number are in THIS game (it comes from the game's own data, so it follows the level).
  // It says nothing about which are still hidden — remembering that is the game.
  function fossilsHTML() {
    const data = ui.st.data, tokens = data.tokens.slice().sort((a, b) => (a.gem ? 1 : 0) - (b.gem ? 1 : 0) || a.value - b.value);
    const total = tokens.reduce((n, t) => n + t.count, 0), M = data.matching;
    const rows = tokens.map(t => `<div class="frow"><span class="mini">${t.gem ? '💎' : t.value}</span><b>× ${t.count}</b><span class="what">${t.gem ? `${t.count / M.gemSetSize === 1 ? 'one gem map' : t.count / M.gemSetSize + ' gem maps'} (${M.gemSetSize} pieces each), worth ${t.value}` : `${t.count / M.pairSize === 1 ? 'one pair' : t.count / M.pairSize + ' pairs'}`}</span></div>`).join('');
    return `<div class="screen help fossils" style="z-index:5"><div class="sheet"><h1>Tiles in this game</h1>
      <p class="dim">How many of each there are — not which are still hidden.</p>
      ${rows}<p class="total">${total} tiles in all</p>
      <button class="big" data-act="closefossils">Close</button></div></div>`;
  }
  // How to play: four little pictures and a line each; the fine print (judgment calls) is folded away underneath.
  const howTile = (x, y, { text = '', ring = '', dash = false, back = false, top = '' } = {}) => {
    const R = 24, pts = r => hexPts(x, y, r);
    return `<polygon points="${pts(R)}" fill="#2a1d14" stroke="#3d2b1d" stroke-width="2"/>` + (back
      ? `<polygon points="${pts(R * 0.8)}" fill="url(#gSand)" stroke="#5e4527" stroke-width="2.5"/><polygon points="${pts(R * 0.8)}" fill="url(#pSpeck)"/>`
      : `<polygon points="${pts(R * 0.8)}" fill="url(#gPlain)" stroke="#a58a58" stroke-width="2.5"/><text x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="central" font-size="${text.length > 1 ? 17 : 22}" font-weight="900" fill="#3b2410">${text}</text>`)
      + (ring ? `<polygon points="${pts(R * 0.92)}" fill="none" stroke="${ring}" stroke-width="4"${dash ? ` style="${dashStyle(R * 0.92)}"` : ''}/>` : '')
      + (top ? `<text x="${x}" y="${y - 30}" text-anchor="middle" font-size="20">${top}</text>` : '');
  };
  const howArrow = x => `<path d="M${x - 12} 40 H${x + 8} M${x + 1} 32 L${x + 9} 40 L${x + 1} 48" fill="none" stroke="#a8957a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  function helpHTML() {
    const B = COLORS[0], M = D.matching;
    const card = (title, svg, line) => `<div class="hcard"><svg viewBox="0 0 200 84" aria-hidden="true">${svg}</svg><b>${title}</b><p>${line}</p></div>`;
    const bankChip = `<rect x="14" y="16" width="52" height="52" rx="8" fill="url(#gAged)" stroke="#3ecf8e" stroke-width="4"/><path d="M46,46 L58,58 M58,46 L46,58" stroke="#b3261e" stroke-width="4.5" stroke-linecap="round" opacity=".85"/><text x="35" y="38" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="900" fill="#12306b">7</text>`;
    return `<div class="screen help" style="z-index:5"><div class="sheet"><h1>How to play</h1>
      <div class="how">
        ${card('1 · Peek', howTile(52, 48, { back: true, ring: B, dash: true, top: '👆' }) + howArrow(100) + howTile(148, 48, { text: '7', ring: B, dash: true, top: '👁' }), 'Tap a tile. Only you see it.')}
        ${card('2 · Flip', howTile(52, 48, { text: '7', ring: B, dash: true }) + howTile(148, 48, { text: '5', ring: B }), 'Tap another. Everyone sees it.')}
        ${card('3 · Match', howTile(52, 48, { text: '7', ring: B }) + `<text x="100" y="49" text-anchor="middle" dominant-baseline="central" font-size="34" font-weight="800" fill="#3ecf8e">=</text>` + howTile(148, 48, { text: '7', ring: B }), 'Same number? The two halves make a map. If not, they flip back — remember them!')}
        ${card('Or dig up', bankChip + howArrow(100) + `<text x="152" y="46" text-anchor="middle" dominant-baseline="central" font-size="40" font-weight="900" fill="#f5a524">+7</text>`, 'A map scores nothing until it is dug up. Instead of peeking, tap one of your maps to score its number.')}
      </div>
      ${gemValue() ? `<p class="hline"><b>💎 Gem maps</b> are torn in three pieces: match all three. Worth ${gemValue()}.</p>` : ''}
      <p class="hline"><b>🏆 Most points wins</b> once every tile is matched. Maps you never dig up score nothing.</p>
      ${ui.st ? '<button class="ghost" data-act="fossils">How many tiles of each number?</button>' : ''}
      <details class="fine"><summary>The fine print</summary><ul>${judgments().filter(j => gemValue() || !/^After you peek a gem/.test(j)).map(j => `<li>${esc(j)}</li>`).join('')}</ul>
        <p class="dim">The full list is in DECISIONS.md. Version ${esc(BUILD)}.</p></details>
      <button class="big" data-act="closehelp">Close</button></div></div>`;
  }

  // Settings: prompts above the board, and (for playtesting, or if you just want everything) unlock every level.
  function settingsHTML() {
    const seg = `<span class="seg">${['auto', 'on', 'off'].map(v => `<button class="${ui.hints === v ? 'on' : ''}" data-act="hints" data-v="${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</span>`;
    const unlock = ui.settings === 'unlock'
      ? `<div class="warn"><p class="warn-h">Unlock all opponents?</p>
           <p>This opens every level right away. Playing through the campaign — beating each opponent to unlock the next — is the intended way to learn the game, and unlocking skips that. You can lock them again here at any time.</p>
           <button class="big" data-act="unlock-yes">Unlock all</button><button class="big alt" data-act="unlock-no">Keep the campaign as is</button></div>`
      : ui.settings === 'reset'
        ? `<div class="warn"><p class="warn-h">Reset the campaign?</p><p>Every opponent you have beaten goes back to locked, except Beginner, and unlocking all opponents is switched off. Games in progress are not affected.</p>
             <button class="big danger" data-act="reset-yes">Reset campaign</button><button class="big alt" data-act="reset-no">Keep my progress</button></div>`
      : `${ui.unlockAll ? '<p class="ok">✓ All opponents are unlocked.</p>' : '<button class="ghost" data-act="unlock-ask">Unlock all opponents…</button>'}<button class="ghost" data-act="reset-ask">Reset campaign…</button>`;
    const soundSeg = `<span class="seg">${[['on', 'On'], ['off', 'Off']].map(([v, t]) => `<button class="${(ui.sound ? 'on' : 'off') === v ? 'on' : ''}" data-act="sound" data-v="${v}">${t}</button>`).join('')}</span>`;
    return `<div class="screen help settings" style="z-index:6"><div class="sheet"><h1>Settings</h1>
      <h3>Sound effects</h3><p>${soundSeg}</p>
      <h3>Prompts above the board</h3><p>${seg}</p><p class="dim">Auto shows them until you have finished one game on this device.</p>
      <h3>Campaign</h3>${unlock}
      ${ui.settings === 'unlock' || ui.settings === 'reset' ? '' : '<button class="big" data-act="closesettings">Done</button>'}</div></div>`;
  }

  // A reminder about tiles on the table must never hide them: the card moves to the half of the page the tile is not in, and the tile itself is drawn again above the dimmed page.
  function syncTip() {
    const L = fxLayer();
    if (L) L.querySelectorAll('.spotclone').forEach(e => e.remove());
    if (!ui.tip || !ui.tip.focus || !ui.tip.focus.length || !L || !ui.st) return;
    const back = root.querySelector('.tipback'), main = root.querySelector('.main');
    if (!back) return;
    const found = ui.tip.focus.map(f => ({ f, t: ui.st.tokens[f.tid], el: root.querySelector(`.cell[data-id="${ui.st.tokens[f.tid].cell}"]`) })).filter(x => x.el);
    if (!found.length) return;
    const tip = back.querySelector('.tip'), hit = () => { const c = tip.getBoundingClientRect(); return found.reduce((n, x) => { const g = x.el.getBoundingClientRect(); return n + (g.right < c.left || g.left > c.right || g.bottom < c.top || g.top > c.bottom ? 0 : 1); }, 0); };
    if (hit()) {                                                                          // the card at the bottom covers a gem: put it at the top instead (below the scoreboard)
      const before = hit();
      back.classList.add('top'); back.style.paddingTop = ((main ? main.getBoundingClientRect().top : 0) + 8) + 'px';
      if (hit() > before) { back.classList.remove('top'); back.style.paddingTop = ''; }       // (worse there: stay at the bottom; the gem is drawn above the card anyway)
    }
    for (const { f, t, el } of found) {
      const r = rectOf(el), ring = `<polygon class="ring" style="stroke:${f.color};${f.dash ? dashStyle(BOARD_S * 0.9) : ''}" points="${hexPts(0, 0, BOARD_S * 0.9)}"/>`;
      fxEl('spotclone', r, r.h, r.h, `<svg viewBox="${-BOARD_S} ${-BOARD_S} ${2 * BOARD_S} ${2 * BOARD_S}" width="100%" height="100%"><g class="tile">${mapFaceArt(0, 0, BOARD_S, t, t.id)}</g>${ring}</svg>`);
    }
  }

  function render() {
    if (ui.st && ui.st.over && !ui.countedOver) gameFinished();     // count the game (and record a campaign result) before drawing the end screen
    if (ui.screen === 'play' && ui.st && ui.st.over && !animating() && !ui.endSounded) {      // the end screen appears now: its sound goes with it
      ui.endSounded = true;
      const o = ui.outcome;
      sfx(ui.mode === 'campaign' && o ? (o.won ? (o.completed || (o.newlyUnlocked && !(UNLOCK_ALL || ui.unlockAll)) ? 'unlock' : 'win') : 'lose') : 'win', 200);
    }
    const html = { home: homeHTML, pass: passHTML, campaign: campaignHTML, play: gameHTML }[ui.screen]();
    root.innerHTML = html + (ui.help ? helpHTML() : '') + (ui.fossils && ui.st ? fossilsHTML() : '') + (ui.settings ? settingsHTML() : '');
    syncTip();
    saveGame();
  }

  window.FossilFrenzyUI = { ui, render, onClick, audio, startAnim };
  resumeGame();
  render();
})();
</script>
</body>
</html>
