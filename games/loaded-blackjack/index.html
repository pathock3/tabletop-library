<style>
:root { --bg:#0c1a14; --felt:#1b4a35; --gold:#f2c14e; --text:#f4efe0; --dim:#b9c9b8; --wood:#4a2f18; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; width: 100%; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif; touch-action: manipulation; }
#app { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 70% at 50% 35%, #2a6b4d 0%, #1b4a35 45%, #0c1a14 100%); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
input { font: inherit; color: inherit; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px); overflow: hidden; }
/* ---- menus ---- */
.home, .cover, .over { justify-content: center; gap: 18px; background:
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><circle cx='30' cy='30' r='3' fill='%23ffffff' fill-opacity='.07'/></svg>"),
  radial-gradient(ellipse at 50% 30%, #2f7a58, #12301f 70%, #08120d); }
.over { overflow-y: auto; justify-content: flex-start; padding-top: calc(env(safe-area-inset-top) + 50px); }
.hero { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.suits { font-size: 44px; font-weight: 900; letter-spacing: 6px; color: #f2c14e; text-shadow: 0 3px 0 #000; }
.kicker { font-size: 30px; font-weight: 900; letter-spacing: 14px; color: var(--gold); text-shadow: 0 3px 0 #000; padding-left: 14px; }
h1 { margin: -4px 0 0; font-size: 84px; line-height: 1; font-weight: 1000; font-style: italic; color: #fff7d6; -webkit-text-stroke: 3px #0a2a1a; paint-order: stroke fill; text-shadow: 0 6px 0 #0d3b25, 0 14px 22px rgba(0,0,0,.6); text-align: center; }
.cover h1, .over h1 { font-size: 56px; }
.tag { margin: 8px 0 0; color: #d6e8d2; text-align: center; font-size: 19px; max-width: 460px; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
.menu { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.big { min-width: 280px; max-width: 92%; padding: 14px 26px; min-height: 56px; border-radius: 16px; background: linear-gradient(#2f6b4b, #1b4430); border: 3px solid #e0b052; font-size: 20px; font-weight: 800; color: #fbf3d8; box-shadow: 0 5px 0 #06140d, inset 0 2px 0 rgba(255,255,255,.2); text-shadow: 0 2px 0 rgba(0,0,0,.45); }
.big:active { transform: translateY(2px); }
.big.gold { background: linear-gradient(#ffe08a, #e0a82e); color: #3b230a; text-shadow: none; border-color: #fff1bd; }
.big.ghost { background: rgba(0,0,0,.28); box-shadow: none; }
.ver { color: rgba(255,255,255,.55); font-size: 12px; margin: 0; }
.libback { position: absolute; z-index: 3; left: calc(env(safe-area-inset-left) + 12px); top: calc(env(safe-area-inset-top) + 8px); display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px; min-height: 44px; border-radius: 99px; background: rgba(8,20,14,.85); border: 2px solid var(--gold); color: var(--text); font-size: 16px; font-weight: 800; text-decoration: none; }
.libback span { font-size: 22px; line-height: 1; color: var(--gold); }
.topbar { width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; position: relative; flex: none; }
.topbar .rnd { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 15px; color: var(--dim); }
.chip { min-width: 46px; height: 46px; padding: 0 16px; border-radius: 23px; background: linear-gradient(#2f6b4b, #1b4430); border: 2px solid #e0b052; font-size: 16px; font-weight: 800; box-shadow: 0 3px 0 #06140d; }
/* ---- new game ---- */
.stitle { margin: 0; color: var(--gold); font-size: 30px; }
.sscroll { flex: 1; min-height: 0; width: 100%; max-width: 640px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 8px 2px 14px; }
.seat { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; background: rgba(0,0,0,.25); padding: 8px 10px; border-radius: 14px; }
.sdot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; flex: none; }
.sname { flex: 1 1 120px; min-width: 100px; height: 44px; border-radius: 10px; border: 2px solid #3d7a5a; background: rgba(0,0,0,.35); padding: 0 12px; font-size: 18px; font-weight: 700; user-select: text; -webkit-user-select: text; }
.seg { display: inline-flex; border: 2px solid #3d7a5a; border-radius: 12px; overflow: hidden; } .seg button { min-width: 64px; height: 44px; padding: 0 12px; font-weight: 800; font-size: 15px; background: rgba(0,0,0,.25); } .seg button.on { background: var(--gold); color: #3b230a; } .ghostseg { border-color: transparent; min-width: 0; }
.x { width: 44px; height: 44px; font-size: 18px; color: var(--dim); }
.add { min-width: 0; width: 100%; max-width: none; margin: 6px 0; font-size: 17px; min-height: 48px; }
.opts { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 56px; padding: 8px 12px; border-radius: 14px; background: rgba(0,0,0,.25); border: 2px solid #2e6a4b; }
.opt i { width: 34px; height: 34px; border-radius: 8px; border: 3px solid #e0b052; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 24px; color: #1c1c24; flex: none; } .opt.on i { background: var(--gold); }
.opt b { display: block; font-size: 17px; } .opt small { color: var(--dim); font-size: 13px; }
.deckcap { margin: 6px 0 0; text-align: center; font-size: 14px; color: var(--dim); }
.seedrow { display: flex; align-items: center; gap: 10px; padding: 6px 12px; color: var(--dim); } .seed { flex: 1; height: 44px; border-radius: 10px; border: 2px solid #3d7a5a; background: rgba(0,0,0,.35); padding: 0 12px; user-select: text; -webkit-user-select: text; }
.start { margin-top: 6px; }
/* ---- the table ---- */
.game { gap: 6px; }
.opps { width: 100%; max-width: 900px; display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 6px; flex: 0 1 auto; overflow-y: auto; max-height: 46%; }
.pnl { position: relative; background: rgba(0,0,0,.28); border: 3px solid var(--pc, #888); border-radius: 14px; padding: 6px 8px 8px; min-width: 0; }
.pnl.me { width: 100%; max-width: 900px; border-width: 4px; background: rgba(0,0,0,.34); }
.pnl.tgt { box-shadow: 0 0 0 4px var(--gold), 0 0 24px 6px rgba(242,193,78,.7); animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { box-shadow: 0 0 0 4px var(--gold), 0 0 6px 1px rgba(242,193,78,.4); } }
.phead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 15px; } .phead b { font-size: 17px; } .pts { color: var(--dim); font-size: 13px; }
.bdg { font-style: normal; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: rgba(255,255,255,.14); } .bdg.on { background: var(--gold); color: #3b230a; } .bdg.bad { background: #c0392b; }
.tot { margin-left: auto; font-size: 20px; font-weight: 900; color: var(--gold); text-shadow: 0 2px 0 #000; }
.line { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: flex-start; min-height: 62px; }
.load { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 800; align-self: center; margin-left: 4px; color: #ffd45e; } .load i { width: 14px; height: 14px; border-radius: 50%; background: #e8a61c; border: 2px solid #fff3c0; display: inline-block; margin-left: -6px; } .load i:first-child { margin-left: 0; }
.stamp { position: absolute; right: 12px; top: 40%; transform: rotate(-12deg); border: 4px solid #ff5a4a; color: #ff5a4a; font-weight: 1000; font-size: 28px; padding: 2px 12px; border-radius: 8px; background: rgba(0,0,0,.4); letter-spacing: 3px; animation: stamp .45s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
@keyframes stamp { from { transform: scale(2.6) rotate(-12deg); opacity: 0; } }
.pnl.busted .card { opacity: .7; }
.status { text-align: center; font-weight: 800; font-size: 18px; min-height: 40px; flex: none; } .status small { display: block; color: var(--dim); font-weight: 500; font-size: 13px; min-height: 16px; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: auto; min-height: 62px; }
.act { min-width: 120px; min-height: 60px; padding: 0 22px; border-radius: 16px; font-size: 22px; font-weight: 900; border: 3px solid #fff3d6; box-shadow: 0 5px 0 #06140d; }
.act.hit { background: linear-gradient(#ff7a5a, #c8321a); } .act.pass { background: linear-gradient(#5ab0f0, #1f6fc0); } .act.dd { background: linear-gradient(#ffd45e, #e0a21b); color: #3b230a; font-size: 18px; } .act.flip { background: linear-gradient(#b48cf0, #6d45c0); font-size: 17px; }
/* ---- cards ---- */
.card { --w: 54px; position: relative; width: var(--w); height: calc(var(--w) * 1.42); flex: none; border-radius: 7px; background: linear-gradient(#fffaf0, #eadfc4); color: #1c1c24; border: 3px solid var(--cc, #444); display: flex; flex-direction: column; align-items: center; padding: 2px 1px; box-shadow: 0 2px 0 rgba(0,0,0,.5); overflow: hidden; text-align: center; }
.card .cval { font-size: calc(var(--w) * .42); font-weight: 900; line-height: 1.05; } .card .cname { font-size: calc(var(--w) * .17); font-weight: 800; line-height: 1.05; margin-top: 1px; } .card .cval.wide { font-size: calc(var(--w) * .3); } .card.lg .cval.wide { font-size: calc(var(--w) * .24); }
.card .cname.x1 { font-size: calc(var(--w) * .145); }
.card .ccat { margin-top: auto; font-size: calc(var(--w) * .12); font-weight: 800; color: #fff; background: var(--cc); width: 100%; padding: 1px 0; text-transform: uppercase; letter-spacing: .03em; }
.card .cab { font-size: calc(var(--w) * .1); line-height: 1.12; margin: 3px 3px 2px; text-align: left; font-weight: 600; flex: 1; } .card .cab.sm { font-size: calc(var(--w) * .092); } .card .cab.tiny { font-size: calc(var(--w) * .08); }
.card.start .cval { margin: auto 0; font-size: calc(var(--w) * .62); } .card.lg { --w: 112px; border-width: 4px; border-radius: 10px; } .card.lg .ccat { margin-top: 0; order: -1; } .card.lg .cval { font-size: calc(var(--w) * .34); }
.card.zoom { --w: 190px; } .card .ctag { position: absolute; top: 0; left: 0; right: 0; font-size: 9px; font-weight: 900; background: #1c1c24; color: #ffd45e; text-transform: uppercase; letter-spacing: .06em; }
.card.lg .ctag { font-size: 11px; }
.card.back { background: repeating-linear-gradient(45deg, #7a1d1d, #7a1d1d 5px, #5a1212 5px, #5a1212 10px); border-color: #e8d49a; } .card.back .cback { margin: auto; font-size: calc(var(--w) * .5); color: #e8d49a; } .card.back .cback span { font-size: calc(var(--w) * .3); font-weight: 900; }
.card.side { transform: rotate(90deg) scale(.85); margin: 0 calc(var(--w) * .2); opacity: .8; } .card.glow { outline: 4px solid var(--gold); outline-offset: 2px; animation: pulse 1s ease-in-out infinite alternate; }
.bigline .card { --w: 108px; } .bigline .card.lg { --w: 108px; }
.sheet { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.66); display: grid; place-items: center; padding: 14px; overflow: auto; }
.sheet.bottom { align-items: end; background: rgba(0,0,0,.25); }
.sheetin { background: linear-gradient(#20523a, #12301f); border: 3px solid #e0b052; border-radius: 22px; padding: 18px; width: min(560px, 100%); max-height: 94%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.sheetin h2, .sheetin h3 { margin: 0; color: var(--gold); } .sheetin p { margin: 0; font-size: 16px; line-height: 1.4; max-width: 460px; }
.opts2 { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; } .opts2 .big { width: 100%; max-width: 420px; }
.pickrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; } .pickrow small { width: 100%; color: var(--dim); } .pickc { padding: 2px; border-radius: 10px; } .pickc .card { --w: 76px; } .showrow .card { --w: 76px; }
.decklist { width: 100%; max-height: 52vh; overflow-y: auto; text-align: left; } .drow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; padding: 5px 2px; border-bottom: 1px solid rgba(255,255,255,.12); } .drow .dc { width: 10px; height: 10px; background: var(--cc); display: inline-block; border-radius: 2px; } .drow small { width: 100%; color: var(--dim); font-size: 12px; }
.logsheet .logbody { width: 100%; max-height: 56vh; overflow-y: auto; text-align: left; } .ll { padding: 3px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
/* ---- draft ---- */
.draft { flex: 1; min-height: 0; width: 100%; max-width: 900px; overflow-y: auto; text-align: center; padding-bottom: 8px; } .draft h2 { margin: 2px 0; color: var(--gold); } .dsub { margin: 0 0 6px; color: var(--dim); }
.ordrow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; } .ord { padding: 4px 10px; border-radius: 99px; border: 2px solid var(--pc); font-weight: 800; font-size: 14px; } .ord.now { background: var(--gold); color: #3b230a; }
.market { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; } .mk { padding: 2px; border-radius: 12px; } .mk.canpick { outline: 3px dashed var(--gold); outline-offset: 2px; } .mk .card { --w: 106px; }
.picks { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; } .pk { font-size: 13px; background: rgba(0,0,0,.3); padding: 3px 9px; border-radius: 99px; } .decks { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; } .decks .chip { height: 40px; font-size: 14px; }
/* ---- results: the big moment ---- */
.results { position: absolute; inset: 0; z-index: 20; background: rgba(8,20,14,.96); padding: calc(env(safe-area-inset-top) + 56px) 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow-y: auto; }
.results h2 { margin: 0; color: var(--gold); } .rrows { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 8px; }
.rrow { border: 3px solid var(--pc); border-radius: 12px; padding: 6px 8px; background: rgba(255,255,255,.05); animation: slidein .5s var(--d, 0s) backwards; } .rrow.bad { border-style: dashed; }
.rtop { display: flex; align-items: baseline; gap: 10px; } .rtop b { font-size: 18px; } .rt { font-size: 26px; font-weight: 900; color: var(--gold); animation: pop .5s calc(var(--d, 0s) + 1.4s) backwards; } .rp { margin-left: auto; font-weight: 800; color: var(--dim); animation: slidein .5s calc(var(--d, 0s) + 1.8s) backwards; }
.rline { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; } .flipin { animation: flipc .7s calc(var(--d, 0s) + .5s) backwards; }
@keyframes slidein { from { opacity: 0; transform: translateY(14px); } } @keyframes pop { from { opacity: 0; transform: scale(2); } } @keyframes flipc { from { transform: rotateY(90deg); opacity: .2; } }
.results.skip *, .results.skip { animation: none !important; }
.stand { font-size: 14px; color: var(--dim); text-align: center; } .ractions { display: flex; gap: 10px; align-items: center; margin-top: auto; padding-top: 8px; flex-wrap: wrap; justify-content: center; }
.final { width: 100%; max-width: 420px; } .frow { display: flex; justify-content: space-between; padding: 8px 14px; margin: 4px 0; background: rgba(0,0,0,.3); border-radius: 12px; font-size: 18px; }
.hist { border-collapse: collapse; background: rgba(0,0,0,.28); border-radius: 12px; overflow: hidden; margin: 6px 0; } .hist td, .hist th { padding: 6px 12px; text-align: center; font-size: 15px; } .hist td:first-child { text-align: left; font-weight: 700; }
@media (orientation: landscape) and (max-height: 700px) { h1 { font-size: 56px; } .opps { max-height: 52%; } .card.lg { --w: 84px; } .bigline .card { --w: 84px; } .act { min-height: 52px; } }
@media (max-width: 520px) { .bigline .card { --w: 70px; } .card { --w: 44px; } h1 { font-size: 60px; } .opps { grid-template-columns: 1fr; } }
</style>

<script id="data">
// ---- THE RULES AND THE CARDS: everything a rule or a card is lives here; the engine below only does what this says ----
const GAME_DATA = {
  title: 'Loaded Blackjack',
  library: { name: 'Tabletop Library', href: '../../index.html' },
  tagline: 'Get as close to 21 as you can. Cheat your way there.',
  rules: {
    target: 21,                    // the number you try to reach without going over
    rounds: 5, quickRounds: 3,     // a full game and a Quick Game
    minPlayers: 2, maxPlayers: 6,
    marketPerPlayer: 2,            // upgrade cards dealt face up for each player
    picksPerPlayer: 2,             // everyone drafts this many
    busted: { points: 1 },         // a busted player scores the points for last place
    sideBetPoints: 2,              // Side Bet: a bust that ranks above the other busts (when at least one other player busted)
    getawayTotal: 17,              // Getaway Car: your total becomes this
    passDelayMs: 800,              // an AI takes one action about this often
    dealAt: [0, 1],                // the first card dealt is hidden, the second face up
  },
  ai: {
    levels: ['easy', 'medium', 'hard'],
    easyHitAtMost: 14, mediumBustChance: .35,
    hardBustChanceBehind: .5, hardBustChanceAhead: .25,
    easyUsesOptional: .5,
  },
  // The 9 cards every player starts with: one each of 1 to 9. All fixed; there is no Ace and there are no suits.
  starting: [
    ...['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'].map((id, k) => ({ id, name: String(k + 1), val: { kind: 'fixed', v: k + 1 }, cat: 'Starting', trig: 'none', text: '' })),
  ],
  // The 50 upgrade cards. val: fixed, flex (counts as either number), range, ringer (1 or the card to its left), headcount.
  // trig: when drawn / once per round / passive / when you would bust / scoring / at reveal. ai: a rough strength, 1 to 5 (the drafting AI uses it).
  upgrades: [
    // Control
    { id: 'two-faced', name: 'Two-Faced', cat: 'Control', val: { kind: 'flex', opts: [2, 7] }, trig: 'none', text: '', ai: 3 },
    { id: 'sleeve-card', name: 'Sleeve Card', cat: 'Control', val: { kind: 'flex', opts: [1, 5] }, trig: 'none', text: '', ai: 3 },
    { id: 'feather', name: 'Feather', cat: 'Control', val: { kind: 'flex', opts: [0, 3] }, trig: 'none', text: '', ai: 2 },
    { id: 'hi-lo', name: 'Hi-Lo', cat: 'Control', val: { kind: 'flex', opts: [1, 10] }, trig: 'none', text: '', ai: 4 },
    { id: 'dealers-choice', name: "Dealer's Choice", cat: 'Control', val: { kind: 'flex', opts: [2, 4, 6] }, trig: 'none', text: '', ai: 3 },
    { id: 'mechanic', name: 'Mechanic', cat: 'Control', val: { kind: 'range', min: 1, max: 5 }, trig: 'passive', text: 'Counts as any value from 1 to 5.', ai: 4 },
    { id: 'ringer', name: 'Ringer', cat: 'Control', val: { kind: 'ringer' }, trig: 'passive', text: 'Counts as 1, or as the value of the card to its left.', ai: 3 },
    { id: 'fixer', name: 'Fixer', cat: 'Control', val: { kind: 'fixed', v: 2 }, trig: 'once', text: 'Once per round: change another card in your line by 1, up or down.', ai: 4 },
    { id: 'split', name: 'Split', cat: 'Control', val: { kind: 'fixed', v: 5 }, trig: 'once', text: 'Once per round: halve another card in your line, rounding down.', ai: 3 },
    // Peek
    { id: 'shiner', name: 'Shiner', cat: 'Peek', val: { kind: 'fixed', v: 2 }, trig: 'once', text: 'Once per round: look at the top card of your deck. You may put it on the bottom.', ai: 4 },
    { id: 'marked-card', name: 'Marked Card', cat: 'Peek', val: { kind: 'fixed', v: 3 }, trig: 'drawn', text: 'When drawn: look at the top 2 cards of your deck and return them in any order.', ai: 3 },
    { id: 'cold-deck', name: 'Cold Deck', cat: 'Peek', val: { kind: 'fixed', v: 1 }, trig: 'drawn', text: 'When drawn: look at the top 3 cards of your deck. Put one on top and the rest on the bottom.', ai: 3 },
    { id: 'bottom-deal', name: 'Bottom Deal', cat: 'Peek', val: { kind: 'fixed', v: 2 }, trig: 'passive', text: 'You may look at the bottom card of your deck at any time. When you hit, you may draw from the bottom instead.', ai: 4 },
    { id: 'card-counter', name: 'Card Counter', cat: 'Peek', val: { kind: 'fixed', v: 2 }, trig: 'drawn', text: 'When drawn: look through your deck and put any card on top.', ai: 3 },
    { id: 'stacker', name: 'Stacker', cat: 'Peek', val: { kind: 'fixed', v: 2 }, trig: 'once', text: 'Once per round: put a card from your line back on top of your deck.', ai: 4 },

    const order = s.pl.map((p, i) => i).filter(i => i !== meIdx).sort((a, b) => s.part.includes(b) - s.part.includes(a));
    const body = s.phase === 'draft' ? draftHTML(s, v) : (s.phase === 'results' ? '' : tableHTML(s, v, meIdx, order, targetSet));
    return `<div class="screen game">${libraryLink()}<div class="topbar"><span class="rnd">Round ${s.round} of ${s.rounds}${s.tiebreak ? ' · tiebreak' : ''}</span><button class="chip" data-act="log" aria-label="Log">Log</button><button class="chip" data-act="menu" aria-label="Menu">☰ Menu</button></div>${body}${s.phase === 'results' ? resultsHTML(s) : ''}${sheetHTML(s, v, meIdx)}${ui.log ? logHTML(s) : ''}</div>`;
  }
  const isMeFor = (s, pd, v) => pd.who != null && s.pl[pd.who].kind === 'human' && (v === pd.who || (humans(s).length === 1));
  function tableHTML(s, v, me, order, targetSet) {
    const pd = s.pending, mine = pd && isMeFor(s, pd, v) ? pd : null;
    const opp = order.map(i => panelHTML(s, i, v, false, targetSet.has(i))).join('');
    const msg = s.pending && s.pending.kind === 'turn' ? (mine ? 'Your turn' : esc(s.pl[s.pending.who].name) + ' is thinking…') : (s.pending && s.pending.who != null && !mine ? esc(s.pl[s.pending.who].name) + ' is deciding…' : '');
    return `<div class="opps">${opp}</div><div class="status">${msg}<small>${esc(lastLog(s))}</small></div>${panelHTML(s, me, v, true, targetSet.has(me))}${actionBar(s, mine)}`;
  }
  const lastLog = s => (s.log.length ? s.log[s.log.length - 1].t : '');
  function actionBar(s, mine) {
    if (!mine || mine.kind !== 'turn') return '<div class="actions"></div>';
    const o = id => mine.opts.find(x => x.id === id);
    return `<div class="actions">${o('hit') ? '<button class="act hit" data-act="ans" data-v="hit">Hit</button>' : ''}<button class="act pass" data-act="ans" data-v="pass">Pass</button>${o('double') ? '<button class="act dd" data-act="ans" data-v="double">Double Down</button>' : ''}${o('flip') ? '<button class="act flip" data-act="ans" data-v="flip">Flip hidden card</button>' : ''}</div>`;
  }
  function handoffHTML(s) { const w = s.pending.who; return `<div class="screen cover"><div class="hero"><div class="suits">21</div><h1 style="color:${PTS[w % 6]}">${esc(s.pl[w].name)}</h1><p class="tag">Pass the device to ${esc(s.pl[w].name)}.</p></div><button class="big gold" data-act="handoff" data-v="${w}">I'm ${esc(s.pl[w].name)}. Tap when ready</button></div>`; }

  // a sheet for the pending decision, a tapped card or a deck list
  function mini(c) { return faceHTML(c, {}); }
  function sheetHTML(s, v, me) {
    const pd = s.pending;
    let h = '';
    if (ui.deckOf !== null) {
      const counts = {}; E.deckList(s, ui.deckOf).forEach(id => { counts[id] = (counts[id] || 0) + 1; });
      const ids = Object.keys(counts).sort((a, b) => (DEF[a].cat === 'Starting') - (DEF[b].cat === 'Starting') || DEF[a].name.localeCompare(DEF[b].name));
      return `<div class="sheet" data-act="closesheet"><div class="sheetin" data-act="none"><h3>${esc(s.pl[ui.deckOf].name)}'s deck (${E.deckList(s, ui.deckOf).length} cards)</h3><div class="decklist">${ids.map(id => `<div class="drow"><b>${esc(DEF[id].name)}</b>${counts[id] > 1 ? ' ×' + counts[id] : ''}<small>${esc(DEF[id].val.kind === 'fixed' ? DEF[id].val.v : valText({ id }))} · ${esc(DEF[id].text || DEF[id].cat)}</small></div>`).join('')}</div><button class="big" data-act="closesheet">Close</button></div></div>`;
    }
    if (ui.sheet !== null) {
      const c = s.cards[ui.sheet]; if (c) {
        const d = DEF[c.id], where = s.pl.findIndex(p => p.line.some(e => e.c.u === c.u)), ent = where >= 0 ? s.pl[where].line.find(e => e.c.u === c.u) : null;
        const hiddenToMe = ent && ent.down && !s.showAll && !(v === where && !ent.unk);
        const useOpt = pd && pd.kind === 'turn' && isMeFor(s, pd, v) ? pd.opts.find(o => o.u === c.u) : null;
        const flip = pd && pd.kind === 'turn' && isMeFor(s, pd, v) && ent && ent.down && where === pd.who ? pd.opts.find(o => o.id === 'flip') : null;
        if (hiddenToMe) return `<div class="sheet" data-act="closesheet"><div class="sheetin" data-act="none"><h3>A hidden card</h3><p>${esc(s.pl[where].name)}'s hidden card is face down. It still counts toward their total.</p><button class="big" data-act="closesheet">Close</button></div></div>`;
        return `<div class="sheet" data-act="closesheet"><div class="sheetin" data-act="none">${faceHTML(c, { big: true, cls: 'zoom' })}<h3>${esc(d.name)}</h3><p><b>${esc(d.cat)}</b> · value ${esc(valText(c))}${ent ? ' · in ' + esc(s.pl[where].name) + "'s line" : ''}${c.o >= 0 && c.o !== where ? ' · owned by ' + esc(s.pl[c.o].name) : ''}</p><p>${esc(d.text || 'No ability.')}</p>${useOpt ? `<button class="big gold" data-act="ans" data-v="${esc(useOpt.id)}">Use ${esc(d.name)}</button>` : ''}${flip ? '<button class="big gold" data-act="ans" data-v="flip">Flip this card face up</button>' : ''}<button class="big ghost" data-act="closesheet">Close</button></div></div>`;
      }
    }
    if (!pd || pd.kind === 'turn' || pd.kind === 'results' || !isMeFor(s, pd, v)) return h;
    if (pd.kind === 'target') return `<div class="sheet bottom"><div class="sheetin"><h3>${esc(pd.prompt)}</h3><div class="opts2">${pd.opts.map(o => `<button class="big" data-act="ans" data-v="${esc(o.id)}"><span class="sdot" style="background:${PTS[o.p % 6]}"></span> ${esc(o.label)}</button>`).join('')}</div></div></div>`;
    if (pd.kind === 'pick') return '';
    const show = (pd.show || []).map(u => s.cards[u]).filter(Boolean);
    if (pd.kind === 'card') return `<div class="sheet"><div class="sheetin"><h3>${esc(pd.prompt)}</h3><div class="pickrow">${pd.opts.map(o => { const c = s.cards[o.u]; const i = s.pl.findIndex(p => p.line.some(e => e.c.u === o.u)); const e = i >= 0 ? s.pl[i].line.find(x => x.c.u === o.u) : null; return `<button class="pickc" data-act="ans" data-v="${esc(o.id)}">${e && e.down ? faceHTML(c, { tag: 'hidden' }) : faceHTML(c, {})}</button>`; }).join('')}</div></div></div>`;
    return `<div class="sheet"><div class="sheetin"><h3>${esc(pd.prompt)}</h3>${show.length ? `<div class="pickrow showrow">${pd.showLabel ? `<small>${esc(pd.showLabel)}</small>` : ''}${show.map(c => mini(c)).join('')}</div>` : ''}<div class="opts2">${pd.opts.map(o => `<button class="big ${pd.kind === 'window' && o.id === 'decline' ? 'ghost' : ''}" data-act="ans" data-v="${esc(o.id)}">${esc(o.label)}</button>`).join('')}</div></div></div>`;
  }
  function draftHTML(s, v) {
    const dr = s.draft, pd = s.pending, mine = pd && pd.kind === 'pick' && isMeFor(s, pd, v);
    const who = dr && dr.k < dr.order.length ? dr.order[dr.k] : null;
    const orderRow = dr ? dr.order.slice(0, dr.order.length / 2).map((i, k) => `<span class="ord ${who === i ? 'now' : ''}" style="--pc:${PTS[i % 6]}">${k + 1}. ${esc(s.pl[i].name)}</span>`).join('') : '';
    const picks = dr ? dr.picks.map(x => `<span class="pk">${esc(s.pl[x.p].name)}: ${esc(DEF[s.cards[x.u].id].name)}</span>`).join('') : '';
    return `<div class="draft"><h2>The Draft</h2><p class="dsub">${who != null ? (mine ? 'Your pick!' : esc(s.pl[who].name) + ' is picking…') : ''} Two picks each, fewest points first${dr && dr.tie ? ' (ties broken at random)' : ''}.</p><div class="ordrow">${orderRow}</div>
      <div class="market">${s.market.map(c => `<button class="mk ${mine ? 'canpick' : ''}" data-act="${mine ? 'ans' : 'card'}" data-v="c${c.u}" data-u="${c.u}" data-p="-1">${faceHTML(c, { big: true })}</button>`).join('')}</div><div class="picks">${picks}</div><div class="decks">${s.part.map(i => `<button class="chip" data-act="deck" data-p="${i}">${esc(s.pl[i].name)}'s deck</button>`).join('')}</div></div>`;
  }
  function resultsHTML(s) {
    const r = s.result, sk = ui.skip ? ' skip' : ''; if (!r) return '';
    const rows = r.rows.slice().sort((a, b) => (b.pts - a.pts) || ((a.place || 99) - (b.place || 99)));
    return `<div class="results${sk}"><h2>${s.tiebreak ? 'Tiebreak round' : 'Round ' + r.round} results</h2><div class="rrows">${rows.map((x, k) => `<div class="rrow ${x.busted ? 'bad' : ''}" style="--d:${.5 + k * .6}s;--pc:${PTS[x.p % 6]}"><div class="rtop"><b>${esc(s.pl[x.p].name)}</b><span class="rt">${x.busted ? 'BUST' : x.total}</span><span class="rp">${x.busted ? 'last place' : 'place ' + x.place} · +${x.pts}</span></div><div class="rline">${x.line.map(l => { const c = s.cards[l.u]; return faceHTML(c, { cls: 'flipin', val: valText(c) }); }).join('')}${x.load ? `<span class="load"><b>${x.load}</b> Load</span>` : ''}</div></div>`).join('')}</div>
      <div class="stand"><b>Standings</b> ${s.pl.map((p, i) => ({ n: p.name, t: p.pts })).sort((a, b) => b.t - a.t).map(x => `${esc(x.n)} ${x.t}`).join(' · ')}</div>
      <div class="ractions"><button class="chip" data-act="skip">Skip</button><button class="big gold" data-act="ans" data-v="continue">${s.round >= s.rounds || s.tiebreak ? 'Finish' : 'Continue to the draft'}</button></div></div>`;
  }
  function overHTML(s) {
    const order = s.pl.map((p, i) => i).sort((a, b) => s.pl[b].pts - s.pl[a].pts);
    const hist = s.history;
    return `<div class="screen over">${libraryLink()}<div class="hero"><div class="suits">21</div><h1>${esc(s.pl[s.winner].name)} wins!</h1></div>
      <div class="final">${order.map((i, k) => `<div class="frow"><b>${k + 1}. ${esc(s.pl[i].name)}</b><span>${s.pl[i].pts} pts</span></div>`).join('')}</div>
      <table class="hist"><tr><th></th>${hist.map(h => `<th>R${h.round}${h.tiebreak ? 'T' : ''}</th>`).join('')}</tr>${order.map(i => `<tr><td>${esc(s.pl[i].name)}</td>${hist.map(h => `<td>${h.pts[i] != null ? h.pts[i] : '–'}</td>`).join('')}</tr>`).join('')}</table>
      <button class="big gold" data-act="newgame">Play again</button><button class="big ghost" data-act="home">Main Menu</button></div>`;
  }
  const logHTML = s => `<div class="sheet" data-act="log"><div class="sheetin logsheet" data-act="none"><h3>Log</h3><div class="logbody">${s.log.slice(-60).reverse().map(l => `<div class="ll">${esc(l.t)}</div>`).join('')}</div><button class="big" data-act="log">Close</button></div></div>`;
  const sheetBox = inner => `<div class="sheet" data-act="none"><div class="sheetin">${inner}</div></div>`;
  const helpHTML = () => sheetBox(`<h2>How to Play</h2>${D.texts.help.map(t => `<p>${esc(t)}</p>`).join('')}<button class="big gold" data-act="closehelp">Got it</button>`);
  const menuHTML = () => sheetBox(`<h2>Menu</h2><button class="big gold" data-act="closemenu">Back to the game</button><button class="big" data-act="help">How to Play</button><button class="big" data-act="resettips">Reset tips</button><button class="big ghost" data-act="home">Main Menu</button>`);
  const tipHTML = () => { const t = D.texts.tips[ui.tip]; return t ? sheetBox(`<h2>${esc(t[0])}</h2><p>${esc(t[1])}</p><button class="big gold" data-act="tipok">Got it</button>`) : ''; };

  // ---------- first-time tips: each once, the first time it comes up (the game waits while one is open) ----------
  function tipCheck() {
    const s = ui.s; if (!s || ui.tip || ui.screen !== 'game' || humans(s).length === 0) return;
    const sn = seen(), pd = s.pending, v = viewer(s), want = [];
    const add = k => { if (!sn[k] && !ui.tipQ.includes(k)) want.push(k); };
    if (s.phase === 'play') { add('welcome'); }
    if (s.phase === 'play' && v !== null && s.pl[v] && s.pl[v].line.length >= 2) add('deal');
    if (pd && pd.kind === 'turn' && isMeFor(s, pd, v)) add('turn');
    if (v !== null && s.pl[v] && s.pl[v].load > 0) add('load');
    if (pd && pd.kind === 'window' && isMeFor(s, pd, v)) add('window');
    if (v !== null && s.pl[v] && s.pl[v].status === 'busted') add('bust');
    if (s.phase === 'results') add('reveal');
    if (s.phase === 'draft') add('draft');
    ui.tipQ.push(...want);
    if (ui.tipQ.length) { ui.tip = ui.tipQ.shift(); const x = seen(); x[ui.tip] = 1; store.set(TIPS, JSON.stringify(x)); }
  }

  // ---------- running the game ----------
  function newGame() {
    const st = ui.setup, seats = st.seats.map(x => ({ name: x.name || 'Player', kind: x.kind, level: x.level }));
    const seed = st.seed.trim() ? Number(st.seed) | 0 : (Math.random() * 2 ** 31) | 0;
    ui.s = E.newGame({ seats, seed, quick: st.quick, friendly: st.friendly, showAll: st.showAll });
    ui.shown = null; ui.sheet = null; ui.deckOf = null; ui.skip = false; ui.screen = 'game'; save(); render();
  }
  function answerNow(id) { const r = E.answer(ui.s, id); if (r.ok) { ui.sheet = null; ui.skip = false; save(); } render(); }

  function render() {
    clearTimeout(ui.timer);
    let h;
    if (ui.screen === 'setup') h = setupHTML();
    else if (ui.screen === 'game' && ui.s) { tipCheck(); h = gameHTML(); }
    else h = homeHTML();
    app.innerHTML = h + (ui.menu && ui.screen === 'game' ? menuHTML() : '') + (ui.help ? helpHTML() : '') + (ui.tip ? tipHTML() : '');
    drive();
  }
  function drive() {
    const s = ui.s; if (ui.screen !== 'game' || !s || s.phase === 'over' || ui.menu || ui.help || ui.tip) return;
    const pd = s.pending; if (!pd) return;
    if (pd.kind === 'results') { if (humans(s).length === 0) ui.timer = setTimeout(() => answerNow('continue'), 3500); return; }
    if (pd.who == null) return;
    const pl = s.pl[pd.who];
    if (pl.kind === 'human') { if (multi(s) && ui.shown !== pd.who) return; return; }
    const delay = pd.kind === 'ack' ? 250 : D.rules.passDelayMs * (humans(s).length ? 1 : .35);
    ui.timer = setTimeout(() => { if (ui.s !== s || s.pending !== pd) return; const id = AI.answer(s, pd.who); const r = E.answer(s, id); if (!r.ok) console.error('AI answer refused', id, pd.prompt); save(); render(); }, delay);
  }

  app.addEventListener('input', e => {
    const t = e.target;
    if (t.classList.contains('sname')) ui.setup.seats[Number(t.dataset.i)].name = t.value;
    if (t.classList.contains('seed')) ui.setup.seed = t.value.replace(/[^0-9-]/g, '');
  });
  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act, s = ui.s; if (a === 'none') return;
    const st = ui.setup;
    if (a === 'newgame') { ui.setup = ui.setup || defaultSetup(); ui.screen = 'setup'; ui.menu = false; render(); }
    else if (a === 'continue') { try { const d = JSON.parse(store.get(SAVE)); ui.s = d.s; ui.screen = 'game'; ui.shown = null; render(); } catch (err) { store.del(SAVE); render(); } }
    else if (a === 'home') { ui.screen = 'home'; ui.menu = false; ui.help = false; render(); }
    else if (a === 'help') { ui.help = true; render(); } else if (a === 'closehelp') { ui.help = false; render(); }
    else if (a === 'menu') { ui.menu = true; render(); } else if (a === 'closemenu') { ui.menu = false; render(); }
    else if (a === 'resettips') { store.del(TIPS); ui.menu = false; render(); }
    else if (a === 'tipok') { ui.tip = ui.tipQ.length ? ui.tipQ.shift() : null; if (ui.tip) { const x = seen(); x[ui.tip] = 1; store.set(TIPS, JSON.stringify(x)); } render(); }
    else if (a === 'kind') { st.seats[Number(el.dataset.i)].kind = el.dataset.v; render(); }
    else if (a === 'level') { st.seats[Number(el.dataset.i)].level = el.dataset.v; render(); }
    else if (a === 'addseat') { const n = st.seats.length; st.seats.push({ kind: 'ai', level: 'medium', name: AINAMES[(n - 1) % 6] }); render(); }
    else if (a === 'rmseat') { st.seats.splice(Number(el.dataset.i), 1); render(); }
    else if (a === 'opt') { st[el.dataset.k] = !st[el.dataset.k]; render(); }
    else if (a === 'start') newGame();
    else if (a === 'handoff') { ui.shown = Number(el.dataset.v); render(); }
    else if (a === 'closesheet') { ui.sheet = null; ui.deckOf = null; render(); }
    else if (a === 'log') { ui.log = !ui.log; render(); }
    else if (a === 'skip') { ui.skip = true; render(); }
    else if (a === 'card') { ui.sheet = Number(el.dataset.u); render(); }
    else if (a === 'deck') { ui.deckOf = Number(el.dataset.p); render(); }
    else if (a === 'target') { const pd = s && s.pending; if (pd && pd.kind === 'target' && isMeFor(s, pd, viewer(s))) { const o = pd.opts.find(x => x.p === Number(el.dataset.p)); if (o) { answerNow(o.id); return; } } ui.deckOf = Number(el.dataset.p); render(); }
    else if (a === 'ans') { if (s && s.pending) answerNow(el.dataset.v); }
  });
  render();
  if (typeof window !== 'undefined') window.LB = { ui, render, newGame };
})();
</script>
</body>
</html>
