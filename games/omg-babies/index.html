<script id="data">
// OMG Babies! All rules, numbers, goal cards and baby names live here (rulebook Dec 2023 + the Babies Photo Cards sheet).
const GAME_DATA = {
  title: 'OMG Babies!',
  library: { href: '../../index.html' },
  rules: {
    rounds: 7,              // "a week"; the rulebook says play as long as it is fun, so the app ends after this many rounds (settings)
    energyMax: 10,          // the trackers' top (not in the rulebook)
    startPoop: 1,           // everyone gains 1 Poop and draws a Baby
    startEnergy: 'order',   // first player starts with 1 Energy, the next with 2, and so on (capped by startEnergyCap)
    startEnergyCap: 5,      // the Setup says 5: no one starts with more than this
    newBabyCost: 1, daycareCost: 1, deepCleanCost: 1, rerollCost: 1,
    baseDice: 5, maxDice: 10,            // 5 dice, plus 1 for each Baby in your Home, at most 10
    diaperRemoves: 2, restGives: 2,      // each Diaper removes up to 2 Poop; each Rest gives 2 Energy
    nightJoyPerPoops: 2,                 // -1 Joy for every 2 Poop in your Home
    goalSlots: 5,                        // face-up Goal cards to buy from
    skillCost: 3,                        // the sheet leaves Skill costs blank: 3 of the matching die
  },
  // The dice: 1 Learn, 2 Move, 3 Social, 4 Diaper, 5 Rest, 6 Play (wild).
  faces: [
    { n: 1, id: 'L', name: 'Learn', icon: '💡', color: '#f5c542' }, { n: 2, id: 'M', name: 'Move', icon: '👟', color: '#5fb36b' }, { n: 3, id: 'S', name: 'Social', icon: '💬', color: '#e0589f' },
    { n: 4, id: 'D', name: 'Diaper', icon: '🧷', color: '#4aa6d9' }, { n: 5, id: 'R', name: 'Rest', icon: '😴', color: '#8a7ad0' }, { n: 6, id: 'P', name: 'Play', icon: '⭐', color: '#ff8a4a' },
  ],
  joyTable: { 2: 1, 3: 2, 4: 4, 5: 6, 6: 8, 7: 10, 8: 12, 9: 14, 10: 15 },   // n of a kind (Learn, Move or Social) -> Joy
  // Goal cards (sheet "Babies Photo Cards"). Skill: a permanent extra die face. Memory: pay the dice, gain the Joy.
  goals: [
    { name: 'First Word', type: 'Skill', gives: 'L' }, { name: 'Baby Sign Language Class', type: 'Skill', gives: 'L' }, { name: 'First Steps', type: 'Skill', gives: 'M' }, { name: 'First Friend', type: 'Skill', gives: 'S' },
    { name: 'Play Date', type: 'Memory', cost: '1M 1S', joy: 1 }, { name: 'Visit the Playground', type: 'Memory', cost: '1M 1S', joy: 1 }, { name: 'Story Time at the Library', type: 'Memory', cost: '2L', joy: 1 },
    { name: 'Music Class', type: 'Memory', cost: '1L 1S', joy: 1 }, { name: 'Puppet Show', type: 'Memory', cost: '1L 1S', joy: 1 }, { name: 'Neighborhood Walk', type: 'Memory', cost: '2M', joy: 1 },
    { name: 'Go to the Zoo', type: 'Memory', cost: '2M 1L', joy: 2 }, { name: 'Visit the Park', type: 'Memory', cost: '2M 1S', joy: 2 }, { name: 'Go for a Hike', type: 'Memory', cost: '3M', joy: 2 },
    { name: 'Out on the Lake', type: 'Memory', cost: '3S', joy: 2 }, { name: 'First Day of Daycare', type: 'Memory', cost: '1S 1M 1L', joy: 2 }, { name: 'Aquarium', type: 'Memory', cost: '2L 1M', joy: 2 },
    { name: 'Family Picnic', type: 'Memory', cost: '2S 1M', joy: 2 }, { name: 'Beach Day', type: 'Memory', cost: '2M 2S', joy: 3 },
    // the unnamed cards of the sheet: named here by what they are
    { name: 'Tummy Time', type: 'Memory', cost: '2M', joy: 1 }, { name: 'Bedtime Story', type: 'Memory', cost: '2L', joy: 1 }, { name: 'Peekaboo', type: 'Memory', cost: '2S', joy: 1 }, { name: 'Cozy Nap', type: 'Memory', cost: '2R', joy: 1 },
    { name: 'Crawling Race', type: 'Memory', cost: '3M', joy: 2 }, { name: 'Picture Book', type: 'Memory', cost: '3L', joy: 2 }, { name: 'Giggle Party', type: 'Memory', cost: '3S', joy: 2 }, { name: 'Lazy Sunday', type: 'Memory', cost: '3R', joy: 2 },
    { name: 'Big Adventure', type: 'Memory', cost: '4M', joy: 4 }, { name: 'First Birthday', type: 'Memory', cost: '4L', joy: 4 }, { name: 'Family Reunion', type: 'Memory', cost: '4S', joy: 4 }, { name: 'Perfect Day', type: 'Memory', cost: '4R', joy: 4 },
  ],
  babyNames: ['Ella', 'Noah', 'Mia', 'Leo', 'Ava', 'Max', 'Zoe', 'Finn', 'Ivy', 'Jack', 'Lily', 'Sam', 'Ruby', 'Ben', 'Nora', 'Theo', 'Cleo', 'Owen', 'Maya', 'Eli', 'Rosie', 'Gus', 'Hazel', 'Milo', 'Pearl', 'Otto', 'Daisy', 'Felix', 'June', 'Ollie', 'Poppy', 'Rex', 'Wren', 'Bo', 'Tess', 'Jude', 'Opal', 'Hank', 'Lulu', 'Moe'],
  names: ['Maya', 'Theo', 'Priya', 'Jonas', 'Alma', 'Ravi', 'Lena'],
  settings: { bots: 3, rounds: 7, level: 'normal' },
  limits: { bots: [1, 7], rounds: [3, 20] },
  ai: { levels: {
    easy:   { babies: 1, rerolls: 0, reserve: 1, buys: 1 },
    normal: { babies: 2, rerolls: 1, reserve: 1, buys: 2 },
    hard:   { babies: 3, rerolls: 3, reserve: 1, buys: 3 },

<script id="engine">
// OMG Babies! rules: pure, no DOM. State is plain JSON changed in place by apply().
const Engine = (() => {
  const D = GAME_DATA, R = D.rules, F = Object.fromEntries(D.faces.map(f => [f.id, f]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const rnd = s => { s.rng = (s.rng + 0x6D2B79F5) | 0; let t = s.rng; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const shuffle = (s, a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, [lo, hi]) => Math.max(lo, Math.min(hi, v));
  const parseCost = c => { const o = {}; for (const m of String(c || '').match(/\d[A-Z]/g) || []) o[m[1]] = (o[m[1]] || 0) + +m[0]; return o; };
  const home = p => p.babies.filter(b => b.up);
  const log = (s, seat, text) => { s.log.push({ round: s.round, seat, text }); if (s.log.length > 200) s.log.shift(); };
  const addJoy = (p, n) => { p.joy = Math.max(0, p.joy + n); p.peak = Math.max(p.peak, p.joy); };
  const cleanSettings = o => { const c = Object.assign(clone(D.settings), o || {}); for (const k of Object.keys(D.limits)) c[k] = clamp(Math.round(+c[k] || D.settings[k]), D.limits[k]); if (!D.ai.levels[c.level]) c.level = 'normal'; return c; };

  function newGame(opts = {}) {
    const o = Object.assign({ seed: (Math.random() * 2 ** 31) | 0, humans: [0], settings: {} }, opts), cfg = cleanSettings(o.settings), n = cfg.bots + 1;
    const s = { v: 1, cfg, rng: o.seed | 0, n, round: 1, turn: 0, phase: 'morning', players: [], babyDeck: [], goalDeck: [], goalRow: [], log: [], winners: null, summary: null };
    s.babyDeck = shuffle(s, D.babyNames.map((nm, i) => i)); s.goalDeck = shuffle(s, D.goals.map((g, i) => i));
    for (let i = 0; i < n; i++) s.players.push({ name: i === 0 && o.humans.includes(0) ? 'You' : D.names[(i - 1) % D.names.length], human: o.humans.includes(i), energy: R.startEnergy === 'order' ? Math.min(R.startEnergyCap, i + 1) : R.startEnergyCap, joy: 0, peak: 0, poop: R.startPoop, babies: [], goals: [], skills: [], dice: [], rolled: false, rerolls: 0, mem: {} });
    for (const p of s.players) drawBaby(s, p);
    for (let k = 0; k < R.goalSlots; k++) s.goalRow.push(s.goalDeck.length ? s.goalDeck.pop() : null);
    startTurn(s); return s;
  }
  function drawBaby(s, p) { if (!s.babyDeck.length) return false; p.babies.push({ id: s.babyDeck.pop(), up: true }); return true; }
  function startTurn(s) { const p = s.players[s.turn]; p.dice = []; p.rolled = false; p.rerolls = 0; s.phase = 'morning'; s.summary = { before: { joy: p.joy, poop: p.poop, energy: p.energy, babies: home(p).length }, notes: [] }; }
  const refill = s => { for (let k = 0; k < R.goalSlots; k++) if (s.goalRow[k] == null && s.goalDeck.length) s.goalRow[k] = s.goalDeck.pop(); };
  const roll1 = s => 1 + Math.floor(rnd(s) * 6);
  const diceCount = p => Math.min(R.maxDice, R.baseDice + home(p).length);

  // ---------- the afternoon: what a set of dice is worth ----------
  const countsOf = dice => { const c = { L: 0, M: 0, S: 0, D: 0, R: 0, P: 0 }; for (const d of dice) c[D.faces[d.f - 1].id]++; return c; };
  const joyFor = (c, hasBaby) => hasBaby ? ['L', 'M', 'S'].reduce((a, k) => a + (D.joyTable[Math.min(10, c[k])] || 0), 0) : 0;
  // Play dice are wild: give them to whatever pays best. Returns the best split and what it does.
  function bestUse(p, dice) {
    const c = countsOf(dice), wild = c.P, hasBaby = home(p).length > 0; let best = null;
    const kinds = ['L', 'M', 'S', 'D', 'R'];
    (function go(i, left, add) {
      if (i === kinds.length - 1) { add[kinds[i]] = left; evalIt(add); return; }
      for (let k = 0; k <= left; k++) { add[kinds[i]] = k; go(i + 1, left - k, add); }
    })(0, wild, {});
    function evalIt(add) {
      const t = { L: c.L + add.L, M: c.M + add.M, S: c.S + add.S, D: c.D + add.D, R: c.R + add.R };
      const joy = joyFor(t, hasBaby), poop = Math.min(p.poop, R.diaperRemoves * t.D), energy = Math.min(R.energyMax - p.energy, R.restGives * t.R), value = joy + poop * 0.7 + energy * 0.8;
      if (!best || value > best.value) best = { value, joy, poop, energy, t };
    }
    return best || { value: 0, joy: 0, poop: 0, energy: 0, t: c };
  }
  // Can these dice pay a cost like {M:1,S:1}? Natural dice first, Play dice fill in. Returns the dice indices to spend, or null.
  function payment(dice, cost) {
    const used = new Set(), need = Object.entries(cost);
    for (const [k, n] of need) { let left = n; dice.forEach((d, i) => { if (left && !used.has(i) && D.faces[d.f - 1].id === k) { used.add(i); left--; } }); cost = cost; if (left) { dice.forEach((d, i) => { if (left && !used.has(i) && D.faces[d.f - 1].id === 'P') { used.add(i); left--; } }); } if (left) return null; }
    return [...used];
  }
  const goalCost = g => g.type === 'Skill' ? { [g.gives]: R.skillCost } : parseCost(g.cost);

  // ---------- actions ----------
  const err = e => ({ ok: false, error: e });
  function spend(s, p, n) { if (p.energy < n) return false; p.energy -= n; return true; }
  function apply(s, a) {
    const p = s.players[a.seat]; if (s.phase === 'over' || !p || a.seat !== s.turn) return err('turn');
    switch (a.type) {
      case 'newBaby': {
        if (s.phase !== 'morning') return err('phase'); if (!s.babyDeck.length) return err('deck'); if (!spend(s, p, R.newBabyCost)) return err('energy');
        drawBaby(s, p); s.summary.notes.push('drew a baby: ' + D.babyNames[p.babies[p.babies.length - 1].id]); return { ok: true, baby: p.babies[p.babies.length - 1] };
      }
      case 'daycare': { // flip any number of babies face down or up for 1 Energy
        if (s.phase !== 'morning') return err('phase'); const ids = a.babies || []; if (!ids.length) return err('none'); if (!spend(s, p, R.daycareCost)) return err('energy');
        for (const i of ids) if (p.babies[i]) p.babies[i].up = !p.babies[i].up; s.summary.notes.push('daycare for ' + ids.length); return { ok: true };
      }
      case 'deepClean': {
        if (s.phase !== 'morning') return err('phase'); if (!spend(s, p, R.deepCleanCost)) return err('energy');
        p.poop = 0; p.joy = 0; p.energy = 0; s.summary.notes.push('deep clean: lost all Poop, Joy and Energy'); return { ok: true };
      }
      case 'toAfternoon': {
        if (s.phase !== 'morning') return err('phase'); s.phase = 'afternoon'; p.dice = [];
        for (let i = 0; i < diceCount(p); i++) p.dice.push({ f: roll1(s) });
        for (const k of p.skills) p.dice.push({ f: D.faces.find(f => f.id === k).n, fixed: true });
        p.rolled = true; return { ok: true };
      }
      case 'reroll': { // for 1 Energy, reroll any number of (rolled, not skill) dice
        if (s.phase !== 'afternoon') return err('phase'); const idx = (a.dice || []).filter(i => p.dice[i] && !p.dice[i].fixed); if (!idx.length) return err('none'); if (!spend(s, p, R.rerollCost)) return err('energy');
        for (const i of idx) p.dice[i].f = roll1(s); p.rerolls++; return { ok: true };
      }
      case 'buy': {
        if (s.phase !== 'afternoon') return err('phase'); const gi = s.goalRow[a.slot]; if (gi == null) return err('slot'); const g = D.goals[gi], pay = payment(p.dice, goalCost(g)); if (!pay) return err('cost');
        p.dice = p.dice.filter((d, i) => !pay.includes(i));
        if (g.type === 'Skill') { p.skills.push(g.gives); p.goals.push(gi); s.summary.notes.push('learned ' + g.name); } else { addJoy(p, g.joy); p.goals.push(gi); s.summary.notes.push(g.name + ' (+' + g.joy + ' Joy)'); }
        s.goalRow[a.slot] = null; refill(s); return { ok: true, goal: g };
      }
      case 'finish': return finishAfternoon(s, p);
      case 'next': { if (s.phase !== 'night') return err('phase'); return nextTurn(s); }
      default: return err('type');
    }
  }
  // Resolve the dice, then the Night, in one go; the turn waits on 'next' (so you can read what happened).
  function finishAfternoon(s, p) {
    if (s.phase !== 'afternoon') return err('phase');
    const u = bestUse(p, p.dice); p.dice = [];
    addJoy(p, u.joy); p.poop -= u.poop; p.energy = Math.min(R.energyMax, p.energy + u.energy);
    s.summary.dice = { joy: u.joy, poop: u.poop, energy: u.energy, t: u.t };
    // Night
    const babies = home(p).length, lose = Math.floor(p.poop / R.nightJoyPerPoops);

    s.summary.night = { joy: -lose, poop: babies, energy: -babies };
    s.summary.after = { joy: p.joy, poop: p.poop, energy: p.energy, peak: p.peak };
    s.phase = 'night'; return { ok: true };
  }
  function nextTurn(s) {
    s.turn = (s.turn + 1) % s.n; if (s.turn === 0) { s.round++; if (s.round > s.cfg.rounds) { s.phase = 'over'; const top = Math.max(...s.players.map(p => p.peak)); s.winners = s.players.map((p, i) => p.peak === top ? i : -1).filter(i => i >= 0); return { ok: true }; } }
    startTurn(s); return { ok: true };
  }
  // What a seat may see: everything on the table is public in this game (dice are rolled in the open).
  const viewFor = s => s;
  return { newGame, apply, home, diceCount, bestUse, payment, goalCost, parseCost, countsOf, joyFor, cleanSettings, viewFor, clone, rnd, F };
})();
</script>
<script id="bots">
// Computer parents: they play a whole turn with the same actions as a person.
const Bots = (() => {
  const D = GAME_DATA, E = Engine, R = D.rules;
  const lv = s => D.ai.levels[s.cfg.level] || D.ai.levels.normal;
  // the kind (Learn / Move / Social) a hand of dice is closest to a big set of
  const topKind = (dice) => { const c = E.countsOf(dice); return ['L', 'M', 'S'].sort((a, b) => c[b] - c[a])[0]; };
  function morning(s, seat) {
    const p = s.players[seat], L = lv(s);
    while (E.home(p).length < L.babies && p.energy > L.reserve && s.babyDeck.length) E.apply(s, { type: 'newBaby', seat });
    // too much poop and several babies: put the extras in daycare for a round
    if (p.poop >= 8 && E.home(p).length > 1 && p.energy > L.reserve) { const idx = p.babies.map((b, i) => b.up ? i : -1).filter(i => i >= 0).slice(1); E.apply(s, { type: 'daycare', seat, babies: idx }); }
    else if (E.home(p).length === 0 && p.babies.length && p.energy > 0) E.apply(s, { type: 'daycare', seat, babies: p.babies.map((b, i) => i) });
  }
  function afternoon(s, seat) {
    const p = s.players[seat], L = lv(s);
    for (let k = 0; k < L.rerolls && p.energy > L.reserve; k++) {
      const kind = topKind(p.dice), keep = new Set(['P', kind]); if (p.poop > 2) keep.add('D'); if (p.energy <= 2) keep.add('R');
      const idx = p.dice.map((d, i) => keep.has(D.faces[d.f - 1].id) || d.fixed ? -1 : i).filter(i => i >= 0); if (idx.length < 2) break; E.apply(s, { type: 'reroll', seat, dice: idx });
    }
    for (let b = 0; b < L.buys; b++) {
      let best = null; s.goalRow.forEach((gi, slot) => { if (gi == null) return; const g = D.goals[gi], ok = E.payment(p.dice, E.goalCost(g)); if (!ok) return; const v = g.type === 'Skill' ? 1.5 : g.joy; if (!best || v > best.v) best = { v, slot }; });
      if (!best || best.v < 1) break; E.apply(s, { type: 'buy', seat, slot: best.slot });
    }
    E.apply(s, { type: 'finish', seat });
  }
  // One whole turn for a bot; returns the summary of it.
  function turn(s, seat) {
    morning(s, seat); E.apply(s, { type: 'toAfternoon', seat }); afternoon(s, seat); const sum = s.summary; return sum;
  }
  function playGame(s) {
    for (let g = 0; g < 5000 && s.phase !== 'over'; g++) { turn(s, s.turn); E.apply(s, { type: 'next', seat: s.turn }); }
    return s;
  }
  return { turn, playGame, morning, afternoon };
})();
</script>

    if (sh.t === 'how') body = `<div class="howto"><h3>How to play OMG Babies!</h3><p>You take care of babies. The player with the most <b>Joy at any point</b> wins. Play ${ui.settings.rounds} rounds; each turn has a Morning, an Afternoon and a Night.</p>
      <ul><li><b>Morning</b> (each costs ${R.newBabyCost}⚡): draw a <b>New Baby</b>; send babies to <b>Daycare</b> (face down: they are not in your Home) or bring them back; or <b>Deep Clean</b> (lose all Poop, Joy and Energy).</li>
      <li><b>Afternoon</b>: roll ${R.baseDice} dice plus 1 for each baby at home (at most ${R.maxDice}). Reroll any dice for ${R.rerollCost}⚡. 💡 Learn, 👟 Move, 💬 Social, 🧷 Diaper (removes up to ${R.diaperRemoves} Poop each), 😴 Rest (+${R.restGives}⚡ each), ⭐ Play (wild).</li>
      <li><b>Joy</b> (you need a baby at home): matching Learn, Move or Social dice: 2 of a kind 1 Joy, 3 → 2, 4 → 4, 5 → 6 … 10 → 15.</li>
      <li><b>Goals</b>: spend dice to buy a Memory (gain its Joy) or a Skill (a permanent extra die face).</li>
      <li><b>Night</b>: −1 Joy per ${R.nightJoyPerPoops} Poop, then +1 Poop and −1⚡ for each baby at home.</li></ul></div><button class="btn go" data-act="closesheet">Got it</button>`;
    else if (sh.t === 'menu') body = `<h3>Menu</h3><button class="btn sky" data-act="sheet" data-s="how">How to play</button><button class="btn ${ui.quit ? 'sun' : ''}" data-act="newgame">${ui.quit ? 'Tap again to abandon this game' : 'New game'}</button><button class="btn" data-act="menu">Main menu</button>${LIB ? `<a class="btn" href="${D.library.href}">‹ Library</a>` : ''}<button class="btn go" data-act="closesheet">Back to the babies</button>`;
    else if (sh.t === 'recap') body = `<h3>While you slept…</h3>${ui.recap.map(r => `<div class="li"><b>${esc(r.name)}</b>: ${r.joy >= 0 ? '+' : ''}${r.joy} Joy now (${r.joy2} Joy, best ${r.peak}). ${esc(r.notes)}</div>`).join('')}<button class="btn go" data-act="closesheet">${ui.s.phase === 'over' ? 'See the winner' : 'My turn!'}</button>`;
    return `<div class="sheet-bg" data-act="bg"><div class="sheet">${body}</div></div>`;
  }
  function render() {
    let h = ui.screen === 'menu' ? menuHTML() : gameHTML(); h += sheetHTML(); if (ui.toast) h += `<div class="toast">${esc(ui.toast)}</div>`;
    const pn = $.querySelector('#panel'), top = pn ? pn.scrollTop : 0; $.innerHTML = h; const n = $.querySelector('#panel'); if (n && top) n.scrollTop = top; ui.newBaby = null; ui.rolled = false;
  }

  // ---------- flow ----------
  function start() { ui.s = E.newGame({ settings: ui.settings }); ui.screen = 'game'; ui.sheet = null; ui.hold = []; ui.goalPick = null; ui.daycare = null; ui.recap = null; ui.quit = false; render(); }
  function afterNight() { // you tapped Next: the computer parents take their turns at once, then the recap waits for you
    const s = ui.s; E.apply(s, { type: 'next', seat: ME }); const recap = [];
    while (s.phase !== 'over' && s.turn !== ME) { const q = s.players[s.turn], before = q.joy, sum = B.turn(s, s.turn); recap.push({ name: q.name, joy: q.joy - before, joy2: q.joy, peak: q.peak, notes: (sum.notes.length ? sum.notes.join(', ') + '. ' : '') + (sum.dice && sum.dice.joy ? `Dice gave +${sum.dice.joy} Joy.` : '') }); E.apply(s, { type: 'next', seat: s.turn }); }
    ui.recap = recap; ui.hold = []; ui.goalPick = null; ui.sheet = recap.length ? { t: 'recap' } : null; render();
  }
  const act = a => { const r = E.apply(ui.s, Object.assign({ seat: ME }, a)); if (!r.ok) toast({ energy: 'Not enough Energy', cost: 'You cannot pay for that', deck: 'No more babies' }[r.error] || 'Not allowed'); return r; };
  const H = {
    play() { start(); }, menu() { ui.screen = 'menu'; ui.sheet = null; ui.quit = false; render(); },
    bots(d) { ui.settings.bots = +d.n; saveSettings(); render(); }, level(d) { ui.settings.level = d.k; saveSettings(); render(); },
    rounds() { const r = ui.settings.rounds + 2; ui.settings.rounds = r > 11 ? 3 : r; ui.settings = E.cleanSettings(ui.settings); saveSettings(); render(); },
    sheet(d) { ui.sheet = { t: d.s }; render(); }, closesheet() { ui.sheet = null; render(); }, bg() { H.closesheet(); },
    newgame() { if (!ui.quit) { ui.quit = true; return render(); } ui.quit = false; start(); },
    newbaby() { const r = act({ type: 'newBaby' }); if (r.ok) { ui.newBaby = ui.s.players[ME].babies.length - 1; render(); } },
    daystart() { ui.daycare = []; render(); }, daybaby(d) { const i = +d.i, m = ui.daycare, k = m.indexOf(i); if (k >= 0) m.splice(k, 1); else m.push(i); render(); },
    daydo() { const r = act({ type: 'daycare', babies: ui.daycare }); ui.daycare = null; render(); }, daycancel() { ui.daycare = null; render(); },
    clean() { if (act({ type: 'deepClean' }).ok) { toast('All clean (and tired)'); } },
    toafternoon() { ui.hold = []; ui.goalPick = null; if (act({ type: 'toAfternoon' }).ok) { ui.rolled = true; render(); } },
    die(d) { const i = +d.i, k = ui.hold.indexOf(i); if (k >= 0) ui.hold.splice(k, 1); else ui.hold.push(i); render(); },
    reroll() { const r = act({ type: 'reroll', dice: ui.hold }); if (r.ok) { ui.hold = []; ui.rolled = true; render(); } },
    goal(d) { const slot = +d.i; if (ui.goalPick !== slot) { ui.goalPick = slot; return render(); } const r = act({ type: 'buy', slot }); ui.goalPick = null; ui.hold = []; if (r.ok) toast('Got it: ' + r.goal.name); else render(); },
    finish() { ui.hold = []; ui.goalPick = null; act({ type: 'finish' }); render(); }, next() { afterNight(); }, none() {},
  };
  $.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; if (el.dataset.act === 'bg' && e.target !== el) return; const f = H[el.dataset.act]; if (!f) return; if (!['newgame', 'sheet'].includes(el.dataset.act)) ui.quit = false; f(el.dataset); });
  window.__ob = { ui, E, B };
  render();
})();
</script>
