<html lang="en">

<style>
:root { --ink: #0f2a2b; --wine: #1c5558; --wine-d: #0f3a3c; --gold: #f2b63a; --gold-d: #a9741a; --paper: #f3e6c4; --paper-d: #d8c595; --steel: #2a2e38; --text: #f6ecd8; --dim: #c9b79a; --green: #5fb36b; --red: #e0585a;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; width: 100%; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; color: var(--text); font-family: var(--sans); touch-action: manipulation; background: var(--ink); }
body::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 100% 60% at 50% 0%, #2d8a85 0%, #17595a 45%, #0f2a2b 80%); }
#app { position: absolute; inset: 0; z-index: 1; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--serif); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.btn { min-height: 56px; padding: 0 22px; border-radius: 14px; font-size: 20px; font-weight: 800; background: linear-gradient(#ffffff22, #ffffff08), #1f6d70; border: 2px solid #ffffff3a; box-shadow: 0 5px 0 #0008; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0008; }
.btn.gold { background: linear-gradient(#ffe6a0, #f2b63a 55%, #d19320); color: var(--ink); border: 0; box-shadow: 0 6px 0 #7a5410, 0 12px 22px #0008; font-size: 24px; min-height: 66px; }
.btn.gold:active { transform: translateY(5px); box-shadow: 0 1px 0 #7a5410; }
.btn.alt { background: #ffffff14; }
.btn.sm { min-height: 48px; font-size: 17px; padding: 0 16px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chip { min-height: 48px; padding: 0 16px; border-radius: 24px; font-size: 17px; font-weight: 700; background: #ffffff14; border: 2px solid #ffffff30; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.chip.on { background: linear-gradient(#ffe6a0, #f2b63a); color: var(--ink); border-color: #fff3; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.libback { position: absolute; z-index: 3; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); padding: 10px 16px; border-radius: 22px; background: #0008; border: 2px solid var(--gold-d); font-weight: 700; font-size: 16px; text-decoration: none; min-height: 44px; display: flex; align-items: center; }

/* menu */
.menu { justify-content: flex-start; padding-top: max(60px, env(safe-area-inset-top)); }
.crest { width: min(380px, 66vw); flex: none; filter: drop-shadow(0 10px 18px #000a); }
.menu h1 { font-size: clamp(40px, 9vw, 74px); letter-spacing: 3px; line-height: 1; text-align: center; color: #fff1cc; text-shadow: 0 3px 0 var(--wine-d), 0 0 24px #f2b63a66; text-transform: uppercase; }
.menu .sub { font-size: clamp(16px, 3vw, 22px); color: var(--dim); text-align: center; max-width: 560px; }
.menu .stack { display: flex; flex-direction: column; gap: 14px; width: min(460px, 92vw); margin-top: 8px; }
.credit { font-size: 13px; color: var(--dim); text-align: center; opacity: .8; margin-top: auto; }

/* setup / lab */
.panel { width: min(760px, 100%); background: #00000040; border: 2px solid #ffffff22; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { font-size: 22px; color: #fff1cc; }
.panel .hint { font-size: 15px; color: var(--dim); line-height: 1.35; }
.scroll { flex: 1; min-height: 0; width: min(760px, 100%); overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; touch-action: pan-y; }
.top { width: min(760px, 100%); display: flex; align-items: center; gap: 10px; min-height: 48px; }
.top h2 { flex: 1; font-size: 26px; color: #fff1cc; }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid #ffffff18; }
.ctl label { font-size: 16px; flex: 1; line-height: 1.25; }
.ctl.chg label { color: var(--gold); }
.step { display: flex; align-items: center; gap: 6px; }
.step b { min-width: 44px; text-align: center; font-size: 24px; font-family: var(--serif); }
.step button { width: 48px; height: 48px; border-radius: 12px; background: #ffffff1a; border: 2px solid #ffffff30; font-size: 26px; font-weight: 800; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.wrapchips .chip { min-height: 44px; font-size: 15px; padding: 0 12px; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 16px; }
table.cmp td, table.cmp th { padding: 7px 6px; border-top: 1px solid #ffffff18; text-align: right; }
table.cmp td:first-child, table.cmp th:first-child { text-align: left; }
table.cmp td.d { font-size: 13px; color: var(--gold); }
.bar { height: 10px; border-radius: 5px; background: #ffffff20; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--gold); }
input[type=text], textarea { width: 100%; border-radius: 12px; border: 2px solid #ffffff30; background: #00000050; color: var(--text); padding: 10px 12px; font: inherit; font-size: 17px; user-select: text; -webkit-user-select: text; }


/* game stage: a fixed 1180 x 820 table scaled to fit the screen */
#stage { position: absolute; left: 50%; top: 50%; width: 1180px; height: 820px; transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 8px; }
#stage > .topbar, #stage > .handwrap { flex: none; }
.rotate { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 60; background: var(--gold); color: var(--ink); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.topbar { height: 106px; display: flex; gap: 8px; align-items: stretch; }
.menubtn { width: 56px; border-radius: 14px; background: #0008; border: 2px solid var(--gold-d); font-size: 28px; flex: none; }
.invitecard { flex: 1; min-width: 0; border-radius: 14px; background: linear-gradient(170deg, #fff8e4, #ecdcae); color: var(--ink); border: 3px solid var(--gold-d); padding: 5px 12px; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.invitecard h2 { font-size: 26px; line-height: 1.05; display: flex; align-items: baseline; gap: 10px; }
.invitecard h2 small { font-family: var(--sans); font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #7a5410; }
.invitecard .story { font-size: 14px; font-style: italic; line-height: 1.15; color: #4b3a14; }
.invitecard .pay { font-size: 14px; font-weight: 700; line-height: 1.15; }
.impchips { display: flex; gap: 4px; flex-wrap: wrap; }
.ichip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 900; padding: 1px 7px; border-radius: 10px; background: #0001; color: #7b6b3a; }
.ichip.on { background: var(--c); color: #fff; } .ichip.minus { background: #fff; color: var(--c); outline: 2px solid var(--c); outline-offset: -2px; }
.roundbox, .timerbox { width: 108px; border-radius: 14px; background: #00000055; border: 2px solid #ffffff25; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; flex: none; }
.roundbox small, .timerbox small { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
.roundbox b { font-family: var(--serif); font-size: 32px; color: #fff1cc; }
.timerbox { width: 130px; flex-direction: row; gap: 8px; } .timerbox b { font-family: var(--serif); font-size: 42px; color: #fff1cc; font-variant-numeric: tabular-nums; } .timerbox.low b { color: var(--red); animation: blink .5s infinite alternate; }
@keyframes blink { to { opacity: .45; } }
.board { width: 236px; border-radius: 14px; background: #00000055; border: 2px solid #ffffff25; padding: 4px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-content: center; font-size: 13px; flex: none; }
.board div { display: flex; justify-content: space-between; gap: 4px; line-height: 1.35; } .board b { color: var(--gold); } .board .me { color: #fff1cc; font-weight: 800; }
.mess { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 15), 1fr); grid-template-rows: repeat(10, 1fr); gap: 2px; position: relative; touch-action: none; }
.tile { border-radius: 6px; position: relative; overflow: hidden; min-width: 0; min-height: 0; touch-action: none; }
.tile.empty { background: #00000030; border: 1px dashed #ffffff14; }
.tile.down { background: repeating-linear-gradient(45deg, #1d6f72, #1d6f72 5px, #2a8a8c 5px, #2a8a8c 10px); border: 2px solid #0a2a2b; box-shadow: inset 0 0 0 1px #ffffff30; }
.tile.down::after { content: "🧥"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; opacity: .55; }
.tile.up { background: linear-gradient(170deg, #fff8e4, #ecdcae); border: 2px solid var(--c); color: var(--ink); padding: 1px 3px; display: flex; flex-direction: column; justify-content: space-between; }
.tile.up b { font-size: 10px; line-height: 1.03; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .vals { display: flex; gap: 3px; flex-wrap: nowrap; font-size: 11px; font-weight: 900; line-height: 1; }
.tile .vals span { color: var(--c2); } .tile .vals span.neg { color: #c0262d; }
.tile.dbg { opacity: .8; } .tile.dbg::after { display: none; }
.tile.flash { animation: flashring 1.1s; } @keyframes flashring { 0% { box-shadow: 0 0 0 4px #fff, 0 0 14px 6px var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }
.tile.gone { animation: flipout .36s forwards; } @keyframes flipout { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg) scale(1.1); background: #fff8e4; } 100% { transform: scale(.2) translateY(160px); opacity: 0; } }
.tile.landed { animation: landin .35s; } @keyframes landin { from { transform: scale(1.5) rotate(-8deg); opacity: .3; } }
.handwrap { height: 196px; display: flex; gap: 8px; }
.handrow { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.hc { position: relative; border-radius: 12px; background: linear-gradient(170deg, #fff8e4, #ecdcae); color: var(--ink); border: 4px solid var(--t); padding: 5px 6px 6px; display: flex; gap: 6px; min-width: 0; touch-action: none; box-shadow: 0 3px 0 #0006; }
.hc.sel { transform: translateY(-8px); box-shadow: 0 0 0 3px #fff, 0 10px 0 #0006; }
.hc.arrive { animation: arrive .4s; } @keyframes arrive { from { transform: translateY(60px) scale(.8); opacity: 0; } }
.hc.dragging { opacity: .25; } .hc.dropbefore { box-shadow: -8px 0 0 -2px var(--gold); } .hc.dropafter { box-shadow: 8px 0 0 -2px var(--gold); }
.hc.slotcard { cursor: default; }
.hc.played::after { content: "ON"; position: absolute; right: 6px; top: 4px; background: var(--ink); color: var(--gold); font-weight: 900; font-size: 11px; padding: 0 6px; border-radius: 8px; }
.hc.empty { background: #ffffff0e; border: 3px dashed #ffffff25; box-shadow: none; }
.hc .imps { display: flex; flex-direction: column; gap: 4px; width: 56px; flex: none; justify-content: flex-start; }
.im { display: flex; align-items: center; justify-content: space-between; gap: 2px; background: var(--c); color: #fff; border-radius: 8px; padding: 1px 6px; font-size: 17px; font-weight: 900; line-height: 1.3; }
.im b.neg { color: #ffd0d0; background: #a3151d; border-radius: 5px; padding: 0 3px; }
.im i { font-style: normal; font-size: 14px; }
.hc .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hc .nm { font-family: var(--serif); font-size: 18px; line-height: 1.05; overflow-wrap: anywhere; }
.hc .ty { font-style: normal; font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #6b5a2a; }
.hc .pr { display: flex; flex-wrap: wrap; gap: 3px; } .hc .pr span { font-size: 12px; font-weight: 800; background: #00000018; border-radius: 6px; padding: 0 5px; }
.hc .ab { font-size: 14px; font-weight: 700; line-height: 1.15; color: #7a2a1a; }
.handside { width: 150px; flex: none; border-radius: 14px; background: #00000055; border: 2px solid #ffffff25; padding: 8px; display: flex; flex-direction: column; gap: 8px; justify-content: center; text-align: center; }
.handside b { font-family: var(--serif); font-size: 26px; color: #fff1cc; } .handside small { color: var(--dim); font-size: 12px; font-weight: 700; }
.handside .btn { min-height: 52px; font-size: 18px; }
.hint { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); z-index: 20; background: var(--gold); color: var(--ink); border-radius: 22px; padding: 10px 20px; font-weight: 900; font-size: 20px; pointer-events: none; }
.invitepanel { position: absolute; inset: 0; z-index: 15; background: #0f2a2bf0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; }
.invitepanel h1 { font-size: 54px; color: #fff1cc; } .invitepanel .story { font-size: 22px; font-style: italic; color: #f0e3c8; max-width: 760px; } .invitepanel .pay { font-size: 22px; font-weight: 800; color: var(--gold); max-width: 760px; }
.invitepanel .impchips .ichip { font-size: 18px; padding: 3px 14px; }
.preview { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 25; width: 360px; height: 190px; pointer-events: none; }
.preview .hc { height: 100%; font-size: 130%; }
.build { flex: 1; min-height: 0; display: flex; gap: 10px; }
.build .handrow { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); flex: none; width: 520px; gap: 6px; }
.figure { flex: 1; border-radius: 16px; background: #00000040; border: 2px solid #ffffff22; display: grid; grid-template-columns: 1fr 190px; gap: 10px; padding: 10px; }
.fig { display: flex; flex-direction: column; gap: 6px; }
.slot { flex: 1; border-radius: 12px; border: 3px dashed #ffffff40; background: #ffffff0d; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--dim); font-weight: 800; font-size: 15px; position: relative; min-height: 0; }
.slot .bare { display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 14px; } .slot .bare i { font-style: normal; font-size: 36px; }
.slot .lab { position: absolute; left: 8px; top: 3px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: .8; }
.slot.target { border-color: var(--gold); background: #f2b63a22; } .slot.bad { animation: shake .3s; border-color: var(--red); } @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.slot .hc { width: 100%; height: 100%; box-shadow: none; }
.accwrap { display: flex; flex-direction: column; gap: 8px; }
.accwrap .slot { flex: none; height: 150px; }
.totals { border-radius: 12px; background: #00000055; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
.totals .im { font-size: 18px; } .totals .metric { font-size: 14px; color: var(--dim); text-align: center; } .totals .metric b { color: var(--gold); font-size: 22px; }
.reveal { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.rvrow { flex: 1; min-height: 0; display: flex; gap: 6px; }
.rv { flex: 1; min-width: 0; border-radius: 14px; background: #00000050; border: 2px solid #ffffff25; padding: 6px; display: flex; flex-direction: column; gap: 4px; animation: pop .5s backwards; }
.rv.me { border-color: var(--gold); } .rv.win { background: linear-gradient(#f2b63a40, #00000050); border-color: var(--gold); box-shadow: 0 0 24px #f2b63a66; }
@keyframes pop { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.rv h4 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; font-family: var(--serif); font-size: 18px; color: #fff1cc; } .rv h4 em { font-style: normal; font-size: 26px; color: var(--gold); }
.mini { border-radius: 8px; border: 3px solid var(--t); background: linear-gradient(170deg, #fff8e4, #ecdcae); color: var(--ink); padding: 2px 4px; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; line-height: 1.05; }
.mini b { font-size: 11px; } .mini .vals { display: flex; gap: 4px; font-size: 12px; font-weight: 900; } .mini .vals span.neg { color: #c0262d; }
.mini.none { background: #ffffff0e; border: 2px dashed #ffffff25; color: var(--dim); font-size: 11px; text-align: center; align-items: center; }
.rv .tot { display: flex; gap: 3px; flex-wrap: wrap; } .rv .tot .ichip { font-size: 12px; background: var(--c); color: #fff; } .rv .tot .ichip.zero { opacity: .35; }
.rv .fx { font-size: 11px; color: var(--gold); font-weight: 800; min-height: 14px; } .rv .parts { font-size: 11px; color: #e6f3ee; line-height: 1.25; } .rv .parts span { color: var(--gold); font-weight: 900; }
.final { display: flex; flex-direction: column; gap: 6px; }
.final .row2 { display: flex; align-items: center; gap: 10px; background: #00000050; border-radius: 12px; padding: 8px 12px; border: 2px solid #ffffff25; } .final .row2.win { border-color: var(--gold); background: #f2b63a33; }
.final .row2 b { width: 120px; font-family: var(--serif); font-size: 22px; color: #fff1cc; } .final .row2 span { flex: 1; font-size: 15px; color: var(--dim); } .final .row2 em { font-style: normal; font-size: 32px; font-weight: 900; color: var(--gold); font-family: var(--serif); }
.dbgpanel { position: absolute; right: 168px; bottom: 206px; width: 330px; max-height: 190px; overflow: auto; z-index: 18; background: #000c; border-radius: 10px; padding: 6px 8px; font-size: 11px; line-height: 1.3; color: #ffd; pointer-events: none; }
textarea.log { width: 100%; height: 320px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
.toast { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70; background: var(--gold); color: var(--ink); padding: 10px 18px; border-radius: 22px; font-weight: 800; font-size: 17px; pointer-events: none; max-width: 90%; text-align: center; }
.ghost { position: fixed; z-index: 90; pointer-events: none; opacity: .92; transform: rotate(-3deg) scale(1.04); box-shadow: 0 16px 24px #0009; }
.sheetwide { width: min(900px, 100%); }
@media (max-width: 520px) { .btn.gold { font-size: 21px; min-height: 60px; } }
.sheet-bg { position: absolute; inset: 0; z-index: 80; background: #000a; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(760px, 100%); max-height: 94%; background: linear-gradient(#17595a, #0f3a3c); border: 2px solid var(--gold-d); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 14px 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.sheet h3 { font-size: 24px; color: #fff1cc; } .sheet.full { height: 92%; }
.howto h3 { margin-top: 6px; } .howto p, .howto li { font-size: 17px; line-height: 1.4; color: #e6f3ee; } .howto ul { margin: 4px 0; padding-left: 22px; }
.say { width: 100%; text-align: center; font-size: 17px; color: #fff1cc; background: #00000050; border-radius: 12px; padding: 7px 10px; line-height: 1.25; }
.stagehost { position: absolute; inset: 0; overflow: hidden; }

/* v3: art cards, two invites, figure board, gallery */
.hc { gap: 5px; padding: 4px 5px 5px; }
.hc .imps { width: 52px; gap: 4px; }
.hc .info { gap: 3px; }
.hc .artbox { flex: 1; min-height: 0; border-radius: 8px; overflow: hidden; background: #fff6dc; border: 2px solid #00000022; display: flex; align-items: center; justify-content: center; }
.hc .artbox svg { width: 100%; height: 100%; display: block; }
.hc .nm { font-size: 15px; line-height: 1.05; }
.hc .ab { font-size: 12px; line-height: 1.12; }
.hc.sel { transform: translateY(-8px); box-shadow: 0 0 0 4px #fff, 0 10px 0 #0006; }
.topbar { gap: 6px; }
.invitecard { padding: 4px 9px; gap: 1px; min-width: 0; }
.invitecard h2 { font-size: 19px; line-height: 1.05; display: block; }
.invitecard h2 small { display: block; font-size: 10px; letter-spacing: 1.5px; }
.invitecard .pay { font-size: 12px; line-height: 1.12; font-weight: 700; }

  function pickChoices(ab) {
    if (!ab || !ab.pick) return [null];
