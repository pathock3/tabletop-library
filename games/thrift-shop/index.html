<html lang="en">

<style>
:root { --ink: #0f2a2b; --wine: #1c5558; --wine-d: #0f3a3c; --gold: #f2b63a; --gold-d: #a9741a; --paper: #f3e6c4; --paper-d: #d8c595; --steel: #2a2e38; --text: #f6ecd8; --dim: #c9b79a; --green: #5fb36b; --red: #e0585a;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; width: 100%; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; color: var(--text); font-family: var(--sans); touch-action: manipulation; background: var(--ink); }
body::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 100% 60% at 50% 0%, #2d8a85 0%, #17595a 45%, #0f2a2b 80%); }
#app { position: absolute; inset: 0; z-index: 1; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--serif); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.btn { min-height: 56px; padding: 0 22px; border-radius: 14px; font-size: 20px; font-weight: 800; background: linear-gradient(#ffffff22, #ffffff08), #1f6d70; border: 2px solid #ffffff3a; box-shadow: 0 5px 0 #0008; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0008; }
.btn.gold { background: linear-gradient(#ffe6a0, #f2b63a 55%, #d19320); color: var(--ink); border: 0; box-shadow: 0 6px 0 #7a5410, 0 12px 22px #0008; font-size: 24px; min-height: 66px; }
.btn.gold:active { transform: translateY(5px); box-shadow: 0 1px 0 #7a5410; }
.btn.alt { background: #ffffff14; }
.btn.sm { min-height: 48px; font-size: 17px; padding: 0 16px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chip { min-height: 48px; padding: 0 16px; border-radius: 24px; font-size: 17px; font-weight: 700; background: #ffffff14; border: 2px solid #ffffff30; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.chip.on { background: linear-gradient(#ffe6a0, #f2b63a); color: var(--ink); border-color: #fff3; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.libback { position: absolute; z-index: 3; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); padding: 10px 16px; border-radius: 22px; background: #0008; border: 2px solid var(--gold-d); font-weight: 700; font-size: 16px; text-decoration: none; min-height: 44px; display: flex; align-items: center; }

/* menu */
.menu { justify-content: flex-start; padding-top: max(60px, env(safe-area-inset-top)); }
.crest { width: min(380px, 66vw); flex: none; filter: drop-shadow(0 10px 18px #000a); }
.menu h1 { font-size: clamp(40px, 9vw, 74px); letter-spacing: 3px; line-height: 1; text-align: center; color: #fff1cc; text-shadow: 0 3px 0 var(--wine-d), 0 0 24px #f2b63a66; text-transform: uppercase; }
.menu .sub { font-size: clamp(16px, 3vw, 22px); color: var(--dim); text-align: center; max-width: 560px; }
.menu .stack { display: flex; flex-direction: column; gap: 14px; width: min(460px, 92vw); margin-top: 8px; }
.credit { font-size: 13px; color: var(--dim); text-align: center; opacity: .8; margin-top: auto; }

/* setup / lab */
.panel { width: min(760px, 100%); background: #00000040; border: 2px solid #ffffff22; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { font-size: 22px; color: #fff1cc; }
.panel .hint { font-size: 15px; color: var(--dim); line-height: 1.35; }
.scroll { flex: 1; min-height: 0; width: min(760px, 100%); overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; touch-action: pan-y; }
.top { width: min(760px, 100%); display: flex; align-items: center; gap: 10px; min-height: 48px; }
.top h2 { flex: 1; font-size: 26px; color: #fff1cc; }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid #ffffff18; }
.ctl label { font-size: 16px; flex: 1; line-height: 1.25; }
.ctl.chg label { color: var(--gold); }
.step { display: flex; align-items: center; gap: 6px; }
.step b { min-width: 44px; text-align: center; font-size: 24px; font-family: var(--serif); }
.step button { width: 48px; height: 48px; border-radius: 12px; background: #ffffff1a; border: 2px solid #ffffff30; font-size: 26px; font-weight: 800; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.wrapchips .chip { min-height: 44px; font-size: 15px; padding: 0 12px; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 16px; }
table.cmp td, table.cmp th { padding: 7px 6px; border-top: 1px solid #ffffff18; text-align: right; }
table.cmp td:first-child, table.cmp th:first-child { text-align: left; }
table.cmp td.d { font-size: 13px; color: var(--gold); }
.bar { height: 10px; border-radius: 5px; background: #ffffff20; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--gold); }
input[type=text], textarea { width: 100%; border-radius: 12px; border: 2px solid #ffffff30; background: #00000050; color: var(--text); padding: 10px 12px; font: inherit; font-size: 17px; user-select: text; -webkit-user-select: text; }


/* game stage: a fixed 1180 x 820 table scaled to fit the screen */
#stage { position: absolute; left: 50%; top: 50%; width: 1180px; height: 820px; transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 8px; }
#stage > .topbar, #stage > .handwrap { flex: none; }
.rotate { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 60; background: var(--gold); color: var(--ink); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.topbar { height: 106px; display: flex; gap: 8px; align-items: stretch; }
.menubtn { width: 56px; border-radius: 14px; background: #0008; border: 2px solid var(--gold-d); font-size: 28px; flex: none; }
.invitecard { flex: 1; min-width: 0; border-radius: 14px; background: linear-gradient(170deg, #fff8e4, #ecdcae); color: var(--ink); border: 3px solid var(--gold-d); padding: 5px 12px; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.invitecard h2 { font-size: 26px; line-height: 1.05; display: flex; align-items: baseline; gap: 10px; }
.invitecard h2 small { font-family: var(--sans); font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #7a5410; }
.invitecard .story { font-size: 14px; font-style: italic; line-height: 1.15; color: #4b3a14; }
.invitecard .pay { font-size: 14px; font-weight: 700; line-height: 1.15; }
.impchips { display: flex; gap: 4px; flex-wrap: wrap; }
.ichip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 900; padding: 1px 7px; border-radius: 10px; background: #0001; color: #7b6b3a; }
.ichip.on { background: var(--c); color: #fff; } .ichip.minus { background: #fff; color: var(--c); outline: 2px solid var(--c); outline-offset: -2px; }
.roundbox, .timerbox { width: 108px; border-radius: 14px; background: #00000055; border: 2px solid #ffffff25; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; flex: none; }
.roundbox small, .timerbox small { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
.roundbox b { font-family: var(--serif); font-size: 32px; color: #fff1cc; }
.timerbox { width: 130px; flex-direction: row; gap: 8px; } .timerbox b { font-family: var(--serif); font-size: 42px; color: #fff1cc; font-variant-numeric: tabular-nums; } .timerbox.low b { color: var(--red); animation: blink .5s infinite alternate; }
@keyframes blink { to { opacity: .45; } }
.board { width: 236px; border-radius: 14px; background: #00000055; border: 2px solid #ffffff25; padding: 4px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-content: center; font-size: 13px; flex: none; }
.board div { display: flex; justify-content: space-between; gap: 4px; line-height: 1.35; } .board b { color: var(--gold); } .board .me { color: #fff1cc; font-weight: 800; }
.mess { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(var(--cols, 15), 1fr); grid-template-rows: repeat(10, 1fr); gap: 2px; position: relative; touch-action: none; }
.tile { border-radius: 6px; position: relative; overflow: hidden; min-width: 0; min-height: 0; touch-action: none; }
.tile.empty { background: #00000030; border: 1px dashed #ffffff14; }
.tile.down { background: repeating-linear-gradient(45deg, #1d6f72, #1d6f72 5px, #2a8a8c 5px, #2a8a8c 10px); border: 2px solid #0a2a2b; box-shadow: inset 0 0 0 1px #ffffff30; }
.tile.down::after { content: "🧥"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; opacity: .55; }
.tile.up { background: linear-gradient(170deg, #fff8e4, #ecdcae); border: 2px solid var(--c); color: var(--ink); padding: 1px 3px; display: flex; flex-direction: column; justify-content: space-between; }
.tile.up b { font-size: 10px; line-height: 1.03; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .vals { display: flex; gap: 3px; flex-wrap: nowrap; font-size: 11px; font-weight: 900; line-height: 1; }
.tile .vals span { color: var(--c2); } .tile .vals span.neg { color: #c0262d; }
.tile.dbg { opacity: .8; } .tile.dbg::after { display: none; }
.tile.flash { animation: flashring 1.1s; } @keyframes flashring { 0% { box-shadow: 0 0 0 4px #fff, 0 0 14px 6px var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }
.tile.gone { animation: flipout .36s forwards; } @keyframes flipout { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg) scale(1.1); background: #fff8e4; } 100% { transform: scale(.2) translateY(160px); opacity: 0; } }
.tile.landed { animation: landin .35s; } @keyframes landin { from { transform: scale(1.5) rotate(-8deg); opacity: .3; } }
.handwrap { height: 196px; display: flex; gap: 8px; }
.handrow { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.hc { position: relative; border-radius: 12px; background: linear-gradient(170deg, #fff8e4, #ecdcae); color: var(--ink); border: 4px solid var(--t); padding: 5px 6px 6px; display: flex; gap: 6px; min-width: 0; touch-action: none; box-shadow: 0 3px 0 #0006; }
.hc.sel { transform: translateY(-8px); box-shadow: 0 0 0 3px #fff, 0 10px 0 #0006; }
.hc.arrive { animation: arrive .4s; } @keyframes arrive { from { transform: translateY(60px) scale(.8); opacity: 0; } }
.hc.dragging { opacity: .25; } .hc.dropbefore { box-shadow: -8px 0 0 -2px var(--gold); } .hc.dropafter { box-shadow: 8px 0 0 -2px var(--gold); }
.hc.slotcard { cursor: default; }
.hc.played::after { content: "ON"; position: absolute; right: 6px; top: 4px; background: var(--ink); color: var(--gold); font-weight: 900; font-size: 11px; padding: 0 6px; border-radius: 8px; }
.hc.empty { background: #ffffff0e; border: 3px dashed #ffffff25; box-shadow: none; }
.hc .imps { display: flex; flex-direction: column; gap: 4px; width: 56px; flex: none; justify-content: flex-start; }
.im { display: flex; align-items: center; justify-content: space-between; gap: 2px; background: var(--c); color: #fff; border-radius: 8px; padding: 1px 6px; font-size: 17px; font-weight: 900; line-height: 1.3; }
.im b.neg { color: #ffd0d0; background: #a3151d; border-radius: 5px; padding: 0 3px; }
.im i { font-style: normal; font-size: 14px; }
.hc .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hc .nm { font-family: var(--serif); font-size: 18px; line-height: 1.05; overflow-wrap: anywhere; }
.hc .ty { font-style: normal; font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: #6b5a2a; }
.hc .pr { display: flex; flex-wrap: wrap; gap: 3px; } .hc .pr span { font-size: 12px; font-weight: 800; background: #00000018; border-radius: 6px; padding: 0 5px; }
.hc .ab { font-size: 14px; font-weight: 700; line-height: 1.15; color: #7a2a1a; }
.handside { width: 150px; flex: none; border-radius: 14px; background: #00000055; border: 2px solid #ffffff25; padding: 8px; display: flex; flex-direction: column; gap: 8px; justify-content: center; text-align: center; }
.handside b { font-family: var(--serif); font-size: 26px; color: #fff1cc; } .handside small { color: var(--dim); font-size: 12px; font-weight: 700; }
.handside .btn { min-height: 52px; font-size: 18px; }
.hint { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); z-index: 20; background: var(--gold); color: var(--ink); border-radius: 22px; padding: 10px 20px; font-weight: 900; font-size: 20px; pointer-events: none; }
.invitepanel { position: absolute; inset: 0; z-index: 15; background: #0f2a2bf0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; }
.invitepanel h1 { font-size: 54px; color: #fff1cc; } .invitepanel .story { font-size: 22px; font-style: italic; color: #f0e3c8; max-width: 760px; } .invitepanel .pay { font-size: 22px; font-weight: 800; color: var(--gold); max-width: 760px; }
.invitepanel .impchips .ichip { font-size: 18px; padding: 3px 14px; }
.preview { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 25; width: 360px; height: 190px; pointer-events: none; }
.preview .hc { height: 100%; font-size: 130%; }
.build { flex: 1; min-height: 0; display: flex; gap: 10px; }
.build .handrow { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); flex: none; width: 520px; gap: 6px; }
.figure { flex: 1; border-radius: 16px; background: #00000040; border: 2px solid #ffffff22; display: grid; grid-template-columns: 1fr 190px; gap: 10px; padding: 10px; }
.fig { display: flex; flex-direction: column; gap: 6px; }
.slot { flex: 1; border-radius: 12px; border: 3px dashed #ffffff40; background: #ffffff0d; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--dim); font-weight: 800; font-size: 15px; position: relative; min-height: 0; }
.slot .bare { display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 14px; } .slot .bare i { font-style: normal; font-size: 36px; }
.slot .lab { position: absolute; left: 8px; top: 3px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: .8; }
.slot.target { border-color: var(--gold); background: #f2b63a22; } .slot.bad { animation: shake .3s; border-color: var(--red); } @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.slot .hc { width: 100%; height: 100%; box-shadow: none; }
.accwrap { display: flex; flex-direction: column; gap: 8px; }
.accwrap .slot { flex: none; height: 150px; }
.totals { border-radius: 12px; background: #00000055; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
.totals .im { font-size: 18px; } .totals .metric { font-size: 14px; color: var(--dim); text-align: center; } .totals .metric b { color: var(--gold); font-size: 22px; }
.reveal { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.rvrow { flex: 1; min-height: 0; display: flex; gap: 6px; }
.rv { flex: 1; min-width: 0; border-radius: 14px; background: #00000050; border: 2px solid #ffffff25; padding: 6px; display: flex; flex-direction: column; gap: 4px; animation: pop .5s backwards; }
.rv.me { border-color: var(--gold); } .rv.win { background: linear-gradient(#f2b63a40, #00000050); border-color: var(--gold); box-shadow: 0 0 24px #f2b63a66; }
@keyframes pop { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.rv h4 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; font-family: var(--serif); font-size: 18px; color: #fff1cc; } .rv h4 em { font-style: normal; font-size: 26px; color: var(--gold); }
.mini { border-radius: 8px; border: 3px solid var(--t); background: linear-gradient(170deg, #fff8e4, #ecdcae); color: var(--ink); padding: 2px 4px; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; line-height: 1.05; }
.mini b { font-size: 11px; } .mini .vals { display: flex; gap: 4px; font-size: 12px; font-weight: 900; } .mini .vals span.neg { color: #c0262d; }
.mini.none { background: #ffffff0e; border: 2px dashed #ffffff25; color: var(--dim); font-size: 11px; text-align: center; align-items: center; }
.rv .tot { display: flex; gap: 3px; flex-wrap: wrap; } .rv .tot .ichip { font-size: 12px; background: var(--c); color: #fff; } .rv .tot .ichip.zero { opacity: .35; }
.rv .fx { font-size: 11px; color: var(--gold); font-weight: 800; min-height: 14px; } .rv .parts { font-size: 11px; color: #e6f3ee; line-height: 1.25; } .rv .parts span { color: var(--gold); font-weight: 900; }
.final { display: flex; flex-direction: column; gap: 6px; }
.final .row2 { display: flex; align-items: center; gap: 10px; background: #00000050; border-radius: 12px; padding: 8px 12px; border: 2px solid #ffffff25; } .final .row2.win { border-color: var(--gold); background: #f2b63a33; }
.final .row2 b { width: 120px; font-family: var(--serif); font-size: 22px; color: #fff1cc; } .final .row2 span { flex: 1; font-size: 15px; color: var(--dim); } .final .row2 em { font-style: normal; font-size: 32px; font-weight: 900; color: var(--gold); font-family: var(--serif); }
.dbgpanel { position: absolute; right: 168px; bottom: 206px; width: 330px; max-height: 190px; overflow: auto; z-index: 18; background: #000c; border-radius: 10px; padding: 6px 8px; font-size: 11px; line-height: 1.3; color: #ffd; pointer-events: none; }
textarea.log { width: 100%; height: 320px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
.toast { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70; background: var(--gold); color: var(--ink); padding: 10px 18px; border-radius: 22px; font-weight: 800; font-size: 17px; pointer-events: none; max-width: 90%; text-align: center; }
.ghost { position: fixed; z-index: 90; pointer-events: none; opacity: .92; transform: rotate(-3deg) scale(1.04); box-shadow: 0 16px 24px #0009; }
.sheetwide { width: min(900px, 100%); }
@media (max-width: 520px) { .btn.gold { font-size: 21px; min-height: 60px; } }
.sheet-bg { position: absolute; inset: 0; z-index: 80; background: #000a; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(760px, 100%); max-height: 94%; background: linear-gradient(#17595a, #0f3a3c); border: 2px solid var(--gold-d); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 14px 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.sheet h3 { font-size: 24px; color: #fff1cc; } .sheet.full { height: 92%; }
.howto h3 { margin-top: 6px; } .howto p, .howto li { font-size: 17px; line-height: 1.4; color: #e6f3ee; } .howto ul { margin: 4px 0; padding-left: 22px; }
.say { width: 100%; text-align: center; font-size: 17px; color: #fff1cc; background: #00000050; border-radius: 12px; padding: 7px 10px; line-height: 1.25; }
.stagehost { position: absolute; inset: 0; overflow: hidden; }

/* v3: art cards, two invites, figure board, gallery */
.hc { gap: 5px; padding: 4px 5px 5px; }
.hc .imps { width: 52px; gap: 4px; }
.hc .info { gap: 3px; }
.hc .artbox { flex: 1; min-height: 0; border-radius: 8px; overflow: hidden; background: #fff6dc; border: 2px solid #00000022; display: flex; align-items: center; justify-content: center; }
.hc .artbox svg { width: 100%; height: 100%; display: block; }
.hc .nm { font-size: 15px; line-height: 1.05; }
.hc .ab { font-size: 12px; line-height: 1.12; }
.hc.sel { transform: translateY(-8px); box-shadow: 0 0 0 4px #fff, 0 10px 0 #0006; }
.topbar { gap: 6px; }
.invitecard { padding: 4px 9px; gap: 1px; min-width: 0; }
.invitecard h2 { font-size: 19px; line-height: 1.05; display: block; }
.invitecard h2 small { display: block; font-size: 10px; letter-spacing: 1.5px; }
.invitecard .pay { font-size: 12px; line-height: 1.12; font-weight: 700; }
.invitecard .ichip { font-size: 11px; padding: 0 6px; }
.timerbox { width: 118px; flex-direction: column; gap: 0; } .timerbox .rd { font-size: 12px; font-weight: 800; color: var(--dim); letter-spacing: .5px; }

// Thrift Shop rules: pure, no DOM, no clock. State is plain JSON changed in place by apply(); the RNG state lives in it.
// The UI (or a simulator) decides when the thrifting time is up by calling { type: 'endThrift' }.
const Engine = (() => {
  const D = GAME_DATA, SH = SHEET, CARDS = SH.cards;
  const IMPS = D.impressions.map(i => i.id), SLOTS = D.slots.map(s => s.id), ACC = SLOTS[SLOTS.length - 1], CLOTHING = SLOTS.slice(0, -1);
  const clone = o => JSON.parse(JSON.stringify(o));
  const rnd = s => { s.rng = (s.rng + 0x6D2B79F5) | 0; let t = s.rng; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  const clamp = (v, [lo, hi]) => Math.max(lo, Math.min(hi, v));
  const cardOf = i => CARDS[i];
  const ordinal = n => ['1st', '2nd', '3rd'][n] || (n + 1) + 'th';

  function cleanSettings(o) {
    const s = Object.assign(clone(D.settings), o || {});
    for (const k of Object.keys(D.limits)) s[k] = clamp(Math.round(+s[k] || D.settings[k]), D.limits[k]);
    s.rounds = Math.min(s.rounds, Math.floor(SH.invites.length / D.invitesPerRound));
    s.startHand = Math.min(s.startHand, s.handLimit);
    if (!D.botSpeeds[s.botSpeed]) s.botSpeed = D.settings.botSpeed;
    s.debug = !!s.debug; return s;
  }

  function newGame(opts = {}) {
    const o = Object.assign({ seed: (Math.random() * 2 ** 31) | 0, humans: [0], settings: {} }, opts);
    const cfg = cleanSettings(o.settings), n = cfg.bots + 1;
    const s = { v: 3, cfg, rng: o.seed | 0, n, round: 0, phase: 'invite', cells: [], invites: [], players: [], results: null, roundLog: [], ready: [] };
    for (let i = 0; i < n; i++) s.players.push({ name: i === 0 && o.humans.includes(0) ? 'You' : D.names[(i - 1) % D.names.length], human: o.humans.includes(i), hand: [], board: Object.fromEntries(SLOTS.map(k => [k, null])), wand: null, done: false, likes: [], mem: {} });
    // the whole thrift deck laid out in a grid, face down; the dealt hands leave empty spaces
    const deck = shuffle(s, CARDS.map((_, i) => i)); s.cells = deck.map(c => ({ c }));
    const spots = shuffle(s, s.cells.map((_, i) => i)); let k = 0;
    for (const p of s.players) for (let j = 0; j < cfg.startHand; j++) { const cell = spots[k++]; p.hand.push(s.cells[cell].c); s.cells[cell] = null; }
    s.invites = shuffle(s, SH.invites.map((_, i) => i)).slice(0, cfg.rounds * D.invitesPerRound);
    startRound(s); return s;
  }
  function startRound(s) {
    s.round++; s.phase = 'invite'; s.results = null; s.ready = [];
    for (const p of s.players) { p.done = false; p.wand = null; p.mem = {}; for (const k of SLOTS) p.board[k] = null; }
  }
  // The two invites of the round: [A, B].
  const invitesOf = s => Array.from({ length: D.invitesPerRound }, (_, k) => SH.invites[s.invites[(s.round - 1) * D.invitesPerRound + k]]);
  const inviteNames = s => invitesOf(s).map(i => i.name);
  const handFull = (s, p) => p.hand.length >= s.cfg.handLimit;
  const filled = p => SLOTS.filter(k => p.board[k] != null).length;

  // ---------------- scoring ----------------
  const metricImps = m => typeof m === 'string' ? [m] : Object.values(m)[0];
  const asList = x => Array.isArray(x) ? x : x ? [x] : [];
  // The Impressions the invites' rules name, in order (invite A first, then B): used for Golden Trophy ties.
  function inviteImpOrder(names) { const out = []; for (const nm of asList(names)) for (const b of SH.scoring[nm] || []) for (const x of metricImps(b.metric)) if (!out.includes(x)) out.push(x); return out; }
  function metricValue(m, t) {
    if (typeof m === 'string') return t[m];
    if (m.sum) return m.sum.reduce((a, x) => a + t[x], 0);
    if (m.diff) return t[m.diff[0]] - t[m.diff[1]];
    return Math.min(...m.min.map(x => t[x]));
  }
  // The Impression a Magic Wand feeds by default: the first one the invites reward (invite A, then B), not Spooky if possible.
  function defaultWand(names) {
    const list = asList(names); const rewarded = [];
    for (const nm of list) { const inv = SH.invites.find(i => i.name === nm); if (inv) rewarded.push(...inv.rewards); }

  }
  // Clothing first, then the accessory. `names` = the round's invite names (for Golden Trophy ties and the Wand default).
  function impressionTotals(board, wand, names) {
    const t = Object.fromEntries(IMPS.map(i => [i, 0])); let effect = '';
    const clothes = CLOTHING.map(k => board[k]).filter(c => c != null).map(cardOf);
    for (const c of clothes) IMPS.forEach((imp, i) => { t[imp] += c.v[i]; });
    const acc = board[ACC] != null ? cardOf(board[ACC]) : null;
    if (acc && acc.ability) {
      const a = acc.ability;
      if (a.kind === 'perPrint') { const cnt = clothes.filter(c => c.prints.some(p => a.prints.includes(p))).length; t[a.imp] += a.n * cnt; effect = `+${a.n * cnt} ${a.imp}`; }
      else if (a.kind === 'perAnyPrint') { const cnt = clothes.reduce((x, c) => x + c.prints.length, 0); t[a.imp] += a.n * cnt; effect = `+${a.n * cnt} ${a.imp}`; }
      else if (a.kind === 'perEmptySlot') { const cnt = CLOTHING.filter(k => board[k] == null).length; t[a.imp] += a.n * cnt; effect = `+${a.n * cnt} ${a.imp}`; }
      else if (a.kind === 'add') { t[a.to] += t[a.from]; effect = `+${t[a.from]} ${a.to}`; }
      else if (a.kind === 'becomesZero') { effect = t[a.imp] ? `${a.imp} ${t[a.imp]} becomes 0` : `${a.imp} is already 0`; t[a.imp] = 0; }

        const top = Math.max(...IMPS.map(i => t[i]));

        t[target] += t.Spooky; effect = `+${t.Spooky} ${target} (from Spooky)`;
      }
    }

<script id="bots">
// Computer shoppers. Pure decisions (no timers): the UI asks for one action at a time at the pace in the settings.
// A bot sees only its own hand and the two invites. The mess is all face down, so it takes blind (it never sees a face-down card or another hand).
const Bots = (() => {
  const D = GAME_DATA, E = Engine, SH = SHEET, CARDS = SH.cards;
  const SLOTS = E.SLOTS;

  // The best look from a hand for one invite (its first block's metric); `names` are both invites (Golden Trophy ties, Wand default).
  function bestLook(hand, target, maxPlayed, names) {
    const metric = firstMetric(target), wand = E.defaultWand(names || target);

    for (const c of [...new Set(hand)]) byType[CARDS[c].type].push(c);

    const ok = i => JSON.stringify(Art.printsDrawn(i)) === JSON.stringify(CARDS[i].prints.slice().sort());
    const bad = CARDS.map((c, i) => i).filter(i => !ok(i)).length;
    const cells = idxs.map(i => { const c = CARDS[i], good = ok(i); return `<div class="gcell ${good ? '' : 'bad'}"><div class="gart">${ui.onFigure && c.type !== 'Accessory' ? Art.figure({ [c.type]: i }) : ui.onFigure ? Art.figure({ Accessory: i }) : Art.card(i)}</div><b>${esc(c.name)}</b>
      <small>${c.power ? esc(c.power) + ' · ' : ''}${c.type === 'Accessory' ? esc(c.abilityText) : impsOf(c).map(([im, v]) => im.icon + v).join(' ')}</small><small>sheet: ${c.prints.length ? esc(c.prints.join(', ')) : 'no prints'}</small><small>art: ${Art.printsDrawn(i).length ? esc(Art.printsDrawn(i).join(', ')) : 'no prints'} ${good ? '✓' : '✗'}</small></div>`; }).join('');
    return `<div class="screen"><div class="top"><button class="btn sm alt" data-act="${ui.s && ui.screen === 'gallery' && ui.fromGame ? 'backgame' : 'menu'}">‹ Back</button><h2>Art gallery</h2><span style="color:${bad ? '#ff8a8a' : 'var(--gold)'};font-weight:800">${bad ? bad + ' cards disagree with the sheet' : 'All 120 match the sheet ✓'}</span></div>
      <div class="row" style="gap:6px">${['Head', 'Top', 'Bottom', 'Accessory'].map(k => `<button class="chip ${t === k ? 'on' : ''}" data-act="gtype" data-t="${k}">${k}</button>`).join('')}<button class="chip ${ui.onFigure ? 'on' : ''}" data-act="gfig">${ui.onFigure ? 'On the figure' : 'Card art'}</button></div><div class="scroll gallery">${cells}</div></div>`;
  }
  function rulesViewHTML() {
    const rows = SH.invites.map(v => `<div class="rrow"><b>${esc(v.name)}</b> <small>${esc(v.shape)}</small><div>${esc(v.payout)}${v.notes ? ' <i>' + esc(v.notes) + '</i>' : ''}</div><code>${esc(JSON.stringify(SH.scoring[v.name]))}</code></div>`).join('');
    return `<div class="screen"><div class="top"><button class="btn sm alt" data-act="menu">‹ Back</button><h2>Invite rules (${SH.invites.length})</h2></div><div class="scroll rules">${rows}</div></div>`;
  }
  function howText() {
    const S = ui.settings;
    return `<h3>The goal</h3><p>Win the most <b>Likes</b> over ${S.rounds} rounds. Each round has <b>two Invites</b>; both score for everyone, so your round Likes are A + B. They reward the four Impressions: 👑 Fancy, 🤪 Wacky, 🧸 Cute and 👻 Spooky.</p>
    <h3>Thrift (${S.thriftSecs} seconds, everyone at once)</h3><ul><li>Tap any card in the mess to take it. Every card is face down: you cannot peek.</li>
    <li>Your hand holds ${S.handLimit} cards, and you start every round with a full hand. Tap cards in your hand to select them, then press <b>Put back (N)</b>: they go back into the mess face down.</li><li>Drag cards in your hand to reorder them.</li></ul>
    <h3>Build (no timer)</h3><ul><li>Play up to ${S.maxPlayed} cards: one Head, Top, Bottom and Accessory. Drag a card onto the figure, or tap the card and then the part of the figure. Empty slots are allowed (bald, undershirt, heart boxers, empty hand).</li>
    <li>Clothes add their Impressions. The accessory then adds its bonus. Each Invite turns everyone’s totals into Likes.</li></ul>
    <h3>Reveal</h3><p>Everyone’s look is shown on their figure with the totals, the accessory effect and the Likes from each Invite. Your whole hand carries into the next round; the mess is not reshuffled.</p>
    <h3>Ties</h3><p>Tied players share a place and both get the better payout.</p>`;
  }
  function sheetHTML() {
    const sh = ui.sheet; if (!sh) return '';
    let body = '';
    if (sh.t === 'how') body = `<div class="howto"><h3 style="font-size:28px">How to play Thrift Shop</h3>${howText()}</div><button class="btn gold" data-act="closesheet">Got it</button>`;
    else if (sh.t === 'menu') body = `<h3>Menu</h3><button class="btn" data-act="sheet" data-s="how">How to play</button><button class="btn" data-act="log">Round log</button><div class="ctl" style="border:0"><label>Debug view (show all cards)</label><button class="chip ${ui.settings.debug ? 'on' : ''}" data-act="debug">${ui.settings.debug ? 'On' : 'Off'}</button></div>${ui.settings.debug ? '<button class="btn alt" data-act="gallery">🎨 Art gallery</button><button class="btn alt" data-act="rulesview">📋 Invite rules</button>' : ''}
      <button class="btn ${ui.quit ? 'gold' : ''}" data-act="newgame">${ui.quit ? 'Tap again to abandon this game' : 'New game'}</button><button class="btn" data-act="menu">Main menu</button>${LIB ? `<a class="btn" href="${D.library.href}">‹ Library</a>` : ''}<button class="btn alt" data-act="closesheet">Back to the table</button>`;
    else if (sh.t === 'log') body = `<h3>Round log</h3><textarea class="log" id="logtext" readonly>${esc(ui.s ? E.logText(ui.s) : '')}</textarea><div class="row"><button class="btn gold" data-act="copylog">Copy</button><button class="btn alt" data-act="closesheet">Close</button></div>`;
    else if (sh.t === 'wand') body = `<h3>🪄 Magic Wand</h3><p style="font-size:18px">Add your Spooky to which Impression?</p><div class="row">${D.impressions.filter(i => i.id !== 'Spooky').map(i => `<button class="chip" style="min-height:64px;font-size:22px" data-act="wand" data-imp="${i.id}">${i.icon} ${i.id}</button>`).join('')}</div>`;
    return `<div class="sheet-bg" data-act="bg"><div class="sheet ${sh.t === 'how' ? 'full' : ''} ${sh.t === 'log' ? 'sheetwide' : ''}">${body}</div></div>`;
  }

  // ---------- render ----------
  function fit() { const st = document.getElementById('stage'); const k = Math.min(innerWidth / 1180, innerHeight / 820); if (st) st.style.setProperty('--s', k); }
  function render() {
    let h;
    if (ui.screen === 'menu') h = menuHTML();
    else if (ui.screen === 'settings') h = settingsHTML();
    else if (ui.screen === 'gallery') h = galleryHTML();
    else if (ui.screen === 'rules') h = rulesViewHTML();
    else {
      const s = ui.s, body = s.phase === 'invite' || s.phase === 'thrift' ? thriftHTML() : s.phase === 'build' ? buildHTML() : s.phase === 'reveal' ? revealHTML() : finalHTML();
      const portrait = innerHeight > innerWidth && !ui.rotateOff;
      h = `<div id="stage">${body}</div>${portrait ? '<div class="rotate"><span>Thrift Shop is built for a sideways iPad.</span><button class="btn sm" data-act="rotateoff" style="min-height:40px">Carry on</button></div>' : ''}`;
    }
    h += sheetHTML(); $.innerHTML = h; fit(); if (ui.screen === 'game') { patchDebug(); updateTimer(); }
  }
  function updateTimer() {
    const s = ui.s; if (!s || s.phase !== 'thrift') return; const f = Math.max(0, 1 - ui.elapsed / s.cfg.thriftSecs), left = Math.max(0, Math.ceil(s.cfg.thriftSecs - ui.elapsed));
    const t = document.getElementById('secs'); if (t) t.textContent = left; const box = document.getElementById('timerbox'); if (box) box.classList.toggle('low', left <= 10);
    const top = document.getElementById('sandT'), bot = document.getElementById('sandB'); if (top) { top.setAttribute('y', 4 + (1 - f) * 24); top.setAttribute('height', f * 24); } if (bot) { bot.setAttribute('y', 52 - (1 - f) * 24); bot.setAttribute('height', (1 - f) * 24); }
  }

  // ---------- game flow ----------
  function startGame() { ui.s = E.newGame({ settings: ui.settings }); ui.screen = 'game'; ui.sel = []; ui.sheet = null; ui.paused = false; ui.elapsed = 0; ui.botNext = []; ui.quit = false; ui.last = Date.now(); render(); }
  function beginThrift() {
    const s = ui.s; E.apply(s, { type: 'start', seat: ME }); ui.elapsed = 0; for (let i = 1; i < s.n; i++) B.targetInvite(s, i);
    ui.botNext = s.players.map((p, i) => i === ME ? 0 : Date.now() + B.delaySecs(s.cfg, E.rnd(s)) * 1000); ui.last = Date.now(); render();
  }
  function endThrift() {
    const s = ui.s; if (s.phase !== 'thrift') return; cancelGesture(); ui.sel = []; E.apply(s, { type: 'endThrift' }); B.buildAll(s); ui.sheet = null; ui.paused = false;
    const me = s.players[ME]; if (me.hand.some(c => CARDS[c].ability && CARDS[c].ability.kind === 'wand')) me.wand = E.defaultWand(E.inviteNames(s));
    render();
  }
  function animateTake(i) { const el = document.querySelector(`.tile[data-cell="${i}"]`); if (el) el.classList.add('gone'); setTimeout(() => patchTile(i), 380); }
  function botAct(i) {
    const s = ui.s, a = B.decide(s, i); if (!a) return; const r = E.apply(s, a); if (!r.ok) return;
    if (a.type === 'take') animateTake(a.cell); else if (a.type === 'putBack') r.cells.forEach(c => { patchTile(c, 'landed flash'); setTimeout(() => patchTile(c), 1200); });
    if (ui.settings.debug) patchDebug();
  }
  function tick() {
    const s = ui.s, now = Date.now(), dt = Math.min(500, now - ui.last); ui.last = now;
    if (ui.screen !== 'game' || !s || s.phase !== 'thrift' || ui.paused || ui.sheet) return;
    ui.elapsed += dt / 1000; updateTimer();
    for (let i = 1; i < s.n; i++) if (now >= ui.botNext[i]) { botAct(i); ui.botNext[i] = now + B.delaySecs(s.cfg, E.rnd(s)) * 1000; }
    if (ui.elapsed >= s.cfg.thriftSecs) endThrift();
  }
  setInterval(tick, 100);

  // human moves
  function takeCell(i) {
    const s = ui.s, cell = s.cells[i]; if (!cell || s.phase !== 'thrift' || ui.paused) return;
    if (E.handFull(s, s.players[ME])) { hint('Hand full. Put a card back first.'); return; }
    const r = E.apply(s, { type: 'take', seat: ME, cell: i }); if (!r.ok) return;
    animateTake(i); ui.arrive = r.card; ui.sel = []; patchHand(); if (ui.settings.debug) patchDebug();
  }
  function putBack() {
    const s = ui.s, p = s.players[ME]; if (!ui.sel.length || s.phase !== 'thrift') return; const cards = ui.sel.map(i => p.hand[i]).filter(c => c != null);
    const r = E.apply(s, { type: 'putBack', seat: ME, cards }); ui.sel = []; if (r.ok) r.cells.forEach(c => patchTile(c, 'landed')); patchHand();
  }
  function placeCard(handIdx, slot) {
    const s = ui.s, p = s.players[ME], card = p.hand[handIdx]; if (card == null) return false;
    const r = E.apply(s, { type: 'place', seat: ME, card, slot });
    if (!r.ok) { hint(r.error === 'limit' ? `You can only play ${s.cfg.maxPlayed} cards.` : `That part of the figure takes a ${CARDS[card].type}.`); patchBuild(); const el = document.querySelector(`.zone[data-slot="${slot}"]`); if (el) { el.classList.add('bad'); setTimeout(() => el.classList.remove('bad'), 350); } return false; }
    ui.sel = [];
    if (CARDS[card].ability && CARDS[card].ability.kind === 'wand') { p.wand = p.wand || E.defaultWand(E.inviteNames(s)); ui.sheet = { t: 'wand' }; render(); return true; }
    patchBuild(); return true;
  }

  // ---------- touch: taps and drags (Pointer Events; HTML5 drag-and-drop is unreliable on iPad Safari) ----------
  let g = null, ghost = null;
  function cancelGesture() { if (ghost) { ghost.remove(); ghost = null; } ui.drag = false; g = null; }
  const repatch = () => { if (ui.s.phase === 'build') patchBuild(); else patchHand(); };
  $.addEventListener('pointerdown', e => {
    if (ui.screen !== 'game' || ui.sheet || e.button > 0) return; const s = ui.s;
    if (ui.sel.length && s.phase === 'build' && !e.target.closest('.hc, .zone')) { ui.sel = []; repatch(); }
    const tile = e.target.closest('.tile[data-cell]');
    if (tile && s.phase === 'thrift') { const cell = +tile.dataset.cell; if (!s.cells[cell]) return; g = { kind: 'tile', id: e.pointerId, cell, x0: e.clientX, y0: e.clientY, moved: false }; return; }
    const hc = e.target.closest('.hc[data-hand]');
    if (hc && (s.phase === 'thrift' || s.phase === 'build')) { g = { kind: 'hand', id: e.pointerId, hand: +hc.dataset.hand, el: hc, x0: e.clientX, y0: e.clientY, drag: false, ox: 0, oy: 0 }; try { hc.setPointerCapture(e.pointerId); } catch (err) { /* ok */ } }
  });
  function hitAt(x, y, selfHand) { const els = document.elementsFromPoint(x, y); return { over: els.find(el => el.classList && el.classList.contains('hc') && el.dataset.hand != null && +el.dataset.hand !== selfHand), slot: els.find(el => el.dataset && el.dataset.slot) }; }
  document.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return; const moved = Math.hypot(e.clientX - g.x0, e.clientY - g.y0) > 12;
    if (g.kind === 'tile') { if (moved) g.moved = true; return; }
    if (!g.drag && moved) {
      g.drag = true; ui.drag = true; const r = g.el.getBoundingClientRect(); g.ox = g.x0 - r.left; g.oy = g.y0 - r.top;
      ghost = g.el.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px'; document.body.appendChild(ghost); g.el.classList.add('dragging');
    }
    if (g.drag && ghost) {
      ghost.style.left = (e.clientX - g.ox) + 'px'; ghost.style.top = (e.clientY - g.oy) + 'px';
      document.querySelectorAll('.hc.dropbefore, .hc.dropafter').forEach(x => x.classList.remove('dropbefore', 'dropafter'));
      const { over } = hitAt(e.clientX, e.clientY, g.hand); if (over) over.classList.add(+over.dataset.hand > g.hand ? 'dropafter' : 'dropbefore');
    }
  });
  function endGesture(e, cancel) {
    if (!g || e.pointerId !== g.id) return; const gg = g, s = ui.s; g = null;
    if (gg.kind === 'tile') { if (!cancel && !gg.moved) takeCell(gg.cell); return; }
    if (ghost) { ghost.remove(); ghost = null; } ui.drag = false;
    if (cancel) { repatch(); return; }
    if (gg.drag) {
      const { over, slot } = hitAt(e.clientX, e.clientY, gg.hand);
      if (over) { E.apply(s, { type: 'reorder', seat: ME, from: gg.hand, to: +over.dataset.hand }); ui.sel = []; }
      else if (slot && s.phase === 'build') { ui.sel = []; placeCard(gg.hand, slot.dataset.slot); return; }
      repatch(); return;
    }
    const p = s.players[ME], card = p.hand[gg.hand];   // a tap on a hand card
    if (s.phase === 'build') {
      if (card != null && p.board[CARDS[card].type] === card) { E.apply(s, { type: 'unplace', seat: ME, slot: CARDS[card].type }); ui.sel = []; patchBuild(); return; }
      ui.sel = isSel(gg.hand) ? [] : [gg.hand]; patchBuild(); return;
    }
    ui.sel = isSel(gg.hand) ? ui.sel.filter(i => i !== gg.hand) : ui.sel.concat(gg.hand).sort((a, b) => a - b); patchHand();   // thrifting: taps toggle a multi-selection
  }
  document.addEventListener('pointerup', e => endGesture(e, false));
  document.addEventListener('pointercancel', e => endGesture(e, true));

  // ---------- clicks ----------
  const H = {
    play() { startGame(); }, settings() { ui.screen = 'settings'; render(); }, menu() { ui.screen = 'menu'; ui.sheet = null; ui.paused = false; ui.quit = false; cancelGesture(); render(); },
    num(d) { const [lo, hi] = D.limits[d.k]; ui.settings = E.cleanSettings(Object.assign({}, ui.settings, { [d.k]: Math.max(lo, Math.min(hi, ui.settings[d.k] + (+d.d))) })); saveSettings(); render(); },
    speed(d) { ui.settings.botSpeed = d.k; saveSettings(); render(); },
    debug() { ui.settings.debug = !ui.settings.debug; saveSettings(); render(); },
    resetsettings() { ui.settings = E.cleanSettings({}); saveSettings(); render(); },
    gallery() { ui.fromGame = !!(ui.s && ui.screen === 'game'); ui.sheet = null; ui.screen = 'gallery'; render(); }, rulesview() { ui.sheet = null; ui.screen = 'rules'; render(); },
    gtype(d) { ui.galleryType = d.t; render(); }, gfig() { ui.onFigure = !ui.onFigure; render(); }, backgame() { ui.screen = 'game'; ui.paused = false; ui.last = Date.now(); render(); },
    sheet(d) { ui.sheet = { t: d.s }; ui.paused = true; render(); }, closesheet() { ui.sheet = null; ui.paused = false; ui.last = Date.now(); render(); }, bg() { H.closesheet(); },
    newgame() { if (!ui.quit) { ui.quit = true; return render(); } ui.quit = false; startGame(); },
    begin() { beginThrift(); }, putback() { putBack(); },
    slot(d) {
      const s = ui.s; if (s.phase !== 'build') return; const p = s.players[ME];
      if (ui.sel.length === 1) { placeCard(ui.sel[0], d.slot); return; }
      if (p.board[d.slot] != null) { E.apply(s, { type: 'unplace', seat: ME, slot: d.slot }); patchBuild(); }
    },
    wand(d) { E.apply(ui.s, { type: 'setWand', seat: ME, imp: d.imp }); if (ui.sheet && ui.sheet.t === 'wand') { ui.sheet = null; render(); } else patchBuild(); },
    done() { E.apply(ui.s, { type: 'done', seat: ME }); ui.sel = []; render(); },
    next() { E.apply(ui.s, { type: 'next', seat: ME }); ui.elapsed = 0; ui.sel = []; render(); },
    again() { startGame(); }, log() { ui.sheet = { t: 'log' }; ui.paused = true; render(); },
    copylog() { const ta = document.getElementById('logtext'); if (!ta) return; ta.select(); let ok = false; try { if (navigator.clipboard) { navigator.clipboard.writeText(ta.value); ok = true; } else ok = document.execCommand('copy'); } catch (err) { /* the text stays selected */ } const b = document.querySelector('[data-act=copylog]'); if (b) b.textContent = ok ? 'Copied' : 'Selected: copy it'; },
    rotateoff() { ui.rotateOff = true; render(); },
  };
  $.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.dataset.act === 'bg' && e.target !== el) return;
    const f = H[el.dataset.act]; if (!f) return; if (!['newgame', 'sheet'].includes(el.dataset.act)) ui.quit = false; f(el.dataset, e);
  });
  addEventListener('resize', fit);
  window.__t2 = { ui, E, B, endThrift, takeCell, tick };
  render();
})();
</script>
</body>
