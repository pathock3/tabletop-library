<style>:root { --bg:#14100c; --panel:#2b1d12; --gold:#f2c14e; --text:#f6ead2; --dim:#c9b690; --wood:#5b3a1e; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }

  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif; touch-action: manipulation; }
#app { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 70% at 50% 40%, #24483a 0%, #14281f 60%, #0a1510 100%); }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px); }
/* ---- main menu: two kingdoms facing each other across a hex map ---- */
.home, .cover { justify-content: center; gap: 22px; background:
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='104' height='180'><g fill='none' stroke='%23ffffff' stroke-opacity='.07' stroke-width='2'><path d='M52 2 100 30V86L52 114 4 86V30Z'/><path d='M52 114V150M4 86 -44 114M100 86 148 114'/></g></svg>"),
  linear-gradient(172deg, #a8271c 0%, #5e1712 36%, #141b33 56%, #1f4d9e 100%); }
.hero { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.herosvg { width: min(86vw, 420px); height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
.kicker { font-size: 26px; font-weight: 900; letter-spacing: 10px; color: var(--gold); text-shadow: 0 3px 0 #000; margin-top: 6px; padding-left: 10px; }

.cover h1 { font-size: 64px; }

.menu { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.big { min-width: 300px; max-width: 92%; padding: 14px 28px; min-height: 58px; border-radius: 16px; background: linear-gradient(#7a4e28, #4d2f16); border: 3px solid #e0b052; font-size: 21px; font-weight: 800; color: #fbefd0; box-shadow: 0 5px 0 #20110a, inset 0 2px 0 rgba(255,255,255,.2); text-shadow: 0 2px 0 rgba(0,0,0,.45); }
.big:active { transform: translateY(2px); box-shadow: 0 3px 0 #20110a; }

.big.gold { background: linear-gradient(#ffe08a, #e0a82e); color: #3b230a; text-shadow: none; border-color: #fff1bd; }
.big.go { background: linear-gradient(#e2503a, #a82114); border-color: #ffb09c; font-size: 24px; min-height: 64px; } .big.go.off { opacity: .35; }

.ver { color: rgba(255,255,255,.55); font-size: 12px; margin: 0; }
.libback { position: absolute; z-index: 3; left: calc(env(safe-area-inset-left) + 12px); top: calc(env(safe-area-inset-top) + 8px); display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px; min-height: 44px; border-radius: 99px; background: rgba(20,12,6,.8); border: 2px solid var(--gold); color: var(--text); font-size: 16px; font-weight: 800; text-decoration: none; }

/* ---- the table ---- */

.chip { min-width: 46px; height: 46px; padding: 0 16px; border-radius: 23px; background: linear-gradient(#7a4e28, #4d2f16); border: 2px solid #e0b052; font-size: 17px; font-weight: 800; box-shadow: 0 3px 0 #20110a; }

}

.flagmark { font-size: .6px; text-anchor: middle; pointer-events: none; }
.tok { cursor: pointer; } .tok .body { stroke: #fff; stroke-width: .08; filter: drop-shadow(0 .06px .05px rgba(0,0,0,.7)); } .tok.selu .body { stroke: var(--gold); stroke-width: .18; } .tok.done { opacity: .6; }
.tok.movable .body { stroke: #ffe36e; stroke-width: .14; animation: ring 1s ease-in-out infinite alternate; }
@keyframes ring { to { stroke-width: .03; } }
.tm { font-size: .55px; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; } .bd { fill: #111; stroke: #fff; stroke-width: .04; }
.bn { font-size: .32px; fill: #fff; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

.card.sel { transform: translateY(-10px); outline: 4px solid var(--gold); } .card.dim { opacity: .5; } .card.back { background: repeating-linear-gradient(45deg, #5a3a22, #5a3a22 6px, #3a2414 6px, #3a2414 12px); } .card.empty { background: transparent; border-style: dashed; box-shadow: none; }
.battle { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #3a2616, #140d08 80%); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 16px) 16px 16px; z-index: 10; overflow: hidden; }
.battle h2 { margin: 6px 0 0; color: var(--gold); }
.slots { display: flex; gap: 28px; } .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; } .slot .card { --w: min(46vw, 190px); }

.sheetin { background: linear-gradient(#35230f, #22160b); border: 3px solid #e0b052; border-radius: 22px; padding: 22px; max-width: 560px; max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: left; }
.sheetin h2 { margin: 0; color: var(--gold); } .sheetin p { margin: 0; font-size: 16px; line-height: 1.4; }
/* ---- turning over a castle: is the flag here? ---- */

.revtxt.bot { text-align: center; opacity: 0; animation: fadein .5s 2.1s forwards; } .revtxt .res { font-size: 34px; font-weight: 900; color: var(--gold); } .revtxt small { color: var(--dim); font-size: 15px; }
.flipper { position: relative; width: 230px; height: 290px; perspective: 900px; transform-style: preserve-3d; animation: shake .5s .5s 2, flip 1.1s 1.2s forwards cubic-bezier(.3,1.4,.5,1); }
.face { position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 6px solid #e0b052; box-shadow: 0 14px 30px rgba(0,0,0,.7); }
.face.front { background: linear-gradient(#cdbf99, #8d8061); } .face.front svg { width: 80%; } .face.front .q { position: absolute; bottom: 14px; font-size: 56px; font-weight: 900; color: #2f2418; opacity: .8; }
.face.back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 40%, #fff6cf, #e9c35c); color: #3b230a; gap: 6px; } .no .face.back { background: linear-gradient(#cfd3d8, #8f969e); } .face.back b { font-size: 32px; } .flagbig { font-size: 110px; line-height: 1; }

@keyframes flip { to { transform: rotateY(180deg); } } @keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } } @keyframes fadein { to { opacity: 1; } }

.pick { background: radial-gradient(ellipse at 50% 0, #3a2616, #140d08 80%); justify-content: flex-start; }
.pick .topbar { margin-bottom: 0; }
.picktitle { margin: 0 0 6px; font-size: 30px; text-shadow: 0 2px 0 #000; text-align: center; }
.pickscroll { flex: 1; min-height: 0; width: 100%; max-width: 820px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 4px 24px; }

.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.ftile { text-align: left; padding: 12px 14px; min-height: 84px; border-radius: 14px; background: linear-gradient(#3a2814, #26180b); border: 3px solid var(--fc); box-shadow: 0 4px 0 #000; display: flex; flex-direction: column; gap: 2px; }
.ftile b { font-size: 19px; } .ftile small { color: var(--dim); font-size: 13px; } .ftile i { font-style: normal; font-size: 12px; color: #d8c49a; }

.fnote { text-align: center; color: var(--dim); font-size: 13px; }
/* ---- a card ---- */
.hand { container-type: inline-size; width: 100%; --cw: 148px; }
.card { --w: var(--cw, 148px); width: var(--w); aspect-ratio: 5 / 7; flex: none; border-radius: 10px; background: linear-gradient(#fbf1d8, #e8d4a6); color: #2b1d12; border: 4px solid var(--cc, #7c5a38); display: flex; flex-direction: column; align-items: stretch; padding: calc(var(--w) * 0.035) calc(var(--w) * 0.04) calc(var(--w) * 0.04); box-shadow: 0 3px 0 #000; text-align: center; overflow: hidden; }
.hand .card { --w: clamp(92px, calc(100cqw / var(--n, 4) - 8px), 150px); }
.card.small { --w: 104px; } .asidehand .card { --w: 80px; }
.ctop { display: flex; align-items: flex-start; justify-content: space-between; gap: calc(var(--w) * 0.01); }
.cside { flex: 0 0 calc(var(--w) * 0.29); min-height: calc(var(--w) * 0.17); border: .calc(var(--w) * 0.06) solid #8a6c3c; border-radius: calc(var(--w) * 0.018); padding: .calc(var(--w) * 0.08) 0 .calc(var(--w) * 0.06); background: rgba(255,255,255,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; }

.cside.weak { border-color: #9a2a1a; color: #7a1d12; } .cside.strong { border-color: #1d6a34; color: #14502a; }
.cpow { font-size: calc(var(--w) * 0.25); font-weight: 900; line-height: 1; padding-top: calc(var(--w) * 0.01); position: relative; } .cpow sup { position: absolute; top: calc(var(--w) * 0.015); right: calc(var(--w) * -0.09); font-size: calc(var(--w) * 0.07); color: #9a6a00; }
.cname { font-size: calc(var(--w) * 0.105); font-weight: 900; line-height: 1.05; margin-top: calc(var(--w) * 0.02); } .cname.x1 { font-size: calc(var(--w) * 0.086); } .cname.x2 { font-size: calc(var(--w) * 0.072); }
.crole { font-size: calc(var(--w) * 0.056); font-weight: 800; color: #6b5a3a; text-transform: uppercase; letter-spacing: .06em; }
.cab { flex: 1; min-height: 0; margin-top: calc(var(--w) * 0.024); padding-top: calc(var(--w) * 0.02); border-top: .calc(var(--w) * 0.05) solid rgba(107,90,58,.45); font-size: calc(var(--w) * 0.074); line-height: 1.17; font-weight: 600; display: flex; flex-direction: column; justify-content: flex-start; gap: calc(var(--w) * 0.01); text-align: left; }
.cab b { font-weight: 900; } .cab.a1 { font-size: calc(var(--w) * 0.064); } .cab.a2 { font-size: calc(var(--w) * 0.054); line-height: 1.12; }
.card.sel { transform: translateY(-10px); outline: 4px solid var(--gold); } .card.dim { opacity: .55; } .card.back { background: repeating-linear-gradient(45deg, #5a3a22, #5a3a22 6px, #3a2414 6px, #3a2414 12px); } .card.empty { background: transparent; border-style: dashed; box-shadow: none; }

@media (max-height: 560px) { .status { font-size: 15px; } .herosvg, .kicker { display: none; } h1 { font-size: 64px; margin: 0; } .home { gap: 10px; } .big { min-height: 48px; padding: 8px 24px; } }

/* ---- v2: abilities, faction cards, clashes and results ---- */
.fwrap { display: flex; flex-direction: column; gap: 6px; } .fview { min-height: 44px; border-radius: 10px; border: 2px solid #e0b052; background: rgba(0,0,0,.3); color: #f3dfae; font-weight: 800; font-size: 14px; padding: 0 10px; }
.sheet.wide { overflow: auto; } .sheetin.wide { width: min(1040px, 100%); max-width: 1040px; max-height: 94%; }
.refgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 196px), 1fr)); gap: 12px; width: 100%; justify-items: center; } .refcard { display: flex; flex-direction: column; align-items: center; gap: 4px; } .refcard small { color: var(--dim); font-size: 13px; }
.refgrid .card { --w: min(44vw, 190px); }
.urow { width: 100%; text-align: left; border-bottom: 1px solid rgba(255,255,255,.14); padding: 8px 0; font-size: 17px; } .hand.mini { justify-content: flex-start; min-height: 0; margin-top: 6px; } .hand.mini .card { --w: 82px; }
.unitinfo { width: 100%; text-align: center; } .unitinfo small { color: var(--dim); font-weight: 700; }
.tools { display: flex; gap: 8px; justify-content: center; }
.big.warn { background: linear-gradient(#ffd45e, #e0a21b); color: #3b230a; border-color: #fff1bd; font-size: 18px; }

.card.hasab { outline: 4px solid #ffd45e; outline-offset: 1px; box-shadow: 0 0 16px 3px rgba(255,212,94,.6); }
.abilpanel { display: flex; flex-direction: column; gap: 10px; width: min(96%, 720px); } .abrow { display: flex; gap: 12px; align-items: center; background: rgba(0,0,0,.35); border: 2px solid #e0b052; border-radius: 16px; padding: 10px; text-align: left; } .abrow .card { --w: 96px; flex: none; } .abtxt { display: flex; flex-direction: column; gap: 6px; flex: 1; } .abtxt b { font-size: 20px; color: var(--gold); } .abtxt p { margin: 0; font-size: 15px; line-height: 1.35; } .abtxt .big { min-width: 0; min-height: 48px; font-size: 17px; padding: 8px 14px; }
.guessgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; width: min(96%, 720px); } .guess { min-width: 0; min-height: 56px; padding: 6px 8px; font-size: 16px; } .guess small { font-size: 12px; }
.idols { display: flex; flex-direction: column; align-items: center; gap: 6px; } .idols small { color: var(--dim); } .idolrow { display: flex; gap: 12px; } .idolcard { width: 128px; min-height: 96px; border-radius: 12px; border: 4px solid #8a6a3a; background: linear-gradient(#5a7a3a, #2e4a1e); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 #000; } .idolcard:nth-child(2) { background: linear-gradient(#6b6b6b, #3a3a3a); } .idolcard b { font-size: 22px; } .idolcard small { color: #e8e0c0; font-size: 12px; } .idolcard.sel { outline: 5px solid var(--gold); transform: translateY(-6px); } .idolcard[disabled] { opacity: .35; }
.idolchip { font-weight: 900; font-size: 13px; background: #223; border: 2px solid #8a8; border-radius: 99px; padding: 2px 10px; color: #cfe; } .idolchip.good { border-color: var(--gold); color: var(--gold); }
.bnotes { font-size: 14px; color: var(--dim); text-align: center; max-width: 620px; } .hint { margin: 0; color: var(--dim); }
.slotcard { position: relative; } .slot.win .slotcard .card { animation: winpop .7s .55s both; } .slot.saved .slotcard .card { animation: winpop .7s .55s both; } .slot.lose .slotcard .card { animation: losefall .8s .55s both; }
@keyframes winpop { 0% { transform: none; } 50% { transform: scale(1.14) translateY(-12px); box-shadow: 0 0 30px 10px rgba(255,212,94,.85); } 100% { transform: scale(1.06) translateY(-8px); box-shadow: 0 0 22px 6px rgba(255,212,94,.6); } }
@keyframes losefall { 0% { transform: none; } 25% { transform: translateX(-8px) rotate(-3deg); } 50% { transform: translateX(8px) rotate(3deg); } 100% { transform: scale(.88) rotate(-4deg); filter: grayscale(1) brightness(.6); opacity: .7; } }
.stamp { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-12deg) scale(1); font-weight: 1000; font-size: 22px; letter-spacing: 2px; padding: 2px 12px; border: 4px solid; border-radius: 8px; background: rgba(0,0,0,.55); animation: stampin .4s 1.15s cubic-bezier(.2,1.6,.4,1) both; pointer-events: none; } .stamp.lose { color: #ff5a4a; border-color: #ff5a4a; } .stamp.win { color: #ffd45e; border-color: #ffd45e; } .stamp.saved { color: #8be28b; border-color: #8be28b; }
@keyframes stampin { from { transform: translate(-50%, -50%) rotate(-12deg) scale(2.6); opacity: 0; } }
.msg.verdict { font-size: 24px; color: #ffe9b0; text-shadow: 0 2px 0 #000; animation: verdictin .5s 1s both; } @keyframes verdictin { from { opacity: 0; transform: translateY(10px) scale(.96); } }
.outcome { position: absolute; inset: 0; z-index: 60; background: rgba(8,5,3,.9); display: grid; place-items: center; padding: 20px; animation: ocfade .3s both; } @keyframes ocfade { from { opacity: 0; } }
.oc { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: ocpop .6s cubic-bezier(.2,1.4,.4,1) both; } @keyframes ocpop { from { transform: scale(.6); opacity: 0; } }
.ocswords { font-size: 96px; line-height: 1; filter: drop-shadow(0 0 24px var(--oc)); } .ocwho { font-size: 56px; font-weight: 1000; color: var(--oc); text-shadow: 0 4px 0 #000, 0 0 30px var(--oc); } .ocsub { font-size: 22px; font-weight: 700; color: #f1e3c4; }

/* the battle fits any screen: its cards shrink with the height, and it scrolls if it still does not fit */

    if (v.step === 'over') status = v.winner === -1 ? 'Nobody wins. Draw.' : `${nm(v.winner)} wins!`;
    else if (v.step === 'flag') status = a === me ? 'Hide your flag: tap one of your starting castles. Your opponent can\'t see which.' : `${nm(a)} is hiding their flag…`;
    else if (v.step === 'discard') status = a === me ? `Your hand is over ${D.rules.handMax}: choose ${v.hand.length - D.rules.handMax} card${v.hand.length - D.rules.handMax === 1 ? '' : 's'} to lose.` : `${nm(a)} is choosing cards to lose…`;
    else if (retreatSpots) status = 'Retreat: tap a glowing space to take your last card there. You will lose this battle.';
    else if (v.step === 'battle') status = clash ? `⚔ Battle at ${placeName(v.battle.hex)}! ${v.battle.att === me ? 'You attack' : nm(v.battle.att) + ' attacks'} with ${v.battle.counts[v.battle.att]} card${v.battle.counts[v.battle.att] === 1 ? '' : 's'} against ${v.battle.counts[1 - v.battle.att]}.` : 'Resolving the battles';
    else if (!myTurn) status = `${nm(a)} is moving…`;
    else if (selCard) status = 'Now tap one of your castles in supply';
    else if (selUnit) status = !(v.units.find(u => u.id === selUnit) || {}).acted ? 'Tap a glowing space to move there (ringed castles by tunnel), or tap the unit again to cancel.' : 'This unit has moved. Tap it again to close.';
    else if (!handEmpty) status = 'Place cards: tap a card, then a castle in supply. Or keep them for later, move, and Resolve.';
    else if (movable) status = 'Tap a ringed unit, then where it goes. Then tap Resolve!';
    else status = 'All moved. Tap Resolve!';
    const phase = v.step === 'battle' ? 2 : 1;
    const mySel = selUnit && v.units.find(u => u.id === selUnit);
    let low = '';
    if (v.step !== 'battle') {
      if (mySel) low = `<div class="unitinfo"><small>Cards in this unit (${mySel.cards.length})</small><div class="hand">${mySel.cards.slice().sort((x, y) => pw(y) - pw(x)).map(c => cardHTML(c, { small: true, attr: 'disabled' })).join('')}</div></div>`;
      else if (v.hand.length) low = `<div class="hand" style="--n:${v.hand.length}">${v.hand.slice().sort((x, y) => pw(y) - pw(x)).map(c => cardHTML(c, { sel: c.id === selCard, attr: myTurn ? `data-card="${c.id}"` : 'disabled' })).join('')}</div>`;
      else low = '<div class="hand"><small class="hint">No cards in hand</small></div>';
    }
    const deployMode = (myTurn && v.hand.length && selCard) || (v.step === 'flag' && a === me);
    const flagMode = v.step === 'flag' && a === me;
    return `<div class="screen game" style="--me:${col(me)}">
      <div class="topbar"><button class="chip menuchip" data-act="menu" aria-label="Menu">☰ Menu</button></div>
      <div class="main">
        <div class="boardwrap">${boardHTML(v, selUnit, retreatSpots ? retreatSpots : reach, deployMode, movable, clash, tun)}</div>
        <div class="side">
          <div class="phases"><span class="who" style="background:${col(v.cur)}">${nm(v.cur)}'s turn · ${esc(facName(v.cur))}</span><span class="ph ${phase === 1 ? 'on' : ''}">1 · Deploy &amp; Move</span><span class="ph ${phase === 2 ? 'on' : ''}">2 · Resolve</span></div>
          <div class="status">${esc(status)}</div>
          ${v.notice ? `<div class="notice">${esc(v.notice)}</div>` : ''}
          ${retreatSpots ? '<button class="big" data-act="rcancel">Cancel: stay and play the card</button>' : clash ? '<button class="big go" data-act="startbattle">Start battle</button>' : low}
          ${myTurn && !clash ? `<button class="big go ${ui.askResolve ? 'warn' : ''}" data-act="endmove">${ui.askResolve ? ui.askResolve : 'Resolve!'}</button>` : ''}
          ${v.step !== 'battle' && v.step !== 'over' ? '<div class="tools"><button class="chip" data-act="units">Your units</button><button class="chip" data-act="myfac">Your cards</button></div>' : ''}
          <div class="deckline"><span>You: deck ${v.deck[me]} · hand ${v.hand.length}</span><button class="fallenbtn" data-act="fallen" data-p="${me}" style="border-color:${col(me)}">Fallen ${v.fallen[me].length}</button><span>${esc(nm(v.opp))}: deck ${v.deck[v.opp]} · hand ${v.oppHand}</span><button class="fallenbtn" data-act="fallen" data-p="${v.opp}" style="border-color:${col(v.opp)}">Fallen ${v.fallen[v.opp].length}</button></div>
        </div>
      </div>
      ${v.step === 'battle' && !clash ? battleHTML(v) : ''}
      ${v.step === 'discard' && a === me ? discardHTML(v) : ''}
      ${v.step === 'over' ? sheet(`<h2 style="color:${v.winner >= 0 ? col(v.winner) : 'inherit'}">${v.winner === -1 ? 'Draw' : nm(v.winner) + ' wins!'}</h2><button class="big gold" data-act="again">Play again</button><button class="big ghost" data-act="home">Main Menu</button>`) : ''}
    </div>`;
  }

  function render() {
    clearTimeout(ui.timer); if (ui.s) E.use(ui.s);
    let h;
    if (ui.screen === 'pick' && ui.pick) h = pickHTML();
    else if (ui.screen === 'home' || !ui.s) h = homeHTML();
    else if (needsCover()) h = coverHTML();
    else h = gameHTML();
    const rv = pendingReveal(), oc = !rv && pendingOutcome(), inGame = ui.screen === 'game' && ui.s && !needsCover();
    const sh = ui.sheet ? (ui.sheet.t === 'units' ? (inGame ? unitsSheet(E.viewFor(ui.s, viewer())) : '') : ui.sheet.t === 'fallen' ? (inGame ? fallenSheet(E.viewFor(ui.s, viewer()), ui.sheet.p) : '') : factionSheet(ui.sheet.id, ui.sheet.alt)) : '';
    app.innerHTML = h + (ui.menu && ui.screen === 'game' ? menuHTML() : '') + sh + (ui.help ? helpHTML() : '') + (rv ? revealHTML(rv) : '') + (oc && inGame ? outcomeHTML(oc) : '');
    animateTokens();
    if (ui.screen === 'game' && ui.s && isBotTurn() && !needsCover()) {
      const s = ui.s, bot = 1 - ui.human, quick = s.step === 'play';
      ui.timer = setTimeout(() => {
        const a = Bots.nextAction(E.viewFor(s, bot));
        const r = E.apply(s, a);
        if (!r.ok) console.error('bot move refused', a, r.error);
        save(); render();
      }, quick ? (s.hands[bot].length ? D.bot.deployMs : D.bot.moveMs) : D.bot.thinkMs);
    }
  }
  /* a unit that moves slides to where it went, so you can watch the computer move */
  function animateTokens() {
    const svg = app.querySelector('svg.board'), next = {};
    if (!svg) { ui.tokPos = {}; return; }
    const vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect(), k = Math.min(r.width / (vb.width || 12.3), r.height / (vb.height || 11.1)) || 1;
    svg.querySelectorAll('g[data-unit]').forEach(el => {
      const id = el.dataset.unit, b = el.getBoundingClientRect(); next[id] = { x: b.left, y: b.top, h: el.dataset.hex };
      const o = ui.tokPos[id]; if (o && o.h !== el.dataset.hex && el.animate) el.animate([{ transform: `translate(${(o.x - b.left) / k}px, ${(o.y - b.top) / k}px)` }, { transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.3,.7,.3,1)' });
    });
    ui.tokPos = next;
  }

  function tapHex(k, unitId) {
    const s = ui.s, me = viewer(), v = E.viewFor(s, me), sel = ui.sel, myTurn = s.step === 'play' && actorNow() === me;
    const tu = unitId && v.units.find(x => x.id === Number(unitId));
    if (s.step === 'battle') { if (ui.retreating && actorNow() === me && v.battle.retreat.indexOf(k) >= 0) act({ type: 'retreat', to: k }); return; }
    if (tu && tu.owner === me && sel && sel.t === 'unit' && sel.id === tu.id) { ui.sel = null; ui.askResolve = false; render(); return; }          // tap the unit again: cancel
    if (!myTurn) { ui.sel = tu && tu.owner === me ? { t: 'unit', id: tu.id } : null; render(); return; }          // look inside any of your units, any time
    if (sel && sel.t === 'card') { const cn = E.hexCastle[k]; if (cn && s.castles[cn].owner === me && v.supply.indexOf(cn) >= 0) act({ type: 'deploy', card: sel.id, castle: cn }); else { ui.sel = null; render(); } return; }
    if (sel && sel.t === 'unit') {
      const u = v.units.find(x => x.id === sel.id);
      if (u && !u.acted && (E.reachable(v, u).indexOf(k) >= 0 || E.tunnelTo(v, u).indexOf(k) >= 0)) { act({ type: 'move', unit: u.id, to: k }); return; }
    }
    ui.sel = tu && tu.owner === me ? { t: 'unit', id: tu.id } : null; render();
  }

  app.addEventListener('click', e => {
    const t = e.target;
    const actEl = t.closest('[data-act]'), card = t.closest('[data-card]'), unit = t.closest('[data-unit]'), hex = t.closest('[data-hex]');
    if (actEl && actEl.dataset.act !== 'none') {
      const a = actEl.dataset.act; if (a !== 'endmove') ui.askResolve = false;
      if (a === 'mode-ai') startPick('ai'); else if (a === 'mode-pass') startPick('pass');
      else if (a === 'board') { ui.pick.map = actEl.dataset.m; render(); }
      else if (a === 'pickfac') pickFaction(actEl.dataset.f, actEl.dataset.paired === '1');
      else if (a === 'pickback') { ui.pick = null; ui.screen = ui.s ? 'game' : 'home'; render(); }
      else if (a === 'continue') cont();
      else if (a === 'help') { ui.help = true; render(); } else if (a === 'closehelp') { ui.help = false; render(); }
      else if (a === 'menu') { ui.menu = true; render(); } else if (a === 'closemenu') { ui.menu = false; render(); }
      else if (a === 'home') { ui.screen = 'home'; ui.menu = false; ui.help = false; render(); }
      else if (a === 'again') { ui.menu = false; startPick(ui.mode); }
      else if (a === 'uncover') { ui.seen = actorNow(); render(); }
      else if (a === 'endmove') {
        if (actEl.classList.contains('off')) return;
        const v = E.viewFor(ui.s, viewer()), left = v.units.filter(u => u.owner === v.me && !u.acted && E.reachable(v, u).length).length;
        const bits = [left ? 'units that can move' : '', v.hand.length ? 'cards in your hand (they stay there)' : ''].filter(Boolean);
        if (bits.length && !ui.askResolve) { ui.askResolve = 'You still have ' + bits.join(' and ') + '. Tap again to Resolve'; render(); return; }
        ui.askResolve = false; act({ type: 'endMove' });
      }
      else if (a === 'bc') act({ type: 'continue' });
      else if (a === 'startbattle') { ui.announced = battleKey(ui.s); render(); }
      else if (a === 'outack') { const o = pendingOutcome(); if (o) ui.outN = o.n; render(); }
      else if (a === 'viewfac') { ui.sheet = { t: 'fac', id: actEl.dataset.f, alt: (ui.s && ui.screen === 'game' && ui.s.fac.indexOf(actEl.dataset.f) >= 0) ? ui.s.fac[1 - ui.s.fac.indexOf(actEl.dataset.f)] : null }; render(); }
      else if (a === 'myfac') { const me = viewer(); ui.menu = false; ui.sheet = { t: 'fac', id: ui.s.fac[me], alt: ui.s.fac[1 - me] }; render(); }
      else if (a === 'units') { ui.menu = false; ui.sheet = { t: 'units' }; render(); }
      else if (a === 'closesheet') { ui.sheet = null; render(); }
      else if (a === 'useab') { const d = actEl.dataset; act({ type: 'ability', ability: d.ab, card: d.card, unit: d.unit ? Number(d.unit) : undefined }); }
      else if (a === 'ready') act({ type: 'ready' });
      else if (a === 'idol') { ui.idol = ui.idol === actEl.dataset.k ? null : actEl.dataset.k; render(); }
      else if (a === 'bplay') { if (ui.bsel) act({ type: 'play', card: ui.bsel, idol: ui.idol || undefined }); }
      else if (a === 'keepcard') act({ type: 'swap', card: null });
      else if (a === 'retreat') { ui.retreating = true; render(); }
      else if (a === 'rcancel') { ui.retreating = false; render(); }
      else if (a === 'fallen') { ui.sheet = { t: 'fallen', p: Number(actEl.dataset.p) }; render(); }
      else if (a === 'loseok') { const v = E.viewFor(ui.s, viewer()); if (ui.dsel.length === v.hand.length - D.rules.handMax) { const ids = ui.dsel.slice(); ui.dsel = []; act({ type: 'discard', cards: ids }); } }
      else if (a === 'revack') { const r = pendingReveal(); if (r) ui.revN = r.n; render(); }
      return;
    }
    if (ui.help || ui.menu || ui.sheet) return;
    const lose = t.closest('[data-lose]'); if (lose) { const id = lose.dataset.lose; ui.dsel = ui.dsel.indexOf(id) >= 0 ? ui.dsel.filter(x => x !== id) : ui.dsel.concat(id); render(); return; }
    const bsel = t.closest('[data-bsel]'), swap = t.closest('[data-swap]'), guess = t.closest('[data-guess]');
    if (bsel) { ui.bsel = ui.bsel === bsel.dataset.bsel ? null : bsel.dataset.bsel; render(); return; }          // tapping a card only chooses it; Play is a button
    if (swap) { act({ type: 'swap', card: swap.dataset.swap }); return; }
    if (guess) { act({ type: 'guess', role: guess.dataset.guess }); return; }
    if (card) { ui.sel = ui.sel && ui.sel.id === card.dataset.card ? null : { t: 'card', id: card.dataset.card }; render(); return; }
    const s = ui.s;
    if (s && s.step === 'flag' && actorNow() === viewer() && hex) { const cn = E.hexCastle[hex.dataset.hex]; if (cn) act({ type: 'flag', castle: cn }); return; }
    if (hex || unit) { tapHex((unit || hex).dataset.hex, unit && unit.dataset.unit); }
  });

  render();
  if (typeof window !== 'undefined') window.WAR = { ui, render, newGame };
})();
</script>
</body>
</html>
