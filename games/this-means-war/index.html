<script id="data">
// ---- THE RULES, THE BOARD AND THE TEXTS: everything a rule is lives here; the engine below only does what this says ----
const GAME_DATA = {
  title: 'This Means WAR!',
  library: { name: 'Tabletop Library', href: '../../index.html' },
  players: 2,
  sides: [{ id: 'red', name: 'Red', color: '#e0482c' }, { id: 'blue', name: 'Blue', color: '#2f7fe0' }],

  // Each side has its own deck of these 17 cards. A stronger card (power) beats a weaker one, unless the weaker card is the stronger one's weakness.
  cards: [
    { id: 'leader',   name: 'Leader',   power: 14, weakness: 'assassin', copies: 2, mark: '♛' },
    { id: 'general',  name: 'General',  power: 12, weakness: 'spy',      copies: 2, mark: '★' },
    { id: 'warrior',  name: 'Warrior',  power: 10, weakness: 'sorcerer', copies: 3, mark: '⚔' },
    { id: 'ranger',   name: 'Ranger',   power: 8,  weakness: null,       copies: 3, mark: '➶' },
    { id: 'sorcerer', name: 'Sorcerer', power: 6,  weakness: null,       copies: 3, mark: '✦' },
    { id: 'spy',      name: 'Spy',      power: 4,  weakness: null,       copies: 2, mark: '◉' },
    { id: 'assassin', name: 'Assassin', power: 2,  weakness: null,       copies: 2, mark: '†' },
  ],

  rules: {
    firstDraw: [1, 2],          // the first player starts with 1 card, the second with 2
    drawPerTurn: 2,             // every turn ends by drawing this many
    speed: 2,                   // spaces a unit may move with its one action each turn
    unitMax: 7,                 // a unit holds at most one card of each type: up to 7 cards
    maxTurns: 300,              // a game nobody can win ends as a draw after this many turns (never reached in real play)
  },

  // The basic map: a hexagonal board of spaces. Seven castles, each one space apart: one in the middle and six around it. Each side starts with two
  // neighbouring castles (one of them hides its flag); the three castles in between are neutral.
  board: {
    radius: 3,
    castles: [
      { id: 'mid', name: 'the Central Castle', q: 0, r: 0 },
      { id: 'e', name: 'the East Castle',   q: 2, r: 0 },  { id: 'ne', name: 'the Northeast Castle', q: 2, r: -2 }, { id: 'nw', name: 'the Northwest Castle', q: 0, r: -2 },
      { id: 'w', name: 'the West Castle',   q: -2, r: 0 }, { id: 'sw', name: 'the Southwest Castle', q: -2, r: 2 }, { id: 'se', name: 'the Southeast Castle', q: 0, r: 2 },
    ],
    start: [['nw', 'ne'], ['sw', 'se']],          // red (top) and blue (bottom)
  },

  bot: { names: ['Computer'], thinkMs: 650, quickMs: 300 },

  texts: {
    tagline: 'Capture the hidden flag before they capture yours!',
    help: [
      'Capture the other side\'s hidden flag. Each side secretly hides a flag in one of its two starting castles. Take the castle that hides the enemy flag and you win.',
      'Each side has its own deck of 17 cards. Cards are stronger the bigger their number. A card can still lose to its weakness: Leader to Assassin, General to Spy, Warrior to Sorcerer. Equal cards are both defeated.',
      'Your turn has two parts. Part 1, Deploy & Move: place every card in your hand onto one of your castles.  Cards on a castle form a unit (up to 7 cards, one of each type). Then move: tap a unit that has not moved yet, then tap where it goes. Each unit moves once, up to 2 spaces, through its own units but not through enemy units.',
      'Part 2, Resolve: tap Resolve! Your units on the same space merge, and any undefended castle you stand on is captured. If your unit is on an enemy unit, you fight: the defender plays a card, then the attacker. Survivors wait aside and become the new hand when the hand is empty. The players take turns playing first: the defender plays first in the first round, the attacker in the second, and so on. Whoever runs out of cards loses the battle; the winner keeps the survivors and, on an enemy castle, captures it.',
      'Every turn ends by drawing 2 cards. When your deck is empty, your discard pile is shuffled to make a new one.',
      'Not in this version yet: tunnels and the hero cards.',
    ],
    modes: [['ai', 'Play the Computer', ''], ['pass', 'Pass and Play', 'Two players, one device']],
  },
};
</script>
<script id="engine">
// ---- THE RULES ENGINE: pure, no DOM. State is plain JSON (save/restore is JSON.stringify). Hidden information leaves only through viewFor. ----
const Engine = (() => {
  const D = GAME_DATA, R = D.rules, B = D.board;
  const CT = {}; D.cards.forEach(c => { CT[c.id] = c; });
  const hk = (q, r) => q + ',' + r;
  const parse = k => k.split(',').map(Number);
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  const onBoard = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)) <= B.radius;
  const castleHex = {}, hexCastle = {};
  B.castles.forEach(c => { castleHex[c.id] = hk(c.q, c.r); hexCastle[hk(c.q, c.r)] = c.id; });
  const allHexes = [];
  for (let q = -B.radius; q <= B.radius; q++) for (let r = -B.radius; r <= B.radius; r++) if (onBoard(q, r)) allHexes.push(hk(q, r));
  const dist = (a, b) => { const [aq, ar] = parse(a), [bq, br] = parse(b); return Math.max(Math.abs(aq - bq), Math.abs(ar - br), Math.abs(aq + ar - bq - br)); };

  const rnd = s => { s.rng = (s.rng + 0x6D2B79F5) | 0; let t = s.rng; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const shuffle = (s, a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const other = p => 1 - p;
  const sideName = p => D.sides[p].name;
  const castleName = id => (B.castles.find(c => c.id === id) || {}).name || id;

  // 'a' when card a wins, 'b' when card b wins, 'both' when both are defeated. The stronger card wins unless the weaker one is its weakness.
  function duel(a, b) {
    const ca = CT[a.type], cb = CT[b.type];
    if (ca.power === cb.power) return 'both';
    const hi = ca.power > cb.power ? ca : cb, lo = hi === ca ? cb : ca;
    const hiWins = hi.weakness !== lo.id;
    return (hi === ca) === hiWins ? 'a' : 'b';
  }

  function draw(s, p, n) {
    for (; n > 0; n--) {
      if (!s.decks[p].length) { if (!s.discard[p].length) return; s.decks[p] = shuffle(s, s.discard[p]); s.discard[p] = []; }
      s.hands[p].push(s.decks[p].pop());
    }
  }

  function createGame(opts) {
    opts = opts || {};
    const first = opts.first === 1 ? 1 : 0;
    const s = { v: 1, rng: (opts.seed == null ? Date.now() : opts.seed) | 0, first, cur: first, step: 'flag', flagQueue: [first, other(first)], castles: {}, decks: [[], []], discard: [[], []], hands: [[], []], units: [], uid: 1, reveals: [], revealN: 0, winner: null, battle: null, pending: [], notice: '', turns: 1 };
    B.castles.forEach(c => { s.castles[c.id] = { owner: null, flagOf: null, revealed: false }; });
    B.start.forEach((ids, p) => ids.forEach(id => { s.castles[id].owner = p; }));
    for (let p = 0; p < 2; p++) {
      D.cards.forEach(c => { for (let i = 0; i < c.copies; i++) s.decks[p].push({ id: p + '-' + c.id + '-' + i, type: c.id, owner: p }); });
      shuffle(s, s.decks[p]);
    }
    draw(s, first, R.firstDraw[0]); draw(s, other(first), R.firstDraw[1]);
    return s;
  }

  function actor(s) {
    if (s.step === 'flag') return s.flagQueue[0];
    if (s.step === 'play') return s.cur;
    if (s.step === 'battle') return s.battle.stage === 'first' ? s.battle.first : s.battle.stage === 'second' ? other(s.battle.first) : s.battle.att;
    return null;
  }

  const unitsAt = (s, k) => s.units.filter(u => u.at === k);
  const enemyAt = (s, k, p) => s.units.some(u => u.at === k && u.owner !== p);

  // every space the unit can reach with its action: up to `speed` spaces, through allied units but never past an enemy unit
  function reachable(s, unit) {
    const seen = {}, out = [];
    seen[unit.at] = 0;
    let frontier = [unit.at];
    for (let step = 1; step <= R.speed; step++) {
      const next = [];
      frontier.forEach(k => {
        const [q, r] = parse(k);
        DIRS.forEach(d => {
          const nq = q + d[0], nr = r + d[1], nk = hk(nq, nr);
          if (!onBoard(nq, nr) || seen[nk] != null) return;
          seen[nk] = step; out.push(nk);
          if (!enemyAt(s, nk, unit.owner)) next.push(nk);
        });
      });
      frontier = next;
    }
    return out;
  }

  function mergeAll(s) {
    const groups = {};
    s.units.forEach(u => { (groups[u.owner + '|' + u.at] = groups[u.owner + '|' + u.at] || []).push(u); });
    Object.keys(groups).forEach(g => {
      const list = groups[g]; if (list.length < 2) return;
      const keep = list[0], have = {};
      keep.cards.forEach(c => { have[c.type] = true; });
      list.slice(1).forEach(u => {
        u.cards.forEach(c => { if (have[c.type] || keep.cards.length >= R.unitMax) s.discard[u.owner].push(c); else { have[c.type] = true; keep.cards.push(c); } });
        s.units.splice(s.units.indexOf(u), 1);
      });
    });
  }

  function capture(s, k, p) {
    const id = hexCastle[k]; if (!id) return;
    const c = s.castles[id]; if (c.owner === p) return;
    const flip = !c.revealed && B.start[other(p)].indexOf(id) >= 0;          // one of their two first castles, not yet turned over: it may hide the flag
    c.owner = p; c.revealed = true;
    if (flip) s.reveals.push({ n: ++s.revealN, castle: id, by: p, flag: c.flagOf === other(p) });
    s.notice += sideName(p) + ' captured ' + castleName(id) + '. ';
    if (c.flagOf === other(p)) { s.step = 'over'; s.winner = p; s.notice += sideName(p) + ' found the flag! '; }
  }

  function endTurn(s) {
    if (s.step === 'over') return;
    draw(s, s.cur, R.drawPerTurn);
    s.cur = other(s.cur); s.turns++; s.step = 'play'; s.battle = null;
    s.units.forEach(u => { u.acted = false; });
    if (s.turns > R.maxTurns) { s.step = 'over'; s.winner = -1; }
  }

  function nextBattle(s) {
    if (s.step === 'over') return;
    while (s.pending.length) {
      const k = s.pending.shift(), mine = s.units.filter(u => u.at === k && u.owner === s.cur), theirs = s.units.filter(u => u.at === k && u.owner !== s.cur);
      if (!mine.length || !theirs.length) continue;
      const side = [[], []];
      s.units.filter(u => u.at === k).forEach(u => side[u.owner].push.apply(side[u.owner], u.cards));
      s.units = s.units.filter(u => u.at !== k);
      s.battle = { hex: k, att: s.cur, def: other(s.cur), stage: 'first', first: other(s.cur), played: [null, null], result: null, rounds: 0, side: [{ hand: side[0], aside: [] }, { hand: side[1], aside: [] }] };
      s.step = 'battle';
      return;
    }
    endTurn(s);
  }

  function battlePhase(s) {
    s.notice = ''; s.reveals = [];
    mergeAll(s);
    s.units.filter(u => u.owner === s.cur).forEach(u => { if (s.step !== 'over' && hexCastle[u.at] && !enemyAt(s, u.at, s.cur)) capture(s, u.at, s.cur); });
    if (s.step === 'over') return;
    const spots = [];
    s.units.forEach(u => { if (u.owner === s.cur && enemyAt(s, u.at, s.cur) && spots.indexOf(u.at) < 0) spots.push(u.at); });
    s.pending = spots; s.battle = null;
    nextBattle(s);
  }

  function finishBattle(s, winner) {
    const b = s.battle;
    if (winner != null) {
      const cards = b.side[winner].hand.concat(b.side[winner].aside);
      s.units.push({ id: s.uid++, owner: winner, at: b.hex, cards, acted: true });
      s.notice += sideName(winner) + ' won the battle. ';
      if (winner === b.att) capture(s, b.hex, winner);
    } else s.notice += 'Both armies were wiped out. ';
    b.side.forEach(sd => sd.hand.concat(sd.aside).forEach(c => { if (winner == null || c.owner !== winner) s.discard[c.owner].push(c); }));
    s.battle = null;
    if (s.step === 'over') return;
    nextBattle(s);
  }

  const bad = msg => ({ ok: false, error: msg });
  function apply(s, a) {
    const p = actor(s);
    if (p == null) return bad('game over');
    if (a.type === 'flag') {
      if (s.step !== 'flag') return bad('not now');
      const c = s.castles[a.castle];
      if (!c || c.owner !== p) return bad('hide the flag in one of your castles');
      c.flagOf = p; s.flagQueue.shift();
      if (!s.flagQueue.length) s.step = 'play';
      return { ok: true };
    }
    if (s.step === 'play') {
      if (a.type === 'deploy') {
        const i = s.hands[p].findIndex(c => c.id === a.card), c = s.hands[p][i], cs = s.castles[a.castle];
        if (!c) return bad('no such card');
        if (!cs || cs.owner !== p) return bad('place cards on your own castles');
        const k = castleHex[a.castle];
        s.hands[p].splice(i, 1);
        const u = s.units.find(x => x.owner === p && x.at === k && x.cards.length < R.unitMax && !x.cards.some(y => y.type === c.type));
        if (u) u.cards.push(c); else s.units.push({ id: s.uid++, owner: p, at: k, cards: [c], acted: false });
        return { ok: true };
      }
      if (a.type === 'move') {
        const u = s.units.find(x => x.id === a.unit);
        if (!u || u.owner !== p) return bad('no such unit');
        if (u.acted) return bad('that unit has already acted');
        if (reachable(s, u).indexOf(a.to) < 0) return bad('too far');
        u.at = a.to; u.acted = true;
        return { ok: true };
      }
      if (a.type === 'endMove') {
        if (s.hands[p].length) return bad('place all your cards first');
        battlePhase(s);
        return { ok: true };
      }
      return bad('unknown action');
    }
    if (s.step === 'battle') {
      const b = s.battle;
      if (a.type === 'play') {
        if (b.stage !== 'first' && b.stage !== 'second') return bad('not now');
        const hand = b.side[p].hand, i = hand.findIndex(c => c.id === a.card);
        if (i < 0) return bad('no such card');
        b.played[p] = hand.splice(i, 1)[0];
        if (b.stage === 'first') { b.stage = 'second'; return { ok: true }; }
        const out = duel(b.played[b.att], b.played[b.def]);          // the players take turns playing first; who is attacking only decides who captures
        b.result = out; b.rounds++;
        const fate = (card, dies) => { if (dies) s.discard[card.owner].push(card); else b.side[card.owner].aside.push(card); };
        fate(b.played[b.att], out !== 'a'); fate(b.played[b.def], out !== 'b');
        b.stage = 'result';
        return { ok: true };
      }
      if (a.type === 'continue') {
        if (b.stage !== 'result') return bad('not now');
        b.played = [null, null]; b.result = null; b.first = other(b.first);
        b.side.forEach(sd => { if (!sd.hand.length) { sd.hand = sd.aside; sd.aside = []; } });
        const left = b.side.map(sd => sd.hand.length > 0);
        if (left[0] && left[1]) b.stage = 'first'; else finishBattle(s, left[0] ? 0 : left[1] ? 1 : null);
        return { ok: true };
      }
    }
    return bad('unknown action');
  }

  // what player p may see: own cards, counts for everything else, the flag only where it is theirs or has been found
  function viewFor(s, p) {
    const o = other(p), copy = c => ({ id: c.id, type: c.type, owner: c.owner });
    const v = { me: p, opp: o, step: s.step, cur: s.cur, first: s.first, winner: s.winner, notice: s.notice, turns: s.turns, actor: actor(s),
      hand: s.hands[p].map(copy), oppHand: s.hands[o].length, deck: [s.decks[0].length, s.decks[1].length], discard: [s.discard[0].length, s.discard[1].length],
      castles: {}, units: s.units.map(u => ({ id: u.id, owner: u.owner, at: u.at, acted: u.acted, n: u.cards.length, cards: u.owner === p ? u.cards.map(copy) : null })), battle: null, reveals: s.reveals.map(r => ({ n: r.n, castle: r.castle, by: r.by, flag: r.flag })) };
    Object.keys(s.castles).forEach(id => { const c = s.castles[id]; v.castles[id] = { owner: c.owner, mine: c.flagOf === p, flag: c.revealed ? c.flagOf != null : c.flagOf === p, revealed: c.revealed }; });
    if (s.battle) {
      const b = s.battle;
      const hide = !(b.stage === 'result' || (b.stage === 'second' && b.first === o));          // the card played first is face up for the second player; both show once the round is played
      v.battle = { hex: b.hex, att: b.att, def: b.def, stage: b.stage, first: b.first, result: b.result, rounds: b.rounds,
        played: { mine: b.played[p] ? copy(b.played[p]) : null, theirs: b.played[o] && !hide ? copy(b.played[o]) : null, theirsHidden: !!b.played[o] && hide },
        mine: { hand: b.side[p].hand.map(copy), aside: b.side[p].aside.map(copy) }, oppReady: b.side[o].hand.length, oppAside: b.side[o].aside.length };
    }
    return v;
  }

  const serialize = s => JSON.stringify(s);
  const restore = t => JSON.parse(t);

  return { CT, hk, parse, onBoard, allHexes, castleHex, hexCastle, dist, duel, createGame, actor, reachable, apply, viewFor, serialize, restore, castleName, sideName };
})();

<script id="bots">
// ---- THE COMPUTER PLAYER: sees only Engine.viewFor (its own cards, counts of everything else) ----
const Bots = (() => {
  const E = Engine, CT = E.CT;
  const pick = (a, rng) => a[Math.floor((rng || Math.random)() * a.length)];
  const castles = v => Object.keys(v.castles);
  const mineCastles = v => castles(v).filter(id => v.castles[id].owner === v.me);
  const flagCastle = v => castles(v).find(id => v.castles[id].mine && v.castles[id].flag);

  function targetFor(v, at) {
    let best = null, bd = 99;
    castles(v).forEach(id => {
      const c = v.castles[id]; if (c.owner === v.me) return;
      const d = E.dist(at, E.castleHex[id]) - (c.owner === v.opp ? 0.5 : 0);
      if (d < bd) { bd = d; best = E.castleHex[id]; }
    });
    return best;
  }

  function deploy(v) {
    const card = v.hand.slice().sort((a, b) => CT[b.type].power - CT[a.type].power)[0];
    const fc = flagCastle(v);
    const score = id => {
      const k = E.castleHex[id], here = v.units.filter(u => u.owner === v.me && u.at === k);
      const has = here.some(u => u.cards && u.cards.some(c => c.type === card.type));
      let sc = has ? -10 : 0;
      if (id === fc) { const n = here.reduce((t, u) => t + u.n, 0); sc += n < 3 ? 6 - n : -2; }
      else { const t = targetFor(v, k); sc += t ? 4 - E.dist(k, t) : 0; }
      return sc;
    };
    const dest = mineCastles(v).sort((a, b) => score(b) - score(a))[0];
    return { type: 'deploy', card: card.id, castle: dest };
  }

  function movement(v) {
    const fc = flagCastle(v), fk = fc && E.castleHex[fc];
    const home = v.units.filter(u => u.owner === v.me && u.at === fk).sort((a, b) => b.n - a.n)[0];
    for (const u of v.units.filter(x => x.owner === v.me && !x.acted && x !== home)) {
      const target = targetFor(v, u.at); if (!target) continue;
      let best = null, bd = E.dist(u.at, target);
      E.reachable(v, u).forEach(k => {
        const foe = v.units.filter(x => x.owner !== v.me && x.at === k).reduce((t, x) => t + x.n, 0);
        if (foe && foe > u.n + 1) return;
        const d = E.dist(k, target) - (foe ? 0.25 : 0);
        if (d < bd) { bd = d; best = k; }
      });
      if (best) return { type: 'move', unit: u.id, to: best };
    }
    return { type: 'endMove' };
  }

  // does card c beat card d (a card put forward by the other side)?
  const beats = (c, d) => E.duel(c, d) === 'a';

  function nextAction(v, rng) {
    if (v.step === 'flag') return { type: 'flag', castle: pick(mineCastles(v), rng) };
    if (v.step === 'play') return v.hand.length ? deploy(v) : movement(v);
    const b = v.battle, hand = b.mine.hand.slice().sort((x, y) => CT[x.type].power - CT[y.type].power);
    if (b.stage === 'result') return { type: 'continue' };
    if (b.stage === 'second') {
      const win = hand.filter(c => E.duel({ type: c.type }, { type: b.played.theirs.type }) === 'a');
      return { type: 'play', card: (win[0] || hand[0]).id };
    }
    return { type: 'play', card: pick(hand, rng).id };
  }
  return { nextAction, beats };
})();
</script>

    const flag = r.flag, who = nm(r.by), cname = E.castleName(r.castle);
    return `<div class="reveal" data-act="revack"><div class="revtxt top">${esc(who)} took ${esc(cname)}. Is the flag here?</div>
      <div class="flipper ${flag ? 'yes' : 'no'}"><div class="face front"><svg viewBox="-1 -1.3 2 2.2">${castleSVG(0, 0.1, col(1 - r.by), 1.5)}</svg><div class="q">?</div></div>
      <div class="face back"><div class="flagbig">${flag ? '🚩' : '🏳️'}</div><b>${flag ? 'THE FLAG!' : 'No flag'}</b></div></div>
      <div class="revtxt bot"><div class="res">${flag ? esc(who) + ' wins!' : 'Nothing here. The hunt goes on.'}</div><small>Tap to continue</small></div></div>`;
  }

  function battleHTML(v) {
    const b = v.battle, me = v.me, opp = v.opp, mineTurn = v.actor === me, stage = b.stage;
    const cn = E.hexCastle[b.hex], where = cn ? E.castleName(cn) : 'the field';
    const pl = b.played, can = mineTurn && (stage === 'first' || stage === 'second');
    const slot = (p, card, hidden) => `<div class="slot"><small style="color:${col(p)}">${p === me ? 'You' : nm(p)}${(p === b.first && stage !== 'result') || (stage === 'result' && p === b.first) ? ' · played first' : ''}</small>${card ? cardHTML(card) : hidden ? backCard() : '<div class="card empty"></div>'}</div>`;
    const nmc = c => CT[c.type].name + ' (' + CT[c.type].power + ')';
    let msg;
    if (stage === 'result') {
      const mine = pl.mine, theirs = pl.theirs;
      const w = b.result === 'both' ? null : (b.result === 'a' ? (b.att === me ? mine : theirs) : (b.def === me ? mine : theirs));
      const L = w === mine ? theirs : mine;
      msg = b.result === 'both' ? `Your ${nmc(mine)} and their ${nmc(theirs)} are both defeated.` : `${w === mine ? 'Your' : nm(opp) + "'s"} ${nmc(w)} defeats ${w === mine ? nm(opp) + "'s" : 'your'} ${nmc(L)}${CT[w.type].power < CT[L.type].power ? ' (its weakness!)' : ''}`;
    } else if (can) msg = stage === 'first' ? 'You play first this round. Choose a card.' : `${nm(opp)} played ${nmc(pl.theirs)}. Choose your card.`;
    else msg = `${nm(v.actor)} is choosing a card…`;
    return `<div class="battle"><h2>Battle at ${esc(where)}</h2>
      <div class="foe" style="color:${col(opp)}">${nm(opp)}: ${b.oppReady} ready · ${b.oppAside} aside</div>
      <div class="slots">${slot(me, pl.mine, false)}${slot(opp, pl.theirs, pl.theirsHidden)}</div>
      <p class="msg">${esc(msg)}</p>
      <div class="foe" style="color:${col(me)}">Your cards (${b.mine.aside.length} aside)</div>
      <div class="hand">${b.mine.hand.slice().sort((x, y) => CT[y.type].power - CT[x.type].power).map(c => cardHTML(c, { attr: can ? `data-pick="${c.id}"` : 'disabled', dim: !can })).join('')}</div>
      ${b.mine.aside.length ? `<div class="hand asidehand">${b.mine.aside.map(c => cardHTML(c, { small: true, dim: true, attr: 'disabled' })).join('')}</div>` : ''}
      ${stage === 'result' ? '<button class="big go" data-act="bc">Continue</button>' : ''}</div>`;
  }

  function gameHTML() {
    const s = ui.s, me = viewer(), v = E.viewFor(s, me), a = v.actor;
    let selUnit = null, reach = [], selCard = null;
    if (ui.sel && ui.sel.t === 'unit') { const u = v.units.find(x => x.id === ui.sel.id); if (u && u.owner === me) { selUnit = u.id; if (!u.acted && v.step === 'play' && a === me) reach = E.reachable(v, u); } else ui.sel = null; }
    if (ui.sel && ui.sel.t === 'card') selCard = ui.sel.id;
    const myTurn = v.step === 'play' && a === me;
    const handEmpty = !v.hand.length;
    const movable = myTurn && handEmpty && v.units.some(u => u.owner === me && !u.acted);
    let status;
    if (v.step === 'over') status = v.winner === -1 ? 'Nobody wins. Draw.' : `${nm(v.winner)} wins!`;
    else if (v.step === 'flag') status = a === me ? 'Hide your flag: tap one of your two castles. Your opponent can\'t see which.' : `${nm(a)} is hiding their flag…`;
    else if (v.step === 'battle') status = 'Resolving the battles';
    else if (!myTurn) status = `${nm(a)} is moving…`;
    else if (!handEmpty) status = selCard ? 'Now tap one of your castles' : 'Place your cards: tap a card, then one of your castles';
    else if (selUnit) status = 'Tap a glowing space to move there';
    else if (movable) status = 'Tap a ringed unit, then where it goes. Then tap Resolve!';
    else status = 'All moved. Tap Resolve!';
    const phase = v.step === 'battle' ? 2 : 1;
    const mySel = selUnit && v.units.find(u => u.id === selUnit);
    let low = '';
    if (v.step !== 'battle') {
      if (mySel) low = `<div class="hand">${mySel.cards.slice().sort((x, y) => CT[y.type].power - CT[x.type].power).map(c => cardHTML(c, { small: true, attr: 'disabled' })).join('')}</div>`;
      else if (v.hand.length) low = `<div class="hand">${v.hand.slice().sort((x, y) => CT[y.type].power - CT[x.type].power).map(c => cardHTML(c, { sel: c.id === selCard, attr: myTurn ? `data-card="${c.id}"` : 'disabled' })).join('')}</div>`;
      else low = '<div class="hand"><small class="hint">No cards in hand</small></div>';
    }
    const deployMode = (myTurn && v.hand.length && selCard) || (v.step === 'flag' && a === me);
    return `<div class="screen game" style="--me:${col(me)}">
      <div class="topbar">${libraryLink()}<button class="chip menuchip" data-act="menu" aria-label="Menu">☰ Menu</button></div>
      <div class="main">
        <div class="boardwrap">${boardHTML(v, selUnit, reach, deployMode, movable)}</div>
        <div class="side">
          <div class="phases"><span class="who" style="background:${col(v.cur)}">${nm(v.cur)}'s turn</span><span class="ph ${phase === 1 ? 'on' : ''}">1 · Deploy &amp; Move</span><span class="ph ${phase === 2 ? 'on' : ''}">2 · Resolve</span></div>
          <div class="status">${esc(status)}</div>
          ${v.notice ? `<div class="notice">${esc(v.notice)}</div>` : ''}
          ${low}
          ${myTurn ? `<button class="big go ${v.hand.length ? 'off' : ''}" data-act="endmove">Resolve!</button>` : ''}
          <div class="deckline">Your deck ${v.deck[me]} · discard ${v.discard[me]} · ${nm(v.opp)}'s hand ${v.oppHand}</div>
        </div>
      </div>
      ${v.step === 'battle' ? battleHTML(v) : ''}
      ${v.step === 'over' ? sheet(`<h2 style="color:${v.winner >= 0 ? col(v.winner) : 'inherit'}">${v.winner === -1 ? 'Draw' : nm(v.winner) + ' wins!'}</h2><button class="big gold" data-act="again">Play again</button><button class="big ghost" data-act="home">Main Menu</button>`) : ''}
    </div>`;
  }

  function render() {
    clearTimeout(ui.timer);
    let h;
    if (ui.screen === 'home' || !ui.s) h = homeHTML();
    else if (needsCover()) h = coverHTML();
    else h = gameHTML();
    const rv = pendingReveal();
    app.innerHTML = h + (ui.menu && ui.screen === 'game' ? menuHTML() : '') + (ui.help ? helpHTML() : '') + (rv ? revealHTML(rv) : '');
    if (ui.screen === 'game' && ui.s && isBotTurn() && !needsCover()) {
      const s = ui.s, bot = 1 - ui.human;
      ui.timer = setTimeout(() => {
        const a = Bots.nextAction(E.viewFor(s, bot));
        const r = E.apply(s, a);
        if (!r.ok) console.error('bot move refused', a, r.error);
        save(); render();
      }, s.step === 'play' ? D.bot.quickMs : D.bot.thinkMs);
    }
  }

  function tapHex(k, unitId) {
    const s = ui.s, me = viewer(); if (s.step !== 'play' || actorNow() !== me) return;
    const v = E.viewFor(s, me), sel = ui.sel;
    if (sel && sel.t === 'card') { const cn = E.hexCastle[k]; if (cn && s.castles[cn].owner === me) act({ type: 'deploy', card: sel.id, castle: cn }); else { ui.sel = null; render(); } return; }
    if (sel && sel.t === 'unit') {
      const u = v.units.find(x => x.id === sel.id);
      if (u && !u.acted && E.reachable(v, u).indexOf(k) >= 0) { act({ type: 'move', unit: u.id, to: k }); return; }
    }
    const tu = unitId && v.units.find(x => x.id === Number(unitId));
    ui.sel = tu && tu.owner === me ? { t: 'unit', id: tu.id } : null; render();
  }

  app.addEventListener('click', e => {
    const t = e.target;
    const actEl = t.closest('[data-act]'), card = t.closest('[data-card]'), pick = t.closest('[data-pick]'), unit = t.closest('[data-unit]'), hex = t.closest('[data-hex]');
    if (actEl && actEl.dataset.act !== 'none') {
      const a = actEl.dataset.act;
      if (a === 'mode-ai') newGame('ai'); else if (a === 'mode-pass') newGame('pass');
      else if (a === 'continue') cont();
      else if (a === 'help') { ui.help = true; render(); } else if (a === 'closehelp') { ui.help = false; render(); }
      else if (a === 'menu') { ui.menu = true; render(); } else if (a === 'closemenu') { ui.menu = false; render(); }
      else if (a === 'home') { ui.screen = 'home'; ui.menu = false; ui.help = false; render(); }
      else if (a === 'again') newGame(ui.mode);
      else if (a === 'uncover') { ui.seen = actorNow(); render(); }
      else if (a === 'endmove') { if (!actEl.classList.contains('off')) act({ type: 'endMove' }); }
      else if (a === 'bc') act({ type: 'continue' });
      else if (a === 'revack') { const r = pendingReveal(); if (r) ui.revN = r.n; render(); }
      return;
    }
    if (ui.help || ui.menu) return;
    if (pick) { act({ type: 'play', card: pick.dataset.pick }); return; }
    if (card) { ui.sel = ui.sel && ui.sel.id === card.dataset.card ? null : { t: 'card', id: card.dataset.card }; render(); return; }
    const s = ui.s;
    if (s && s.step === 'flag' && actorNow() === viewer() && hex) { const cn = E.hexCastle[hex.dataset.hex]; if (cn) act({ type: 'flag', castle: cn }); return; }
    if (hex || unit) { tapHex((unit || hex).dataset.hex, unit && unit.dataset.unit); }
  });

  render();
  if (typeof window !== 'undefined') window.WAR = { ui, render, newGame };
})();
</script>
</body>
</html>
