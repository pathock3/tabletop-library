<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<style>
:root {
  --bg0: #05040f; --bg1: #0b0824; --bg2: #15103a;
  --violet: #7d5cff; --violet2: #a58bff; --line: rgba(150,128,255,.22);
  --text: #efeaff; --dim: #9d93c9; --faint: #6f66a3;
  --spark: #ff7a1c; --spark2: #ffb347; --teal: #3df2d0; --magenta: #ff5cc4; --amber: #ffc24a;
  --panel: rgba(24,18,66,.78);
  --cw: 100px; --ch: 140px; --sc: 44px; --pw: 56px; --ph: 78px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; width: 100%; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg0); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Segoe UI, Roboto, sans-serif; touch-action: manipulation; }
#app { position: absolute; inset: 0; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
input { font: inherit; }

/* ---------- the cave ---------- */
#bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(ellipse 90% 55% at 50% -8%, rgba(120,80,255,.34), transparent 70%),
    radial-gradient(ellipse 55% 40% at 8% 104%, rgba(61,242,208,.13), transparent 70%),
    radial-gradient(ellipse 55% 40% at 95% 100%, rgba(255,92,196,.13), transparent 70%),
    linear-gradient(#0b0825, #05040f 80%); }
#bg svg { position: absolute; left: 0; width: 100%; display: block; }
#bg .teeth { top: -2px; height: 15%; min-height: 60px; fill: #04030c; filter: drop-shadow(0 6px 14px rgba(125,92,255,.28)); }
#bg .floor { bottom: -2px; height: 11%; min-height: 40px; fill: #04030c; }
#bg .dust i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #c9b8ff; opacity: .0; animation: dust 9s ease-in-out infinite; }
@keyframes dust { 0%,100% { opacity: 0; transform: translateY(0); } 35% { opacity: .5; } 70% { opacity: .15; transform: translateY(-34px); } }
.rm #bg .dust i, .rm * { animation: none !important; }
.rm .card, .rm .flipper { transition-duration: .01s !important; transition-delay: 0s !important; }

#world { position: absolute; inset: 0; }
#view { position: absolute; inset: 0; }
#cards { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 7; overflow: hidden; }
#overlay { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#overlay > * { pointer-events: auto; }
#world.shake { animation: shake .55s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%,90% { transform: translate(-2px,1px); } 20%,80% { transform: translate(5px,-3px); } 30%,50%,70% { transform: translate(-9px,4px); } 40%,60% { transform: translate(9px,-4px); } }

/* ---------- the table ---------- */
.stage { position: absolute; inset: 0; display: grid; grid-template-rows: auto auto minmax(0,1fr); gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px); }
.topbar { position: relative; display: flex; align-items: center; min-height: 52px; }
.menu { width: 36px; height: 36px; border-radius: 50%; background: rgba(30,22,80,.7); border: 1px solid var(--line); color: var(--dim); font-size: 18px; line-height: 1; display: grid; place-items: center; z-index: 2; }
.seats.tight .seat { padding: 6px 7px; gap: 6px; }
.seats.tight .nm { font-size: 11px; }
.seats.tight .sub { display: none; }
.hint { position: absolute; left: 68px; right: 68px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: var(--dim); letter-spacing: .2px; pointer-events: none; }
.hint b { color: var(--spark2); font-weight: 600; }

.seats { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols), minmax(0,1fr)); }
.seats.n2 { --cols: 2; } .seats.n3 { --cols: 3; } .seats.n4 { --cols: 4; } .seats.n5 { --cols: 5; } .seats.n6 { --cols: 6; }
@media (max-aspect-ratio: 1/1) { .seats.n4 { --cols: 2; } .seats.n5, .seats.n6 { --cols: 3; } }
.seat { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-width: 0; border-radius: 16px;
  background: linear-gradient(160deg, rgba(36,28,92,.82), rgba(14,10,42,.9)); border: 1.5px solid rgba(150,128,255,.16);
  opacity: .78; transition: border-color .3s, box-shadow .3s, opacity .3s; }
.seat.cur { opacity: 1; border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 26px -2px var(--c), inset 0 0 22px -8px var(--c); }
.pilezone { flex: none; width: var(--pw); height: var(--ph); border-radius: 10px; border: 1.5px dashed rgba(150,128,255,.2); }
.seat.can .pilezone { border-color: var(--c); border-style: solid; box-shadow: 0 0 14px -2px var(--c); animation: cue 1.6s ease-in-out infinite; }
@keyframes cue { 50% { box-shadow: 0 0 22px 0 var(--c); } }
.sinfo { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.nm { font-weight: 700; font-size: 14px; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
.sub { font-size: 11px; color: var(--dim); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score { font-weight: 800; font-size: var(--sc); line-height: .95; color: #fff; font-variant-numeric: tabular-nums; font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  text-shadow: 0 0 20px var(--c), 0 2px 0 rgba(0,0,0,.4); white-space: nowrap; }
.score small { font-size: .34em; font-weight: 700; color: var(--dim); text-shadow: none; margin-left: 3px; }
.score.bump { animation: bump .32s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }

.felt { position: relative; min-height: 0; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; padding: 12px; border-radius: 26px;
  background: radial-gradient(ellipse at 50% 45%, rgba(74,52,170,.34), rgba(10,8,34,.6) 72%); border: 1px solid var(--line);
  box-shadow: inset 0 0 70px rgba(0,0,0,.55), 0 0 44px rgba(90,60,220,.16); }
/* The draw pile is the thing you tap most, so it lives in the bottom-right corner, under the right thumb (Settings can mirror it to the left).
   The boom pile, which you only look at, sits opposite, at the top. */
.felt > .zboom { grid-column: 1; grid-row: 1; align-self: start; }
.felt > .ztable { grid-column: 2; grid-row: 1; }
.felt > .zdraw { grid-column: 3; grid-row: 1; align-self: end; }
.felt.lefty > .zboom { grid-column: 3; }
.felt.lefty > .zdraw { grid-column: 1; }
@media (max-aspect-ratio: 1/1) {
  .felt { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0,1fr) auto; }
  .felt > .ztable { grid-column: 1 / 3; grid-row: 1; }
  .felt > .zboom { grid-column: 1; grid-row: 2; justify-self: start; align-self: end; }
  .felt > .zdraw { grid-column: 2; grid-row: 2; justify-self: end; align-self: end; }
  .felt.lefty > .zboom { grid-column: 2; justify-self: end; }
  .felt.lefty > .zdraw { grid-column: 1; justify-self: start; }
}
.zone { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.zdraw, .zboom { padding: 2px 6px; }
.zdraw { padding: 8px 12px 4px; }
.zdraw::before { content: ""; position: absolute; inset: -10px; }      /* a generous thumb target around the pile */
.zboom { min-width: calc(var(--cw) * 1.6); }
.zboom .well { margin: calc(var(--ch) * .1) 0 calc(var(--ch) * .14); }
.zdraw { min-width: calc(var(--cw) * 1.25); }
.well { position: relative; width: var(--cw); height: var(--ch); border-radius: calc(var(--cw) * .1); border: 2px dashed rgba(150,128,255,.25); }
.zdraw .well { border-color: rgba(150,128,255,.35); }
.zdraw.can .well { border-style: solid; border-color: rgba(255,179,71,.75); box-shadow: 0 0 22px -2px rgba(255,150,40,.4); }
.stackedge { position: absolute; left: 3%; right: 3%; top: calc(100% - 2px); height: var(--t, 0px); border-radius: 0 0 5px 5px;
  background: repeating-linear-gradient(180deg, #2a2070 0 1px, #120d3b 1px 2.5px); box-shadow: 0 6px 12px rgba(0,0,0,.5); transition: height .3s; }
.zdraw .zcount { margin-top: 14px; }
.zcount { font-size: 15px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.zcount b { font-size: 24px; color: var(--text); font-weight: 800; }
.zboom .zcount b { color: var(--spark2); }
.pips { display: flex; gap: 5px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: rgba(150,128,255,.18); transition: background .3s, box-shadow .3s; }
.pips i.gone { display: none; }
.pips i.on { background: var(--spark); box-shadow: 0 0 9px 1px var(--spark); }
.riffle .well { animation: riffle .6s ease-in-out; }
@keyframes riffle { 25% { transform: rotate(-3deg) scale(1.04); } 60% { transform: rotate(3deg) scale(1.04); } }
.ztable { align-self: stretch; min-height: 0; border-radius: 20px; }
.ztable.has { box-shadow: inset 0 0 40px -10px rgba(255,194,74,.28); }
.risk { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 13px; color: var(--amber); opacity: .9; letter-spacing: .3px; pointer-events: none; }
.risk b { font-size: 17px; margin-right: 3px; }

/* ---------- cards ---------- */
.card { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); will-change: transform; transform-origin: 50% 50%;
  transition: transform var(--dur, .42s) cubic-bezier(.2,.85,.25,1.06) var(--delay, 0s), opacity .25s linear var(--delay, 0s); }
.notrans .card, .notrans .card .flipper { transition: none !important; }
.lift { width: 100%; height: 100%; }
.lift.hop { animation: hop .52s ease-out var(--delay, 0s) backwards; }
@keyframes hop { 0% { transform: scale(1); } 35% { transform: scale(1.16) translateY(-10px); } 70% { transform: scale(.97); } 100% { transform: scale(1); } }
.flipper { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .42s ease var(--delay, 0s); transform: perspective(700px) rotateY(180deg); }
.card.up .flipper { transform: perspective(700px) rotateY(0deg); }
.face { position: absolute; inset: 0; border-radius: calc(var(--cw) * .1); overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 2px 0 rgba(0,0,0,.45), 0 8px 16px rgba(0,0,0,.5); }
.face.back { transform: rotateY(180deg); background: linear-gradient(155deg, #30237c, #130e3c 75%); border: calc(var(--cw) * .03) solid #4a3a9e; }
.face.back::before { content: ""; position: absolute; inset: 7%; border-radius: calc(var(--cw) * .06); border: 1.5px solid rgba(165,139,255,.5);
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 5px, transparent 5px 10px), repeating-linear-gradient(-45deg, rgba(255,255,255,.045) 0 5px, transparent 5px 10px); }
.face.back svg { position: absolute; left: 22%; top: 24%; width: 56%; opacity: .9; }
.face.front { background: radial-gradient(ellipse at 50% 42%, var(--gl) 0, transparent 66%), linear-gradient(165deg, #261c60, #0e0a2d 78%); border: calc(var(--cw) * .03) solid var(--edge); }
.face.front svg.gem { position: absolute; left: 12%; top: 15%; width: 76%; filter: drop-shadow(0 0 calc(var(--cw) * .07) var(--edge)); }
.face.front .sparkle { position: absolute; left: 20%; top: 18%; width: 18%; height: 18%; background: radial-gradient(circle, #fff, transparent 70%); opacity: .0; animation: glint 4.4s ease-in-out infinite; }
@keyframes glint { 0%,70%,100% { opacity: 0; transform: scale(.4); } 82% { opacity: .95; transform: scale(1.1); } }
.c0 { --gl: rgba(61,242,208,.4); --edge: #3df2d0; }
.c1 { --gl: rgba(255,92,196,.4); --edge: #ff5cc4; }
.c2 { --gl: rgba(255,194,74,.4); --edge: #ffc24a; }
.c3 { --gl: rgba(94,170,255,.42); --edge: #5eaaff; }
.boom .face.front { background: radial-gradient(circle at 50% 46%, #ffd37a 0, #ff7a1c 34%, #8f2200 74%, #2b0700 100%); border: calc(var(--cw) * .03) solid #ffcf8a; }
.boom .face.front svg.bomb { position: absolute; left: 8%; top: 12%; width: 84%; }
.boom .face.front .lbl { position: absolute; left: 0; right: 0; bottom: 5%; text-align: center; font-weight: 900; font-size: calc(var(--cw) * .15); letter-spacing: 1.5px; color: #3a0d00; text-shadow: 0 1px 0 rgba(255,220,160,.6); }
.bomb .spark { transform-origin: 79px 10px; animation: fuse .5s ease-in-out infinite alternate; }
@keyframes fuse { from { transform: scale(.8) rotate(-12deg); opacity: .8; } to { transform: scale(1.25) rotate(14deg); opacity: 1; } }
.ash { position: absolute; inset: 0; background: rgba(12,9,32,.62); opacity: 0; transition: opacity .3s; pointer-events: none; }
.card.lost .ash { opacity: 1; }
.card.lost .face.front svg.gem { filter: grayscale(1) brightness(.7); }
.card.atrisk .face.front { box-shadow: 0 0 0 2px rgba(255,194,74,.55), 0 0 20px rgba(255,194,74,.38), 0 8px 16px rgba(0,0,0,.5); }
.card.bang .lift { animation: bang .75s cubic-bezier(.2,1.3,.4,1) backwards; }
@keyframes bang { 0% { transform: scale(.6); } 38% { transform: scale(1.38); } 100% { transform: scale(1.08); } }
.card.boom.up .face.front { box-shadow: 0 0 0 2px rgba(255,160,60,.6), 0 0 34px rgba(255,110,20,.75), 0 8px 16px rgba(0,0,0,.5); }

/* ---------- banners, effects ---------- */
#banner { position: absolute; text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
#banner .big { animation-delay: .28s; font-size: clamp(40px, 10vmin, 104px); font-weight: 900; letter-spacing: 3px; line-height: 1; color: #fff3da; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  background: linear-gradient(#fff3c4, #ffa43a 55%, #ff5a10); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(255,110,20,.8)) drop-shadow(0 4px 0 rgba(60,10,0,.6)); animation: boomtext .6s cubic-bezier(.2,1.4,.4,1) backwards; }
@keyframes boomtext { 0% { transform: scale(.3) rotate(-6deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
#banner .lostn { font-size: clamp(15px, 3vmin, 24px); font-weight: 700; color: var(--spark2); text-shadow: 0 2px 8px #000; }
#banner .saved { font-size: clamp(20px, 4.2vmin, 38px); font-weight: 800; color: var(--c); text-shadow: 0 0 18px var(--c), 0 2px 8px #000; animation: boomtext .5s cubic-bezier(.2,1.4,.4,1) backwards; }
#banner .go { font-size: 13px; color: var(--dim); text-shadow: 0 2px 8px #000; animation: breathe 1.8s ease-in-out infinite; margin-top: 6px; }
@keyframes breathe { 50% { opacity: .45; } }
@media (max-height: 520px) { #banner { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; } #banner .big { font-size: 34px; } #banner .go { margin: 0; } }
.flash { position: absolute; inset: 0; background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), rgba(255,246,214,.95), rgba(255,140,40,.55) 28%, transparent 68%); animation: flash .65s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.sp { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: radial-gradient(circle, #fff6c8, #ff8a1f 60%, transparent 72%); animation: spark .8s cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes spark { from { transform: translate(0,0) scale(1.3); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.1); opacity: 0; } }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain;
  padding: calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 18px); }
.sheet { max-width: 680px; margin: 0 auto; }
h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .3px; }
h2 { margin: 20px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--dim); font-weight: 700; }
h3 { margin: 18px 0 4px; color: var(--spark2); font-size: 16px; }
p.lead { color: var(--dim); margin: 0 0 12px; }
.back { display: inline-block; margin: -6px 0 10px; padding: 8px 0; color: var(--dim); font-size: 14px; text-decoration: none; }
.dim { color: var(--dim); font-size: 13px; }
.seg { display: inline-flex; background: rgba(24,18,66,.8); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { padding: 10px 16px; border-radius: 9px; font-weight: 700; color: var(--dim); min-width: 44px; }
.seg button.on { background: linear-gradient(135deg, #8e6cff, #c55cff); color: #fff; box-shadow: 0 0 14px -2px rgba(150,100,255,.8); }
.seg.small button { padding: 7px 11px; font-size: 14px; }
.seatrow { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; padding: 10px 12px; border-radius: 16px; background: rgba(24,18,66,.55); border: 1px solid var(--line); }
.seatrow .dot { width: 20px; height: 20px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 14px var(--c); }
.seatrow input { flex: 1 1 90px; min-width: 0; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: rgba(8,6,28,.7); color: var(--text); user-select: text; -webkit-user-select: text; }
.seatrow .kinds { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bigbtn { display: block; width: 100%; margin-top: 22px; padding: 17px; border-radius: 16px; background: linear-gradient(135deg, #8e6cff, #d25cff 70%, #ff5cc4); color: #fff; font-weight: 800; font-size: 20px; letter-spacing: .3px;
  box-shadow: 0 0 28px -4px rgba(170,100,255,.8), 0 5px 0 rgba(30,10,80,.7); }
.bigbtn:active { transform: translateY(3px); box-shadow: 0 0 22px -4px rgba(170,100,255,.8), 0 2px 0 rgba(30,10,80,.7); }
.bigbtn.alt { background: rgba(30,22,80,.8); border: 1px solid var(--line); box-shadow: 0 5px 0 rgba(0,0,0,.35); color: var(--text); }
.bigbtn.danger { background: linear-gradient(135deg, #ff7a1c, #e0261c); }
.ghost { margin-top: 10px; padding: 12px 18px; border-radius: 13px; background: rgba(30,22,80,.7); border: 1px solid var(--line); font-weight: 700; color: var(--text); }

/* home */
.home { display: flex; align-items: center; justify-content: center; }
.hero { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.fan { position: relative; width: 300px; height: calc(var(--hh, 150px) + 30px); margin-bottom: 4px; }
.fan .hc { position: absolute; left: 50%; top: 18px; width: var(--hw, 108px); height: var(--hh, 150px); margin-left: calc(var(--hw, 108px) / -2); transform-origin: 50% 120%; transform: rotate(var(--r)) translateX(var(--x)); animation: floaty 5s ease-in-out infinite; animation-delay: var(--d); }
@keyframes floaty { 50% { translate: 0 -8px; } }
.fan .hc .face { backface-visibility: visible; -webkit-backface-visibility: visible; --cw: var(--hw, 108px); }
.logo { margin: 8px 0 0; font-size: clamp(54px, 13vmin, 110px); line-height: .95; font-weight: 900; letter-spacing: -1px; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; white-space: nowrap; }
.logo .w { background: linear-gradient(95deg, #b8fff5, #b79bff 50%, #ff8ad6); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 24px rgba(125,92,255,.6)); }
.logo .dots { color: var(--spark); text-shadow: 0 0 18px var(--spark); animation: fusepulse 1.2s ease-in-out infinite; margin-left: 2px; }
@keyframes fusepulse { 50% { opacity: .55; text-shadow: 0 0 6px var(--spark); } }
.tag { color: var(--dim); font-size: 17px; margin: 10px 0 20px; }
.mode { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 360px; margin-top: 12px; padding: 17px 20px; border-radius: 18px; background: rgba(30,22,80,.75); border: 1.5px solid var(--line); font-weight: 800; font-size: 22px; box-shadow: 0 5px 0 rgba(0,0,0,.4); }
.mode.primary { background: linear-gradient(135deg, #8e6cff, #d25cff 70%, #ff5cc4); border-color: transparent; box-shadow: 0 0 34px -4px rgba(170,100,255,.85), 0 5px 0 rgba(30,10,80,.7); }
.mode:active { transform: translateY(3px); }
.ghostrow { display: flex; gap: 10px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.ver { margin-top: 18px; color: var(--faint); font-size: 12px; }

<!-- =====================================================================
     DATA BLOCK — every rule, point value, the deck, the computer styles, the texts and the sound recipes live here.
     The logic below (engine / bots / sound / ui) reads this object and nothing else.
     ===================================================================== -->
<script id="data">
const GAME_DATA = {
  // Where the Tabletop Library's front page is (relative to this file). Shown only when hosted over http(s).
  library: { name: 'Tabletop Library', href: '../../index.html' },
  title: 'One More…',

  // 2-6 people on one device; each seat is a person or a computer.
  players: { min: 2, max: 6 },

  // ---- THE DECK ---------------------------------------------------------
  // 38 gem cards (one gem each) and 6 boom cards, shuffled together face down. A card is just a number:
  // 0 .. gems-1 are gems, the rest are booms. 'colours' only picks how a gem is drawn - every gem is worth 1.
  deck: { gems: 38, booms: 6, colours: 4 },

  // ---- RULES ------------------------------------------------------------
  // With exactly 'race.players' players the first to SAVE 'race.target' gems wins (all gems saved with neither there = a tie).
  // With more players the game ends when every gem is saved; most gems wins. The refresh needs no number: it happens when
  // the last boom is drawn (every boom is out), or when only booms are left in the draw pile. Each refresh also takes boom cards out of the game for good.
  rules: {
    race: { players: 2, target: 20 },
    minBooms: 1,                            // ...but there are never fewer than this many boom cards: the game needs one
    boomsRemovedPerRefresh: 1,              // each time the draw pile is used up and everything unsaved is shuffled back in, this many boom cards are taken out of the game for good
  },

  // The "Booby Prizes" expansion (16 prize cards) is not built: the rulebook does not say what the cards do.
  // This is where a prize deck would be described if it ever is.
  expansions: { boobyPrizes: { available: false, cards: 0 } },

  // ---- COMPUTER OPPONENTS -----------------------------------------------
  // A computer keeps digging while the odds beat the risk: with G gems and B booms left in the draw pile and g gems at
  // risk this turn, it draws again if G/(G+B) > g'/(g'+1), where g' = g / risk. A higher 'risk' number = bolder.
  styles: [
    { id: 'careful', name: 'Careful', risk: 0.75, blurb: 'Saves early' },
    { id: 'steady',  name: 'Steady',  risk: 1,    blurb: 'Plays the odds' },
    { id: 'daring',  name: 'Daring',  risk: 1.3,  blurb: 'Digs for one more' },
  ],
  bots: {
    defaultStyle: 'steady',
    // In a two-player race: bolder when the opponent is within 'near' gems of the target, calmer when it is 'far' or more away.
    race: { near: 4, nearRisk: 1.35, far: 12, farRisk: 0.85 },
  },

  // ---- SEATS & PACE -----------------------------------------------------
  // Each person keeps their colour for the whole evening.
  seatColours: ['#3df2d0', '#ff5cc4', '#ffc24a', '#5eaaff', '#b79bff', '#b7f24a'],
  defaultNames: ['You', 'Player 2', 'Player 3', 'Player 4', 'Player 5', 'Player 6'],
  setup: { defaultSeats: [{ kind: 'human' }, { kind: 'computer', style: 'steady' }], maxName: 12 },

  // Milliseconds. Only animations and a computer's moves use these; nothing else moves on its own.
  pace: {
    botStart: 350,        // a computer starts its turn this long after the turn reaches it
    botDraw: 480,         // between a computer's draws
    botSave: 450,         // from its last draw to saving
    afterSave: 450,       // after a person saves, before a computer next to them starts
    botTension: 2.5,      // a computer slows down as it nears the moment it stops or goes boom: each draw waits up to this many times longer (1 + this) ...
    botTensionBy: 3,      // ... by (cards at risk x the chance the next card is a boom x this), at most 1
    boomAutoMs: 1100,     // after a boom shows (yours or a computer's), the table clears itself this long afterwards: nobody has to tap
    boomGuardMs: 450,     // taps this soon after a boom are ignored, so a fast digger does not skip the boom by accident
    overDelay: 1100,      // from the last save to the game-over screen
    countStep: 85,        // between gems landing in a pile (the score counts up with them)
  },

  // ---- TEXT -------------------------------------------------------------
  texts: {
    hintDig: 'Tap the pile to dig.',
    hintMore: 'Dig again, or tap Bank to save.',
    judgments: [
      'Who starts: the seat order is shuffled at random when a game begins (the rulebook says "randomly determine a turn order"). A rematch uses the rulebook’s order instead: fewest gems first, then second fewest, and so on; in a two-player game the loser goes first (after a tie, the one who went second).',
      'Refresh when only booms remain: the rulebook lets you refresh when you notice every card left is a boom. Here it happens by itself at that moment, because declining is never better. The gems you have at risk stay on the table and are not shuffled in; it only happens if the shuffle brings at least one gem back.',
      'Every refresh shuffles all cards nobody has saved (the boom pile, lost gems, the draw pile) but never the cards on the table in the current turn.',
      'When the 6th (final) boom is drawn it stays on the table until you tap; the refresh happens as the turn passes.',
      'A boom stays on the table until you tap, so everyone sees it. Taps in the first moment after a boom are ignored so a quick digger cannot skip it by accident.',
      'The game end is checked after every save: in a two-player game when someone has saved 20 gems (or all 38 are saved at 19–19, a tie); with 3–6 players when all 38 gems are saved.',
      'Ties: a tie for the most gems with 3–6 players is a shared win. In a two-player game 19–19 is a tie.',
      'You may draw as many cards in a turn as you like; there is no limit. Saving with nothing drawn is not possible.',
      'Computers see only what players at a table can: how many cards are in the draw pile, how many booms are out, their own gems at risk and everyone’s saved gems. Careful saves earlier, Daring digs longer, Steady plays the odds; in a two-player race they take more risk when the other side is close to 20 and less when it is far away.',
      'Not included: the drinking variant, and the Booby Prizes expansion (the rulebook does not list what its 16 cards do).',
    ],
  },

  // ---- SOUND ------------------------------------------------------------
  // Every sound is built from a few synthesised voices (no audio files, so the game stays one file and works offline).
  // A voice: w = wave ('sine' | 'triangle' | 'square' | 'sawtooth' | 'noise'), f = pitch in Hz (or [from, to] for a glide),
  // at = start (s), d = length (s), g = loudness (0-1), lp / hp = low-/high-pass filter (Hz), a = attack (s, default 0.006).
  // 'rate' on a play call multiplies pitch: 'clink' climbs through run.scale (semitones) with each gem of a run.
  sound: {
    master: 0.5,              // overall level (the device volume still rules)
    maxVoices: 28,            // never more than this many voices sounding at once
    minGapMs: 40,             // the same sound is not retriggered faster than this
    run: { scale: [0, 2, 4, 7, 9, 12, 14, 16] },     // pentatonic steps, in semitones, for a run of gems (the top step repeats)
    sounds: {
      draw:   [{ w: 'noise', f: 0, at: 0, d: 0.06, g: 0.16, hp: 1500, lp: 6000 }, { w: 'triangle', f: [260, 150], at: 0, d: 0.09, g: 0.16 }],
      glint:  [{ w: 'sine', f: 523, at: 0, d: 0.3, g: 0.15 }, { w: 'sine', f: 785, at: 0.025, d: 0.24, g: 0.07 }, { w: 'triangle', f: 262, at: 0, d: 0.12, g: 0.05 }],
      clink:  [{ w: 'sine', f: 659, at: 0, d: 0.22, g: 0.1 }, { w: 'sine', f: 988, at: 0.02, d: 0.18, g: 0.05 }],
      save:   [{ w: 'noise', f: 0, at: 0, d: 0.16, g: 0.05, hp: 6500 }, { w: 'triangle', f: 784, at: 0, d: 0.3, g: 0.14 }, { w: 'triangle', f: 1047, at: 0.07, d: 0.34, g: 0.14 }, { w: 'sine', f: 1568, at: 0.14, d: 0.5, g: 0.1 }, { w: 'sine', f: 2093, at: 0.2, d: 0.5, g: 0.05 }],
      boom:   [{ w: 'noise', f: 0, at: 0, d: 0.12, g: 0.14, hp: 2500 }, { w: 'noise', f: 0, at: 0, d: 0.9, g: 0.26, lp: 1400 }, { w: 'sine', f: [170, 45], at: 0, d: 0.7, g: 0.26 }, { w: 'sawtooth', f: [220, 60], at: 0, d: 0.35, g: 0.08, lp: 700 }],
      rumble: [{ w: 'noise', f: 0, at: 0.05, d: 1.3, g: 0.2, lp: 220, a: 0.15 }, { w: 'triangle', f: [62, 40], at: 0.05, d: 1.2, g: 0.2, a: 0.1 }],
      refresh: [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => ({ w: 'noise', f: 0, at: i * 0.045, d: 0.05, g: 0.09, hp: 2200, lp: 6500 })).concat([{ w: 'triangle', f: [200, 420], at: 0, d: 0.42, g: 0.06 }]),
      win:    [{ w: 'triangle', f: 523, at: 0, d: 0.3, g: 0.2 }, { w: 'triangle', f: 659, at: 0.13, d: 0.3, g: 0.2 }, { w: 'triangle', f: 784, at: 0.26, d: 0.3, g: 0.2 }, { w: 'triangle', f: 1047, at: 0.4, d: 0.9, g: 0.2 }, { w: 'sine', f: 1319, at: 0.4, d: 0.9, g: 0.1 }, { w: 'sine', f: 1568, at: 0.4, d: 0.9, g: 0.08 }, { w: 'sine', f: 2093, at: 0.55, d: 0.7, g: 0.05 }],
      tie:    [{ w: 'triangle', f: 392, at: 0, d: 0.3, g: 0.16 }, { w: 'triangle', f: 392, at: 0.2, d: 0.3, g: 0.16 }, { w: 'triangle', f: 523, at: 0.4, d: 0.7, g: 0.18 }],
      lose:   [{ w: 'triangle', f: 392, at: 0, d: 0.34, g: 0.15 }, { w: 'triangle', f: 330, at: 0.22, d: 0.34, g: 0.15 }, { w: 'triangle', f: 262, at: 0.44, d: 0.7, g: 0.15 }],
      tick:   [{ w: 'sine', f: 880, at: 0, d: 0.04, g: 0.1 }],
    },
  },
};
</script>

<!-- =====================================================================
     ENGINE — pure rules, no DOM.  Reads GAME_DATA (or a copy passed in).
     ===================================================================== -->
<script id="engine">
const Engine = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  const fail = msg => { throw new Error('Illegal: ' + msg); };

  // Seeded RNG whose position can be saved and restored (so a saved game continues exactly where it stopped).
  function mulberry32(seed) {
    let a = seed >>> 0;
    const next = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.getState = () => a;
    next.setState = v => { a = v >>> 0; };
    return next;
  }

  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ---------------- the deck ----------------
  // Card ids 0 .. gems-1 are gems, gems .. gems+booms-1 are booms. The draw pile is an array whose LAST card is the top.
  const isBoom = (s, id) => id >= s.data.deck.gems;
  const gemTotal = s => s.data.deck.gems;
  const boomTotal = s => s.data.deck.booms - s.gone.length;          // booms still in the game (some are taken out at each refresh)
  const colourOf = (s, id) => id % s.data.deck.colours;           // how a gem is drawn; no effect on play
  const cardCount = s => s.data.deck.gems + s.data.deck.booms - s.gone.length;

  // ---------------- creation ----------------
  function createGame(opts = {}) {
    const data = clone(opts.data || GAME_DATA);
    const n = opts.players || data.players.min;
    if (n < data.players.min || n > data.players.max) fail('player count ' + n);
    const rng = opts.rng || (opts.seed !== undefined ? mulberry32(opts.seed) : Math.random);
    const total = data.deck.gems + data.deck.booms;
    const s = {
      data, rules: data.rules, rng, n,
      draw: shuffle(Array.from({ length: total }, (_, i) => i), rng),   // face-down draw pile
      gone: [],                              // boom cards taken out of the game at refreshes
      boomPile: [],                          // cards from busted turns; the booms are face up, so how many are out is public
      table: [],                             // the gems the current player has drawn this turn (at risk)
      safe: Array.from({ length: n }, () => []),   // each player's saved gems
      current: 0, turnNo: 0,
      phase: 'turn',                         // 'turn' (dig or save) | 'boomed' (a boom is showing; the next step is to pass) | 'over'
      lastBoom: null,                        // { card, lost: [gem ids] } while phase is 'boomed'
      refreshes: 0, over: false, result: null,
    };
    return s;
  }

  // Seat order for a new game: the rulebook says to randomly determine a turn order.
  function randomOrder(n, rng) { return shuffle(Array.from({ length: n }, (_, i) => i), rng || Math.random); }

  // ---------------- queries ----------------
  const scores = s => s.safe.map(p => p.length);
  const savedTotal = s => s.safe.reduce((k, p) => k + p.length, 0);
  const boomsOut = s => s.boomPile.filter(c => isBoom(s, c)).length;
  const counts = s => {
    const boomsInDraw = s.draw.filter(c => isBoom(s, c)).length;
    return { drawCount: s.draw.length, boomsInDraw, gemsInDraw: s.draw.length - boomsInDraw, boomsOut: boomsOut(s), atRisk: s.table.length, saved: savedTotal(s) };
  };
  const race = s => !!s.rules.race && s.n === s.rules.race.players;
  const canDraw = s => !s.over && s.phase === 'turn' && s.draw.length > 0;
  const canSave = s => !s.over && s.phase === 'turn' && s.table.length > 0;
  const canPass = s => !s.over && s.phase === 'boomed';

  // ---------------- refresh ----------------
  // Shuffle every card nobody has saved (boom pile + draw pile) into a new draw pile. The cards on the table stay there.
  function refresh(s) {
    s.draw = shuffle(s.boomPile.concat(s.draw), s.rng);
    s.boomPile = [];
    for (let k = 0; k < (s.rules.boomsRemovedPerRefresh || 0); k++) { if (boomTotal(s) <= s.rules.minBooms) break; const i = s.draw.findIndex(c => isBoom(s, c)); if (i < 0) break; s.gone.push(s.draw.splice(i, 1)[0]); }          // a boom leaves the game each time through the deck, but the game always keeps at least `minBooms`
    s.refreshes++;
  }
  // The draw pile holds nothing but booms (or nothing): refresh at once, provided that brings at least one gem back.
  function autoRefresh(s) {
    if (s.over) return null;
    if (s.draw.some(c => !isBoom(s, c))) return null;
    if (!s.boomPile.some(c => !isBoom(s, c))) return null;
    refresh(s);
    return 'auto';
  }

  // ---------------- actions ----------------
  // Draw the top card. A gem joins the table; a boom ends the turn and loses this turn's gems (they go to the boom pile with it).
  function draw(s) {
    if (s.over) fail('the game is over');
    if (s.phase !== 'turn') fail('draw in phase ' + s.phase);
    if (!s.draw.length) fail('the draw pile is empty');
    const card = s.draw.pop();
    if (isBoom(s, card)) {
      const lost = s.table.slice();
      s.boomPile.push(...lost, card);
      s.table = [];
      s.lastBoom = { card, lost };
      s.phase = 'boomed';
      return { type: 'boom', seat: s.current, card, lost, final: boomsOut(s) === boomTotal(s) };
    }
    s.table.push(card);
    return { type: 'gem', seat: s.current, card, refreshed: autoRefresh(s) };
  }

  function checkOver(s) {
    const sc = scores(s);
    let reason = null;
    if (race(s) && sc.some(x => x >= s.rules.race.target)) reason = 'target';
    else if (savedTotal(s) === gemTotal(s)) reason = 'all-saved';
    if (!reason) return false;
    s.over = true; s.phase = 'over';
    s.result = computeResult(s, reason);
    return true;
  }

  // Save: the gems on the table become permanent and the turn ends.
  function save(s) {
    if (s.over) fail('the game is over');
    if (s.phase !== 'turn') fail('save in phase ' + s.phase);
    if (!s.table.length) fail('nothing to save');
    const seat = s.current, gems = s.table.slice();
    s.safe[seat].push(...gems);
    s.table = [];
    if (checkOver(s)) return { type: 'save', seat, gems, over: true, refreshed: null };
    return { type: 'save', seat, gems, over: false, refreshed: pass(s) };
  }

  // After a boom: pass the turn. If that was the last boom, refresh as the turn passes.
  function endTurn(s) {
    if (s.over) fail('the game is over');
    if (s.phase !== 'boomed') fail('there is nothing to pass');
    const final = boomsOut(s) === boomTotal(s);
    if (final) refresh(s);
    const refreshed = pass(s);
    return { type: 'pass', refreshed: final ? 'final' : refreshed };
  }

  function pass(s) {
    s.lastBoom = null;
    s.current = (s.current + 1) % s.n;
    s.turnNo++;
    s.phase = 'turn';
    return autoRefresh(s);
  }

  // ---------------- result, rematch ----------------
  function computeResult(s, reason) {
    const sc = scores(s), best = Math.max(...sc);
    const winners = sc.map((v, i) => (v === best ? i : -1)).filter(i => i >= 0);
    const order = sc.map((v, i) => i).sort((a, b) => sc[b] - sc[a] || a - b);
    const ranking = [];
    order.forEach((idx, k) => {
      const place = k > 0 && sc[idx] === ranking[k - 1].score ? ranking[k - 1].place : k + 1;
      ranking.push({ idx, score: sc[idx], place });
    });
    return { reason: reason || 'all-saved', scores: sc, winners, tie: winners.length > 1, ranking };
  }

  // Who sits where in the next game: fewest gems first, then second fewest, and so on (equal scores keep their order).
  // Two players: the loser first; after a tie, the player who went second goes first. Returns old seat numbers in the new turn order.
  function rematchOrder(result) {
    const sc = result.scores, n = sc.length;
    const idx = Array.from({ length: n }, (_, i) => i);
    if (n === 2 && sc[0] === sc[1]) return [1, 0];
    return idx.sort((a, b) => sc[a] - sc[b] || a - b);
  }

  // ---------------- views ----------------
  // What a player at the table may legitimately know. The ORDER of the draw pile is never in here - only how many cards
  // are in it, which follows from what is public (saved gems, the boom pile, the table) - and nothing about a hidden card.
  function publicView(s, idx) {
    const c = counts(s);
    return {
      n: s.n, me: idx, current: s.current, phase: s.phase, over: s.over, turnNo: s.turnNo,
      gemTotal: gemTotal(s), boomTotal: boomTotal(s),
      race: race(s), target: race(s) ? s.rules.race.target : null,
      drawCount: c.drawCount, gemsInDraw: c.gemsInDraw, boomsInDraw: c.boomsInDraw, boomsOut: c.boomsOut,
      table: s.table.length,
      scores: scores(s),
    };
  }

  // ---------------- save / resume ----------------
  const SAVE_SCHEMA = 1;
  // Identifies the rules a save was made under; a save from different rules (an updated data block) is not resumed.
  function fingerprint(s) {
    const str = JSON.stringify([s.data.deck, s.data.rules, s.data.players]);
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  // A plain-JSON snapshot of a game in progress (works at any moment, including with a boom showing).
  function serialize(s) {
    if (!s.rng.getState) fail('this game uses an RNG that cannot be saved');
    if (s.over) fail('a finished game is not saved');
    return JSON.parse(JSON.stringify({
      schema: SAVE_SCHEMA, fingerprint: fingerprint(s), n: s.n,
      draw: s.draw, boomPile: s.boomPile, table: s.table, safe: s.safe,
      current: s.current, turnNo: s.turnNo, phase: s.phase, lastBoom: s.lastBoom, refreshes: s.refreshes, gone: s.gone,
      rngState: s.rng.getState(),
    }));
  }

  // Rebuilds a game from serialize(); throws if the save is from another schema or other rules or is not a sensible game.
  function restore(saved, opts = {}) {
    if (!saved || saved.schema !== SAVE_SCHEMA) throw new Error('unknown save format');
    const s = createGame({ data: opts.data, players: saved.n, seed: 1 });
    if (fingerprint(s) !== saved.fingerprint) throw new Error('the rules changed since this game was saved');
    for (const k of ['draw', 'boomPile', 'table', 'safe', 'current', 'turnNo', 'phase', 'lastBoom', 'refreshes']) s[k] = saved[k];
    s.gone = saved.gone || [];
    s.rng.setState(saved.rngState);
    const all = s.draw.concat(s.boomPile, s.table, s.gone, ...s.safe).sort((a, b) => a - b);
    if (all.length !== s.data.deck.gems + s.data.deck.booms || all.some((c, i) => c !== i)) throw new Error('save does not match the game');
    if (s.safe.length !== s.n || !(s.current >= 0 && s.current < s.n) || !['turn', 'boomed'].includes(s.phase)) throw new Error('save does not match the game');
    return s;
  }

  return { createGame, randomOrder, draw, save, endTurn, refresh, autoRefresh, canDraw, canSave, canPass,
           scores, savedTotal, boomsOut, counts, isBoom, colourOf, computeResult, rematchOrder, publicView,
           serialize, restore, mulberry32, shuffle, boomTotal };
})();
</script>

<!-- =====================================================================
     BOTS — computer opponents.  They are given Engine.publicView only: never the order of the draw pile.
     ===================================================================== -->
<script id="bots">
const Bots = (() => {
  const styleOf = (id, data = GAME_DATA) => data.styles.find(x => x.id === id) || data.styles.find(x => x.id === data.bots.defaultStyle);

  // The whole decision, from the public view only (Engine.publicView): keep digging while the odds beat the risk.
  //   p = chance the next card is a gem = gemsInDraw / drawCount
  //   dig again if p > g' / (g' + 1), where g' = (gems at risk) / risk, risk being the style's boldness (higher = bolder).
  // Returns 'draw' or 'save'; it never returns an illegal move.
  function decide(view, styleId, data = GAME_DATA) {
    const me = view.me, g = view.table;
    if (g <= 0) return 'draw';                              // nothing to save yet: digging is the only move
    if (view.drawCount <= 0) return 'save';
    const style = styleOf(styleId, data), mine = view.scores[me];
    const others = view.scores.filter((v, i) => i !== me);
    const bestOther = others.length ? Math.max(...others) : 0;

    // Saving wins on the spot: the target is reached, or it ends the game with me in front.
    if (view.race && mine + g >= view.target) return 'save';
    const saved = view.scores.reduce((a, b) => a + b, 0);
    if (saved + g >= view.gemTotal && mine + g > bestOther) return 'save';

    const p = view.drawCount > 0 ? view.gemsInDraw / view.drawCount : 0;
    if (p <= 0) return 'save';                              // only booms are left: the next card is certain to be one

    let risk = style.risk;
    if (view.race) {                                        // a two-player race: how close is the other side to the target?
      const R = data.bots.race, need = view.target - bestOther;
      if (need <= R.near) risk *= R.nearRisk;
      else if (need >= R.far) risk *= R.farRisk;
    }
    const gEff = g / risk;
    return p > gEff / (gEff + 1) ? 'draw' : 'save';
  }

  function create({ style, data = GAME_DATA } = {}) {
    const id = styleOf(style, data).id;
    return { style: id, decide: view => decide(view, id, data) };
  }

  // Plays a whole game between computers (for the simulations and the tests). styles: one style id per seat.
  function playGame({ styles, seed = 1, data = GAME_DATA, maxSteps = 20000 } = {}) {
    const s = Engine.createGame({ data, players: styles.length, seed });
    let steps = 0, booms = 0;
    while (!s.over) {
      if (++steps > maxSteps) throw new Error('game did not finish');
      if (s.phase === 'boomed') { Engine.endTurn(s); continue; }
      const a = decide(Engine.publicView(s, s.current), styles[s.current], data);
      if (a === 'draw') { const r = Engine.draw(s); if (r.type === 'boom') booms++; } else Engine.save(s);
    }
    return { state: s, result: s.result, steps, booms, turns: s.turnNo };
  }

  return { decide, create, styleOf, playGame };
})();
</script>

<script id="sound">
/* =====================================================================
   SOUND — synthesised with Web Audio from the recipes in GAME_DATA.sound; no files, no network.
   Good manners built in: the audio context is only created/resumed inside a tap (iPad Safari insists), nothing plays while
   it is switched off, sounds are short and soft behind one master level and a gentle limiter, the same sound is not stacked
   on itself, the number of voices is capped, and it stops when the page is hidden. The iPad's silent switch still mutes it.
   ===================================================================== */
const Sound = (() => {
  function create({ data, AudioContext, now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now()) } = {}) {
    let ctx = null, master = null, noise = null, enabled = true, voices = 0;
    const lastAt = {}, played = [];

    function build() {
      if (ctx || !AudioContext) return;
      try { ctx = new AudioContext({ latencyHint: 'interactive' }); } catch (e) { try { ctx = new AudioContext(); } catch (e2) { ctx = null; return; } }
      try { wire(); } catch (e) { ctx = null; }                    // a browser with a half-working audio system just stays silent
    }
    function wire() {
      master = ctx.createGain(); master.gain.value = data.master;
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -14; limiter.knee.value = 24; limiter.ratio.value = 6; limiter.attack.value = 0.003; limiter.release.value = 0.2;
      master.connect(limiter); limiter.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 0.25), buf = ctx.createBuffer(1, len, ctx.sampleRate), ch = buf.getChannelData(0);
      let seed = 1; for (let i = 0; i < len; i++) { seed = (seed * 16807) % 2147483647; ch[i] = (seed / 2147483647) * 2 - 1; }     // fixed noise: the same "tak" every time
      noise = buf;
    }

    // Call from inside a tap/click: creates the context the first time and wakes it if the browser put it to sleep.
    function unlock() {
      if (!AudioContext) return false;
      build();
      if (ctx && ctx.state !== 'running' && ctx.resume) { try { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* ignore */ } }
      return !!ctx;
    }
    function suspend() { if (ctx && ctx.state === 'running' && ctx.suspend) { try { const r = ctx.suspend(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* ignore */ } } }

    function voice(v, t0, rate) {
      const t = t0 + (v.at || 0), a = v.a || 0.006, d = Math.max(0.02, v.d), peak = Math.min(1, v.g);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let src;
      if (v.w === 'noise') { src = ctx.createBufferSource(); src.buffer = noise; src.loop = true; }
      else {
        src = ctx.createOscillator(); src.type = v.w;
        const f = (Array.isArray(v.f) ? v.f : [v.f, v.f]).map(x => x * rate);
        src.frequency.setValueAtTime(f[0], t);
        if (f[1] !== f[0]) src.frequency.exponentialRampToValueAtTime(f[1], t + d);
      }
      let node = src;
      if (v.hp) { const h = ctx.createBiquadFilter(); h.type = 'highpass'; h.frequency.value = v.hp; node.connect(h); node = h; }
      if (v.lp) { const l = ctx.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = v.lp; node.connect(l); node = l; }
      node.connect(g); g.connect(master);
      voices++;
      src.onended = () => { voices--; try { g.disconnect(); } catch (e) { /* ignore */ } };
      src.start(t); src.stop(t + d + 0.03);
    }

    // opts.rate multiplies the pitch (1 = as written): a run of gems climbs by playing 'clink' at a rising rate.
    function play(name, opts) {
      const rate = opts && opts.rate > 0 ? opts.rate : 1;
      played.push(name); if (played.length > 200) played.shift();
      const recipe = data.sounds[name];
      if (!enabled || !recipe || !ctx || ctx.state !== 'running') return false;
      const ms = now();
      if (lastAt[name] !== undefined && ms - lastAt[name] < data.minGapMs) return false;
      if (voices + recipe.length > data.maxVoices) return false;
      lastAt[name] = ms;
      const t0 = ctx.currentTime + 0.005;
      try { recipe.forEach(v => voice(v, t0, rate)); } catch (e) { return false; }
      return true;
    }
    return { create, unlock, suspend, play, setEnabled: v => { enabled = !!v; }, isEnabled: () => enabled, played, get ready() { return !!ctx; } };
  }
  return { create };
})();
</script>

  function layoutCards(fresh) {
    const st = ui.st;
    if (!st || ui.screen !== 'play') return;
    ensureCards();
    const q = sel => view.querySelector(sel);
    const wellD = q('.zdraw .well');
    if (!wellD) return;
    const base = cardsEl.getBoundingClientRect();
    const R = el => { const r = el.getBoundingClientRect(); const x = r.left - base.left, y = r.top - base.top; return { x, y, w: r.width, h: r.height, cx: x + r.width / 2, cy: y + r.height / 2 }; };
    const zd = R(wellD), zb = R(q('.zboom .well')), zt = R(q('.ztable'));
    const zp = ui.seats.map((s, i) => R(q(`.seat[data-seat="${i}"] .pilezone`)));
    const cw = ui.cw, ch = ui.ch, u = cw / 112;

    const onTable = new Set(tableIds), lostSet = new Set(st.phase === 'boomed' && st.lastBoom ? st.lastBoom.lost : []);
    const T = new Array(TOTAL);

    // the draw pile: a stack whose edge thickens with the cards in it

    });

    pileGems.forEach((id, j) => { T[id] = { zone: 'boom', x: zb.cx + (hash(id, 1) - 0.5) * 6, y: zb.cy + (hash(id, 2) - 0.5) * 6, r: (hash(id, 3) - 0.5) * 14, z: 20 + j, up: false, op: j >= pileGems.length - 3 ? 1 : 0 }; });
    st.gone.forEach(id => { T[id] = { zone: 'gone', x: zb.cx, y: zb.cy, r: 0, z: 1, up: true, op: 0 }; });          // a boom taken out of the game fades away over the boom pile
    // this turn's gems
    // while a boom is showing, its banner takes the top of the table area and the cards sit below it
    const bandH = st.phase === 'boomed' ? Math.min(zt.h * 0.45, innerHeight < 520 ? 56 : clamp(40, 0.1 * Math.min(innerWidth, innerHeight), 104) + 72) : 0;
    const pos = rowPositions(tableIds.length, { x: zt.x, w: zt.w, y: zt.y + bandH, h: zt.h - bandH, cx: zt.cx, cy: zt.y + bandH + (zt.h - bandH) / 2 }, cw, ch);
    tableIds.forEach((id, i) => { T[id] = { zone: 'table', x: pos[i].x, y: pos[i].y, r: pos[i].r, z: 200 + i, up: true, op: 1 }; });

  function patchStage() {
    const st = ui.st, can = humanTurn() && st.phase === 'turn';
    view.querySelectorAll('.seat').forEach((el, i) => {
      const cur = i === st.current && !st.over;
      el.classList.toggle('cur', cur);
      el.classList.toggle('can', cur && can && st.table.length > 0);
      const pz = el.querySelector('.pilezone');
    });
    view.querySelector('.seats').classList.toggle('tight', !!ui.tight);
    patchScores();
    const zd = view.querySelector('.zdraw');
    zd.classList.toggle('can', can && Engine.canDraw(st));
    zd.querySelector('.zcount b').textContent = st.draw.length; zd.querySelector('.cw').textContent = st.draw.length === 1 ? 'card' : 'cards';
    const out = Engine.boomsOut(st);
    view.querySelector('.zboom .zcount b').textContent = out;
    const bt = Engine.boomTotal(st); view.querySelector('.zboom .bt').textContent = bt;
    view.querySelectorAll('.zboom .pips i').forEach((p, i) => { p.classList.toggle('on', i < out); p.classList.toggle('gone', i >= bt); });
    const zt = view.querySelector('.ztable');
    zt.classList.toggle('has', st.table.length > 0);
    const bb = view.querySelector('.bankbtn'); bb.querySelector('b').textContent = st.table.length; bb.disabled = !(can && Engine.canSave(st));
    view.querySelector('.narr').textContent = narration();
    const bh = bannerHTML();
    if (bh !== ui.bannerKey) { bannerEl.innerHTML = bh; ui.bannerKey = bh; }
  }

  function patchOverlay() {
    const sig = [ui.menu, ui.help, ui.settings, ui.sound, ui.hints, ui.hand, ui.screen, ui.st && ui.st.over && ui.showOver ? 'over' + ui.gameNo : ''].join('|');
    if (sig === ui.ovSig) return;
    ui.ovSig = sig;
    overlayEl.innerHTML = overlayHTML();
  }

  // ---------------- game flow ----------------
  function clearTimers() {
    clearTimeout(ui.botTimer); ui.botTimer = null; ui.botBusy = false;
    clearTimeout(ui.boomTimer); ui.boomTimer = null;
    clearTimeout(ui.overTimer); ui.overTimer = null;
    ui.countTimers.forEach(clearTimeout); ui.countTimers = [];
    ui.fxTimers.forEach(clearTimeout); ui.fxTimers = [];          // a boom's sound and flash, a save's clink: none may land on the next game
  }
  function settleScores() {                              // show the true scores now (a tap skips the counting-up)
    ui.countTimers.forEach(clearTimeout); ui.countTimers = [];
    if (ui.st) ui.shown = Engine.scores(ui.st);
  }

  function makeSeats(order) {
    const seats = order.map(i => {
      const s = ui.setup.seats[i];
      return { id: i, name: (s.name || '').trim() || D.defaultNames[i], kind: s.kind, style: s.style, colour: D.seatColours[i] };
    });
    const seen = {};
    seats.forEach(s => { seen[s.name] = (seen[s.name] || 0) + 1; if (seen[s.name] > 1) s.name = s.name + ' ' + seen[s.name]; });
    return seats;
  }
  // A new game. 'seats' (already in turn order) is given for a rematch; otherwise the setup is shuffled into a random turn order.
  function newGame(seats) {
    clearTimers();
    const seedBase = SEED !== null ? SEED + ui.gameNo : Math.floor(Math.random() * 2147483647);
    const rng = SEED !== null ? Engine.mulberry32(seedBase + 7) : Math.random;
    ui.seats = seats || makeSeats(Engine.randomOrder(ui.setup.n, rng));
    ui.st = Engine.createGame({ players: ui.seats.length, seed: seedBase });
    Object.assign(ui, { screen: 'play', hold: null, menu: null, help: false, settings: false, showOver: false, overHandled: false, fxBoom: -1, boomPending: false,
                        shown: Engine.scores(ui.st), gameNo: ui.gameNo + 1, boomAt: -1e9, bannerKey: '', note: '' });
    fit();
    render();
    startTurnFlow(ui.pace.botStart);
  }
  // Two ways to play, both for two players: the seats are just these (the order is dealt at random).
  function startMode(seats) { ui.setup = { n: 2, seats }; pref.del(SAVE_KEY); newGame(); }
  function toHome() {
    clearTimers();
    Object.assign(ui, { screen: 'home', st: null, hold: null, menu: null, help: false, settings: false, showOver: false, built: null, note: '' });          // (the game on the table stays saved: Continue brings it back)
    render();
  }
  function gameFinished() {
    ui.overHandled = true;
    pref.set(DONE_KEY, (+pref.get(DONE_KEY) || 0) + 1);
    const r = ui.st.result, humanWon = r.winners.some(i => !isBot(i));
    ui.overSound = r.tie ? 'tie' : humanWon ? 'win' : 'lose';          // the same sound whether the wait runs out or a tap skips it
    const show = () => { ui.showOver = true; sfx(ui.overSound); };
    if (reduced()) show(); else ui.overTimer = setTimeout(() => { show(); render(); }, ui.pace.overDelay + (ui.lastSaved || 0) * ui.pace.countStep);   // let the last gems land first
  }

  // ---------------- one move ----------------
  function doDraw() {
    const st = ui.st, k = st.table.length;
    const r = Engine.draw(st);
    if (r.type === 'gem') {
      if (!isBot(st.current)) ui.note = '';          // (your own digging clears what was said before)
      sfx('draw'); sfx('glint', { rate: runRate(k) }, 140);
      if (r.refreshed) riffle();
    } else {
      sfx('draw');
      ui.boomAt = nowMs(); ui.fxBoom = r.card; ui.boomPending = true; ui.note = boomNote(st);
      scheduleBoomClear();
    }
    render();
    return r;
  }
  function doSave() {
    const st = ui.st, seat = st.current, n = st.table.length;
    settleScores();
    ui.lastSaved = n;
    const before = Engine.scores(st)[seat], goneBefore = st.gone.length;
    const r = Engine.save(st);
    ui.note = whoLine(seat, `You banked ${n}.`, `banked ${n}.`) + (st.gone.length > goneBefore ? SHUFFLED : '');
    const after = Engine.scores(st)[seat];
    const step = ui.pace.countStep, land = reduced() ? 40 : 560;
    ui.shown[seat] = reduced() ? after : before;
    for (let k = 1; k <= n; k++) {
      const at = land + (k - 1) * step;
      sfx('clink', { rate: runRate(k - 1) }, at);
      if (!reduced()) ui.countTimers.push(setTimeout(() => { ui.shown[seat] = before + k; patchScores(seat); }, at));
    }
    sfx('save', {}, land + n * step + 30);
    if (r.refreshed) riffle();
    render();
    return r;
  }
  // After a boom nobody has to tap: the table clears itself a moment later and a line at the bottom says what happened.
  function scheduleBoomClear() {
    clearTimeout(ui.boomTimer);
    ui.boomTimer = setTimeout(function again() {
      const st = ui.st; ui.boomTimer = null;
      if (!st || st.over || st.phase !== 'boomed') return;
      if (overlayOpen()) { ui.boomTimer = setTimeout(again, 250); return; }          // (the menu is open: it waits)
      settleScores(); passAfterBoom();
    }, ui.pace.boomAutoMs);
  }
  function boomNote(st) {
    const lost = st.lastBoom.lost.length;
    return `${whoLine(st.current, 'You drew', 'drew')} a BOOM and ${lost ? `lost ${lost} ${lost === 1 ? 'gem' : 'gems'}` : 'lost nothing'}.`;
  }
  const SHUFFLED = ' The deck was shuffled back in and a BOOM was taken out.';
  function passAfterBoom() {
    const st = ui.st;
    clearTimeout(ui.boomTimer); ui.boomTimer = null;
    const goneBefore = st.gone.length;
    const r = Engine.endTurn(st);
    if (st.gone.length > goneBefore) ui.note = (ui.note || '') + SHUFFLED;
    ui.fxBoom = -1; ui.boomPending = false;
    if (r.refreshed) riffle();
    render();
    startTurnFlow(ui.pace.botStart);
  }

  // ---------------- the computers ----------------
  // A computer's turn is shown one draw at a time. A tap anywhere skips to its end; then it waits for a tap before the next player.
  function startTurnFlow(delay) {
    const st = ui.st;
    if (!st || st.over || ui.hold || ui.botBusy || st.phase !== 'turn' || !isBot(st.current)) return;
    if (reduced()) { botLoop(true); return; }
    scheduleBot(delay === undefined ? ui.pace.botStart : delay);
  }
  function nextDecision() { const st = ui.st; return Bots.decide(Engine.publicView(st, st.current), ui.seats[st.current].style); }
  function scheduleBot(delay) {
    ui.botBusy = true;
    clearTimeout(ui.botTimer);
    ui.botTimer = setTimeout(() => botLoop(false), delay);
  }
  // One step (instant: all steps until the turn ends). Returns true while the computer is still digging.
  function botAct() {
    const st = ui.st, seat = st.current;
    if (nextDecision() === 'draw') { const r = doDraw(); return r.type === 'gem'; }
    const n = st.table.length;
    doSave();
    ui.hold = st.over ? null : { seat, n };
    return false;
  }
  // The computer slows down as it gets closer to stopping or going boom: the more it has at risk and the likelier the next card is a boom, the longer it waits to draw.
  function botDelay() {
    const st = ui.st; if (nextDecision() === 'save') return ui.pace.botSave;
    const c = Engine.counts(st), pBoom = c.drawCount ? c.boomsInDraw / c.drawCount : 0, tension = Math.min(1, st.table.length * pBoom * ui.pace.botTensionBy);
    return Math.round(ui.pace.botDraw * (1 + ui.pace.botTension * tension));
  }
  function botLoop(instant) {
    ui.botTimer = null;
    const st = ui.st;
    if (!st || st.over || st.phase !== 'turn' || !isBot(st.current) || ui.screen !== 'play') { ui.botBusy = false; render(); return; }
    if (!instant && overlayOpen()) { ui.botBusy = true; ui.botTimer = setTimeout(() => botLoop(false), 250); return; }
    ui.botBusy = true;
    let more = true, guard = 0;
    do { more = botAct(); } while (instant && more && ++guard < 500);
    if (more) {
      ui.botTimer = setTimeout(() => botLoop(false), botDelay());
    } else { ui.botBusy = false; render(); }
  }
  function skipBot() {
    clearTimeout(ui.botTimer); ui.botTimer = null;
    botLoop(true);
    settleScores();
    render();
  }

  // ---------------- taps on the table ----------------
  // kind: 'draw' (the pile), 'save' (the gems or your safe pile), 'bg' (anywhere else)
  function tableTap(kind) {
    const st = ui.st;
    if (!st) return;
    if (st.over) { if (!ui.showOver) { clearTimeout(ui.overTimer); settleScores(); ui.showOver = true; sfx(ui.overSound || 'lose'); render(); } return; }
    if (ui.botBusy) { skipBot(); return; }
    if (st.phase === 'boomed') { if (nowMs() - ui.boomAt >= ui.pace.boomGuardMs) { settleScores(); passAfterBoom(); } return; }
    if (ui.hold) { ui.hold = null; settleScores(); render(); startTurnFlow(ui.pace.botStart); return; }
    if (isBot(st.current)) return;
    if (kind === 'draw' && Engine.canDraw(st)) doDraw();
    else if (kind === 'save' && Engine.canSave(st)) {
      doSave();
      startTurnFlow(ui.pace.afterSave);
    }
  }

  // ---------------- save / resume: a game in progress survives a reload (or iPad Safari discarding the tab) ----------------
  function saveGame() {
    try {
      if (ui.st && ui.st.over) { pref.del(SAVE_KEY); return; }          // a finished game is not kept
      if (!ui.st || ui.screen !== 'play') return;                           // (on the menus the game you left stays saved)
      localStorage.setItem(SAVE_KEY, JSON.stringify({ schema: 1, build: BUILD, seats: ui.seats, hold: ui.hold, note: ui.note || '', game: Engine.serialize(ui.st) }));
    } catch (e) { /* storage unavailable or full: the game still plays, it just cannot be resumed */ }
  }
  function resumeGame() {
    const sv = pref.json(SAVE_KEY);
    if (!sv) { if (pref.get(SAVE_KEY) !== null) { pref.del(SAVE_KEY); ui.notice = 'Your saved game could not be resumed, so it was cleared.'; } return false; }
    try {
      const st = Engine.restore(sv.game);
      if (!Array.isArray(sv.seats) || sv.seats.length !== st.n) throw new Error('seats');
      const seats = sv.seats.map(s => {
        if (!s || (s.kind !== 'human' && s.kind !== 'computer') || !D.seatColours.includes(s.colour) || typeof s.name !== 'string') throw new Error('seats');
        return { id: s.id | 0, name: s.name.slice(0, D.setup.maxName + 2), kind: s.kind, style: D.styles.some(x => x.id === s.style) ? s.style : D.bots.defaultStyle, colour: s.colour };
      });
      ui.st = st; ui.seats = seats; ui.screen = 'play'; ui.gameNo++; ui.note = sv.note || '';
      ui.hold = sv.hold && sv.hold.seat >= 0 && sv.hold.seat < st.n && st.phase === 'turn' ? { seat: sv.hold.seat | 0, n: sv.hold.n | 0 } : null;
      ui.shown = Engine.scores(st); ui.overHandled = false; ui.showOver = false; ui.fxBoom = st.phase === 'boomed' && st.lastBoom ? st.lastBoom.card : -1;
      if (st.phase === 'boomed') { ui.boomAt = nowMs(); scheduleBoomClear(); }
      return true;
    } catch (e) {
      pref.del(SAVE_KEY);
      ui.notice = /rules changed/.test(e.message) ? 'A new version changed the rules, so your saved game was cleared.' : 'Your saved game could not be resumed, so it was cleared.';
      return false;
    }
  }

  // A tap on the table saves only when it lands on the gems (or just beside them), so a stray tap on the empty felt never banks a turn.
  function onGems(e) {
    if (!e.clientX && !e.clientY) return true;                   // not a real touch (a script or the keyboard): take it at its word
    const g = ui.gemBox;                                         // where the gems are going to be (not where they are mid-flight)
    if (!g) return false;
    const x = e.clientX - g.ox, y = e.clientY - g.oy, m = 18;
    return x >= g.l - m && x <= g.r + m && y >= g.t - m && y <= g.b + m;
  }

  // ---------------- events ----------------
  function setSound(on) { ui.sound = !!on; pref.set(SOUND_KEY, ui.sound ? 'on' : 'off'); audio.setEnabled(ui.sound); if (ui.sound) sfx('tick'); }
  function onClick(e) {
    audio.unlock();                                    // sound can only start from inside a tap; this wakes it
    const el = e.target.closest('[data-act]');
    if (!el) { if (ui.screen === 'play' && !overlayOpen()) tableTap('bg'); return; }
    const d = el.dataset;
    if (el.classList.contains('scrim') && e.target !== el) return;            // a tap inside a panel is not a tap outside it
    switch (d.act) {
      case 'draw': if (ui.screen === 'play' && !overlayOpen()) tableTap('draw'); return;
      case 'save': if (ui.screen === 'play' && !overlayOpen()) tableTap('save'); return;
      case 'play': if (hasSave() && !ui.confirmNew) { ui.confirmNew = true; break; } ui.confirmNew = false; ui.screen = 'mode'; break;          // (a game in progress is replaced only after a second tap)
      case 'home': ui.screen = 'home'; ui.confirmNew = false; break;
      case 'continue': ui.confirmNew = false; if (resumeGame()) { render(); startTurnFlow(ui.pace.botStart); return; } break;
      case 'start-pass': startMode([{ kind: 'human', name: 'Player 1' }, { kind: 'human', name: 'Player 2' }]); return;
      case 'start-ai': startMode([{ kind: 'human', name: 'You' }, { kind: 'computer', name: 'Computer', style: D.bots.defaultStyle }]); return;
      case 'menu': ui.menu = 'main'; break;
      case 'scrimmenu': case 'menu-back': ui.menu = null; break;
      case 'menu-help': ui.menu = null; ui.help = true; break;
      case 'menu-settings': ui.menu = null; ui.settings = true; break;
      case 'menu-restart': ui.menu = 'restart'; break;
      case 'menu-leave': ui.menu = 'leave'; break;
      case 'restart-yes': ui.menu = null; newGame(Engine.randomOrder(ui.seats.length, SEED !== null ? Engine.mulberry32(SEED + ui.gameNo) : Math.random).map(i => ui.seats[i])); return;   // the same people, dealt in again
      case 'leave-yes': ui.menu = null; toHome(); return;
      case 'help': ui.help = true; break;
      case 'closehelp': case 'scrimhelp': ui.help = false; break;
      case 'settings': ui.settings = true; break;
      case 'closesettings': ui.settings = false; break;
      case 'sound': setSound(d.v === 'on'); break;
      case 'hints': ui.hints = d.v; pref.set(HINTS_KEY, d.v); break;
      case 'again': newGame(Engine.rematchOrder(ui.st.result).map(i => ui.seats[i])); return;
      case 'tohome': toHome(); return;
      default: return;
    }
    render();
  }
  root.addEventListener('click', onClick);
  // the page never scrolls or zooms; only the panels and the setup list may scroll
  document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('.screen, .panel'))) e.preventDefault(); }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  let resizeTimer = null;
  const onResize = () => { fit(); if (ui.screen === 'play' && ui.st && ui.built === ui.gameNo) { patchStage(); layoutCards(true); } };
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(onResize, 60); });
  addEventListener('orientationchange', () => setTimeout(onResize, 250));

  // ---------------- drawing the page ----------------
  function render() {
    const st = ui.st;
    if (ui.screen === 'play' && st) {
      if (st.over && !ui.overHandled) gameFinished();
      let fresh = false;
      if (ui.built !== ui.gameNo) {
        fit();
        view.innerHTML = stageHTML(); ui.built = ui.gameNo; ui.bannerKey = ''; bannerEl.innerHTML = ''; fresh = true;
        view.querySelectorAll('.seat .score').forEach(s => { s.dataset.v = ''; });
        cardsEl.classList.add('notrans');
        ui.cardEls.forEach(el => { el._zone = null; });
      }
      cardsEl.style.display = ''; fxEl.style.display = '';
      const felt = view.querySelector('.felt'); if (felt) felt.classList.toggle('lefty', ui.hand === 'left');
      patchStage();
      layoutCards(fresh);
      if (fresh) { void cardsEl.offsetWidth; cardsEl.classList.remove('notrans'); }
    } else {
      ui.built = null;
      view.innerHTML = ui.screen === 'mode' ? modeHTML() : homeHTML();
      cardsEl.style.display = 'none'; fxEl.style.display = 'none'; bannerEl.innerHTML = ''; ui.bannerKey = '';
    }
    patchOverlay();
    saveGame();
  }

  window.OneMoreUI = { ui, render, onClick, audio, newGame };
  fit();
  { const nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {}; if (nav.type !== 'navigate') resumeGame(); }          // a reload (iPad Safari does that to a backgrounded tab) puts you straight back; opening the game fresh shows the menu, where Continue waits
  render();
  startTurnFlow(ui.pace.botStart);
})();
</script>
</body>
</html>
