<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokémon Roll!">
<meta name="build" content="__BUILD__">
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<meta name="theme-color" content="#6a4423">
<title>Pokémon Roll!</title>
<meta name="description" content="Roll the dice, build your team, beat the gym leaders.">
<style>
:root{--ink:#14110f;--navy:#0e1a33;--panel:#17264a;--gold:#ffd23f;--red:#e5383b;--green:#2fa35b;--blue:#2a6fdb;--card:#fffdf4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:manipulation}
html{min-height:100lvh;background-attachment:fixed;background-color:#8c5d31;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='380' height='380'%3E%3Cfilter id='w' x='0' y='0' width='100%25' height='100%25'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.05 0.0035' numOctaves='5' seed='11' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .22  0 0 0 0 .10  0 0 0 0 .03  0 0 0 1.5 -.32'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url%28%23w%29'/%3E%3C/svg%3E");background-size:380px 380px}
body{background:transparent}
#app{position:fixed;top:0;left:0;right:0;height:100vh;height:100lvh;height:var(--appH,100lvh);padding:env(safe-area-inset-top) 0 0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{min-height:56px;padding:10px 26px;border-radius:16px;font-weight:900;font-size:22px;background:linear-gradient(#ffe066,#ffb703);color:#3a2600;border:3px solid #14110f;box-shadow:0 5px 0 #14110f;letter-spacing:.02em}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #14110f}
.btn.big{min-height:72px;font-size:28px;padding:12px 40px}
.btn.alt{background:linear-gradient(#7fb2ff,#3d7be0);color:#06214d}
.btn.red{background:linear-gradient(#ff7b7e,#e5383b);color:#fff}
.btn.ghost{background:#ffffff18;color:#fff;border-color:#ffffff55;box-shadow:none;font-size:18px;min-height:48px}
.btn[disabled]{opacity:.4;pointer-events:none}
.top{display:flex;align-items:center;gap:10px;padding:4px 10px;min-height:60px}
.top{position:relative}
.top .t{position:absolute;left:64px;right:64px;pointer-events:none;font-weight:900;font-size:18px;text-align:center;letter-spacing:.04em}
.ib{width:44px;height:44px;border-radius:12px;background:#ffffff20;border:2px solid #ffffff44;font-size:22px;display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:#ffffff1c;border:2px solid #ffffff33;font-weight:800;font-size:17px}
.chip.on{background:var(--gold);color:#3a2600;border-color:#14110f}
.scr{flex:1;min-height:0;display:flex;flex-direction:column}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;flex:1;padding:64px 16px 16px;min-height:0}
/* ---- menu ---- */
.logo{font:900 64px/0.95 Georgia,'Trebuchet MS',serif;letter-spacing:.02em;color:var(--gold);text-shadow:0 5px 0 #14110f,0 0 30px #ffd23f66,3px 3px 0 #14110f,-3px 3px 0 #14110f,3px -3px 0 #14110f,-3px -3px 0 #14110f}
.logo small{display:block;font-size:30px;color:#fff;letter-spacing:.3em;margin-bottom:8px}
.sprites{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sprites img,.pix{image-rendering:pixelated}
.dice-row{display:flex;gap:14px;justify-content:center}
.d6{width:62px;height:62px;border-radius:14px;background:#fff;color:var(--ink);border:4px solid var(--ink);display:grid;place-items:center;font:900 36px/1 system-ui;box-shadow:0 5px 0 #0006}
.menu{display:flex;flex-direction:column;gap:14px;width:min(420px,86vw)}
.foot{font-size:14px;opacity:.65;padding:10px;text-align:center}
.foot a{color:inherit}
/* ---- the card: ONE design at every size, a standard portrait card (--cw is its width; the whole card is always on show) ---- */
.card{--cw:190px;--ink:#14110f;width:var(--cw);flex:none;position:relative;color:var(--ink);background:var(--bg);border:calc(var(--cw)*.022 + 1px) solid var(--ink);border-radius:calc(var(--cw)*.07);overflow:hidden;box-shadow:0 5px 12px #0008;display:flex;flex-direction:column;transition:transform .15s,filter .3s,opacity .3s;text-align:left;padding-bottom:calc(var(--cw)*.03)}
.card.zero{filter:saturate(.55) brightness(.9);outline:3px solid #e5383b88;outline-offset:-2px}
.card.foe{--ink:#2a0e0e}                 /* their cards face up to you, the right way round, so every card reads the same */
.card .wkt{position:absolute;top:0;left:0;right:0;z-index:4;background:var(--wc,#fff);color:#fff;text-shadow:0 1px 0 #0009;border-bottom:max(1px,calc(var(--cw)*.011)) solid var(--ink);padding:calc(var(--cw)*.008) 0 calc(var(--cw)*.014);text-align:center;font-weight:900;font-size:calc(var(--cw)*.066);letter-spacing:.04em;white-space:nowrap;line-height:1.1}
.card{height:calc(var(--cw)*1.58);min-height:0}
.card .nmrow{padding:calc(var(--cw)*.09) calc(var(--cw)*.04) 0}
.card .top2{display:flex;gap:calc(var(--cw)*.04);padding:calc(var(--cw)*.02) calc(var(--cw)*.04) 0}
.card .art{width:calc(var(--cw)*.42);height:calc(var(--cw)*.42);flex:none;padding:3%;border:max(1px,calc(var(--cw)*.011)) solid var(--ink);border-radius:calc(var(--cw)*.05);background:radial-gradient(circle at 50% 40%,#fff9,var(--c) 78%);display:grid;place-items:center;position:relative;overflow:hidden}
.card .art img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 3px 0 #0003)}
.card .inf{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:calc(var(--cw)*.01)}
.card .nm{font-weight:900;font-size:calc(var(--cw)*.125);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .lv{font-weight:800;font-size:calc(var(--cw)*.064);color:#000b;white-space:nowrap}
.card .tagrow{margin:calc(var(--cw)*.025) calc(var(--cw)*.04) 0;display:flex}
.card .tag{flex:1;text-align:center;background:var(--c);border:max(1px,calc(var(--cw)*.011)) solid var(--ink);border-radius:99px;padding:0 calc(var(--cw)*.03);font-weight:800;font-size:calc(var(--cw)*.07);color:#fff;text-shadow:0 1px 0 #0008;white-space:nowrap}
.card .hpc{align-self:flex-start;background:#e23a3a;border:max(1px,calc(var(--cw)*.011)) solid var(--ink);border-radius:99px;color:#fff;font-weight:900;font-size:calc(var(--cw)*.105);padding:0 calc(var(--cw)*.04);display:inline-flex;align-items:baseline;gap:calc(var(--cw)*.01);line-height:1.15;box-shadow:inset 0 -3px 0 #0003}
.card .hpc.mid{background:#f08a00}.card .hpc.lo{background:#a4001b}
.card .hpc small{font-size:.62em;font-weight:800;opacity:.9}
.card .shd{align-self:flex-start;background:#1457b8;color:#fff;border:max(1px,calc(var(--cw)*.011)) solid var(--ink);border-radius:99px;font-weight:900;font-size:calc(var(--cw)*.07);padding:0 calc(var(--cw)*.04)}
.card .ab{flex:none;--fk:var(--k,1);margin:calc(var(--cw)*.03) calc(var(--cw)*.04) 0;padding:calc(var(--cw)*.012) calc(var(--cw)*.035);border-radius:calc(var(--cw)*.035);background:#fffc;border:max(1px,calc(var(--cw)*.011)) solid var(--ink);font-weight:700;font-size:calc(var(--cw)*.064*var(--k,1));line-height:1.12;min-height:calc(var(--cw)*.17*var(--k,1));display:flex;align-items:center}
.card .faces{margin:calc(var(--cw)*.03) calc(var(--cw)*.04) 0;display:grid;grid-auto-rows:minmax(min-content,1fr);gap:calc(var(--cw)*.01);flex:1;min-height:0}
.card .f{overflow:hidden;display:flex;align-items:center;gap:calc(var(--cw)*.03);background:#fffd;border:max(1px,calc(var(--cw)*.011)) solid var(--ink);border-radius:calc(var(--cw)*.03);padding:0 calc(var(--cw)*.025);font-weight:800;font-size:calc(var(--cw)*.078*var(--k,1));min-height:0;line-height:1.05}
.card .f .mt{flex:1;min-width:0}
.card .f small{font-size:.78em;opacity:.85;font-weight:700}
.card .f.hot{background:#ffe46b;box-shadow:0 0 0 2px #fff,0 0 10px #ffd000;z-index:1}
.card .f.hot .pip{background:var(--ink);color:#fff}
.card .f.pick{outline:max(1px,calc(var(--cw)*.014)) dashed #ffb703;outline-offset:-1px;background:#fff7cf;animation:pulse2 1s infinite}
.card .f.blank{opacity:.45}
.card .pip{width:calc(var(--cw)*.085);height:calc(var(--cw)*.085);border-radius:calc(var(--cw)*.025);background:#fff;border:max(1px,calc(var(--cw)*.011)) solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:calc(var(--cw)*.065);flex:none}
.mA{color:#c1121f}.mB{color:#1457b8}.mH{color:#17803d}.mD{color:#6b6b6b}
.card .sp{margin:calc(var(--cw)*.025) calc(var(--cw)*.04) 0;padding:0 calc(var(--cw)*.03);border-radius:calc(var(--cw)*.035);background:var(--ink);color:#ffe46b;font-weight:800;font-size:calc(var(--cw)*.07*var(--k,1));display:flex;gap:6px;align-items:center;min-height:calc(var(--cw)*.1*var(--k,1));line-height:1.05}
.card .sp i{font-style:normal;background:#ffe46b;color:var(--ink);border-radius:5px;padding:0 5px;white-space:nowrap}
.card .sp.hot{box-shadow:0 0 0 2px #fff,0 0 12px #ffd000}
.card .xb{position:absolute;left:4%;right:4%;bottom:1.5%;z-index:6;margin:0;box-shadow:0 2px 0 #0007;padding:2px;border-radius:calc(var(--cw)*.035);background:#ffb703;color:#14110f;font-weight:900;font-size:calc(var(--cw)*.07);text-align:center;border:max(1px,calc(var(--cw)*.011)) solid var(--ink)}
.card .dbadge{position:absolute;right:calc(var(--cw)*.015);bottom:calc(var(--cw)*.015);z-index:3;min-width:calc(var(--cw)*.2);height:calc(var(--cw)*.2);padding:0 calc(var(--cw)*.03);border-radius:calc(var(--cw)*.04);background:#fff;color:var(--ink);border:max(1px,calc(var(--cw)*.016)) solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:calc(var(--cw)*.14);box-shadow:0 3px 0 #0006}
.card .dbadge.hero{background:#fff;touch-action:none;cursor:grab}
.card .dbadge.lifted{opacity:.25}
.card .dbadge.land{animation:land .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{from{transform:translateY(-44px) rotate(-60deg) scale(1.6);opacity:0}to{transform:none;opacity:1}}
.card.dropok{transform:translateY(-6px);box-shadow:0 0 0 4px #7dff9c,0 8px 18px #000a}
.die[data-act=die]{touch-action:none}
.die.lifted{opacity:.35}
.die.ghost{position:fixed;z-index:200;pointer-events:none;margin:0;transform:scale(1.2) rotate(8deg);box-shadow:0 14px 0 #0005;transition:none}
.plrow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.card .mark{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.2);background:#000a;color:#fff;z-index:2;font-weight:900;text-align:center}
.card.shiny{box-shadow:0 0 0 3px #ffe46b,0 0 22px 5px #ffd23faa}
.card.shiny .art::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fff9 50%,transparent 65%);background-size:250% 100%;animation:glint 2.6s linear infinite;pointer-events:none}
@keyframes glint{from{background-position:150% 0}to{background-position:-100% 0}}
.star{position:absolute;color:#fff6a8;text-shadow:0 0 6px #ffd23f,0 0 12px #ffb703;animation:tw 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
.card.ko{opacity:.4;filter:grayscale(1)}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 4px var(--gold),0 8px 18px #000a}
.card.act{animation:lunge .5s}.card.hurt{animation:shake .4s}
@keyframes lunge{40%{transform:translateY(-16px) scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.card.burst::before{content:'✨';position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-size:calc(var(--cw)*.7);animation:burst .9s ease-out forwards;pointer-events:none}
@keyframes burst{0%{transform:scale(.2) rotate(-30deg);opacity:0}30%{opacity:1}100%{transform:scale(1.7) rotate(40deg);opacity:0}}
.pop{position:absolute;left:0;right:0;top:20%;text-align:center;z-index:6;font:900 calc(var(--cw)*.3) system-ui;color:#fff;text-shadow:0 0 4px #000,0 3px 0 #000,2px 2px 0 #000,-2px 2px 0 #000;animation:rise .9s ease-out forwards;pointer-events:none}
.pop.heal{background:#1f9d55}.pop.txt{font-size:calc(var(--cw)*.14);background:#101a33;color:#ffe46b;border-color:#ffe46b}
@keyframes rise{from{transform:translateY(8px) scale(.6);opacity:0}25%{opacity:1;transform:translateY(0) scale(1.15)}to{transform:translateY(-34px);opacity:0}}
.back{width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.1);border:3px solid #2a0e0e;background:repeating-linear-gradient(45deg,#7b1e1e,#7b1e1e 10px,#8e2a2a 10px,#8e2a2a 20px);display:grid;place-items:center;font-size:calc(var(--cw)*.4);flex:none;box-shadow:0 5px 12px #0008}
.hrow{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:6px 8px 10px;-webkit-overflow-scrolling:touch}
.hrow::before,.hrow::after{content:'';margin:auto}
.cgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:flex-start;overflow:auto;padding:10px;flex:1;min-height:0}
/* ---- the table ---- */
.table{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 8px 0}
.row{display:flex;justify-content:center;align-items:flex-end;gap:8px;min-height:0}
.tray{display:flex;justify-content:center;gap:8px;padding:6px 4px;min-height:44px;flex-wrap:nowrap;overflow:hidden}
.board{flex:1;min-height:0;display:flex;align-items:center;gap:6px;position:relative;overflow:auto;padding:4px}
.board::before,.board::after{content:'';margin:auto}
.col{display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;padding:6px 3px;border-radius:14px;background:#ffffff0d}
.slot{width:var(--cw);height:calc(var(--cw)*1.58);border:3px dashed #ffffff44;border-radius:calc(var(--cw)*.1);display:grid;place-items:center;font-size:calc(var(--cw)*.3);color:#ffffff66}
.slot.ok{border-color:var(--gold);color:var(--gold);background:#ffd23f22;animation:pulse 1s infinite}
.slot.ghost{visibility:hidden}
.die.colored{color:#fff;text-shadow:0 2px 0 #000b;border-color:#14110f}
.card .dbadge.colored{color:#fff;text-shadow:0 1px 0 #000b}
.card .dbadge small{font-size:.55em;margin-left:2px;font-weight:900}
.die{position:relative}
.col.insc{background:none}
.ins{width:calc(var(--cw)*.28);align-self:stretch;border:3px dashed var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font:900 calc(var(--cw)*.25) system-ui;background:#ffd23f1a;animation:pulse 1s infinite}
@keyframes pulse{50%{background:#ffd23f44}}
.vsl{font:900 14px system-ui;letter-spacing:.2em;color:#ffffff88;text-align:center;padding:2px}
.capline{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:22px}
.cap-sp{width:38px;height:38px;image-rendering:pixelated}
.capd{color:#ff6b6b;font-size:30px}.caph{color:#7dff9c;font-size:28px}.capw{color:#ffd23f}.capb{color:#8ec5ff}.capx{color:#ffe46b}.capk{color:#ff9d9d}.capt{opacity:.9}.arrowc{font-size:30px;color:#ffd23f}.caphp{font-weight:800;opacity:.9;font-size:20px}.capnext{font-size:20px;opacity:.9}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.orb{position:fixed;left:0;top:0;font-size:48px;line-height:1;z-index:45;pointer-events:none;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #ffd23f)}
.mvbub{position:fixed;z-index:60;transform:translate(-50%,-50%);background:#101a33;color:#fff;border:5px solid var(--k,#ffd23f);border-radius:20px;padding:8px 18px 8px 10px;font:800 26px system-ui;display:flex;gap:12px;align-items:center;box-shadow:0 8px 0 #000a,0 0 0 3px #101a33,0 14px 30px #000c;animation:bub .25s ease-out;white-space:nowrap;max-width:94vw}
.mvbub.attack{--k:#ff5a5a}.mvbub.heal{--k:#4cd964}.mvbub.guard{--k:#5aa9ff}.mvbub.special{--k:#ffd23f}
.mvbub .who{font-weight:900;color:#ffe9a8}.mvbub .mvt{color:#fff;background:#ffffff22;border-radius:12px;padding:2px 12px}.mvbub .mvt b{color:#ffd23f}.mvbub .arr{font-size:30px;color:var(--k)}
.mvbub img{width:36px;height:36px;image-rendering:pixelated}
@keyframes bub{from{transform:translate(-50%,-50%) scale(.5);opacity:0}}
.card.fx-actor{box-shadow:0 0 0 6px #ffd23f,0 0 30px 10px #ffd23fb0;z-index:5}
.card.fx-target{box-shadow:0 0 0 6px #ff4d4d,0 0 30px 10px #ff4d4db0;z-index:5}
.card.fx-heal{box-shadow:0 0 0 6px #4cd964,0 0 30px 10px #4cd964b0;z-index:5}
.card.dim{filter:brightness(.5) saturate(.6)}
.card.hurt2{animation:shake .45s}.card.heal2{animation:glowg .9s}
@keyframes glowg{30%{box-shadow:0 0 0 6px #7dff9c,0 0 40px 14px #7dff9c}}
.card.kofall{animation:kofall .9s forwards}
@keyframes kofall{to{transform:rotate(14deg) translateY(14px) scale(.9);filter:grayscale(1) brightness(.55);opacity:.45}}
.card .ring{position:absolute;left:50%;top:28%;width:22%;aspect-ratio:1;border:calc(var(--cw)*.035) solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:ringo .55s ease-out forwards;pointer-events:none;z-index:6}
@keyframes ringo{to{transform:translate(-50%,-50%) scale(6.5);opacity:0}}
.card .weakb{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:44%;z-index:7;font:900 calc(var(--cw)*.14)/1 system-ui;padding:calc(var(--cw)*.02) calc(var(--cw)*.06);background:#ffd23f;color:#14110f;border:calc(var(--cw)*.018 + 2px) solid #14110f;border-radius:calc(var(--cw)*.05);box-shadow:0 4px 0 #0008;transform:rotate(-8deg);animation:weakb 1.2s ease-out forwards;pointer-events:none}
@keyframes weakb{0%{transform:rotate(-8deg) scale(.3);opacity:0}25%{opacity:1;transform:rotate(-8deg) scale(1.2)}80%{opacity:1}100%{transform:rotate(-8deg) translateY(-20px);opacity:0}}
.card .plus{position:absolute;top:70%;font-size:calc(var(--cw)*.12);color:#7dff9c;text-shadow:0 0 6px #0a0;z-index:6;animation:plusup 1s ease-out forwards;opacity:0;pointer-events:none}
@keyframes plusup{20%{opacity:1}to{transform:translateY(calc(var(--cw)*-.7));opacity:0}}
.card .pop{animation:rise 1.3s ease-out forwards;font-size:calc(var(--cw)*.25);left:0;right:0;margin:0 auto;width:fit-content;top:12%;padding:0 calc(var(--cw)*.07);background:#c1121f;color:#fff;border:calc(var(--cw)*.02 + 2px) solid #fff;border-radius:calc(var(--cw)*.08);text-shadow:0 2px 0 #0007;box-shadow:0 5px 0 #0008,0 0 18px #000a}
.fx .fxl{stroke-dasharray:16 12;animation:fxdash .45s linear infinite;filter:drop-shadow(0 3px 0 #0008)}
@keyframes fxdash{to{stroke-dashoffset:-28}}
.card.lunge2{animation:lunge2 .5s ease-out;z-index:5}
@keyframes lunge2{35%{transform:translate(var(--dx),var(--dy)) scale(1.07)}100%{transform:none}}
.status{padding:4px 12px;text-align:center;font-weight:800;font-size:18px;min-height:30px}
.bt{flex:1;min-height:0;display:flex;flex-direction:column}
.bt .main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.dock.side{width:176px;flex:none;border-top:0;border-left:2px solid #ffffff22;justify-content:center;align-items:center;overflow:auto}

/* Pokémon Roll! engine: pure rules, no DOM. State is plain JSON so saves and the bots' views are easy. */
const Engine = (() => {
  'use strict';
  const D = GAME_DATA, R = D.rules;
  const lc = x => String(x || '').toLowerCase();
  const other = x => 1 - x;

  // ---------------------------------------------------------------- the cards
  const CARDS = {};
  D.cardsPsv.trim().split('\n').forEach(line => {
    const f = line.split('|');
    const c = { id: f[1], name: f[0], dex: Math.floor(parseFloat(f[1])), type: f[2], weak: f[3], level: +f[4], loc: parseInt(f[5], 10) || 0, hp: +f[6], role: f[7], ability: f[8].trim(), sheet: f.slice(9, 15).map(x => x.trim()), moves: [], special: (f[15] || '').trim(), els: (f[16] || '').split(',').map(x => x.trim().toLowerCase()) };
    c.legend = c.level === 6 && c.loc !== 0;
    CARDS[c.id] = c;
  });
  const typeOf = u => lc(u.elem || CARDS[u.id].type);
  // the element of the move a card is making: each move has its own (the colour in the sheet; none = a plain normal move), whatever the card's own type is
  const atkEl = (b, u) => u.elem ? lc(u.elem) : b.hypo && b.hypo.uid === u.uid && b.hypo.el != null ? b.hypo.el : (b.moveEl && b.moveEl[u.uid]) || 'normal';

  // ---------------------------------------------------------------- reading a move
  // arrows: < the column to the left, ^ the opposing card (an attack's matchup), v yourself, > the column to the right; "<<" reaches two columns.
  const runs = s => { const out = new Set(); const re = /(<+)|(>+)|([\^v])/g; let m; while ((m = re.exec(s))) { if (m[1]) for (let i = 1; i <= m[1].length; i++) out.add(-i); else if (m[2]) for (let i = 1; i <= m[2].length; i++) out.add(i); else out.add(0); } return [...out].sort((a, b) => a - b); };
  function parseSpec(sp) {
    sp = (sp || '').trim(); let spread = false;
    if (/^over\b/.test(sp)) { spread = true; sp = sp.replace(/^over\s*/, ''); }
    if (!sp) return { opts: [[0]], spread, all: true };
    if (/ and\/or | and /.test(sp)) return { opts: [runs(sp.replace(/ and\/or | and /g, ' '))], spread, all: true };
    if (/ or /.test(sp)) {
      const parts = sp.split(/ or /);
      if (parts.every(p => /\^/.test(p))) return { opts: parts.map(runs), spread, all: false };       // "<<<<^ or ^>>>>": one side or the other
      return { opts: runs(sp).map(o => [o]), spread, all: false };                                    // "<^ or >": one of them
    }

  function parseEffect(txt) {
    const m = /^(\+)?(\d+)([abhd])\s*(.*)$/.exec(txt.trim()); if (!m) return null;

  }
  function parseMove(str) {
    if (!str) return null; if (MV[str] !== undefined) return MV[str];
    const clauses = str.split(/ or (?=\+?\d)/).map(cl => cl.split(/\s*(?:,|&)\s*/).map(parseEffect).filter(Boolean)).filter(c => c.length);

    return (MV[str] = clauses.length ? { raw: str, clauses } : null);
  }
  const SP = {};
  function parseSpecial(str) {
    if (SP[str] !== undefined) return SP[str];
    const m = /^(\d+):\s*(.*)$/.exec(str || ''); if (!m || !m[2].trim()) return (SP[str] = null);
