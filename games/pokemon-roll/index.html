<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokémon Roll!">
<meta name="build" content="__BUILD__">
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<meta name="theme-color" content="#0e1a33">
<title>Pokémon Roll!</title>
<meta name="description" content="Roll the dice, build your team, beat the gym leaders.">
<style>
:root{--ink:#14110f;--navy:#0e1a33;--panel:#17264a;--gold:#ffd23f;--red:#e5383b;--green:#2fa35b;--blue:#2a6fdb;--card:#fffdf4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--navy);color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:manipulation}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,#27478f 0%,#12234a 45%,#0a1229 100%)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{min-height:56px;padding:10px 26px;border-radius:16px;font-weight:900;font-size:22px;background:linear-gradient(#ffe066,#ffb703);color:#3a2600;border:3px solid #14110f;box-shadow:0 5px 0 #14110f;letter-spacing:.02em}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #14110f}
.btn.big{min-height:72px;font-size:28px;padding:12px 40px}
.btn.alt{background:linear-gradient(#7fb2ff,#3d7be0);color:#06214d}
.btn.red{background:linear-gradient(#ff7b7e,#e5383b);color:#fff}
.btn.ghost{background:#ffffff18;color:#fff;border-color:#ffffff55;box-shadow:none;font-size:18px;min-height:48px}
.btn[disabled]{opacity:.4;pointer-events:none}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:60px}
.top .t{flex:1;font-weight:900;font-size:20px;text-align:center;letter-spacing:.04em}
.ib{width:52px;height:52px;border-radius:14px;background:#ffffff20;border:2px solid #ffffff44;font-size:26px;display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:#ffffff1c;border:2px solid #ffffff33;font-weight:800;font-size:17px}
.chip.on{background:var(--gold);color:#3a2600;border-color:#14110f}
.scr{flex:1;min-height:0;display:flex;flex-direction:column}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;flex:1;padding:64px 16px 16px;min-height:0}
/* ---- menu ---- */
.logo{font:900 64px/0.95 Georgia,'Trebuchet MS',serif;letter-spacing:.02em;color:var(--gold);text-shadow:0 5px 0 #14110f,0 0 30px #ffd23f66,3px 3px 0 #14110f,-3px 3px 0 #14110f,3px -3px 0 #14110f,-3px -3px 0 #14110f}
.logo small{display:block;font-size:30px;color:#fff;letter-spacing:.3em;margin-bottom:8px}
.sprites{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sprites img,.pix{image-rendering:pixelated}
.dice-row{display:flex;gap:14px;justify-content:center}
.d6{width:62px;height:62px;border-radius:14px;background:#fff;color:var(--ink);border:4px solid var(--ink);display:grid;place-items:center;font:900 36px/1 system-ui;box-shadow:0 5px 0 #0006}
.menu{display:flex;flex-direction:column;gap:14px;width:min(420px,86vw)}
.foot{font-size:14px;opacity:.65;padding:10px;text-align:center}
.foot a{color:inherit}
/* ---- cards ---- */
.card{width:300px;border-radius:18px;border:5px solid var(--ink);background:var(--bg);overflow:hidden;position:relative;color:var(--ink);box-shadow:0 8px 20px #0008}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:22px 10px 4px;background:linear-gradient(#fff9,#fff3)}
.card .nm{font:900 25px/1 system-ui}
.card .lv{font:700 13px system-ui;letter-spacing:.08em;color:#0009;margin-top:3px}
.hpc{width:56px;height:56px;border-radius:50%;background:#e23a3a;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font:900 28px/1 system-ui;box-shadow:inset 0 -6px 0 #0003;text-align:center}
.hpc small{display:block;font-size:9px;letter-spacing:.1em;margin-top:-5px}
.wkt{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;background:#fff;border:0 solid var(--ink);border-width:0 3px 3px;border-radius:0 0 12px 12px;padding:1px 14px 2px;font:800 13px system-ui;letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.art{height:236px;margin:0 10px;border:3px solid var(--ink);border-radius:12px;background:radial-gradient(circle at 50% 40%,#fff9,var(--c) 75%);display:grid;place-items:center;position:relative;overflow:hidden}
.art img{width:224px;height:224px;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #0003)}
.art .tag{position:absolute;left:6px;bottom:6px;background:var(--c);border:2px solid var(--ink);border-radius:20px;padding:1px 10px;font:800 13px system-ui;color:#fff;text-shadow:0 1px 0 #0008}
.art .role{position:absolute;left:6px;top:6px;font:700 11px system-ui;background:#0008;color:#fff;border-radius:10px;padding:2px 8px}
.ab{margin:8px 10px 0;padding:5px 8px;border-radius:8px;background:#fffc;border:2px solid var(--ink);font:700 14px/1.2 system-ui}
.faces{margin:8px 10px 0;display:grid;gap:3px}
.f{display:flex;align-items:center;gap:8px;background:#fffd;border:2px solid var(--ink);border-radius:8px;padding:2px 6px;font:800 17px system-ui;min-height:30px}
.f.hot{background:#ffe46b;box-shadow:0 0 0 3px #fff,0 0 12px #ffd000}
.f.blank{opacity:.45}
.f small{font:700 13px system-ui;opacity:.8}
.pip{width:26px;height:26px;border-radius:6px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font:900 15px system-ui;flex:none}
.mA{color:#c1121f}.mB{color:#1457b8}.mH{color:#17803d}.mD{color:#6b6b6b}
.sp{margin:8px 10px 10px;padding:5px 8px;border-radius:8px;background:var(--ink);color:#ffe46b;font:800 15px system-ui;display:flex;gap:8px;align-items:center}
.sp i{font-style:normal;background:#ffe46b;color:var(--ink);border-radius:5px;padding:0 6px}
.pad{height:10px}
.card.shiny{box-shadow:0 0 0 3px #ffe46b,0 0 26px 6px #ffd23faa}
.card.shiny .art::after,.mini.shiny .art2::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fff9 50%,transparent 65%);background-size:250% 100%;animation:glint 2.6s linear infinite;pointer-events:none}
@keyframes glint{from{background-position:150% 0}to{background-position:-100% 0}}
.star{position:absolute;color:#fff6a8;text-shadow:0 0 6px #ffd23f,0 0 12px #ffb703;animation:tw 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
/* ---- small cards (the table and the picker) ---- */
.mini{--cw:120px;width:var(--cw);border-radius:calc(var(--cw)*.1);border:calc(var(--cw)*.03 + 1px) solid var(--ink);background:var(--bg);color:var(--ink);box-shadow:0 5px 12px #0008;overflow:hidden;position:relative;flex:none;transition:transform .15s,filter .3s,opacity .3s}
.mini.foe{--ink:#2a0e0e}
.mini .nm{font:900 calc(var(--cw)*.125)/1.1 system-ui;padding:calc(var(--cw)*.05) calc(var(--cw)*.04) 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.mini .wk{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;border:0 solid var(--ink);border-width:0 2px 2px;border-radius:0 0 8px 8px;padding:0 calc(var(--cw)*.06);font:800 calc(var(--cw)*.085) system-ui;z-index:2;white-space:nowrap}
.mini .art2{height:calc(var(--cw)*.64);margin:calc(var(--cw)*.03) calc(var(--cw)*.04);border:2px solid var(--ink);border-radius:calc(var(--cw)*.06);background:radial-gradient(circle at 50% 40%,#fff9,var(--c) 75%);display:grid;place-items:center;position:relative;overflow:hidden}
.mini .art2 img{width:calc(var(--cw)*.6);height:calc(var(--cw)*.6);image-rendering:pixelated}
.bar{margin:0 calc(var(--cw)*.04);height:calc(var(--cw)*.14);border:2px solid var(--ink);border-radius:99px;background:#0003;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff8a8a,#d62828);transition:width .35s}
.bar.mid i{background:linear-gradient(#ffd166,#f4a300)}.bar.lo i{background:linear-gradient(#ff6b6b,#b00020)}
.bar b{position:absolute;inset:0;text-align:center;font:900 calc(var(--cw)*.105)/calc(var(--cw)*.1) system-ui;color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000}
.mv{margin:calc(var(--cw)*.04);border-radius:calc(var(--cw)*.06);background:#fffd;border:2px solid var(--ink);padding:2px calc(var(--cw)*.04);display:flex;align-items:center;gap:calc(var(--cw)*.04);font:900 calc(var(--cw)*.14) system-ui;min-height:calc(var(--cw)*.26);white-space:nowrap;overflow:hidden}
.mv.dash{border-style:dashed;background:#fff6;font-size:calc(var(--cw)*.1)}
.dchip{width:calc(var(--cw)*.2);height:calc(var(--cw)*.2);min-width:22px;min-height:22px;border-radius:6px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font:900 calc(var(--cw)*.13) system-ui;flex:none;color:var(--ink)}
.mini.ko{opacity:.35;filter:grayscale(1)}
.mini.sel{transform:translateY(-8px);box-shadow:0 0 0 4px var(--gold),0 8px 18px #000a}
.mini.act{animation:lunge .5s}.mini.hurt{animation:shake .4s}
@keyframes lunge{40%{transform:translateY(-16px) scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.mini.burst::before{content:'✨';position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-size:calc(var(--cw)*.7);animation:burst .9s ease-out forwards;pointer-events:none}
@keyframes burst{0%{transform:scale(.2) rotate(-30deg);opacity:0}30%{opacity:1}100%{transform:scale(1.7) rotate(40deg);opacity:0}}
.pop{position:absolute;left:0;right:0;top:30%;text-align:center;z-index:6;font:900 calc(var(--cw)*.3) system-ui;color:#fff;text-shadow:0 0 4px #000,0 3px 0 #000,2px 2px 0 #000,-2px 2px 0 #000;animation:rise .9s ease-out forwards;pointer-events:none}
.pop.heal{color:#7dff9c}.pop.txt{font-size:calc(var(--cw)*.17);color:#ffe46b}
@keyframes rise{from{transform:translateY(8px) scale(.6);opacity:0}25%{opacity:1;transform:translateY(0) scale(1.15)}to{transform:translateY(-34px);opacity:0}}
.back{width:var(--cw);aspect-ratio:3/4;border-radius:calc(var(--cw)*.1);border:3px solid #2a0e0e;background:repeating-linear-gradient(45deg,#7b1e1e,#7b1e1e 10px,#8e2a2a 10px,#8e2a2a 20px);display:grid;place-items:center;font-size:calc(var(--cw)*.4);flex:none;box-shadow:0 5px 12px #0008}
/* ---- the table ---- */
.table{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 8px 0}
.row{display:flex;justify-content:center;align-items:flex-end;gap:8px;min-height:0}
.tray{display:flex;justify-content:center;gap:8px;padding:6px 4px;min-height:44px;flex-wrap:nowrap;overflow:hidden}
.board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
.col{display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;padding:6px 3px;border-radius:14px;background:#ffffff0d}
.slot{width:var(--cw);aspect-ratio:3/4;border:3px dashed #ffffff44;border-radius:calc(var(--cw)*.1);display:grid;place-items:center;font-size:calc(var(--cw)*.3);color:#ffffff66}
.slot.ok{border-color:var(--gold);color:var(--gold);background:#ffd23f22;animation:pulse 1s infinite}
.ins{width:calc(var(--cw)*.28);align-self:stretch;border:3px dashed var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font:900 calc(var(--cw)*.25) system-ui;background:#ffd23f1a;animation:pulse 1s infinite}
@keyframes pulse{50%{background:#ffd23f44}}
.vsl{font:900 14px system-ui;letter-spacing:.2em;color:#ffffff88;text-align:center;padding:2px}
.status{padding:6px 14px;text-align:center;font-weight:800;font-size:19px;min-height:38px}
.dock{padding:6px 10px 10px;display:flex;flex-direction:column;gap:8px;background:#0a1229cc;border-top:2px solid #ffffff22}
.dice{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:70px}
.die{width:64px;height:64px;border-radius:16px;background:#fff;color:var(--ink);border:4px solid var(--ink);display:grid;place-items:center;font:900 38px/1 system-ui;box-shadow:0 5px 0 #0006;position:relative;transition:transform .12s}
.die.sel{transform:translateY(-10px) scale(1.1);box-shadow:0 0 0 5px var(--gold),0 12px 0 #0006}
.die.used{opacity:.4}
.die.foe{background:#7b1e1e;color:#fff;border-color:#2a0e0e}
.die.roll{animation:rolling .5s}
@keyframes rolling{0%{transform:rotate(-200deg) scale(.3);opacity:0}100%{transform:none;opacity:1}}
.die small{position:absolute;bottom:-4px;right:-4px;font:800 12px system-ui;background:var(--gold);border-radius:8px;padding:0 5px;border:2px solid var(--ink)}
.acts{display:flex;gap:12px;justify-content:center;align-items:center}
/* ---- map ---- */
.map{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;padding:8px 12px;position:relative}
.nd{border-radius:16px;border:4px solid var(--ink);background:var(--bg,#fff);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px;position:relative;box-shadow:0 5px 0 #0007;min-height:0;overflow:hidden}
.nd b{font:900 17px/1.1 system-ui}.nd span{font:700 13px system-ui;opacity:.75}
.nd .em{font-size:30px;line-height:1}
.nd.lock{opacity:.35;filter:grayscale(.7);box-shadow:none}
.nd.done{background:#2fa35b!important;color:#fff}
.nd.boss{border-color:#8a0000;box-shadow:0 5px 0 #4a0000}
.nd.next{animation:pulse2 1.4s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 6px #ffd23faa,0 5px 0 #0007}}
.empty{visibility:hidden}
/* ---- sheets and overlays ---- */
.sheet{position:fixed;inset:0;background:#000b;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.sheet .box{background:#17264a;border:3px solid #ffffff44;border-radius:20px;padding:18px;max-width:min(680px,94vw);max-height:84vh;overflow:auto;width:100%}
.sheet h2{margin:0 0 10px;font-size:26px}
.help p{margin:8px 0;font-size:17px;line-height:1.4}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;overflow:auto;padding:8px;flex:1;min-height:0}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#000d;border:2px solid var(--gold);padding:10px 18px;border-radius:14px;font-weight:800;z-index:80;font-size:18px;animation:fade 2.4s forwards;pointer-events:none}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
.banner{font:900 40px/1.1 Georgia,serif;color:var(--gold);text-shadow:0 4px 0 #14110f,3px 3px 0 #14110f,-3px 3px 0 #14110f}
.tip{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translateX(-50%);width:min(560px,92vw);background:#fffbe0;color:#14110f;border:4px solid var(--ink);border-radius:18px;padding:14px 16px;z-index:70;font-size:19px;font-weight:700;box-shadow:0 8px 0 #0008}
.tip button{margin-top:8px}
.big-sp{image-rendering:pixelated;width:112px;height:112px}
@media (max-height:760px){.logo{font-size:42px}.logo small{font-size:20px}.sprites img{width:64px;height:64px}.d6{width:44px;height:44px;font-size:26px}.center{gap:10px}.btn.big{min-height:60px;font-size:24px}.card{transform:scale(.8);transform-origin:top center}}
.libback{position:absolute;z-index:3;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 8px);display:inline-flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;min-height:44px;border-radius:99px;background:#0a1229d9;border:2px solid var(--gold);color:#fff;font-size:16px;font-weight:800;text-decoration:none}
.libback span{font-size:22px;line-height:1;color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<script id="data">
/* Pokémon Roll! — every rule number, the map, the bosses, the card sheet and the art live here. The engine and bots read this and hard-code none of it. */
const GAME_DATA = {
  title: 'Pokémon Roll!',
  version: 1,
  library: { name: 'Tabletop Library', href: '../../index.html' },
  rules: {
    shinyChance: 0.05,          // every draw from the wild; a card on your team or a boss's team keeps its form
    legendaryDice: 2, legendarySum: 9, legendaryFromSlots: 2,   // roll two dice at the start of a turn once you have a second die: a 9 spots a legendary
    startSlots: 1,              // cards you may challenge a location with; each boss beaten adds one
    locationMax: 6,             // never more than six cards at a time
    maxLevel: 6,
    maxRounds: 60, stallRounds: 6,   // a fight that goes nowhere is lost (a tie is a loss for the hero)
    suddenDeathTries: 3,
    perColumnLimit: 1,
    firstPlaceCount: 1, placeCount: 2,   // the first player puts down one card, then both put down two at a time
  },
  elements: {
    Grass:    { color: '#4caf50', bg: '#bfe8a5', icon: '🌿' },
    Fire:     { color: '#ef6c00', bg: '#ffc79a', icon: '🔥' },
    Water:    { color: '#1e88e5', bg: '#b7dcff', icon: '💧' },
    Electric: { color: '#f9a825', bg: '#ffe9a0', icon: '⚡' },
    Ground:   { color: '#8d6e63', bg: '#d9c7b4', icon: '⛰️' },
    Normal:   { color: '#9e9e9e', bg: '#e4e4e4', icon: '⭐' },
    Psychic:  { color: '#d81b8a', bg: '#f7c3e1', icon: '🔮' },
    Fighting: { color: '#bf5b2c', bg: '#f0c9ae', icon: '👊' },
    Dark:     { color: '#6a3fa0', bg: '#d9c8f0', icon: '🌑' },
    Ice:      { color: '#26c6da', bg: '#c4f1f7', icon: '❄️' },
    Dragon:   { color: '#5c6bc0', bg: '#cfd4f5', icon: '🐉' },
  },
  locations: [
    { id: 1, name: 'Viridian Forest', color: 'green' }, { id: 2, name: 'Mt. Moon', color: 'brown' },
    { id: 3, name: 'Power Plant', color: 'yellow' },    { id: 4, name: 'S.S. Anne', color: 'blue' },
    { id: 5, name: 'Pokemon Tower', color: 'purple' },  { id: 6, name: 'Safari Zone', color: 'green' },
    { id: 7, name: 'Seafoam Islands', color: 'blue' },  { id: 8, name: 'Cinnabar Island', color: 'red' },
    { id: 9, name: 'Victory Road', color: 'brown' },
  ],
  // the five starters: their six levels, in order. The rival picks the starter that beats yours.
  starters: [
    { key: 'bulbasaur', name: 'Bulbasaur', levels: ['1.1', '1.2', '2.3', '2.4', '3.5', '3.6'] },
    { key: 'charmander', name: 'Charmander', levels: ['4.1', '4.2', '5.3', '5.4', '6.5', '6.6'] },
    { key: 'squirtle', name: 'Squirtle', levels: ['7.1', '7.2', '8.3', '8.4', '9.5', '9.6'] },
    { key: 'pikachu', name: 'Pikachu', levels: ['25.1', '25.2', '25.3', '25.4', '25.5', '25.6'] },
    { key: 'larvitar', name: 'Larvitar', levels: ['246.1', '246.2', '247.3', '247.4', '248.5', '248.6'] },
  ],
  // Map 2 from the design doc. A node opens when everything in `needs` is beaten. `lvl` is the level your starter should have;
  // beating a boss lifts your starter to lvl+1. `draws`: [location, cards, extra cards in the long game].
  nodes: [
    { id: 'rival1', kind: 'rival', name: 'Your rival', row: 0, col: 1, needs: [], size: [1, 1], lvl: 1, rivalLevel: 1 },
    { id: 'L1', kind: 'loc', loc: 1, name: 'Viridian Forest', row: 1, col: 0, needs: ['rival1'] },
    { id: 'B1', kind: 'boss', name: 'Brock', trainer: '🪨', row: 1, col: 1, needs: ['rival1'], lvl: 2, size: [2, 2], draws: [[2, 1, 0], [1, 1, 0]] },
    { id: 'L2', kind: 'loc', loc: 2, name: 'Mt. Moon', row: 1, col: 2, needs: ['rival1'] },
    { id: 'B2', kind: 'boss', name: 'Misty', trainer: '🌊', row: 2, col: 0, needs: ['B1'], lvl: 3, size: [3, 3], draws: [[4, 2, 0], [1, 1, 0]] },

/* Pokémon Roll! engine: pure rules, no DOM. State is plain JSON so saves and the bots' views are easy. */
const Engine = (() => {
  'use strict';
  const D = GAME_DATA, R = D.rules;
  const lc = x => String(x || '').toLowerCase();
  const other = x => 1 - x;

  // ---------------------------------------------------------------- the cards
  const CARDS = {};
  D.cardsPsv.trim().split('\n').forEach(line => {
    const f = line.split('|');
    const c = { id: f[1], name: f[0], dex: Math.floor(parseFloat(f[1])), type: f[2], weak: f[3], level: +f[4], loc: parseInt(f[5], 10) || 0, hp: +f[6], role: f[7], ability: f[8].trim(), moves: f.slice(9, 15).map(x => x.trim()), special: (f[15] || '').trim() };
    c.legend = c.level === 6 && c.loc !== 0;
    CARDS[c.id] = c;
  });
  const typeOf = u => lc(CARDS[u.id].type);

  // ---------------------------------------------------------------- reading a move
  // arrows: < the column to the left, ^ the opposing card (an attack's matchup), v yourself, > the column to the right; "<<" reaches two columns.
  const runs = s => { const out = new Set(); const re = /(<+)|(>+)|([\^v])/g; let m; while ((m = re.exec(s))) { if (m[1]) for (let i = 1; i <= m[1].length; i++) out.add(-i); else if (m[2]) for (let i = 1; i <= m[2].length; i++) out.add(i); else out.add(0); } return [...out].sort((a, b) => a - b); };
  function parseSpec(sp) {
    sp = (sp || '').trim(); let spread = false;
    if (/^over\b/.test(sp)) { spread = true; sp = sp.replace(/^over\s*/, ''); }
    if (!sp) return { opts: [[0]], spread, all: true };
    if (/ and\/or | and /.test(sp)) return { opts: [runs(sp.replace(/ and\/or | and /g, ' '))], spread, all: true };
    if (/ or /.test(sp)) {
      const parts = sp.split(/ or /);
      if (parts.every(p => /\^/.test(p))) return { opts: parts.map(runs), spread, all: false };       // "<<<<^ or ^>>>>": one side or the other
      return { opts: runs(sp).map(o => [o]), spread, all: false };                                    // "<^ or >": one of them
    }
    return { opts: [runs(sp)], spread, all: true };
  }
  const MV = {};
  function parseEffect(txt) {
    const m = /^(\+)?(\d+)([abhd])\s*(.*)$/.exec(txt.trim()); if (!m) return null;
    return { k: m[3], n: +m[2], bonus: !!m[1], spec: m[3] === 'd' ? { opts: [[0]], spread: false, all: true } : parseSpec(m[4]) };
  }
  function parseMove(str) {
    if (!str) return null; if (MV[str] !== undefined) return MV[str];
    const clauses = str.split(/ or (?=\+?\d)/).map(cl => cl.split(/\s*(?:,|&)\s*/).map(parseEffect).filter(Boolean)).filter(c => c.length);
    return (MV[str] = clauses.length ? { raw: str, clauses } : null);
  }
  const SP = {};
  function parseSpecial(str) {
    if (SP[str] !== undefined) return SP[str];
    const m = /^(\d+):\s*(.*)$/.exec(str || ''); if (!m || !m[2].trim()) return (SP[str] = null);
    const txt = m[2].replace(/, both teams/, ' on both teams');
    const effs = txt.split(/\s*,\s*/).map(part => {
      const mm = /^(\+)?(\d+)([abhd])\s*(.*)$/.exec(part.trim()); if (!mm) return null;
      const rest = mm[4]; let scope = null, elem = null;
      if (/all allies/.test(rest)) scope = 'allies'; else if (/all opponents/.test(rest)) scope = 'foes'; else if (/all non-(\w+)/.test(rest)) { scope = 'non'; elem = RegExp.$1; } else if (/up to three/.test(rest)) scope = 'three';
      return { k: mm[3], n: +mm[2], bonus: !!mm[1], scope, elem, spec: scope ? null : parseSpec(rest) };
    }).filter(Boolean);
    return (SP[str] = effs.length ? { face: +m[1][0], count: m[1].length, effs, raw: str } : null);
  }

  // ---------------------------------------------------------------- reading an ability
  const AB = D.abilities.map(([re, tag]) => [new RegExp(re, 'i'), tag]);
  const TG = {};
  function tagsOf(card) {
    if (TG[card.id]) return TG[card.id];
    const out = [];

      for (const [re, tag] of AB) {

const Bots = (() => {
  'use strict';
  const E = Engine, C = E.CARDS;
  const other = x => 1 - x;
  const pick = (s, a) => a[E.ri(s, a.length)];

  // how well card `a` fares against card `t` before a die is even thrown
  const matchScore = (a, t) => {
    const A = C[a.id], T = C[t.id];
    return (T.weak.toLowerCase() === A.type.toLowerCase() ? 3 : 0) - (A.weak.toLowerCase() === T.type.toLowerCase() ? 3 : 0) + (a.hp - t.hp) * 0.4 + (A.level - T.level) * 0.3;
  };
  function placement(s, side, level) {
    const b = s.battle, hand = b.hand[side]; if (!hand.length) return null;
    const uids = hand.slice(); const units = uids.map(u => E.U(b, u));
    const slots = E.slotsFor(b, side);
    if (!slots.length) return null;
    if (level === 'easy') return { t: 'place', side, uid: pick(s, uids), ...pick(s, slots) };
    let best = null, bv = -1e9;
    units.forEach(u => slots.forEach(sl => {
      let v = (C[u.id].level * 0.5 + u.hp * 0.1);
      if (sl.join != null) { const foe = b.cols[sl.join][other(side)]; v += foe != null ? matchScore(u, E.U(b, foe)) + 2 : 1; }
      else { v += 0.6; const mine = b.units.filter(x => x.side === side && !x.ko && E.colIdx(b, x.uid) >= 0).length; v += mine ? -0.2 : 0; }
      if (v > bv) { bv = v; best = { t: 'place', side, uid: u.uid, ...sl }; }
    }));
    return best;
  }

  // dice -> cards. `side` is whose dice; the view hides the other side's dice, which is all this needs.
  function assignment(s, side, level) {
    const b = s.battle, units = E.living(b, side).filter(u => !u.skip), n = b.dice[side].length;
    if (!units.length || !n) return [];
    const vals = (u, di) => E.preview(b, u, b.dice[side][di]).value;
    const dieIdx = Array.from({ length: n }, (_, i) => i);
    let perm = dieIdx.slice(); for (let i = perm.length - 1; i > 0; i--) { const j = E.ri(s, i + 1); [perm[i], perm[j]] = [perm[j], perm[i]]; }   // perm[k] = the die that card k gets
    const total = p => units.reduce((t, u, k) => t + (p[k] != null ? vals(u, p[k]) : 0), 0);
    if (level !== 'easy') {
      // start greedy: biggest gain first, then swap pairs until nothing improves
      const free = new Set(dieIdx), p = [];
      units.map((u, k) => ({ u, k })).forEach(() => {});
      const order = units.map((u, k) => k).sort((x, y) => Math.max(...dieIdx.map(d => vals(units[y], d))) - Math.max(...dieIdx.map(d => vals(units[x], d))));
      order.forEach(k => { let bd = -1, bv = -1e9; free.forEach(d => { const v = vals(units[k], d); if (v > bv) { bv = v; bd = d; } }); if (bd >= 0) { p[k] = bd; free.delete(bd); } });
      perm = p;
      if (level === 'hard') {
        let improved = true, guard = 0;
        while (improved && guard++ < 6) {
          improved = false;
          for (let i = 0; i < units.length; i++) for (let j = i + 1; j < units.length; j++) {
            if (perm[i] == null || perm[j] == null) continue;
            const now = vals(units[i], perm[i]) + vals(units[j], perm[j]), sw = vals(units[i], perm[j]) + vals(units[j], perm[i]);
            if (sw > now + 1e-9) { [perm[i], perm[j]] = [perm[j], perm[i]]; improved = true; }
          }
        }
      }
    }
    let out = units.map((u, k) => perm[k] != null ? { uid: u.uid, dice: [perm[k]] } : null).filter(Boolean);
    let score = total(perm);
    if (level === 'hard') {                      // a special move can beat two or three ordinary ones
      units.forEach((u, k) => {
        const sp = E.parseSpecial(C[u.id].special); if (!sp) return;
        const ds = dieIdx.filter(d => b.dice[side][d] === sp.face); if (ds.length < sp.count) return;
        const use = ds.slice(0, sp.count), val = E.preview(b, u, sp.face, use.map(d => b.dice[side][d])).value;
        const rest = units.filter(x => x !== u), freeD = dieIdx.filter(d => use.indexOf(d) < 0);
        const q = []; const fr = new Set(freeD);
        rest.forEach(x => { let bd = -1, bv = -1e9; fr.forEach(d => { const v = vals(x, d); if (v > bv) { bv = v; bd = d; } }); if (bd >= 0) { q.push({ uid: x.uid, dice: [bd] }); fr.delete(bd); } });
        const alt = val + q.reduce((t, a) => t + vals(E.U(b, a.uid), a.dice[0]), 0);
        if (alt > score + 0.5) { score = alt; out = [{ uid: u.uid, dice: use }].concat(q); }
      });
    }
    return out;
  }
  // should a die be thrown again? only when there is a reroll to spend and the face is poor for everyone
  function rerollWorth(s, side, level) {
    const b = s.battle; if (level === 'easy') return null;
    const units = E.living(b, side).filter(u => !u.skip);
    for (let d = 0; d < b.dice[side].length; d++) {
      const v = b.dice[side][d], free = b.rrFace[side].indexOf(v) >= 0 && !b.rrUsed[side][d];
      if (!free && b.rr[side] <= 0) continue;
      const best = Math.max(...units.map(u => E.preview(b, u, v).value));
      if (best < 1.2) return d;
    }
    return null;
  }
  // the next thing the computer's side does, or null if it is the player's move
  function step(s, level) {
    const b = s.battle; if (!b) return null; level = level || s.ai || 'medium';
    if (b.stage === 'place' && b.pl && b.pl.side === 1) return placement(s, 1, level);
    if (b.stage === 'assign' && !b.gmReady) {
      const d = rerollWorth(s, 1, level); if (d != null) return { t: 'reroll', side: 1, die: d };
      return { t: 'gm', asg: assignment(s, 1, level) };
    }
    return null;
  }

  // ---- the player's side, for the tests and the "play it for me" runs: the same thinking, from the hero's seat
  function heroStep(s, level) {
    level = level || 'hard';
    const b = s.battle;
    if (s.phase === 'map') {
      const open = E.D.nodes.filter(n => E.unlocked(s, n) && !((n.kind === 'boss' || n.kind === 'rival') && s.done[n.id]));
      const ready = open.filter(n => n.kind === 'rival' || (n.kind === 'boss' && s.coll.length >= E.gmCount(s, n, 0) + (n.id === 'B7' ? 2 : 0)));
      if (ready.length && s.turn % 3 !== 2) return { t: 'go', node: ready[0].id };
      const locs = open.filter(n => n.kind === 'loc' && E.deckSize(s, n.loc) > 0);
      if (!locs.length) return { t: 'go', node: (ready[0] || open[0]).id };
      const nd = locs[E.ri(s, locs.length)];
      const mx = Math.min(E.slots(s), s.coll.length, E.deckSize(s, nd.loc));
      return { t: 'go', node: nd.id, n: Math.max(1, mx) };
    }
    if (s.phase === 'pick') {
      const need = s.pend.need, best = s.coll.slice().sort((a, c) => (C[c.id].level * 2 + C[c.id].hp) - (C[a.id].level * 2 + C[a.id].hp)).slice(0, need);
      return { t: 'team', uids: best.map(c => c.uid) };
    }
    if (s.phase === 'result') {
      if (s.res && s.res.pick) { let bi = 0; s.res.pick.forEach((i, k) => { if (C[i.id].level * 2 + C[i.id].hp > C[s.res.pick[bi].id].level * 2 + C[s.res.pick[bi].id].hp) bi = k; }); return { t: 'take', i: bi }; }
      return { t: 'done' };
    }
    if (s.phase === 'won') return { t: 'done' };
    if (!b) return null;
    if (b.stage === 'place') {
      if (b.pl.side === 0) return placement(s, 0, level);
      return null;
    }
    if (b.stage === 'assign') {
      if (!b.hero) { const d = rerollWorth(s, 0, level); if (d != null) return { t: 'reroll', side: 0, die: d }; }
      const need = !E.readyToGo(b, 0) || (Object.keys(b.asg[0]).length === 0 && b.dice[0].length > 0);
      if (need) {
        const list = assignment(s, 0, level);
        return { t: '_heroAssign', list };
      }
      return { t: 'go2' };
    }
    if (b.stage === 'resolved') return { t: 'next' };
    return null;
  }
  // apply a bot-decided action to the state (a convenience for tests and the player's "auto" button)
  function applyHero(s, a) {
    if (a.t === '_heroAssign') { let r = { ok: true }; const b = s.battle; Object.keys(b.asg[0]).forEach(k => E.apply(s, { t: 'unassign', side: 0, uid: +k })); a.list.forEach(x => x.dice.forEach(d => { r = E.apply(s, { t: 'assign', side: 0, uid: x.uid, die: d }); })); return r; }
    return E.apply(s, a);
  }
  return { step, heroStep, applyHero, assignment, placement, matchScore };
})();

<script id="ui">
/* Pokémon Roll! screens. Everything is a tap on the table; the computer's side plays itself and you watch. */
(() => {
  'use strict';
  const E = Engine, B = Bots, D = GAME_DATA, C = E.CARDS, R = D.rules;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const buildStamp = () => { const m = document.querySelector('meta[name=build]'); const t = m ? m.content : ''; return !t || /^__/.test(t) ? 'local file' : t; };
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window: carry on without saving */ } };

  let G = null;
  const set = Object.assign({ ai: 'medium', size: 'short', tips: true }, lsGet(SET) || {});
  const ui = { screen: 'menu', sel: null, die: null, aim: null, inspect: null, menu: false, play: null, pick: [], chooser: null, tip: null, burst: null, busy: false, toast: '', help: false, coll: false, shown: {} };
  const saved = () => { const s = lsGet(KEY); return s && s.v === D.version && s.phase !== 'start' ? s : null; };
  const save = () => { if (G) lsSet(KEY, G); };
  const tipsSeen = lsGet(TIPS) || {};

  // ---------------------------------------------------------------- pictures
  const uriC = {};
  const art = (id, sh) => { const dex = C[id].dex, k = dex + (sh ? 's' : 'n'); return uriC[k] || (uriC[k] = 'data:image/png;base64,' + (D.art[dex] || D.art[1])[sh ? 's' : 'n']); };
  const el = t => D.elements[t] || D.elements.Normal;
  const ICON = { a: '⚔', b: '🛡', h: '✚', d: '💥' }, KLS = { a: 'mA', b: 'mB', h: 'mH', d: 'mD' };
  // "3a <^ or >" -> ⚔3 ◀▲ or ▶   (a short, readable move)
  const arrows = s => s.replace(/\bover\b/g, 'split').replace(/</g, '◀').replace(/>/g, '▶').replace(/\^/g, '▲').replace(/\bv\b/g, '▼').replace(/\s+/g, ' ').trim();
  const short = (str, plain) => {
    if (!str) return '';

      const t = `${plus}${ICON[k]}${n}`; const arr = k === 'd' ? '' : (sp ? ' ' + arrows(sp) : '');

  // the big card: the approved design (weakness tab flush with the top edge, big sprite, six faces, special strip)
  function fullCard(id, sh, o) {

    const faces = c.moves.map((m, i) => `<div class="f${m ? '' : ' blank'}${face === i + 1 ? ' hot' : ''}"><span class="pip">${i + 1}</span>${m ? short(m) : '—'}</div>`).join('');
    const hp = o.hp != null ? o.hp : c.hp;
    return `<div class="card${sh ? ' shiny' : ''}" style="--bg:${e.bg};--c:${e.color}">
      ${C[id].weak && D.elements[c.weak] ? `<div class="wkt">weak ${el(c.weak).icon}</div>` : ''}
      <div class="hd"><div><div class="nm">${esc(c.name)}${sh ? ' ✨' : ''}</div><div class="lv">LEVEL ${c.level} · ${stars(c.level)}</div></div><div class="hpc"><div>${hp}<small>HP</small></div></div></div>
      <div class="art"><span class="role">${esc(c.role)}</span><img src="${art(id, sh)}" alt="${esc(c.name)}">${sh ? sparkles() : ''}<span class="tag">${e.icon} ${c.type.toUpperCase()}</span></div>
      <div class="ab">${c.ability ? esc(c.ability) : 'No ability'}</div>
      <div class="faces">${faces}</div>
      ${sp ? `<div class="sp"><i>${String(sp.face).repeat(sp.count).split('').join(' ')}</i> Special: ${short(c.special.replace(/^\d+:\s*/, ''))}</div>` : '<div class="pad"></div>'}
    </div>`;
  }
  // a small card (the table, the picker). u is a battle unit or a {id, sh}
  function mini(u, o) {
    o = o || {}; const c = C[u.id], e = el(c.type), cw = o.cw || 110, hp = o.hp != null ? o.hp : (u.hp != null ? u.hp : c.hp), mx = u.max || c.hp;
    const pct = Math.max(0, Math.min(100, hp / mx * 100)), lvl = pct <= 33 ? ' lo' : pct <= 66 ? ' mid' : '';
    return `<div class="mini${u.sh ? ' shiny' : ''}${o.foe ? ' foe' : ''}${o.ko ? ' ko' : ''}${o.sel ? ' sel' : ''}${o.cls ? ' ' + o.cls : ''}" style="--cw:${cw}px;--bg:${e.bg};--c:${e.color}" ${o.attr || ''}>
      ${D.elements[c.weak] ? `<div class="wk">weak ${el(c.weak).icon}</div>` : ''}
      <div class="nm" style="padding-top:${Math.round(cw * .1)}px">${esc(c.name)}</div>
      <div class="art2"><img src="${art(u.id, u.sh)}" alt="">${u.sh ? sparkles() : ''}</div>
      <div class="bar${lvl}"><i style="width:${pct}%"></i><b>${Math.max(0, hp)} / ${mx}</b></div>
      ${o.mv != null ? `<div class="mv${o.mvDash ? ' dash' : ''}" ${o.mvAttr || ''}>${o.mv}</div>` : '<div style="height:' + Math.round(cw * .05) + 'px"></div>'}
      ${o.pop ? `<div class="pop ${o.pop.cls || ''}">${o.pop.txt}</div>` : ''}
    </div>`;
  }
  const back = cw => `<div class="back" style="--cw:${cw}px">❓</div>`;
  const dieHtml = (v, o) => `<div class="die${o && o.sel ? ' sel' : ''}${o && o.used ? ' used' : ''}${o && o.foe ? ' foe' : ''}${o && o.roll ? ' roll' : ''}" ${o && o.attr || ''}>${v}${o && o.badge ? `<small>${o.badge}</small>` : ''}</div>`;

  // ---------------------------------------------------------------- the game loop
  function toast(t) { ui.toast = t; render(); setTimeout(() => { if (ui.toast === t) { ui.toast = ''; const x = document.querySelector('.toast'); if (x) x.remove(); } }, 2400); }
  function act(a) {
    const before = G.battle ? G.battle.units.map(u => u.uid) : [];
    const r = E.apply(G, a); if (!r.ok) { toast(r.error); return false; }
    save(); noteBursts(before); drive(); return true;
  }
  function noteBursts(before) {

  }
  // the computer's turn to place or assign: one card at a time so you can watch it happen
  function drive() {

    if (e.t === 'move') { p.revealed[e.u] = true; const u = E.U(G.battle, e.u); if (u && u.sh && e.txt && e.txt !== '—') ui.burst = u.uid; wait = e.txt && e.txt !== '—' ? 420 : 120; }
    else if (e.t === 'dmg') { p.hp[e.u] = e.hp; p.pop[e.u] = { txt: '-' + e.n, cls: '' }; wait = 620; }

    else if (e.t === 'ko') { p.ko[e.u] = true; wait = 650; }

    else if (e.t === 'special') { p.pop[e.u] = { txt: 'SPECIAL!', cls: 'txt' }; wait = 520; }

    </div>`;

  function newScreen() {

      <div class="scr"><div class="center">
        <div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center">${D.starters.map(st => { const c = C[st.levels[0]], e = el(c.type); return `<button data-act="starter" data-k="${st.key}" style="background:${e.bg};color:#14110f;border:4px solid #14110f;border-radius:18px;padding:10px 14px 12px;width:150px;box-shadow:0 6px 0 #0008"><img class="pix" width="112" height="112" src="${art(st.levels[0], 0)}" alt=""><div style="font:900 20px system-ui">${st.name}</div><div style="font:800 14px system-ui;opacity:.75">${e.icon} ${c.type}</div></button>`; }).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center"><b>Computer:</b>${['easy', 'medium', 'hard'].map(x => `<button class="chip${set.ai === x ? ' on' : ''}" data-act="ai" data-v="${x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center"><b>Bosses:</b>${[['short', 'Shorter game'], ['long', 'Longer game']].map(([x, l]) => `<button class="chip${set.size === x ? ' on' : ''}" data-act="size" data-v="${x}">${l}</button>`).join('')}</div>
        <div style="opacity:.8;font-size:16px">Your rival will pick the partner that beats yours.</div>
      </div></div>`;
  }
  const nodeCls = (n) => { const open = E.unlocked(G, n), done = (n.kind !== 'loc') && G.done[n.id]; return { open, done }; };
  function mapScreen() {
    const rows = {}; D.nodes.forEach(n => { (rows[n.row] = rows[n.row] || [])[n.col] = n; });
    const tiles = [];
    for (let r = 0; r <= 8; r++) for (let c = 0; c < 3; c++) {
      const n = rows[r] && rows[r][c]; if (!n) { tiles.push('<div class="empty"></div>'); continue; }
      const { open, done } = nodeCls(n); let bg = '#fff', em = '', sub = '';
      if (n.kind === 'loc') { const lc = { green: '#bfe8a5', brown: '#d9c7b4', yellow: '#ffe9a0', blue: '#b7dcff', purple: '#e3c9ff', red: '#ffc79a' }[D.locations.find(l => l.id === n.loc).color]; bg = lc; em = '🗺️'; sub = open ? E.deckSize(G, n.loc) + ' cards' : ''; }
      else if (n.kind === 'boss') { bg = '#ffd9d9'; em = n.trainer; sub = 'Gym leader · ' + (G.bosses[n.id].length) + ' cards'; }
      else { bg = '#e8dcff'; em = n.finale ? '🏆' : '⚔️'; sub = n.finale ? 'The final fight' : '1 card'; }
      const next = open && !done && n.kind !== 'loc';
      tiles.push(`<button class="nd ${n.kind === 'boss' ? 'boss' : ''}${open ? '' : ' lock'}${done ? ' done' : ''}${next ? ' next' : ''}" style="--bg:${bg}" data-act="node" data-id="${n.id}"><div class="em">${open ? (done ? '✅' : em) : '🔒'}</div><b>${esc(n.name)}</b><span>${open ? sub : ''}</span></button>`);
    }
    const sl = E.slots(G);
    return `<div class="top"><button class="ib" data-act="menu">☰</button><div class="t">Kanto &amp; Johto</div><span class="chip">🎲 ×${sl}</span><span class="chip">★ Lv ${G.lv}</span></div>
      <div class="map">${tiles.join('')}</div>
      <div class="dock" style="flex-direction:row;justify-content:center"><button class="btn alt" data-act="coll">Your cards (${G.coll.length})</button></div>`;
  }
  function pickScreen() {
    const p = G.pend, nd = E.node(p.node), need = p.need;
    const opp = nd.kind === 'boss' ? G.bosses[nd.id] : null;
    const cw = Math.max(86, Math.min(190, Math.floor((Math.min(innerWidth, 860) - 40) / Math.min(5, Math.max(3, G.coll.length)) - 10)));
    const gmRow = opp ? `<div class="row" style="padding:4px">${opp.map(i => mini(i, { cw: 72, foe: 1 })).join('')}</div>` : `<div class="row" style="padding:4px">${Array.from({ length: p.gm }, () => back(60)).join('')}</div>`;
    return `<div class="top"><button class="ib" data-act="pickback">←</button><div class="t">${esc(nd.name)}</div><span class="chip">${ui.pick.length} / ${need}</span></div>
      <div class="scr"><div class="status">${opp ? 'They will bring these cards.' : nd.kind === 'rival' ? 'Your rival is ready.' : 'Wild cards are hiding here.'}</div>${gmRow}
      <div class="status" style="opacity:.9">Choose ${need} card${need === 1 ? '' : 's'} for your team.</div>
      <div class="grid">${G.coll.map(c => mini(c, { cw, sel: ui.pick.indexOf(c.uid) >= 0, attr: `data-act="pickc" data-uid="${c.uid}"` })).join('')}</div></div>
      <div class="dock" style="flex-direction:row;justify-content:center"><button class="btn big" data-act="fight" ${ui.pick.length === need ? '' : 'disabled'}>Fight!</button></div>`;
  }

  // ---- the battle table
  function unitMove(b, u) {
    const a = b.asg[u.side][u.uid]; if (!a) return null;
    const vals = a.dice.map(i => b.dice[u.side][i]); return { vals, m: E.chosenMove(b, u, vals), die: a.dice };
  }
  function battleScreen() {
    const b = G.battle, p = ui.play, nd = E.node(b.node), placing = b.stage === 'place', assign = b.stage === 'assign', done = b.stage === 'resolved' && !p;
    const m = Math.max(1, b.limit), W = Math.min(innerWidth, 860), H = innerHeight;
    const cw = Math.max(58, Math.min(220, Math.floor((W - 16 - (m + 1) * 8) / m), Math.floor((H - 470) / 3.0)));
    const hand = side => b.hand[side];
    const selected = ui.sel != null && b.hand[0].indexOf(ui.sel) >= 0 ? ui.sel : null;
    const yourPlace = placing && b.pl.side === 0;
    const hpOf = u => p ? (p.hp[u.uid] != null ? p.hp[u.uid] : u.hp) : u.hp;
    const koOf = u => p ? !!p.ko[u.uid] : u.ko;
    const mvHtml = u => {
      if (u.ko || koOf(u)) return { mv: '✕', dash: 0 };
      const info = unitMove(b, u);
      if (u.skip && (assign || p || done)) return { mv: '<span style="font-size:.8em">💤 loses a round</span>', dash: 1 };
      if (u.side === 1) {
        if (assign || placing) return { mv: info ? '<span class="dchip" style="background:#7b1e1e;color:#fff">?</span> ready' : '…', dash: 1 };
        if (p && !p.revealed[u.uid]) return { mv: '<span class="dchip" style="background:#7b1e1e;color:#fff">?</span>', dash: 1 };
        if (!info) return { mv: '—', dash: 0 };
        return { mv: `<span class="dchip">${info.vals[0]}</span>${info.m && info.m.sp ? '<span class="mA">SPECIAL</span>' : short(info.m ? info.m.str : '')}`, dash: 0 };
      }
      if (info) return { mv: `<span class="dchip">${info.vals.join('+')}</span>${info.m && info.m.sp ? '<span class="mA">SPECIAL</span>' : (info.m && info.m.str ? short(info.m.str) : '—')}`, dash: 0, attr: `data-act="unmv" data-uid="${u.uid}"` };
      if (assign) return { mv: ui.die != null ? 'tap to use ' + b.dice[0][ui.die] : 'needs a die', dash: 1 };
      return { mv: '—', dash: 0 };
    };
    const popOf = u => p && p.pop[u.uid];
    const clsOf = u => {
      let c = ''; const cur = p && p.cur;
      if (cur && cur.t === 'strike' && cur.u === u.uid) c += ' act'; if (cur && cur.t === 'strike' && cur.to.indexOf(u.uid) >= 0 && cur.u !== u.uid) c += ' hurt';
      if (cur && cur.t === 'move' && cur.u === u.uid && cur.txt && cur.txt !== '—') c += ' act';
      if (ui.burst === u.uid) c += ' burst'; if (ui.aim && E.U(b, ui.aim) && aimable(b, E.U(b, ui.aim)).indexOf(u.uid) >= 0) c += ' sel'; return c;
    };
    const unitCard = u => {
      const mvH = mvHtml(u), ko = u.ko || koOf(u);
      if (ko && !(p && !p.ko[u.uid] && !u.ko) && u.ko && !p) return `<div style="width:${cw}px"></div>`;
      const sel = u.side === 0 && assign && ui.die != null;
      return mini(u, { cw, foe: u.side === 1, ko: koOf(u), hp: hpOf(u), mv: mvH.mv, mvDash: mvH.dash, mvAttr: mvH.attr, cls: clsOf(u), pop: popOf(u), attr: `data-act="unit" data-uid="${u.uid}"` });
    };
    const slotHtml = (ci, side) => {
      const uid = b.cols[ci][side];
      if (uid != null) return unitCard(E.U(b, uid));
      const ok = yourPlace && selected != null && side === 0 && E.slotsFor(b, 0).some(s => s.join === ci);
      return `<div class="slot${ok ? ' ok' : ''}" style="--cw:${cw}px" ${ok ? `data-act="join" data-col="${ci}"` : ''}>${ok ? '＋' : ''}</div>`;
    };
    const canIns = yourPlace && selected != null && b.cols.length < b.limit;
    const ins = at => canIns ? `<div class="ins" style="--cw:${cw}px" data-act="ins" data-at="${at}">+</div>` : '';
    let cols = ins(0);
    b.cols.forEach((c, i) => { cols += `<div class="col" style="--cw:${cw}px">${slotHtml(i, 1)}${slotHtml(i, 0)}</div>` + ins(i + 1); });
    if (!b.cols.length && !canIns) cols = `<div class="vsl">${placing ? 'Cards go here' : ''}</div>`;
    // trays
    const trayCw = Math.max(56, Math.min(96, Math.floor((W - 24 - 8 * Math.max(1, hand(0).length)) / Math.max(1, hand(0).length))));
    const foeTray = hand(1).length ? hand(1).map(() => back(Math.max(36, trayCw * .6))).join('') : '';
    const heroTray = hand(0).map(uid => { const u = E.U(b, uid); return mini(u, { cw: trayCw, sel: uid === selected, attr: `data-act="tray" data-uid="${uid}"` }); }).join('');
    // dice
    const hd = b.dice[0], used = E.assignedDice(b, 0);
    const owner = {}; Object.keys(b.asg[0]).forEach(k => b.asg[0][k].dice.forEach(i => { owner[i] = +k; }));
    const diceHtml = (assign || done || p) && hd.length ? hd.map((v, i) => dieHtml(v, { sel: ui.die === i, used: used.has(i), attr: assign ? `data-act="die" data-i="${i}"` : '', badge: owner[i] != null ? (C[E.U(b, owner[i]).id].name.slice(0, 3)) : '', roll: assign && ui.rolledFor !== b.round })).join('') : '';
    const foeDice = (assign || placing || p || done) && b.dice[1].length ? b.dice[1].map((v, i) => dieHtml(assign && !p ? '?' : v, { foe: 1 })).join('') : '';
    if (assign) ui.rolledFor = b.round; else if (placing) ui.rolledFor = 0;
    let status = '', btns = '';

    else if (assign) { const need = E.living(b, 0).filter(u => !u.skip && !b.asg[0][u.uid]).length; status = ui.die != null ? 'Tap a card to give it that ' + b.dice[0][ui.die] : (E.readyToGo(b, 0) ? 'Ready? Press Go!' : 'Tap a die, then a card (' + need + ' to go)'); }

    else if (done) status = b.out === 'hero' ? '🏆 You win!' : b.out === 'gm' ? 'You lose this one' : b.out === 'sudden' ? 'Everyone fell! Sudden death…' : 'Round over';
    if (assign) {
      const canRe = ui.die != null && (b.rr[0] > 0 || (b.rrFace[0].indexOf(hd[ui.die]) >= 0 && !b.rrUsed[0][ui.die]));

    } else if (done) btns = `<button class="btn big" data-act="next">${b.out === 'hero' || b.out === 'gm' ? 'Continue' : b.out === 'sudden' ? 'Sudden death' : 'Next round'}</button>`;

    return `<div class="top"><button class="ib" data-act="menu">☰</button><div class="t">${esc(nd.name)}${b.round ? ' · Round ' + b.round : ''}${b.sudden ? ' · SUDDEN DEATH' : ''}</div><span class="chip">${living(0)} vs ${living(1)}</span></div>
      <div class="table">
        <div class="tray" style="min-height:${Math.round(trayCw * .8)}px">${foeTray}</div>
        <div class="board">${cols}</div>
        <div class="tray">${heroTray}</div>
      </div>
      <div class="status">${status}</div>
      <div class="dock"><div class="dice">${foeDice ? `<div class="dice" style="min-height:0;transform:scale(.7)">${foeDice}</div>` : ''}</div><div class="dice">${diceHtml}</div><div class="acts">${btns}</div></div>`;
    function living(s) { return E.living(b, s).length; }
  }
  const aimable = (b, u) => {
    const a = b.asg[u.side][u.uid]; if (!a) return []; const m = E.chosenMove(b, u, a.dice.map(i => b.dice[u.side][i])); if (!m || !m.mv) return [];
    const c = E.bestClause(b, u, m.mv); if (!c) return []; const out = [];
    E.effectsOf(b, u, c.clause).forEach(e => { if (e.k === 'a') { const cs = E.candidates(b, u, e); if (cs.length > 1 && !e.spec.all) cs.forEach(x => x.forEach(t => out.push(t.u.uid))); } });
    return out;
  };

  function resultScreen() {
    const r = G.res, nd = E.node(r.node);
    const take = r.pick ? `<div class="status">Choose one to join your team!</div><div class="grid" style="flex:none">${r.pick.map((i, k) => mini(i, { cw: Math.min(130, Math.floor((Math.min(innerWidth, 860) - 30) / Math.max(2, r.pick.length)) - 10), attr: `data-act="take" data-i="${k}"` })).join('')}</div>` : (r.took ? `<div class="status">You caught ${esc(C[r.took.id].name)}${r.took.sh ? ' ✨' : ''}!</div><div class="row">${mini(r.took, { cw: 130 })}</div>` : '');
    const lines = []; if (r.win && nd.kind === 'boss') lines.push(`You beat ${esc(nd.name)}! +1 die`); if (r.levelUp) lines.push(`Your partner grew to level ${r.levelUp}!`); if (r.legend && r.win) lines.push(`${esc(C[r.legend.id].name)}${r.legend.sh ? ' ✨' : ''} joins your team!`);

  function wonScreen() {

      <div class="grid" style="flex:none;max-height:44vh">${G.coll.map(c => mini(c, { cw: 84 })).join('')}</div>
      <button class="btn big" data-act="menu0">Main menu</button></div>`;
  }

  // ---- overlays
  const helpText = [
    '<b>The goal.</b> Collect creature cards, beat the gym leaders to open new places, then beat Lance and your rival.',
    '<b>On the map.</b> Tap a place. In a <b>location</b> you fight wild cards: you bring as many cards as you have dice (🎲), they bring the same number. Win, and you keep one of their cards. Lose, and nothing is lost. A <b>gym leader</b> has a fixed team; beat them to level up your partner and earn another die.',
    '<b>A fight.</b> Cards stand in columns, each facing one opponent. Take turns putting cards down (two at a time after the first), then every card gets a die.',
    '<b>Every round.</b> Each side rolls one die per card (no rerolls unless a card says so). Tap a die, then tap the card that should use it. Each card does something different on each number 1–6: attack ⚔, block 🛡, heal ✚, or hurt itself 💥. When you are ready, press Go!',
    '<b>Resolving.</b> Healing happens first. Then cards act from left to right, your card first in each column. A card at 0 health is out immediately. The arrows show who a move can reach: ◀ left, ▲ the card facing it, ▶ right, ▼ itself.',
    '<b>Elements.</b> A card hit by the element on its weakness tab takes double damage.',
    '<b>Blocking.</b> A block soaks up damage for the card or its neighbours. If it can’t soak it all, the blocker takes what is left.',
    '<b>Special moves.</b> Put two or three dice showing the same number on one card to use its special. The cards without a die sit that round out.',
    '<b>Shinies.</b> Every card drawn from a place has a 1-in-20 chance to be shiny. Shiny is just for looks. A card on a team keeps its shine for good.',
    '<b>Legendaries.</b> Once you have two dice, a 9 on two dice at the start of a turn means a legendary was spotted!',
    '<b>Choices I made</b> (the rulebook is a draft): you may put your cards down first or second (the computer goes first); a blocker takes what is left over; a card at 0 health is out at once; when matchups break up, the side with fewer cards moves to find a partner; a fight that goes nowhere for six rounds is a loss; abilities that push or swap cards between columns are not in this version.',
  ];
  function helpSheet() { return `<div class="sheet" data-act="closehelp"><div class="box help" data-stop="1"><h2>How to Play</h2>${helpText.map(t => `<p>${t}</p>`).join('')}<button class="btn" data-act="closehelp">Got it</button></div></div>`; }
  function menuSheet() {
    const inB = !!G.battle;

      ${inB ? '<button class="btn red" data-act="forfeit">Give up this fight</button>' : ''}

  }
  function collSheet() {
    return `<div class="sheet"><div class="top" style="width:100%"><div class="t">Your cards (${G.coll.length})</div><button class="ib" data-act="closecoll">✕</button></div><div class="grid" style="width:100%">${G.coll.slice().sort((a, b) => C[b.id].level - C[a.id].level).map(c => mini(c, { cw: 112, attr: `data-act="inscard" data-uid="${c.uid}"` })).join('')}</div></div>`;
  }
  function inspectSheet() {
    const x = ui.inspect, b = G.battle; let id, sh, face = 0, hp, extra = '';
    if (x.uid != null && b) { const u = E.U(b, x.uid); if (!u) return ''; id = u.id; sh = u.sh; hp = u.hp; const a = b.asg[u.side][u.uid]; if (a && (u.side === 0 || b.stage === 'resolved')) face = b.dice[u.side][a.dice[0]];
      const t = E.tags(u).find(g => g.t === 'incDie' || g.t === 'setDie'); if (t && u.side === 0 && b.stage === 'assign' && a && b.round - u.lastTweak >= t.every) extra = `<button class="btn alt" data-act="tweak" data-uid="${u.uid}">⚡ Use ability on its die</button>`; }

  function chooserSheet() {

  // ---------------------------------------------------------------- render
  function render() {
    if (!$app) return;
    let h = '';
    if (ui.screen === 'new') h = newScreen();
    else if (!G || ui.screen === 'menu') h = menuScreen();
    else if (G.phase === 'map') h = mapScreen();
    else if (G.phase === 'pick') h = pickScreen();
    else if (G.phase === 'battle') h = battleScreen();
    else if (G.phase === 'result') h = resultScreen();
    else if (G.phase === 'won') h = wonScreen();
    if (G && G.notes.length && ui.screen === 'play' && (G.phase === 'map')) h += legendSheet();
    if (ui.chooser) h += chooserSheet();
    if (ui.inspect) h += inspectSheet();
    if (ui.coll) h += collSheet();
    if (ui.menu) h += menuSheet();
    if (ui.help) h += helpSheet();
    if (ui.tip) h += `<div class="tip">${esc(ui.tip.text)}<br><button class="btn" data-act="tipok">OK</button></div>`;
    if (ui.toast) h += `<div class="toast">${esc(ui.toast)}</div>`;
    $app.innerHTML = h;
  }

  // ---------------------------------------------------------------- taps
  const A = {
    continue() { G = saved(); ui.screen = 'play'; resetSel(); drive(); },
    new() { ui.screen = 'new'; render(); },
